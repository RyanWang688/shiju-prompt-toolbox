function sourceButton(item){const source=typeof item.sourceImage==='string'&&/^assets\/[a-zA-Z0-9_./-]+$/.test(item.sourceImage)&&!item.sourceImage.includes('..')?item.sourceImage:'';return source?`<a class="visit-site" href="${esc(source)}" target="_blank" rel="noopener" aria-label="${esc(item.title+'：访问原始来源')}">访问来源 ↗</a>`:'<span class="source-unavailable">原始来源待补</span>'}
let masonryObserver=null,masonryFrame=0,detailTrigger=null,detailScroll=0;
function layoutCards(){cancelAnimationFrame(masonryFrame);masonryFrame=requestAnimationFrame(()=>{const grid=$('grid'),style=getComputedStyle(grid),gap=parseFloat(style.rowGap)||20,row=parseFloat(style.gridAutoRows)||8;grid.querySelectorAll('.card').forEach(card=>card.style.gridRowEnd='span '+Math.ceil((card.getBoundingClientRect().height+gap)/(row+gap)))})}
function observeCards(){masonryObserver?.disconnect();masonryObserver=new ResizeObserver(layoutCards);$('grid').querySelectorAll('.card').forEach(card=>masonryObserver.observe(card));layoutCards()}
window.addEventListener('resize',layoutCards);
let backdropPress=false;
function outsideDetail(e){const r=$('detail').getBoundingClientRect();return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom}
$('detail').addEventListener('pointerdown',e=>{backdropPress=e.target===$('detail')&&outsideDetail(e)});
$('detail').addEventListener('click',e=>{if(backdropPress&&e.target===$('detail')&&outsideDetail(e))$('detail').close();backdropPress=false});
$('detail').addEventListener('close',()=>{$('detailPreview').innerHTML='';const trigger=detailTrigger?.isConnected?detailTrigger:[...$('grid').querySelectorAll('[data-open]')].find(b=>b.dataset.open===selected?.id);trigger?.focus({preventScroll:true});window.scrollTo({top:detailScroll,behavior:'instant'})});
function showDetail(item){selected=item;$('detailTitle').textContent=item.title;$('detailMeta').textContent=(item.kind==='website'?'实用网站 / ':item.kind==='skill'?(item.resourceType||'Skill')+' / ':'')+item.category+' / '+(item.tags||'');$('copy').textContent=item.kind==='website'?'复制网站地址':item.kind==='skill'?'复制 Skill 内容':'复制提示词';$('promptText').textContent=item.prompt;$('detailPreview').innerHTML=item.preview||item.kind==='skill'?visual(item):'';$('previewNote').textContent=['skill','website'].includes(item.kind)?[item.description,item.previewNote].filter(Boolean).join(' '):item.previewNote||'';$('detailRating').innerHTML=ratingControls(item);$('skillSource').textContent=['skill','website'].includes(item.kind)&&item.source?'来源：'+item.source:'';$('sourceLink').innerHTML=typeof item.sourceImage==='string'&&item.sourceImage.startsWith('assets/')&&!item.sourceImage.includes('..')?`<a href="${esc(item.sourceImage)}" target="_blank" rel="noopener">查看原始提示词截图 ↗</a>`:'';if(item.preview?.type==='image'&&typeof item.preview.src==='string'&&item.preview.src.startsWith('assets/')&&!item.preview.src.includes('..'))$('sourceLink').innerHTML+=` <a href="${esc(item.preview.src)}" target="_blank" rel="noopener">查看原图 / 动图 ↗</a>`;if(typeof item.previewSource==='string'&&item.previewSource.startsWith('https://'))$('sourceLink').innerHTML+=` <a href="${esc(item.previewSource)}" target="_blank" rel="noopener">效果图原始出处 ↗</a>`;if(typeof item.demo==='string'&&item.demo.startsWith('assets/')&&!item.demo.includes('..'))$('sourceLink').innerHTML+=` <a href="${esc(item.demo)}" target="_blank" rel="noopener">打开实际演示 ↗</a>`;$('sourceLink').innerHTML+=' '+resourceLinksHtml(item);if(!$('detail').open)$('detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rate]');if(!b)return;const item=items.find(i=>i.id===b.dataset.rate);if(!item)return;const next={...ratings,[item.id]:rating(item)===Number(b.dataset.value)?0:Number(b.dataset.value)};try{localStorage.setItem(ratingKey,JSON.stringify(next));ratings=next;render();if($('detail').open&&selected?.id===item.id)$('detailRating').innerHTML=ratingControls(item);toast(rating(item)?`已记住你的 ${rating(item)} 星评分`:'已清除评分')}catch{toast('评分未保存：浏览器存储不可用。')}});
const navGroups=[{label:'内容类型',items:[['全部内容','layout-dashboard'],['提示词','message-square-text'],['Skills','sparkles'],['实用网站','globe']]},{label:'个人收藏',items:[['我的收藏','heart']]},{label:'主题分类',items:[['动画动效','clapperboard'],['文字效果','type'],['界面设计','panels-top-left'],['写作表达','pen-line'],['其他','shapes']]}];
$('categories').innerHTML=navGroups.map((g,index)=>`${index?'<hr class="rail-separator" aria-hidden="true">':''}<div class="rail-group" role="group" aria-label="${g.label}">${g.items.map(([label,icon])=>`<button type="button" class="rail-button" data-category="${label}" aria-label="${label}" aria-pressed="false" data-tooltip="${label}"><img src="assets/icons/${icon}.svg" alt="" width="21" height="21"></button>`).join('')}</div>`).join('');
let tooltipButton=null,tooltipDismissed=false;
function hideRailTooltip(){if(tooltipButton)tooltipButton.removeAttribute('aria-describedby');tooltipButton=null;$('railTooltip').hidden=true}
function showRailTooltip(button){if(!button||tooltipDismissed)return;tooltipButton=button;const box=button.getBoundingClientRect();$('railTooltip').textContent=button.dataset.tooltip;button.setAttribute('aria-describedby','railTooltip');$('railTooltip').hidden=false;$('railTooltip').style.left=(box.right+12)+'px';$('railTooltip').style.top=Math.max(8,Math.min(innerHeight-44,box.top+box.height/2-18))+'px'}
$('categories').addEventListener('pointerover',e=>{const b=e.target.closest('[data-category]');if(b!==tooltipButton){hideRailTooltip();tooltipDismissed=false;showRailTooltip(b)}});
$('categories').addEventListener('pointerleave',()=>{tooltipDismissed=false;if(!document.activeElement.closest('[data-category]'))hideRailTooltip()});
$('categories').addEventListener('focusin',e=>{tooltipDismissed=false;hideRailTooltip();showRailTooltip(e.target.closest('[data-category]'))});
$('categories').addEventListener('focusout',hideRailTooltip);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){tooltipDismissed=true;hideRailTooltip()}});
$('categories').addEventListener('scroll',hideRailTooltip);window.addEventListener('resize',hideRailTooltip);
$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){if(category!==b.dataset.category)transitionCards(()=>{category=b.dataset.category;render()});hideRailTooltip()}};$('search').oninput=render;$('sort').onchange=()=>transitionCards(render);
$('grid').onclick=e=>{if(e.target.closest('a,[data-rate]'))return;if(e.target.closest('#emptyAdd')){openEditor();return}const star=e.target.closest('[data-star]');if(star){save(items.map(i=>i.id===star.dataset.star?{...i,favorite:!i.favorite}:i));return}const b=e.target.closest('[data-open]');if(b){detailTrigger=b;detailScroll=scrollY;showDetail(items.find(i=>i.id===b.dataset.open))}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).close();if(b.dataset.close==='detail')$('detailPreview').innerHTML=''});
function updateForm(){const kind=$('kind').value,skill=kind==='skill',site=kind==='website';$('description').required=skill||site;$('descriptionLabel').textContent=skill||site?'一句话用途（必填）':'一句话说明（选填）';$('prompt').required=kind==='prompt';$('contentLabel').textContent=site?'网站说明（选填）':skill?'Skill 内容 / 使用说明（选填）':'提示词原文';$('source').required=site;$('source').type=site?'url':'text';$('sourceLabel').textContent=site?'网站地址（必填，http 或 https）':'来源（链接或名称，选填）';$('formTitle').textContent=(editing?'编辑':'收录')+(site?'网站':skill?' Skill':'提示词')}
function openEditor(item){editing=item?.id||null;$('form').reset();$('kind').value=item?(['skill','website'].includes(item.kind)?item.kind:'prompt'):category==='实用网站'?'website':category==='Skills'?'skill':'prompt';for(const k of ['title','category','tags','prompt','description','source'])if(item)$(k).value=item[k]||'';if(!item&&$('kind').value!=='prompt')$('category').value='其他';updateForm();$('editor').showModal()}
$('kind').onchange=updateForm;$('add').onclick=()=>openEditor();
$('form').onsubmit=e=>{e.preventDefault();const kind=$('kind').value;const title=$('title').value.trim(),description=$('description').value.trim(),prompt=$('prompt').value.trim(),source=$('source').value.trim();if(!title||(kind==='prompt'&&!prompt)||(kind!=='prompt'&&!description)){toast('请填写标题与必填内容。');return}if(kind==='website'&&!websiteUrl(source)){toast('请填写有效的 http 或 https 网站地址。');return}const item={...(items.find(i=>i.id===editing)||{}),id:editing||crypto.randomUUID(),kind,title,category:$('category').value,tags:$('tags').value.trim(),prompt:prompt||description,description,source:kind==='website'?websiteUrl(source):source};if(save(editing?items.map(i=>i.id===editing?item:i):[item,...items])){$('editor').close();toast('已保存到工具箱')}};

$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(selected.kind==='website'?selected.source:selected.prompt);toast('内容已复制')}catch{toast('复制失败，请选中内容手动复制。')}};
$('export').onclick=()=>{const data=items.map(i=>({...i,rating:rating(i)}));const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='拾句-工具箱备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(i=>i&&typeof i.title==='string'&&typeof i.prompt==='string'&&i.title.trim()&&i.prompt.trim()))throw Error();if(data.some(i=>i.kind==='website'&&!websiteUrl(i.source)))throw Error();const merged=[...items];const nextRatings={...ratings};for(const i of data){let existing=merged.find(x=>x.title===i.title&&x.prompt===i.prompt);if(!existing){existing={id:crypto.randomUUID(),kind:['skill','website'].includes(i.kind)?i.kind:'prompt',title:i.title.slice(0,100),prompt:i.prompt.slice(0,30000),category:['动画动效','文字效果','界面设计','写作表达','其他'].includes(i.category)?i.category:'其他',tags:String(i.tags||'').slice(0,150),description:String(i.description||'').slice(0,200),source:String(i.source||'').slice(0,1000),favorite:!!i.favorite};merged.unshift(existing)}if(Object.hasOwn(i,'rating'))nextRatings[existing.id]=normalizeRating(i.rating)}if(save(merged)){try{localStorage.setItem(ratingKey,JSON.stringify(nextRatings));ratings=nextRatings;render();toast('导入完成，评分已恢复，重复内容已合并。')}catch{toast('内容已导入，但评分保存失败。')}}}catch{toast('导入失败，请使用有效的 JSON 备份。')}finally{$('file').value=''}};
render();
</script></body></html>
