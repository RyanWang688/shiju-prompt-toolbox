box-shadow:5px 5px 0 #242039}.c .card:nth-child(2){transform:rotate(1deg)}.c .card:nth-child(3){transform:rotate(-1deg)}.c .card:hover{transform:translateY(-5px) rotate(0)}.c .primary{box-shadow:3px 3px 0 #242039;border:1px solid #242039;border-radius:0}.c .preview{height:190px}.c .top{border-bottom:2px solid}.c .brand{font-weight:900} @media(min-width:1600px){.preview{height:210px}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.b .card{grid-template-columns:135px 1fr}.shell{grid-template-columns:165px 1fr}.sidebar{padding:35px 12px}.brand small{display:none}}@media(max-width:720px){.top{padding:12px 18px;height:auto;gap:15px;flex-wrap:wrap}.brand{font-size:20px}.switch a{padding:5px 8px}.shell{display:block}.sidebar,.b .sidebar,.c .sidebar{min-height:0;border:0;display:flex;overflow:auto;gap:6px;padding:18px 18px 0}#categories{display:flex;gap:6px}.sidebar .eyebrow,.side-note{display:none}.sidebar button{white-space:nowrap;width:auto;flex-shrink:0;font-size:13px}.main{padding:25px 18px}.hero{align-items:center}.hero .num{font-size:48px}.hero p{font-size:13px}.hero h1{font-size:32px}.grid,.b .grid{grid-template-columns:1fr}.b .card{grid-template-columns:125px 1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar .primary{flex:1}.preview{height:190px}.b .preview{min-height:210px}.c .hero h1{font-size:36px}dialog{padding:22px}.actions{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.type span{opacity:1}}
.empty.start{background:#fffdf5;border:2px solid #242039;box-shadow:6px 6px 0 #242039;padding:55px 24px;color:var(--ink)}.start h2{font-size:30px;margin:14px 0}.start p{color:var(--muted);font-size:15px;line-height:1.9}.steps{display:flex;justify-content:center;gap:28px;margin:30px 0;font-size:12px;color:var(--muted)}@media(max-width:720px){.start h2{font-size:24px}.steps{gap:12px}.empty.start{padding:34px 14px}.c #categories{flex-wrap:nowrap}.c .sidebar{overflow-x:auto}.hero .num{display:none}} </style></head><body class="c">
<!-- C 方向已选定；提示词由 prompts.json 管理；预览为收录时单独制作；浏览器手动新增内容需导出后才能同步到仓库。 -->
<header class="top"><div class="brand">拾句 <small>PROMPT COLLECTION</small></div><span class="eyebrow">个人提示词工具箱</span></header>
<div class="shell"><aside class="sidebar"><div class="eyebrow">我的工具箱</div><div id="categories"></div><div class="side-note">捕捉一个想法，<br>留住一种可能。<br><br>初稿 · 浏览器本地保存</div></aside><main class="main"><section class="hero"><div><div class="eyebrow">YOUR IDEAS, WITHIN REACH.</div><h1>好点子，<br>都在这块板上。</h1><p>把好用的提示词和视觉灵感，收进自己的工具箱。</p></div><div class="num"><span id="total">06</span><small>可探索的提示词</small></div></section><div class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜索标题、标签、提示词内容…" aria-label="搜索提示词"></div><select id="sort" aria-label="排序"><option value="new">最近加入</option><option value="title">按名称排序</option></select><button class="primary" id="add">＋ 收录提示词</button></div><div class="results"><span id="resultCount"></span><span>效果预览 · 收录后制作</span></div><div class="grid" id="grid"></div><div class="foot">手动新增保存在此浏览器；仓库收录随项目更新。<button id="export">导出备份</button> <button id="import">导入备份</button><input id="file" type="file" accept="application/json" hidden></div></main></div>
<dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button data-close="detail" aria-label="关闭详情">×</button></div><p id="detailMeta" class="eyebrow"></p><div id="promptText" class="prompt-text"></div><div class="actions"><button id="edit">编辑</button><button id="delete">删除</button><button id="copy" class="primary">复制提示词</button></div></dialog>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="formTitle">收录提示词</h2><button type="button" data-close="editor" aria-label="关闭编辑">×</button></div><label for="title">标题</label><input id="title" required maxlength="100"><label for="category">分类</label><select id="category"><option>动画动效</option><option>文字效果</option><option>界面设计</option><option>写作表达</option><option>其他</option></select><label for="tags">标签（空格或逗号分隔）</label><input id="tags" maxlength="150"><label for="prompt">提示词原文</label><textarea id="prompt" required maxlength="30000" placeholder="粘贴你想保存的提示词…"></textarea><label for="description">一句话说明（选填）</label><input id="description" maxlength="200"><div class="actions"><button type="button" data-close="editor">取消</button><button class="primary">保存到工具箱</button></div></form></dialog><div role="status" class="toast hidden" id="toast"></div>
<script>
const seed=[];const key='shiju-personal-v2';let items=seed;let deleted=[];try{const local=JSON.parse(localStorage.getItem(key)||'null');if(local&&Array.isArray(local.items)&&Array.isArray(local.deleted)){deleted=local.deleted;const changed=new Map(local.items.filter(i=>i&&typeof i.id==='string'&&typeof i.title==='string'&&typeof i.prompt==='string').map(i=>[i.id,i]));items=[...seed.filter(i=>!deleted.includes(i.id)).map(i=>changed.get(i.id)||i),...local.items.filter(i=>i&&typeof i.id==='string'&&typeof i.title==='string'&&typeof i.prompt==='string'&&!seed.some(s=>s.id===i.id))]}}catch{}let category='全部提示词',selected=null,editing=null;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}function save(next){try{const removed=seed.filter(i=>!next.some(n=>n.id===i.id)).map(i=>i.id);const changed=next.filter(i=>!seed.some(s=>s.id===i.id&&JSON.stringify(s)===JSON.stringify(i)));localStorage.setItem(key,JSON.stringify({items:changed,deleted:removed}));deleted=removed;items=next;render();return true}catch{toast('保存失败：浏览器存储不可用，请先导出备份。');return false}}
function visual(item){if(item.preview&&typeof item.preview.src==='string'&&/^assets\/[a-zA-Z0-9_./-]+$/.test(item.preview.src)&&!item.preview.src.includes('..')){const p=item.preview;if(p.type==='image')return `<div class="preview"><img src="${esc(p.src)}" alt="${esc(p.alt||item.title+'效果预览')}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>`;if(p.type==='animation')return `<div class="preview"><iframe src="${esc(p.src)}" title="${esc(item.title+'动效预览')}" sandbox="allow-scripts" loading="lazy" style="border:0;width:100%;height:100%"></iframe></div>`;if(p.type==='video')return `<div class="preview"><video src="${esc(p.src)}" controls muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain"></video></div>`}const type=['orbit','type','glass','pulse','layout','write'].includes(item.effect)?item.effect:'custom';return `<div class="preview ${type}" aria-hidden="true">${({orbit:'<i class="ring"></i><i class="ring"></i><i class="ring"></i>',type:'<div><span>让灵感</span><span>慢慢浮现。</span></div>',glass:'<div><b>Clarity.</b><br><small>透过表面，看见层次</small></div>',pulse:'<span></span>',layout:'<b>The<br>Edit.</b><i></i>',write:'<del>致力于打造卓越的表达</del><span>把话说清楚。</span>',custom:'<div style="text-align:center"><span style="font:42px Georgia">Aa</span><br><small>已收录 · 暂无效果预览</small></div>'})[type]}</div>`}
function render(){const cats=['全部提示词','我的收藏','动画动效','文字效果','界面设计','写作表达','其他'];$('categories').innerHTML=cats.map(c=>`<button data-category="${c}" class="${category===c?'active':''}">${c} <small>${items.filter(i=>c==='全部提示词'||c==='我的收藏'&&i.favorite||i.category===c).length}</small></button>`).join('');const q=$('search').value.trim().toLowerCase();let list=items.filter(i=>(category==='全部提示词'||category==='我的收藏'&&i.favorite||i.category===category)&&[i.title,i.tags,i.prompt,i.description].join(' ').toLowerCase().includes(q));if($('sort').value==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));$('total').textContent=String(items.length).padStart(2,'0');$('resultCount').textContent=`${category} / ${list.length} 条`; $('grid').innerHTML=list.length?list.map(i=>`<article class="card">${visual(i)}<div class="card-body"><div class="meta"><span>${esc(i.category)}${i.id.startsWith('demo-')?' · 示例':''}</span><button class="star" data-star="${esc(i.id)}" aria-label="${i.favorite?'取消收藏':'收藏'} ${esc(i.title)}" aria-pressed="${!!i.favorite}">${i.favorite?'★':'☆'}</button></div><h2>${esc(i.title)}</h2><p class="description">${esc(i.description||'一条新收录的灵感。')}</p><div class="card-foot"><span>${esc(i.tags||'未添加标签')}</span><button data-open="${esc(i.id)}">查看提示词 ↗</button></div></div></article>`).join(''):(items.length?'<div class="empty">没有找到匹配的提示词。<br>试试其他关键词或分类。</div>':'<div class="empty start"><span class="eyebrow">A LITTLE SPACE FOR YOUR NEXT BIG IDEA</span><h2>第一条好点子，留给你。</h2><p>把找到的提示词发给我，<br>我来分类、收录，并制作合适的效果预览。</p><div class="steps"><span>01 收集提示词</span><span>02 整理分类</span><span>03 看见效果</span></div><button class="primary" id="emptyAdd">＋ 也可以自己添加</button></div>')}
$('grid').addEventListener('click',e=>{if(e.target.closest('#emptyAdd'))openEditor()});$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;render()}};$('search').oninput=render;$('sort').onchange=render;$('grid').onclick=e=>{const star=e.target.closest('[data-star]');if(star){save(items.map(i=>i.id===star.dataset.star?{...i,favorite:!i.favorite}:i));return}const b=e.target.closest('[data-open]');if(b){selected=items.find(i=>i.id===b.dataset.open);$('detailTitle').textContent=selected.title;$('detailMeta').textContent=selected.category+' / '+selected.tags;$('promptText').textContent=selected.prompt;$('detail').showModal()}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());function openEditor(i){editing=i?.id||null;$('form').reset();$('formTitle').textContent=i?'编辑提示词':'收录提示词';for(const k of ['title','category','tags','prompt','description'])if(i)$(k).value=i[k]||'';$('editor').showModal()}$('add').onclick=()=>openEditor();$('edit').onclick=()=>{$('detail').close();openEditor(selected)};$('form').onsubmit=e=>{e.preventDefault();if(!$('title').value.trim()||!$('prompt').value.trim()){toast('请填写标题和提示词。');return}const item={...(items.find(i=>i.id===editing)||{}),id:editing||crypto.randomUUID(),title:$('title').value.trim(),category:$('category').value,tags:$('tags').value.trim(),prompt:$('prompt').value.trim(),description:$('description').value.trim()};if(save(editing?items.map(i=>i.id===editing?item:i):[item,...items])){$('editor').close();toast('已保存到工具箱')}};$('delete').onclick=()=>{if(confirm('确定删除这条提示词？')){if(save(items.filter(i=>i.id!==selected.id))){$('detail').close();toast('已删除')}}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(selected.prompt);toast('提示词已复制')}catch{toast('复制失败，请选中提示词手动复制。')}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拾句-提示词备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(i=>i&&typeof i.title==='string'&&typeof i.prompt==='string'&&i.title.trim()&&i.prompt.trim()))throw Error();const merged=[...items];for(const i of data){if(!merged.some(x=>x.title===i.title&&x.prompt===i.prompt))merged.unshift({id:crypto.randomUUID(),title:i.title.slice(0,100),prompt:i.prompt.slice(0,30000),category:['动画动效','文字效果','界面设计','写作表达','其他'].includes(i.category)?i.category:'其他',tags:String(i.tags||'').slice(0,150),description:String(i.description||'').slice(0,200),favorite:!!i.favorite})}if(save(merged))toast('导入完成，已跳过重复内容')}catch{toast('导入失败，请使用有效的提示词 JSON 备份。')}finally{$('file').value=''}};render();
</script></body></html>
