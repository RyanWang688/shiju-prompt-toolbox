，可直接编写和预览 HTML、CSS、JavaScript，并浏览大量公开示例，适合找动效写法和快速做原型。\n\n许可：公开示例的许可以各作者标注为准。\n\n官网：https://codepen.io/\n\n发现途径：优设美地（allan.xin）收录的来源；介绍为本工具箱自写。\n\n收录状态：仅收藏网站，未登录、安装或购买。", "preview": {"type": "image", "src": "assets/website-codepen/official-site.jpg", "alt": "CodePen 官方网页实际截图", "width": 800, "height": 844}, "previewNote": "2026-10-23 实际打开官网后的网页截图；仅收藏，未登录、安装或购买。", "previewSource": "https://codepen.io/", "previewEvidence": "live-website-screenshot", "addedAt": "2026-10-23", "verifiedAt": "2026-10-23", "collection": "优设美地来源", "en": {"title": "CodePen", "description": "An online front-end editor and community for writing and previewing HTML, CSS and JavaScript, with a huge library of public demos — for finding motion techniques and quick prototypes.", "tags": "Online editor / Front-end community / Code demos / CSS animation", "license": "Public examples follow the licence each author states.", "previewNote": "Screenshot of the official site taken on 2026-10-23; saved for reference only — no sign-in, install or purchase."}}, {"id": "skill-fredtalk", "title": "FredTalk", "kind": "skill", "resourceType": "口播视频制作 Skill", "category": "动画动效", "repository": "https://github.com/njrhts2kvv-star/FredTalk", "officialUrl": "https://www.fred-fu.com/visual-library", "documentation": "https://github.com/njrhts2kvv-star/FredTalk/blob/main/skills/fred-remotion-output/SKILL.md", "tags": "口播视频 / 自动剪辑 / 字幕粗剪 / Remotion / 动效组件库 / Codex", "description": "把口播稿、录音和素材做成动态视频：逐句从动效组件库选画面，先出真实关键帧确认，再用 Remotion 合成输出；配套粗剪 Skill 可识别字幕、删除口误和重说。适合知识类口播与教程视频。", "source": "https://github.com/njrhts2kvv-star/FredTalk", "addedAt": "2026-10-23", "verifiedAt": "2026-10-23", "prompt": "FredTalk\n\n类型：口播视频制作 Skill\n\n用途：把口播稿、录音和素材做成动态视频：逐句从动效组件库选画面，先出真实关键帧确认，再用 Remotion 合成输出；配套粗剪 Skill 可识别字幕、删除口误和重说。适合知识类口播与教程视频。\n\n说明：主入口 fred-remotion-output 按“准备内容 → 确认画面 → 输出视频”推进，每段画面只复用或改编组件库里已认可的组件，并记录前三个候选的取舍理由；可检索的在线视觉库提供组件预览。粗剪入口 audio-subtitle-roughcut 对原声做人声处理和 1.1 倍速后调用千问 Audio 获取词级字幕，按逐字稿纠错、只删失败重说与口误，最后 +8dB 并交付可手调的审片台与 WAV / SRT；保留语气词和自然停顿。使用前提：需要 Python 3.11+、Node.js 22+ 和 GitHub CLI；字幕识别需使用者自己的千问 API Key 并授权上传录音（付费），作者的人声处理环境不随公开版提供。最新一批组件有 14 天会员抢先下载期，之前公开的组件仍按 MIT 使用。主要为 Codex 编写，也可交给其他编程 Agent。预览使用作者仓库中的组件画面。\n\n在线视觉库：https://www.fred-fu.com/visual-library\nGitHub：https://github.com/njrhts2kvv-star/FredTalk\n使用说明：https://github.com/njrhts2kvv-star/FredTalk/blob/main/skills/fred-remotion-output/SKILL.md\n字幕粗剪：https://github.com/njrhts2kvv-star/FredTalk/blob/main/skills/audio-subtitle-roughcut/SKILL.md\n\n收录状态：仅收藏资源，未安装或执行。", "preview": {"type": "image", "src": "assets/skill-fredtalk/author-t14c-price.jpg", "alt": "FredTalk 组件 T14c「价格落定」画面：GPT-6.1 Sol 输出价 $10.00 / 百万 token", "width": 960, "height": 540}, "previewSource": "https://raw.githubusercontent.com/njrhts2kvv-star/FredTalk/main/docs/assets/T14c.jpg", "previewEvidence": "author-repository-example", "previewNote": "作者仓库中的组件画面 T14c「价格落定」（数字逐位滚动、旧价划掉、差额亮出）的静帧，保留原始水印；非本次运行成果。", "skillTopics": ["动画视频"], "en": {"title": "FredTalk", "description": "Turns a talking-head script, recording and assets into a motion video: picks visuals line by line from an animation component library, shows real keyframes for approval, then renders with Remotion; a companion rough-cut Skill transcribes subtitles and removes flubs and retakes. Great for explainer and tutorial videos.", "tags": "Talking-head video / Auto editing / Subtitle rough cut / Remotion / Motion component library / Codex", "notes": "The main entry, fred-remotion-output, moves through \"prepare content → confirm visuals → render video\"; each shot only reuses or adapts approved components from the library and records why the top three candidates were kept or dropped, with a searchable online visual library for previews. The rough-cut entry, audio-subtitle-roughcut, cleans the voice, speeds it to 1.1×, gets word-level subtitles from Qwen Audio, corrects them against the script, removes only failed retakes and slips, then adds +8 dB and delivers an adjustable review page plus WAV / SRT, keeping fillers and natural pauses. Requirements: Python 3.11+, Node.js 22+ and the GitHub CLI; subtitle recognition needs your own Qwen API key and consent to upload the recording (paid), and the author's voice-processing setup isn't included in the public release. The newest components have a 14-day members-first window; earlier public components remain MIT. Written mainly for Codex but usable with other coding agents. The preview uses a component frame from the author's repository.", "previewNote": "Still from component T14c \"price settles\" in the author's repository (digits roll, the old price is struck through, the difference appears), original watermark kept; not produced here."}}, {"id": "skill-collage-design", "title": "collage-design", "kind": "skill", "resourceType": "拼贴艺术 Skill", "category": "界面设计", "repository": "https://github.com/polgarp/collage-design", "officialUrl": "https://github.com/polgarp/collage-design", "documentation": "https://github.com/polgarp/collage-design/blob/main/SKILL.md", "tags": "拼贴 / 剪贴画 / 开放授权素材 / SVG / 海报封面 / polgarp", "description": "从开放授权档案搜集真实照片与印刷品，剪切、统一色调后层叠成完整的拼贴作品，输出 SVG / PNG 与可调整的构建脚本，并记录每张素材的授权。适合海报、封面和装饰画。", "source": "https://github.com/polgarp/collage-design", "addedAt": "2026-10-23", "verifiedAt": "2026-10-23", "prompt": "collage-design\n\n类型：拼贴艺术 Skill\n\n用途：从开放授权档案搜集真实照片与印刷品，剪切、统一色调后层叠成完整的拼贴作品，输出 SVG / PNG 与可调整的构建脚本，并记录每张素材的授权。适合海报、封面和装饰画。\n\n说明：按四步工作——先写出这件作品的拼贴理念，再推敲隐含的参照，然后只从开放授权档案（或你指定的本地文件夹）获取真实素材，最后在 SVG 上剪切、处理并组合，经过评审和打磨后交付。不使用生成图像，也不照搬在世艺术家的构图；每张素材的出处与授权写入 attributions.md，并提示 CC BY-SA 等授权对成品的影响。仅支持 Claude Code，需要本机安装 ImageMagick、Inkscape、librsvg、fontconfig 与 Python（Pillow、NumPy）；单件作品约 20–40 分钟。预览使用作者仓库中的示例作品。\n\nGitHub：https://github.com/polgarp/collage-design\n使用说明：https://github.com/polgarp/collage-design/blob/main/SKILL.md\n\n收录状态：仅收藏资源，未安装或执行。", "preview": {"type": "image", "src": "assets/skill-collage-design/author-strike-anywhere.jpg", "alt": "作者示例作品 Strike Anywhere：上百张复古火柴盒标签拼贴", "width": 1200, "height": 1200}, "previewSource": "https://raw.githubusercontent.com/polgarp/collage-design/main/examples/strike-anywhere.jpg", "previewEvidence": "author-repository-example", "previewNote": "作者示例作品 Strike Anywhere，由 179 张公有领域火柴盒标签剪出 244 个碎片拼成，来自官方仓库，保留原始素材；非本次运行成果。", "skillTopics": ["图像创作", "视觉设计"], "en": {"title": "collage-design", "description": "Sources real photos and printed matter from open-licensed archives, then cuts, unifies and layers them into a finished collage, exporting SVG / PNG plus an editable build script and logging every source's licence. Great for posters, covers and wall art.", "tags": "Collage / Cut-and-paste / Open-licensed sources / SVG / Posters \u0026 covers / polgarp", "notes": "Works in four movements: write a collage philosophy for the piece, work out the subtle reference, source real material only from open-licensed archives (or a local folder you name), then cut, treat and compose on SVG before a critique and polish. No generated imagery and no copying living artists' compositions; every asset's source and licence go into attributions.md, with warnings about how licences such as CC BY-SA affect the result. Claude Code only; needs ImageMagick, Inkscape, librsvg, fontconfig and Python (Pillow, NumPy); one piece takes about 20–40 minutes. The preview uses an example piece from the author's repository.", "previewNote": "The author's example piece Strike Anywhere — 244 fragments cut from 179 public-domain matchbox labels — from the official repository, original kept; not produced here."}}, {"id": "website-howtocook", "kind": "website", "resourceType": "GitHub 项目", "title": "程序员做饭指南 · HowToCook", "category": "其他", "topics": ["实用软件"], "tags": "GitHub 项目清单 / 菜谱 / 烹饪 / 生活工具", "description": "用结构化菜谱说明食材用量、准备事项和操作步骤，方便按步骤做家常菜，也提供厨房基础知识。", "prompt": "程序员做饭指南 · HowToCook\n\n用途：用结构化菜谱说明食材用量、准备事项和操作步骤，方便按步骤做家常菜，也提供厨房基础知识。\n\n使用说明：各菜谱的用量与操作以原文为准。网页入口是仓库推荐的 HowToCook Viewer，菜谱仓库与浏览器项目分别维护。\n\n用户清单顺序：#10（用户提供的排列，不是 GitHub 实时排名）\n用户提供的亮点（原 结果。案例为虚构会议。\n\n收录状态：收藏用途、来源和真实案例；本次未安装该 Skill。\n\n官方仓库：https://github.com/pbakaus/impeccable\n官方案例说明：https://impeccable.style/cases/neo-mirai/\n实际案例网页：https://impeccable.style/neo-mirai/\n\n搜索别名：Impact-Cable。2026-10-23 用户确认截图中的此名称指向 Impeccable，因此合并到现有条目，不新增同名项目。", "preview": {"type": "image", "src": "assets/skill-impeccable/author-neo-mirai.png", "alt": "Impeccable 作者真实案例 Neo Mirai 网站的实际浏览器截图", "width": 1265, "height": 712}, "previewNote": "作者真实案例：Neo Mirai 响应式网站，2026-10-22 实际打开后截图。非本次生成；案例流程见官方说明。", "previewSource": "https://impeccable.style/neo-mirai/", "previewEvidence": "author-published-case-screenshot", "addedAt": "2026-10-22", "verifiedAt": "2026-10-23", "aliases": ["Impact-Cable"], "officialUrl": "https://github.com/pbakaus/impeccable", "repository": "https://github.com/pbakaus/impeccable", "skillTopics": ["视觉设计"], "en": {"title": "Impeccable", "description": "Helps AI design and polish frontends — typography, color, layout and interaction — and checks responsiveness and accessibility. For landing pages, product UIs and redesigns.", "tags": "Frontend design / UI review / Type \u0026 color / Responsive / Design systems", "previewNote": "The author's real case: the Neo Mirai responsive site, screenshotted on 2026-10-22. Not generated here; see the official notes for the workflow."}}, {"id": "skill-awesome-design-md", "kind": "skill", "title": "Awesome DESIGN.md", "resourceType": "design-reference-library", "category": "界面设计", "tags": "DESIGN.md / 设计参考库 / 设计令牌 / 品牌风格 / 界面规范", "description": "把真实网站的配色、字体、间距与组件规则整理成 DESIGN.md，供 AI 编写界面时参考。它是设计规范资源库，适合寻找视觉方向并保持多页面风格一致。", "source": "https://github.com/VoltAgent/awesome-design-md", "documentation": "https://github.com/VoltAgent/awesome-design-md/blob/main/README.md", "prompt": "Awesome DESIGN.md（维护者：VoltAgent）\n\n类型：设计规范参考库，按用户要求收录在 Skills 栏目；不是一项独立执行的 Skill。\n\n用途：从真实网站中分析并整理色彩、字体、间距、组件、设计令牌和使用规则，保存为 DESIGN.md，作为 AI 编写界面的视觉参考。\n\n适合：寻找品牌视觉方向、向 AI 说明想要的网页风格、保持多个页面一致，或为项目建立可复用的设计规范。\n\n使用方式：选择一个合适的参考，阅读对应 DESIGN.md，再让编码代理结合项目自己的内容和需求使用规范。参考分析不代表原品牌官方授权或背书。\n\n预览：作者网站 getdesign.md 公开的 Apple 风格设计系统交互实例（页面标题为 Lumora），本次实际打开并截图。它展示作者提供的设计参考效果，不是 Apple 官网截图，也不是本次由 Skill 生成。\n\n收录状态：收藏参考库与作者预览，本次未安装或执行工具。\n\n官方仓库：https://github.com/VoltAgent/awesome-design-md\n参考目录：https://getdesign.md/\n对应参考说明：https://getdesign.md/apple/design-md\n实际交互预览：https://getdesign.md/design-md/apple/preview", "preview": {"type": "image", "src": "assets/skill-awesome-design-md/author-apple-preview.png", "alt": "作者 getdesign.md 公开的 Apple 风格 Lumora 设计系统实例实际截图", "width": 1265, "height": 712}, "previewNote": "作者真实示例：getdesign.md 公开的 Apple 风格 / Lumora 交互预览，2026-10-22 实际截图。非 Apple 官网，非本次生成。", "previewSource": "https://getdesign.md/design-md/apple/preview", "previewEvidence": "author-published-reference-preview", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "officialUrl": "https://github.com/VoltAgent/awesome-design-md", "repository": "https://github.com/VoltAgent/awesome-design-md", "skillTopics": ["视觉设计"], "en": {"title": "Awesome DESIGN.md", "description": "Captures real websites' colors, fonts, spacing and component rules as DESIGN.md files for AI to follow when building UIs — a style reference library for finding a direction and staying consistent.", "tags": "DESIGN.md / Design reference library / Design tokens / Brand style / UI guidelines", "previewNote": "The author's real example: the public Apple-style / Lumora interactive preview on getdesign.md, screenshotted on 2026-10-22. Not Apple's site, not generated here."}}, {"id": "skill-pixel2motion", "kind": "skill", "title": "pixel2motion", "category": "动画动效", "tags": "Logo 动画 / 位图转 SVG / 品牌开场 / 矢量拟合", "description": "把位图 Logo 转成平滑、可编辑的 SVG，再编排为品牌动画与独立 HTML 展示。适合 Logo 开场、加载、悬停动效，并提供矢量拟合和动画验收依据。", "source": "https://github.com/nolangz/pixel2motion", "documentation": "https://github.com/nolangz/pixel2motion/blob/main/SKILL.md", "prompt": "pixel2motion（作者：nolangz / Nolan Lai）\n\n用途：把 PNG、JPG、WebP 或截图中的 Logo 重建为结构清晰、平滑且可编辑的 SVG，再制作品牌动画。\n\n流程：分析源图与品牌动效性格 → 最少复杂度的矢量拟合 → 动画编排 → 几何与动作质量检查。强调平滑边缘、语义化拆分，以及动画最终画面与确认过的静态矢量一致。\n\n适合：Logo reveal、品牌开场、启动屏、加载与悬停动效，以及像素图到 SVG 的重建。\n\n主要交付：静态 logo.svg、可独立打开的动画 HTML、动效规范、拟合叠图与动画帧检查证据；可制作 GIF/视频预览。\n\n预览：作者仓库公开的 Horizon 和 CueRecord 动态 GIF。未在本次运行该 Skill，也未安装。\n\n官方 Skill：https://github.com/nolangz/pixel2motion/blob/main/SKILL.md\n完整互动展示：https://nolangz.github.io/pixel2motion/", "preview": {"type": "image", "src": "assets/skill-pixel2motion/author-horizon.gif", "alt": "作者真实示例：Horizon Logo 从位图重建后的动画输出", "width": 640, "height": 418}, "previewNote": "作者真实示例：官方仓库 docs/gifs/claude-horizon.gif；非本次生成。另附 CueRecord 动画与作者完整互动展示。", "previewSource": "https://github.com/nolangz/pixel2motion/blob/e9faedb28930df0da2acf17da00c80730a78cfe8/docs/gifs/claude-horizon.gif", "previewEvidence": "author-published-demo", "demo": "assets/skill-pixel2motion/showcase.html", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "officialUrl": "https://github.com/nolangz/pixel2motion", "repository": "https://github.com/nolangz/pixel2motion", "skillTopics": ["动画视频"], "en": {"title": "pixel2motion", "description": "Converts bitmap logos into smooth, editable SVGs, then choreographs brand animations as standalone HTML. For logo intros, loaders and hovers, with vector-fit and animation QA.", "tags": "Logo animation / Bitmap to SVG / Brand intro / Vector fitting", "previewNote": "The author's real example: docs/gifs/claude-horizon.gif in the official repository; not generated here. The CueRecord animation and the author's full interactive showcase are also included."}}, {"id": "skill-child-photo-doodle-collage", "kind": "skill", "title": "child-photo-doodle-collage", "category": "界面设计", "tags": "照片涂鸦 / 蜡笔插画 / 创意写真 / 人像合成", "description": "把真人照片与蜡笔手绘涂鸦融合，保留人物面容、姿态和服装，让小动物、道具与人物产生真实接触。适合儿童或成人的童趣写真和创意照片合成。", "source": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "documentation": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage/blob/main/skill/child-photo-doodle-collage/SKILL.md", "prompt": "child-photo-doodle-collage\n\n用途：将用户提供的照片加工为真人与蜡笔涂鸦共同出现的创意写真，适用于儿童和成人。\n\n核心要求：保留面容、表情、姿势、发型与服装；使用平面蜡笔或彩铅质感的插画；主要涂鸦需要接触人物身体或照片中的真实道具，例如小猫趴肩、鸟停指尖或小动物扒住包口。\n\n背景：默认替换为留白充分的暖白影棚背景；当环境配色、户外场景或真实道具是画面核心时保留原场景。\n\n可附加：简短英文手写词、爱心、星星和符合动作状态的运动线。\n\n输入：一张需要处理的原始照片。\n\n预览来源：作者仓库公开的标准输出与作品合集，并非本次重新生成。\n\n来源：https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "preview": {"type": "image", "src": "assets/skill-child-photo-doodle-collage/author-showcase.jpg", "alt": "作者公开的真实照片涂鸦合成作品合集", "width": 1219, "height": 1198}, "previewNote": "作者真实示例：公开仓库 showcase-overview.jpg，保留原始作品与水印；非本次生成。", "previewSource": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage/blob/main/showcase/comparisons/showcase-overview.jpg", "previewEvidence": "author-published-output", "officialUrl": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "repository": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "skillTopics": ["图像创作"], "en": {"title": "child-photo-doodle-collage", "description": "Blends real photos with crayon doodles while keeping faces, poses and clothing intact, letting little animals and props genuinely interact with people. For playful portraits of kids or adults.", "tags": "Photo doodle / Crayon illustration / Creative portraits / Portrait compositing", "previewNote": "The author's real example: showcase-overview.jpg from the public repository, original work and watermark kept; not generated here."}}, {"id": "skill-gsap-skills", "kind": "skill", "title": "gsap-skills", "category": "动画动效", "tags": "GSAP / 时间轴 / 滚动联动 / SVG / 动画开发", "description": "GreenSock 官方的 GSAP 技能合集，帮助 AI 正确编写时间轴、滚动联动、错峰和 SVG 动画，并处理框架集成与性能优化。适合网页动效和交互动画开发。", "source": "https://github.com/greensock/gsap-skills", "documentation": "https://github.com/greensock/gsap-skills/blob/main/README.md", "prompt": "gsap-skills\n\n用途：GreenSock 官方提供的一组 AI 动画开发技能，指导代理使用 GSAP 编写和维护网页动画。它是多个 Skills 的合集，并非只有一份 Skill。\n\n覆盖：基础补间与缓动、时间轴编排、错峰  if(matchMedia('(prefers-reduced-motion:reduce)').matches){apply();return}
 if(!document.startViewTransition){root.classList.add('theme-fade');apply();setTimeout(()=>root.classList.remove('theme-fade'),520);return}
 const box=origin.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2,radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 root.classList.add('theme-vt');const transition=document.startViewTransition(apply);transition.finished.finally(()=>root.classList.remove('theme-vt'));
 transition.ready.then(()=>{root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${radius}px at ${x}px ${y}px)`]},{duration:720,easing:'cubic-bezier(.2,.9,.22,1)',pseudoElement:'::view-transition-new(root)'});
  root.animate({transform:['none','scale(.985)'],filter:['brightness(1)','brightness(.8)']},{duration:720,easing:'cubic-bezier(.2,.9,.22,1)',pseudoElement:'::view-transition-old(root)'})}).catch(()=>{})}
$('themeToggle').onclick=e=>setTheme(currentTheme()==='dark'?'light':'dark',e.currentTarget);
// Follow the system only until the visitor picks a theme themselves.
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{let saved=null;try{saved=localStorage.getItem(themeKey)}catch{}if(!saved)setTheme(e.matches?'dark':'light',$('themeToggle'),false)});
document.querySelector('.lang-switch').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)switchLanguage(b.dataset.lang,b)});
new ResizeObserver(()=>moveLangThumb(false)).observe(document.querySelector('.lang-switch'));
moveLangThumb(false);{const firstSync=syncLikes(true),firstPaint=()=>transitionCards(applyLanguage,true);if(likesState==='loading'&&!likeCounts.size)Promise.race([firstSync,new Promise(r=>setTimeout(r,1200))]).finally(firstPaint);else firstPaint();firstSync.then(changed=>changed&&refreshRanking())}
</script></body></html>
