说封面，实际生成依赖可用的图像工具。\n\n预览：作者真实示例：官方仓库 demo/封面-剑道独尊.png；保留原图，非本次生成。\n\n收录状态：仅收藏用途、文档和真实示例（如有），未安装或执行此 Skill，未采信截图中的 GitHub 星数，个人评分留给用户。\n\n官方来源：https://github.com/zenstory-ai/oh-story-claudecode\n说明文档：https://github.com/zenstory-ai/oh-story-claudecode/blob/74080143dd1ac9a39a930fafd99a0dbbe61b946a/skills/story-cover/SKILL.md\n真实示例出处：https://github.com/zenstory-ai/oh-story-claudecode/blob/74080143dd1ac9a39a930fafd99a0dbbe61b946a/demo/封面-剑道独尊.png", "officialUrl": "https://github.com/zenstory-ai/oh-story-claudecode", "repository": "https://github.com/zenstory-ai/oh-story-claudecode", "skillTopics": ["写作创作"], "en": {"title": "story-cover", "description": "Creates novel covers with title and byline from the book title, author name and genre; actual rendering depends on an available image tool.", "tags": "Fiction writing / Covers / Title typography / Book visuals"}}, {"id": "skill-moss-image", "kind": "skill", "title": "MOSS-Image", "resourceType": "image-model-with-prompt-enhancer", "category": "其他", "tags": "AI 生图 / 提示词增强 / 文字渲染 / 布局控制 / 海报插画", "description": "OpenMOSS 的图像生成项目，支持文字渲染与布局控制；附带的 moss-image-prompt-enhancer Skill 可把创意整理为详细描述或布局 JSON。适合海报、插画及文字位置规划。", "source": "https://github.com/OpenMOSS/MOSS-Image", "documentation": "https://github.com/OpenMOSS/MOSS-Image/blob/main/skills/moss-image-prompt-enhancer/SKILL.md", "prompt": "MOSS-Image（OpenMOSS）\n\n项目用途：文生图模型系列，包含 Base 和 SFT，支持自然语言描述、文字渲染，以及通过 JSON 指定物体、文字与空间位置的布局控制。\n\n仓库内 Skill：moss-image-prompt-enhancer。将创意扩展为详细 caption，或为海报、多面板与精确文字位置编写 Layout；配套 Python 脚本负责坐标转换和提示词序列化，不调用图像生成服务。\n\n适合：海报和图文排版、插画或摄影风格图像的提示词整理、多个元素之间的位置规划。\n\n使用区别：Skill 输出可粘贴的提示词；真正出图仍需要 MOSS-Image 模型或相应生成服务。使用 Layout 时，生成尺寸需与布局尺寸一致。\n\n预览：作者官方仓库公开的模型输出合集，展示摄影、插画及文字渲染等效果。它是相关 MOSS-Image 模型的作者示例，不是 Prompt Enhancer Skill 单独生成的图，也不是本次生成。\n\n收录状态：收藏模型项目及其配套 Skill 的用途、来源和真实示例；本次未安装 Skill、下载模型权重或调用生图。\n\n官方仓库：https://github.com/OpenMOSS/MOSS-Image\n官方项目页：https://openmoss.ai/MOSS-Image/\nSkill 说明：https://github.com/OpenMOSS/MOSS-Image/blob/main/skills/moss-image-prompt-enhancer/SKILL.md\n官方在线演示：https://huggingface.co/spaces/OpenMOSS-Team/MOSS-Image", "preview": {"type": "image", "src": "assets/skill-moss-image/author-showcase.webp", "alt": "OpenMOSS 官方发布的 MOSS-Image 模型真实输出合集，非 Prompt Enhancer 单独输出", "width": 2400, "height": 2680}, "previewNote": "作者真实模型示例：官方 assets/showcase/overview.webp 原图。展示 MOSS-Image 模型效果；配套 Skill 只增强提示词，本图非本次生成。", "previewSource": "https://github.com/OpenMOSS/MOSS-Image/blob/52b87fca23acedc399d062d593bec388aee9926a/assets/showcase/overview.webp", "previewEvidence": "author-published-model-output", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "officialUrl": "https://github.com/OpenMOSS/MOSS-Image", "repository": "https://github.com/OpenMOSS/MOSS-Image", "skillTopics": ["图像创作"], "en": {"title": "MOSS-Image", "description": "OpenMOSS's image generation project with text rendering and layout control; its moss-image-prompt-enhancer Skill turns ideas into detailed descriptions or layout JSON. For posters, illustrations and text placement.", "tags": "AI image generation / Prompt enhancement / Text rendering / Layout control / Posters \u0026 illustration"}}, {"id": "skill-impeccable", "kind": "skill", "title": "Impeccable", "category": "界面设计", "tags": "前端设计 / 界面评审 / 排版配色 / 响应式 / 设计系统", "description": "帮助 AI 设计和打磨前端界面，改善排版、配色、布局与交互，并检查响应式和可访问性。适合落地页、产品界面及现有网页的设计优化。", "source": "https://github.com/pbakaus/impeccable", "documentation": "https://github.com/pbakaus/impeccable/blob/main/skill/SKILL.src.md", "prompt": "Impeccable（作者：Paul Bakaus）\n\n用途：为 AI 编码代理提供前端设计指导，覆盖界面创建、设计评审、排版、布局、配色、动效、文案、响应式和可访问性。\n\n适合：网页与落地页设计、产品界面打磨、改善通用模板感，以及从现有代码整理 DESIGN.md、设计令牌与组件。\n\n典型能力：critique 设计评审、audit 技术检查、polish 细节打磨、typeset 排版、layout 布局、animate 动效、adapt 多设备适配。具体命令以官方当前文档为准。\n\n预览：本次实际打开作者发布的 Neo Mirai 工作网站并截图。官方案例介绍了从页面参考图、品牌工具包到响应式网页的实现过程；这是作者真实案例，并非本次生成或实际运行 Impeccable 的结果。案例为虚构会议。\n\n收录状态：收藏用途、来源和真实案例；本次未安装该 Skill。\n\n官方仓库：https://github.com/pbakaus/impeccable\n官方案例说明：https://impeccable.style/cases/neo-mirai/\n实际案例网页：https://impeccable.style/neo-mirai/\n\n搜索别名：Impact-Cable。2026-10-23 用户确认截图中的此名称指向 Impeccable，因此合并到现有条目，不新增同名项目。", "preview": {"type": "image", "src": "assets/skill-impeccable/author-neo-mirai.png", "alt": "Impeccable 作者真实案例 Neo Mirai 网站的实际浏览器截图", "width": 1265, "height": 712}, "previewNote": "作者真实案例：Neo Mirai 响应式网站，2026-10-22 实际打开后截图。非本次生成；案例流程见官方说明。", "previewSource": "https://impeccable.style/neo-mirai/", "previewEvidence": "author-published-case-screenshot", "addedAt": "2026-10-22", "verifiedAt": "2026-10-23", "aliases": ["Impact-Cable"], "officialUrl": "https://github.com/pbakaus/impeccable", "repository": "https://github.com/pbakaus/impeccable", "skillTopics": ["视觉设计"], "en": {"title": "Impeccable", "description": "Helps AI design and polish frontends — typography, color, layout and interaction — and checks responsiveness and accessibility. For landing pages, product UIs and redesigns.", "tags": "Frontend design / UI review / Type \u0026 color / Responsive / Design systems"}}, {"id": "skill-awesome-design-md", "kind": "skill", "title": "Awesome DESIGN.md", "resourceType": "design-reference-library", "category": "界面设计", "tags": "DESIGN.md / 设计参考库 / 设计令牌 / 品牌风格 / 界面规范", "description": "把真实网站的配色、字体、间距与组件规则整理成 DESIGN.md，供 AI 编写界面时参考。它是设计规范资源库，适合寻找视觉方向并保持多页面风格一致。", "source": "https://github.com/VoltAgent/awesome-design-md", "documentation": "https://github.com/VoltAgent/awesome-design-md/blob/main/README.md", "prompt": "Awesome DESIGN.md（维护者：VoltAgent）\n\n类型：设计规范参考库，按用户要求收录在 Skills 栏目；不是一项独立执行的 Skill。\n\n用途：从真实网站中分析并整理色彩、字体、间距、组件、设计令牌和使用规则，保存为 DESIGN.md，作为 AI 编写界面的视觉参考。\n\n适合：寻找品牌视觉方向、向 AI 说明想要的网页风格、保持多个页面一致，或为项目建立可复用的设计规范。\n\n使用方式：选择一个合适的参考，阅读对应 DESIGN.md，再让编码代理结合项目自己的内容和需求使用规范。参考分析不代表原品牌官方授权或背书。\n\n预览：作者网站 getdesign.md 公开的 Apple 风格设计系统交互实例（页面标题为 Lumora），本次实际打开并截图。它展示作者提供的设计参考效果，不是 Apple 官网截图，也不是本次由 Skill 生成。\n\n收录状态：收藏参考库与作者预览，本次未安装或执行工具。\n\n官方仓库：https://github.com/VoltAgent/awesome-design-md\n参考目录：https://getdesign.md/\n对应参考说明：https://getdesign.md/ 建后的动画输出", "width": 640, "height": 418}, "previewNote": "作者真实示例：官方仓库 docs/gifs/claude-horizon.gif；非本次生成。另附 CueRecord 动画与作者完整互动展示。", "previewSource": "https://github.com/nolangz/pixel2motion/blob/e9faedb28930df0da2acf17da00c80730a78cfe8/docs/gifs/claude-horizon.gif", "previewEvidence": "author-published-demo", "demo": "assets/skill-pixel2motion/showcase.html", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "officialUrl": "https://github.com/nolangz/pixel2motion", "repository": "https://github.com/nolangz/pixel2motion", "skillTopics": ["动画视频"], "en": {"title": "pixel2motion", "description": "Converts bitmap logos into smooth, editable SVGs, then choreographs brand animations as standalone HTML. For logo intros, loaders and hovers, with vector-fit and animation QA.", "tags": "Logo animation / Bitmap to SVG / Brand intro / Vector fitting"}}, {"id": "skill-child-photo-doodle-collage", "kind": "skill", "title": "child-photo-doodle-collage", "category": "界面设计", "tags": "照片涂鸦 / 蜡笔插画 / 创意写真 / 人像合成", "description": "把真人照片与蜡笔手绘涂鸦融合，保留人物面容、姿态和服装，让小动物、道具与人物产生真实接触。适合儿童或成人的童趣写真和创意照片合成。", "source": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "documentation": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage/blob/main/skill/child-photo-doodle-collage/SKILL.md", "prompt": "child-photo-doodle-collage\n\n用途：将用户提供的照片加工为真人与蜡笔涂鸦共同出现的创意写真，适用于儿童和成人。\n\n核心要求：保留面容、表情、姿势、发型与服装；使用平面蜡笔或彩铅质感的插画；主要涂鸦需要接触人物身体或照片中的真实道具，例如小猫趴肩、鸟停指尖或小动物扒住包口。\n\n背景：默认替换为留白充分的暖白影棚背景；当环境配色、户外场景或真实道具是画面核心时保留原场景。\n\n可附加：简短英文手写词、爱心、星星和符合动作状态的运动线。\n\n输入：一张需要处理的原始照片。\n\n预览来源：作者仓库公开的标准输出与作品合集，并非本次重新生成。\n\n来源：https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "preview": {"type": "image", "src": "assets/skill-child-photo-doodle-collage/author-showcase.jpg", "alt": "作者公开的真实照片涂鸦合成作品合集", "width": 1219, "height": 1198}, "previewNote": "作者真实示例：公开仓库 showcase-overview.jpg，保留原始作品与水印；非本次生成。", "previewSource": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage/blob/main/showcase/comparisons/showcase-overview.jpg", "previewEvidence": "author-published-output", "officialUrl": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "repository": "https://github.com/haomiaomou-cmd/child-photo-doodle-collage", "skillTopics": ["图像创作"], "en": {"title": "child-photo-doodle-collage", "description": "Blends real photos with crayon doodles while keeping faces, poses and clothing intact, letting little animals and props genuinely interact with people. For playful portraits of kids or adults.", "tags": "Photo doodle / Crayon illustration / Creative portraits / Portrait compositing"}}, {"id": "skill-gsap-skills", "kind": "skill", "title": "gsap-skills", "category": "动画动效", "tags": "GSAP / 时间轴 / 滚动联动 / SVG / 动画开发", "description": "GreenSock 官方的 GSAP 技能合集，帮助 AI 正确编写时间轴、滚动联动、错峰和 SVG 动画，并处理框架集成与性能优化。适合网页动效和交互动画开发。", "source": "https://github.com/greensock/gsap-skills", "documentation": "https://github.com/greensock/gsap-skills/blob/main/README.md", "prompt": "gsap-skills\n\n用途：GreenSock 官方提供的一组 AI 动画开发技能，指导代理使用 GSAP 编写和维护网页动画。它是多个 Skills 的合集，并非只有一份 Skill。\n\n覆盖：基础补间与缓动、时间轴编排、错峰入场、ScrollTrigger 滚动联动、动画插件、React/Vue/Svelte 集成和性能优化。\n\n适合：多元素协同动画、滚动叙事、SVG 动效，以及需要暂停、反转或动态控制的交互动画。\n\n主要技能：gsap-core、gsap-timeline、gsap-scrolltrigger、gsap-plugins、gsap-utils、gsap-react、gsap-performance、gsap-frameworks。\n\n收录状态：已收藏官方来源和用途说明，尚未安装或执行。\n预览：本次运行 GSAP 的实际画面，按官方 core / timeline 示例模式制作；另附可播放的本地演示。\n\n官方仓库：https://github.com/greensock/gsap-skills", "addedAt": "2026-10-22", "verifiedAt": "2026-10-22", "preview": {"type": "image", "src": "assets/skill-gsap-skills/runtime-preview.png", "alt": "实际运行 GSAP 时间轴与错峰动画后保存的浏览器画面", "width": 1280, "height": 720}, "previewNote": "本次真实运行截图：使用 GSAP 3.15.0，按官方 core / timeline 模式制作。点击“打开实际演示”可播放、暂停或重播。", "previewSource": "https://github.com/greensock/gsap-skills/blob/main/examples/vanilla/main.js", "previewEvidence": "locally-executed-gsap", "demo": "assets/skill-gsap-skills/live-demo ographic card web page with sheen and layered parallax, plus an editable Blender project.", "tags": "Holo cards / 3D cards / Blender / Three.js"}}, {"id": "fab-to-sheet", "title": "加号展开面板", "category": "动画动效", "topics": ["App 交互"], "tags": "容器变形 / 面板 / 480ms", "description": "容器从悬浮按钮连续展开，选项错峰淡入。", "prompt": "悬浮按钮形变为底部面板（FAB to Sheet）：同一个容器的宽高从64连续过渡到470乘300、圆角从32到28，走cubic-bezier(.2,.9,.22,1)约480ms；面板里的选项等容器落定后按每项4帧交错淡入，关闭时沿同一条曲线反向收回原位。", "preview": {"type": "animation", "src": "assets/fab-to-sheet/preview.html", "alt": "加号展开面板：可交互演示"}, "sourceImage": "assets/fab-to-sheet/source.png", "previewNote": "根据提示词手工制作的可交互演示，非模型实测输出。", "addedAt": "2026-10-22", "cardPreview": {"type": "image", "src": "assets/fab-to-sheet/card-preview.png", "alt": "加号展开面板 实际网页演示截图；点开可交互", "width": 1280, "height": 720}, "cardPreviewNote": "本工具箱实际网页演示的浏览器截图，卡片使用静态封面，详情保留完整交互。", "en": {"title": "FAB to Sheet", "description": "The container expands continuously from the floating button, with options fading in staggered.", "tags": "Container morph / Panel / 480ms"}}, {"id": "button-loader-success", "title": "提交状态反馈", "category": "动画动效", "topics": ["按钮交互"], "tags": "按钮 / 加载 / 状态反馈", "description": "按钮、环形进度和成功结果在同一容器完成。", "prompt": "按钮状态形变链（Button to Loader to Success）：点击后宽度从470收到76变成圆形，沿边缘绘制环形进度；走满后环合拢，勾形用strokeDasharray描边画出来，再横向展开成结果条。三个状态共用一个容器，位置从头到尾不变。", "preview": {"type": "animation", "src": "assets/button-loader-success/preview.html", "alt": "提交状态反馈：可交互演示"}, "sourceImage": "assets/button-loader-success/source.png", "previewNote": "根据提示词手工制作的可交互演示，非模型实测输出。", "addedAt": "2026-10-22", "cardPreview": {"type": "image", "src": "assets/button-loader-success/card-preview.png", "alt": "提交状态反馈 实际网页演示截图；点开可交互", "width": 1280, "height": 720}, "cardPreviewNote": "本工具箱实际网页演示的浏览器截图，卡片使用静态封面，详情保留完整交互。", "en": {"title": "Submit State Feedback", "description": "Button, progress ring and success result all play out in a single container.", "tags": "Button / Loading / State feedback"}}, {"id": "elastic-tab-indic $('copy').onclick=async()=>{if(!selected)return;const button=$('copy'),revision=++copyRevision,label=copyLabel(selected),text=selected.kind==='website'?selected.source:selected.prompt;clearTimeout(copyTimer);button.disabled=true;try{await navigator.clipboard.writeText(text);if(revision!==copyRevision)return;button.innerHTML='<svg class="copy-check" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>'+tr('复制成功')+'</span>';button.classList.add('copy-success');toast(tr('✓ 复制成功，已放入剪贴板'));if(!matchMedia('(prefers-reduced-motion:reduce)').matches)button.animate([{transform:'scale(1)'},{transform:'scale(.96)',offset:.2},{transform:'scale(1.04)',offset:.65},{transform:'scale(1)'}],{duration:460,easing:'cubic-bezier(.2,.9,.22,1)'});copyTimer=setTimeout(()=>{if(revision===copyRevision){button.textContent=label;button.classList.remove('copy-success')}},2200)}catch{if(revision===copyRevision)toast(tr('复制失败，请选中内容手动复制。'))}finally{if(revision===copyRevision)button.disabled=false}};
$('detail').addEventListener('close',resetCopy);
$('export').onclick=()=>{const data=items.map(({rating,...item})=>item);const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='拾句-工具箱备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(i=>i&&typeof i.title==='string'&&typeof i.prompt==='string'&&i.title.trim()&&i.prompt.trim()))throw Error();if(data.some(i=>i.kind==='website'&&!websiteUrl(i.source)))throw Error();const merged=[...items];for(const i of data){let existing=merged.find(x=>x.title===i.title&&x.prompt===i.prompt);if(!existing){existing={id:crypto.randomUUID(),kind:['skill','website'].includes(i.kind)?i.kind:'prompt',title:i.title.slice(0,100),prompt:i.prompt.slice(0,30000),category:['动画动效','文字效果','界面设计','写作表达','其他'].includes(i.category)?i.category:'其他',tags:String(i.tags||'').slice(0,150),description:String(i.description||'').slice(0,200),source:String(i.source||'').slice(0,1000),favorite:!!i.favorite};merged.unshift(existing)}}if(save(merged))toast(tr('导入完成，重复内容已合并。'))}catch{toast(tr('导入失败，请使用有效的 JSON 备份。'))}finally{$('file').value=''}};
function copyLabel(item){return tr(item.kind==='website'?'复制网站地址':item.kind==='skill'?'复制 Skill 内容':'复制提示词')}
function applyLanguage(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-label]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.i18nLabel)));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.i18nPlaceholder));document.querySelectorAll('.lang-option').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));hideRailTooltip();render();applyMasonry();positionTopicIndicator()}
// The language thumb reuses the elastic tab motion, clamped inside its pill.
let langFrame=0;
function moveLangThumb(animate){const thumb=document.querySelector('.lang-thumb'),active=document.querySelector('.lang-option[aria-pressed="true"]'),min=3,max=thumb.parentElement.clientWidth-3,to={left:active.offsetLeft,top:0,width:active.offsetWidth,height:0},paint=r=>{const left=Math.max(min,r.left),right=Math.min(max,r.left+r.width);thumb.style.left=left+'px';thumb.style.width=Math.max(0,right-left)+'px'};cancelAnimationFrame(langFrame);if(!animate||!thumb.style.width){paint(to);return}const from={left:parseFloat(thumb.style.left),top:0,width:parseFloat(thumb.style.width),height:0};let start,tailStart,frames=0;const tick=now=>{start??=now;frames++;if(frames===7)tailStart=now;const p=Math.min(1,(now-start)/560),tail=tailStart===undefined?0:Math.min(1,(now-tailStart)/Math.max(1,560-(tailStart-start)));paint(p<1?elasticTopicRect(from,to,p,tail):to);if(p<1)langFrame=requestAnimationFrame(tick)};langFrame=requestAnimationFrame(tick)}
// Without view transitions, changed text resolves from blur in a wave that starts at the toggle.
function revealText(origin){const o=origin.getBoundingClientRect(),reach=Math.hypot(innerWidth,innerHeight);document.querySelectorAll('.dashboard-shell :is([data-i18n],h1,h2,.description,.card-foot>span,.meta>span,.preview-credit,.visit-site,.topic-chip,#resultCount)').forEach(el=>{const r=el.getBoundingClientRect();if(!r.width||r.bottom<0||r.top>innerHeight)return;const distance=Math.hypot(r.left+r.width/2-o.left,r.top+r.height/2-o.top);el.animate([{opacity:0,filter:'blur(6px)',transform:'translateY(6px)'},{opacity:1,filter:'blur(0)',transform:'none'}],{duration:420,delay:distance/reach*320,easing:'cubic-bezier(.2,.9,.22,1)',fill:'backwards'})})}
function switchLanguage(next,origin){if(next===lang)return;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,update=()=>{lang=next;try{localStorage.setItem(langKey,lang)}catch{}applyLanguage();moveLangThumb(!reduce)};if(reduce||!document.startViewTransition){update();if(!reduce)revealText(origin);return}const box=origin.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2,radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y)),root=document.documentElement;root.classList.add('lang-vt');const transition=document.startViewTransition(update);transition.finished.finally(()=>root.classList.remove('lang-vt'));transition.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${radius}px at ${x}px ${y}px)`]},{duration:760,easing:'cubic-bezier(.2,.9,.22,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{})}
document.querySelector('.lang-switch').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)switchLanguage(b.dataset.lang,b)});
new ResizeObserver(()=>moveLangThumb(false)).observe(document.querySelector('.lang-switch'));
transitionCards(applyLanguage,true);moveLangThumb(false);
