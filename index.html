const seed=[{"id": "skill-openscreen", "kind": "skill", "resourceType": "开源录屏演示工具 / 配套 Skill", "title": "OpenScreen", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "录屏 / 产品演示 / 自动缩放 / 自动字幕 / AI 剪辑 / Screen Studio 替代 / Codex", "description": "免费开源的录屏做演示工具（Screen Studio 的开源替代）：录屏后自动跟随光标缩放、加摄像头小窗和本地自动字幕，用对话让 AI 帮你剪辑，GPU 加速导出 MP4 / GIF，无水印、无订阅，商用也免费。", "prompt": "OpenScreen\n类型：开源录屏演示工具 / 配套 Skill\n\n用途：免费开源的录屏做演示工具（Screen Studio 的开源替代）：录屏后自动跟随光标缩放、加摄像头小窗和本地自动字幕，用对话让 AI 帮你剪辑，GPU 加速导出 MP4 / GIF，无水印、无订阅，商用也免费。\n\n说明：录指定窗口或整个屏幕，同时录麦克风和系统声音；摄像头画中画有 8 个吸附位置；缩放可自动跟随光标也可手动设置深度、时长和缓动；光标可调大小、平滑轨迹并加点击特效；配音字幕在本机转写、不上传，删掉文字稿里的一句就能剪掉对应片段；AI 剪辑助手用自带的 Key（Claude、OpenAI、Gemini 等）把对话里的要求直接改到时间线上（剪切、缩放、变速、标注、镜头取景），默认不开启。另有壁纸背景、运动模糊、文字 / 箭头标注、多比例导出，界面支持简体中文。附带命令行和 MCP，可用 openscreen-demo Skill 让 Claude Code、Codex 等 Agent 自动录制并剪好功能演示视频。支持 Windows、macOS、Linux；项目仍在快速迭代，可能有不兼容的改动。\n\n来历：原作者 Siddharth Vaddem 在 v1.5.0 后归档了原仓库（siddharthvaddem/openscreen），经他同意由社区在 getopenscreen/openscreen 继续开发，名称和 MIT 许可不变。\n\n安装 Skill：npx skills add getopenscreen/openscreen --skill openscreen-demo -y\n\n许可：MIT\n\nGitHub：https://github.com/getopenscreen/openscreen\n官网：https://getopenscreen.com/\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/getopenscreen/openscreen", "repository": "https://github.com/getopenscreen/openscreen", "officialUrl": "https://getopenscreen.com/", "preview": {"type": "image", "src": "assets/skill-openscreen/author-demo.gif", "alt": "OpenScreen 官方演示动图：一键换整片风格、删文字稿即剪视频、编辑器里的 AI 给每次点击加缩放", "width": 960, "height": 540}, "cardPreview": {"type": "image", "src": "assets/skill-openscreen/author-demo-frame.png", "alt": "OpenScreen 官方演示动图中的一帧：用对话让 AI 剪辑录屏", "width": 960, "height": 540}, "previewSource": "https://raw.githubusercontent.com/getopenscreen/openscreen/main/docs/assets/demo.gif", "previewEvidence": "author-repository-animated-example", "previewNote": "官方仓库 README 中的编辑演示动图；卡片封面是其中一帧。非本次运行成果。", "addedAt": "2026-10-28", "verifiedAt": "2026-10-28", "en": {"title": "OpenScreen", "description": "A free, open-source screen recorder for product demos (an open alternative to Screen Studio): cursor-following auto zoom, webcam overlay and on-device captions, AI editing by chat, and GPU-accelerated MP4 / GIF export — no watermarks, no subscriptions, free for commercial use.", "tags": "Screen recording / Product demos / Auto zoom / Auto captions / AI editing / Screen Studio alternative / Codex", "notes": "Record a window or the whole screen with mic and system audio; webcam picture-in-picture with eight snap positions; auto zoom that follows the cursor or manual zooms with depth, duration and easing; cursor size, smoothing and click effects; captions transcribed on-device (no upload), and deleting a sentence from the transcript cuts it from the video; a bring-your-own-key AI assistant (Claude, OpenAI, Gemini and more, off by default) applies chat requests to the timeline. Also wallpapers, motion blur, annotations and multi-ratio export, with a Simplified Chinese UI. A CLI, MCP server and the openscreen-demo skill let Claude Code, Codex and other agents record and edit feature demos. Windows, macOS and Linux; still evolving fast. The original author archived siddharthvaddem/openscreen after v1.5.0 and, with his approval, development continues at getopenscreen/openscreen under the same name and MIT licence.", "license": "MIT", "previewNote": "The editing demo GIF from the official README; the card cover is one of its frames — not output from this site."}}, {"id": "skill-ego-lite", "kind": "skill", "resourceType": "AI Agent 浏览器 / 配套 Skill", "title": "ego (lite)", "category": "其他", "skillTopics": ["开发工具"], "tags": "AI 浏览器 / 浏览器自动化 / Agent 并行 / 登录态共享 / Claude Code / Codex", "description": "给 AI Agent 用的浏览器：Agent 在各自隔离的 Space 里后台跑网页任务，你照常上网互不抢控制权；首次启动可一键导入 Chrome 的登录态、Cookie、扩展和书签，Claude Code、Codex 等 Agent 通过 ego-browser Skill 直接操控，免费、无需登录。", "prompt": "ego (lite)\n类型：AI Agent 浏览器 / 配套 Skill\n\n用途：给 AI Agent 用的浏览器：Agent 在各自隔离的 Space 里后台跑网页任务，你照常上网互不抢控制权；首次启动可一键导入 Chrome 的登录态、Cookie、扩展和书签，Claude Code、Codex 等 Agent 通过 ego-browser Skill 直接操控，免费、无需登录。\n\n说明：和 browser-use 这类「另找一个浏览器来驱动」的桥接工具不同，它本身就是你和 Agent 共用的浏览器：每个 Agent 一个隔离 Space，可以同时开很多个并行任务，你随时能看到、接管或停止。能力以页内 JavaScript 函数开放（snapshot、fill、click、wait、navigate、capture），Agent 写一段代码一次执行多步操作，比来回调用命令更快、更省 Token。浏览数据留在本机。目前支持 macOS 和 Windows，Linux 在路线图上。用法：在 Agent 里输入 /ego-browser 加一句大白话的任务。\n\n安装 Skill：npx skills add citrolabs/ego-lite（也可直接下载应用，安装时会把 ego-browser Skill 写进本机各 Agent 的 Skill 目录）\n\n许可：MIT\n\nGitHub：https://github.com/citrolabs/ego-lite\n官网：https://lite.ego.app\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/citrolabs/ego-lite", "repository": "https://github.com/citrolabs/ego-lite", "officialUrl": "https://lite.ego.app", "preview": {"type": "image", "src": "assets/skill-ego-lite/official-site.png", "alt": "ego (lite) 官网首屏的实际浏览器截图", "width": 1440, "height": 810}, "previewSource": "https://lite.ego.app/", "previewEvidence": "author-official-site-screenshot", "previewNote": "ego (lite) 官网首屏，2026-10-28 实际打开后截图；非本次运行成果。", "addedAt": "2026-10-28", "verifiedAt": "2026-10-28", "en": {"title": "ego (lite)", "description": "A browser built for AI agents: agents run web tasks in their own isolated Spaces in the background while you keep browsing, so nobody fights over control. On first launch it can import your Chrome sign-ins, cookies, extensions and bookmarks, and Claude Code, Codex and other agents drive it through the ego-browser skill. Free, no account needed.", "tags": "AI browser / Browser automation / Parallel agents / Shared sign-in state / Claude Code / Codex", "notes": "Unlike bridge tools such as browser-use that drive some other browser, it is one browser shared by you and your agents: one isolated Space per agent, many running in parallel, and you can watch, take over or stop any of them. Capabilities are exposed as in-page JavaScript functions (snapshot, fill, click, wait, navigate, capture), so an agent runs several steps in one script — faster and cheaper in tokens than command-by-command loops. Browsing data stays on your machine. macOS and Windows today, Linux on the roadmap. Type /ego-browser plus a plain-language task in your agent. Install the skill with npx skills add citrolabs/ego-lite, or download the app, which writes the skill into each local agent.", "license": "MIT", "previewNote": "The ego (lite) website hero, screenshotted on 2026-10-28 — not output from this site."}}, {"id": "website-ticket-monitoring", "kind": "website", "resourceType": "GitHub 项目", "title": "ticket-monitoring 机票监控", "category": "其他", "topics": ["实用软件"], "tags": "机票监控 / 比价 / 价格走势 / K 线 / 钉钉推送 / 自托管 / 开源", "description": "自托管的机票价格监控：从去哪儿、飞猪、携程、同程、途牛五个渠道采集航班明细，按你设的心理价判断是否达标，用钉钉推送图文和价格走势，达标时还能加电话 / 短信等强提醒；国内和国际航线都支持，数据留在本机，配置全在网页。", "prompt": "ticket-monitoring 机票监控\n类型：GitHub 项目\n\n用途：自托管的机票价格监控：从去哪儿、飞猪、携程、同程、途牛五个渠道采集航班明细，按你设的心理价判断是否达标，用钉钉推送图文和价格走势，达标时还能加电话 / 短信等强提醒；国内和国际航线都支持，数据留在本机，配置全在网页。\n\n说明：可设多用户、多航线、多日期，直飞和中转分别设心理线，还能按航司、行李、时段、中转衔接、最长时长等条件过滤；每轮汇总成一条钉钉图文，达标的排在最前，附 7 天趋势和操作建议，可叠加 Windows 弹窗、ntfy、Bark、阿里云电话 / 短信，并支持免打扰时段。网页控制台能看价格走势、K 线、价格日历和各渠道健康状况。去哪儿网页版已于 2026-10 停服，项目已改走其 H5 页面。需要 Python 3.9+，提供 Windows / Linux / macOS 发行包；有可直接点开的在线演示（演示数据为合成，不是真实票价）。\n\n许可：Apache-2.0\n\n在线演示：https://dengmeiluan.github.io/ticket-monitoring/site/\nGitHub：https://github.com/dengmeiluan/ticket-monitoring\n\n收录状态：仅收藏，未安装、登录或执行。", "source": "https://github.com/dengmeiluan/ticket-monitoring", "repository": "https://github.com/dengmeiluan/ticket-monitoring", "officialUrl": "https://dengmeiluan.github.io/ticket-monitoring/site/", "preview": {"type": "image", "src": "assets/website-ticket-monitoring/official-site.png", "alt": "机票监控台在线演示的实际浏览器截图（演示模式，合成数据）", "width": 1440, "height": 900}, "previewSource": "https://dengmeiluan.github.io/ticket-monitoring/site/", "previewEvidence": "live-website-screenshot", "previewNote": "2026-10-28 实际打开作者在线演示后的截图；演示模式，票价为合成数据。仅收藏，未安装或登录。", "addedAt": "2026-10-28", "verifiedAt": "2026-10-28", "en": {"title": "ticket-monitoring (flight price monitor)", "description": "A self-hosted flight price monitor: collects flight details from five Chinese booking sites (Qunar, Fliggy, Ctrip, Tongcheng, Tuniu), checks them against your target prices, and pushes DingTalk cards with price trends — plus phone-call or SMS alerts when a target is hit. Domestic and international routes; data stays on your machine and everything is configured in a web UI.", "tags": "Flight prices / Price comparison / Price trends / Candlestick charts / DingTalk alerts / Self-hosted / Open source", "notes": "Multiple users, routes and dates, separate targets for direct and connecting flights, and filters for airline, baggage, time window, connection, maximum duration and more. Each round becomes one DingTalk card with hits on top, a 7-day trend and advice, optionally with Windows pop-ups, ntfy, Bark or Aliyun calls / SMS and quiet hours. The web console shows trends, candlestick charts, a price calendar and channel health. Needs Python 3.9+, with Windows / Linux / macOS release packages and an online demo that uses synthetic prices.", "license": "Apache-2.0", "previewNote": "Screenshot of the author’s online demo taken on 2026-10-28; demo mode with synthetic prices. Saved for reference only — not installed or signed in."}}, {"id": "skill-video-editing", "kind": "skill", "resourceType": "视频剪辑 Skill", "title": "video-editing（视频剪辑技能）", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "口播剪辑 / B-roll / 镜头分析 / 字幕 / 质检 / Codex / 推荐：必装", "description": "口播 / 教程 / 访谈类短视频的 AI 剪辑生产线：从素材导入、转写、清稿、分镜，到寻找和规划 B-roll、分析镜头、字幕与声音设计，再到渲染和逐项质量检查，把素材堆推进成可发布的小红书 / 抖音 / 视频号成片。", "prompt": "video-editing（视频剪辑技能）\n类型：视频剪辑 Skill\n\n用途：口播 / 教程 / 访谈类短视频的 AI 剪辑生产线：从素材导入、转写、清稿、分镜，到寻找和规划 B-roll、分析镜头、字幕与声音设计，再到渲染和逐项质量检查，把素材堆推进成可发布的小红书 / 抖音 / 视频号成片。\n\n说明：每一步都落成可审计的文件——转写、清稿、分镜、B-roll / 生图 / 生成视频规划、素材清单、渲染配置、字幕、QA 报告和标题文案。可选用 YOLO 对抽样帧做物体检测来理解画面；停顿删段同时看声音和画面；渲染后检查字幕像素、音画对齐、声道、闪烁和单帧瞬态等问题。针对中文社媒口播调过参数（字幕、节奏、响度、平台违禁词），三平台导出。官方 README 写明面向 OpenClaw / Codex，配图可直接调用 Codex 内置的 imagegen。需要本机 FFmpeg 和 Python 环境。\n\n推荐程度（收录者）：必装\n\n许可：仓库未附许可证文件\n\nGitHub：https://github.com/maxazure/video-editing-skill\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/maxazure/video-editing-skill", "repository": "https://github.com/maxazure/video-editing-skill", "preview": null, "cardPreview": null, "previewStatus": "pending", "previewEvidence": "pending", "previewNote": "真实预览待补：作者仓库没有公开示例图或成片；本次仅收录，未运行该 Skill。", "addedAt": "2026-10-27", "verifiedAt": "2026-10-27", "en": {"title": "video-editing (video editing skill)", "description": "An AI editing pipeline for talking-head, tutorial and interview shorts: from ingest, transcription, clean-up and storyboard to finding and planning B-roll, analysing shots, captions and sound design, then rendering and itemised quality checks — turning a pile of footage into a publish-ready Xiaohongshu / Douyin / WeChat Channels video.", "tags": "Talking-head editing / B-roll / Shot analysis / Captions / QA / Codex / Pick: must-install", "notes": "Every step leaves an auditable file — transcript, clean script, storyboard, B-roll / image / generated-video plan, asset list, render config, captions, QA report and post copy. Optional YOLO detection on sampled frames for scene understanding; dead-air cuts check both sound and picture; post-render checks cover caption pixels, A/V sync, channels, flicker and single-frame glitches. Tuned for Chinese social talking-head videos, with exports for three platforms. The official README targets OpenClaw / Codex and can use Codex’s built-in imagegen. Needs FFmpeg and Python locally. Curator rating: must-install.", "license": "No license file in the repository", "previewNote": "Real preview pending: the author’s repository has no public example image or finished video; saved only, the Skill was not run here."}}, {"id": "skill-claude-video-skills", "kind": "skill", "resourceType": "Claude Code 视频剪辑 Skills", "title": "claude-video-skills", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "字幕 / 配音同步 / B-roll / 配乐 / 缩放动画 / Remotion / Claude Code / 推荐：可选安装", "description": "面向 Claude Code 的视频剪辑自动化，基于 Remotion：把粗剪好的片段（或旁白加想法）放进项目，用 /make-video 一路完成转写、按节拍排的图形方案、字幕、B-roll、缩放动画和完整配乐。", "prompt": "claude-video-skills\n类型：Claude Code 视频剪辑 Skills\n\n用途：面向 Claude Code 的视频剪辑自动化，基于 Remotion：把粗剪好的片段（或旁白加想法）放进项目，用 /make-video 一路完成转写、按节拍排的图形方案、字幕、B-roll、缩放动画和完整配乐。\n\n说明：/make-video 先问你要做什么，再分派到对应流程——竖版口播短片（9:16）、横版长视频（16:9）、只有旁白的无人出镜动效短片（纸感风格），或只写短视频脚本。首次渲染前走一遍品牌设置（主色、强调色、字体），之后每条视频沿用。转写默认用 AssemblyAI 或 OpenAI Whisper（音频会上传到服务商），也可改用本地 WhisperX。仓库只含代码，不带音乐、音效和 Logo，缺了也能渲染。注意：它只负责成片加工，不做粗剪和去口误，需要先自己把素材剪干净。\n\n兼容性：原生面向 Claude Code（.claude/skills 结构），在 Codex 等其他工具中使用需要自行适配。\n\n推荐程度（收录者）：可选安装\n\n许可：MIT\n\nGitHub：https://github.com/imtamiliniyan/claude-video-skills\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/imtamiliniyan/claude-video-skills", "repository": "https://github.com/imtamiliniyan/claude-video-skills", "preview": null, "cardPreview": null, "previewStatus": "pending", "previewEvidence": "pending", "previewNote": "真实预览待补：作者仓库没有公开成片或演示截图（仓库里只有风格参考素材）；本次仅收录，未运行该 Skill。", "addedAt": "2026-10-27", "verifiedAt": "2026-10-27", "en": {"title": "claude-video-skills", "description": "Video-editing automation for Claude Code, built on Remotion: drop in a pre-cut clip (or a voiceover plus an idea) and /make-video takes it end to end — transcription, a beat-timed graphics plan, captions, B-roll, zooms and a full audio score.", "tags": "Captions / Voiceover sync / B-roll / Music / Zoom animation / Remotion / Claude Code / Pick: optional", "notes": "/make-video asks what you are making and routes to the right pipeline: vertical talking-head shorts (9:16), long-form (16:9), faceless voiceover-only motion reels in a paper style, or a reel script only. A one-time brand setup (colours, accent, fonts) carries over to every video. Transcription uses AssemblyAI or OpenAI Whisper by default (audio is uploaded to the provider) or local WhisperX. Code only — no music, SFX or logos ship, and renders still work without them. It finishes videos but does not rough-cut or remove filler, so trim your footage first. Built natively for Claude Code (.claude/skills); other tools such as Codex need adapting. Curator rating: optional.", "license": "MIT", "previewNote": "Real preview pending: the author’s repository has no public finished video or demo screenshot (only style reference assets); saved only, the Skill was not run here."}}, {"id": "skill-dify", "kind": "skill", "resourceType": "开源 AI 应用开发平台", "title": "Dify", "category": "其他", "skillTopics": ["开发工具"], "tags": "Agent 工作流 / RAG 知识库 / 可视化编排 / 自托管 / 低代码 / LangGenius", "description": "开源的生产级 Agent 工作流开发平台：把可视化工作流编排、RAG 知识库和 Agent 配置放进同一个工作台，拖拽节点串起模型调用、条件分支和外部工具，原型到上线不用重建技术栈。", "prompt": "Dify\n类型：开源 AI 应用开发平台\n\n用途：开源的生产级 Agent 工作流开发平台：把可视化工作流编排、RAG 知识库和 Agent 配置放进同一个工作台，拖拽节点串起模型调用、条件分支和外部工具，原型到上线不用重建技术栈。\n\n说明：三件事在同一个工作台里完成——可视化工作流（拖拽节点串起 LLM 调用、条件分支、代码和外部工具）、RAG 知识库（让模型接上你自己的文档和数据）、Agent（负责多步推理和工具调用的复杂任务）。支持众多模型和工具集成；可用官方云服务，也可在 VPC 或自己的服务器上用 Docker Compose 自托管。非技术人员能上手，开发者把时间留给业务逻辑。GitHub 约 15.9 万星（2026-10-26），后端主要是 Python，前端是 TypeScript。\n\n许可：Dify Open Source License（在 Apache 2.0 基础上附加条件：未经书面授权不得用源码运营多租户服务；使用其前端时不得移除或修改控制台和应用里的 LOGO 与版权信息）\n\nGitHub：https://github.com/langgenius/dify\n官网：https://dify.ai\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/langgenius/dify", "repository": "https://github.com/langgenius/dify", "officialUrl": "https://dify.ai", "preview": {"type": "image", "src": "assets/skill-dify/official-site.png", "alt": "Dify 官网首屏的实际浏览器截图：构建生产级 Agentic 工作流平台", "width": 1440, "height": 810}, "previewSource": "https://dify.ai/zh", "previewEvidence": "author-official-site-screenshot", "previewNote": "Dify 官网首屏，2026-10-26 实际打开后截图；非本次运行成果。", "addedAt": "2026-10-26", "verifiedAt": "2026-10-26", "en": {"title": "Dify", "description": "An open-source, production-grade platform for building agentic workflows: visual workflow orchestration, RAG knowledge bases and agent setup in one workspace — drag nodes to chain model calls, branches and external tools, and go from prototype to production without rebuilding the stack.", "tags": "Agent workflows / RAG knowledge base / Visual orchestration / Self-hosting / Low-code / LangGenius", "notes": "Visual workflows (drag nodes for LLM calls, branches, code and external tools), RAG knowledge bases that connect models to your own documents and data, and agents for multi-step reasoning and tool use. Broad model and tool integrations; use the hosted cloud or self-host in a VPC or on your own servers with Docker Compose. About 159k GitHub stars (2026-10-26); Python backend, TypeScript frontend.", "license": "Dify Open Source License (Apache 2.0 with extra conditions: no multi-tenant service from the source without written permission; keep the logo and copyright in the console and apps when using its frontend)", "previewNote": "The Dify website hero, screenshotted on 2026-10-26 — not output from this site."}}, {"id": "wheel-date-picker", "kind": "prompt", "title": "滚轮选择器", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 滚轮选择器 / 惯性滚动 / 吸附 / 3D 圆柱", "description": "年月日三列滚轮跟手滚动，松手带惯性再吸附到格，中间最大最亮、上下渐小渐淡成 3D 圆柱；天数随月份更新。", "prompt": "做一个生日滚轮选择器：年、月、日三列滚轮，手指上下拖动时跟手滚动，松手后带惯性继续滚，再减速并吸附到最近的一格停稳，有咔哒感；中间选中行文字最大最亮，越往上下越小越透明，带3D圆柱弯曲效果；月份变了以后日期列的天数自动〔更〕新（如2月只有28或29天）。", "preview": {"type": "animation", "src": "assets/wheel-date-picker/preview.html", "alt": "滚轮选择器：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AIGC「4个选择器动效，第1名太顺了」系列（选择器排行 TOP 4）中「AI 描述词 · 选好这 4 项」字幕，用户提供截图。截图右侧的收藏图标遮住了个别字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-26", "cardPreview": {"type": "image", "src": "assets/wheel-date-picker/card-preview.png", "alt": "滚轮选择器：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Wheel Date Picker", "description": "Year, month and day wheels follow your finger, coast with inertia and snap to a row, the centre largest and brightest on a 3D cylinder; day counts follow the month.", "tags": "App interaction / Wheel picker / Inertial scroll / Snap / 3D cylinder", "prompt": "Build a birthday wheel picker: three wheels for year, month and day that scroll with the finger while dragging up and down, keep rolling with inertia after release, then slow down and snap to the nearest row with a click-like feel; the selected middle row has the largest, brightest text, rows get smaller and more transparent towards the top and bottom with a 3D cylinder curve; when the month changes the day column's count [updates] automatically (e.g. February has only 28 or 29 days).", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "hotel-range-calendar", "kind": "prompt", "title": "日历选区间", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 日历 / 区间选择 / 荧光笔底带 / 数字滚动", "description": "点一天为入住，按住往后滑像荧光笔依次涂出圆角底带，松手定离店日，「共 N 晚」数字滚动；选更早的日期则重新开始。", "prompt": "做一个订酒店用的日历区间选择：点第一天作为入住，日期变成实心圆；手指按住往后滑动时，从入住日到手指所在日期之间的格子像荧光笔一样依次涂上浅色底带，〔带〕子两端是圆角；松手确定离店日，底部实时显示「共 N 晚」，数字滚动变化；如〔果〕选的日期早于入住日，就自动当成新的入住日重新开始。", "preview": {"type": "animation", "src": "assets/hotel-range-calendar/preview.html", "alt": "日历选区间：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AIGC「4个选择器动效，第1名太顺了」系列（选择器排行 TOP 4）中「AI 描述词 · 选好这 4 项」字幕，用户提供截图。截图右侧的收藏图标遮住了个别字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-26", "cardPreview": {"type": "image", "src": "assets/hotel-range-calendar/card-preview.png", "alt": "日历选区间：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Hotel Range Calendar", "description": "Tap a check-in day, then press and slide to paint a rounded highlighter band day by day; release to set check-out while \"N nights\" rolls — an earlier day restarts the range.", "tags": "App interaction / Calendar / Range selection / Highlighter band / Rolling number", "prompt": "Build a date-range calendar for hotel booking: tap the first day as check-in and the date becomes a solid circle; while the finger presses and slides forward, the cells between check-in and the day under the finger get a light band painted on one after another like a highlighter, [the] band with rounded ends; release to set check-out, the bottom shows \"N nights\" live with a rolling number; [if] the chosen day is earlier than check-in, treat it as the new check-in and start over.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "price-range-slider", "kind": "prompt", "title": "双头价格滑块", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 双头滑块 / 价格区间 / 气泡避让 / 刻度吸附", "description": "两个把手拖动时放大跟手，中间轨道实时填色；价格气泡靠近时自动错开，把手不交叉、至少隔 ¥100，松手弹回并吸附到 ¥50 刻度。", "prompt": "做一个商品价格区间双头滑块：两个圆形把手可以分别拖动，拖动时把手放大到1.2倍并跟手移动，两个把手之间的轨道用强调色填充、实时跟着变长变短；把手上方〔浮〕出价格气泡，数字实时变化，两个气泡靠近时自动错开不重叠；两个把手不能交〔叉〕，至少保持100元间隔；松手时把手弹性回到正常大小，并吸附到最近的50元刻度。", "preview": {"type": "animation", "src": "assets/price-range-slider/preview.html", "alt": "双头价格滑块：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AIGC「4个选择器动效，第1名太顺了」系列（选择器排行 TOP 4）中「AI 描述词 · 选好这 4 项」字幕，用户提供截图。截图右侧的收藏图标遮住了个别字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-26", "cardPreview": {"type": "image", "src": "assets/price-range-slider/card-preview.png", "alt": "双头价格滑块：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Price Range Slider", "description": "Two thumbs grow and follow your finger while the track between them fills live; price bubbles move apart instead of overlapping, thumbs keep ¥100 apart, and release springs back to a ¥50 step.", "tags": "App interaction / Dual-thumb slider / Price range / Bubble avoidance / Step snapping", "prompt": "Build a dual-thumb product price range slider: two round thumbs can each be dragged, growing to 1.2× and following the finger while dragged, and the track between them is filled with the accent colour, lengthening and shortening live; price bubbles [pop up] above the thumbs with live numbers, and when the two bubbles get close they automatically move apart without overlapping; the thumbs can't [cross] and keep at least ¥100 apart; on release they spring back to normal size and snap to the nearest ¥50 step.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "cart-quantity-stepper", "kind": "prompt", "title": "数量加减", "category": "动画动效", "topics": ["App 交互", "按钮交互"], "tags": "App 交互 / 数量加减 / 翻页计数器 / 长按加速 / 按压反馈", "description": "按钮按下缩到 0.9 再弹回，数字像翻页计数器上下翻动约 220ms；数量到 1 时减号变灰，长按加号 0.5 秒后越加越快。", "prompt": "做一个购物车数量加减器：点＋或－时，按钮按下缩小到0.9再弹回；数字像翻页计数器一样，加的时候旧数字向上滑出、新数字从下方滑入，减的时候方向相反，〔用〕时约220ms；数量到1时－按钮变灰；长按＋超过0.5秒后越加越快连续增加。", "preview": {"type": "animation", "src": "assets/cart-quantity-stepper/preview.html", "alt": "数量加减：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AIGC「4个选择器动效，第1名太顺了」系列（选择器排行 TOP 4）中「AI 描述词 · 选好这 4 项」字幕，用户提供截图。截图右侧的收藏图标遮住了个别字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-26", "cardPreview": {"type": "image", "src": "assets/cart-quantity-stepper/card-preview.png", "alt": "数量加减：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Cart Quantity Stepper", "description": "Buttons squeeze to 0.9 and spring back while the number flips like a page counter in about 220ms; minus greys out at 1, and holding plus for 0.5 s speeds up.", "tags": "App interaction / Quantity stepper / Flip counter / Long-press acceleration / Press feedback", "prompt": "Build a cart quantity stepper: tapping + or − shrinks the button to 0.9 and springs it back; the number behaves like a flip counter — when adding, the old number slides up and out and the new one slides in from below, and when subtracting the direction is reversed, taking about 220ms; at a quantity of 1 the − button turns grey; holding + for more than 0.5 seconds keeps adding, faster and faster.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "skill-kouyu", "kind": "skill", "resourceType": "英语口语陪练 Skill", "title": "口语练习台（Kouyu）", "category": "写作表达", "skillTopics": ["求职效率"], "tags": "英语口语 / 场景对话 / 渐进提示 / 纠错 / 本地复习台", "description": "面向 Codex / ChatGPT 的英语口语陪练 Skill：在对话里选主题做场景角色扮演，先预习单词和句型，过程中给渐进式中文提示和轻量纠错，结束后把真实表现、纠正和下一步整理到本地可视化复习台。", "source": "https://github.com/maverickgao8848/kouyu", "repository": "https://github.com/maverickgao8848/kouyu", "prompt": "口语练习台（Kouyu）\n类型：英语口语陪练 Skill\n\n用途：面向 Codex / ChatGPT 的英语口语陪练 Skill：在对话里选主题做场景角色扮演，先预习单词和句型，过程中给渐进式中文提示和轻量纠错，结束后把真实表现、纠正和下一步整理到本地可视化复习台。\n\n说明：覆盖超市、健身房、咖啡店、餐厅、酒店、机场、理发、面试等场景，也可自定义主题；有 5 / 10 / 20 / 40 分钟四种节奏、入门 / 中级 / 进阶难度，以及沉浸式、引导式、学习式三种中文辅助；帮助按「中文意图提示 → 英文关键词 → 完整示范」逐级给出，只纠正影响理解或与本课目标相关的问题。说「I'm ready.」开始、「Let's wrap up.」结束并出报告。复习台用 Python 3.10+ 标准库运行（python scripts/workbench.py serve，默认 http://127.0.0.1:8765/），数据只存本机。仓库未附许可证文件。\n\n安装：git clone https://github.com/maverickgao8848/kouyu.git ~/.codex/skills/kouyu\n\nGitHub：https://github.com/maverickgao8848/kouyu\n\n收录状态：仅收藏，未安装或执行。", "preview": {"type": "image", "src": "assets/skill-kouyu/author-practice.jpg", "alt": "口语练习台作者提供的英语复习台截图", "width": 1417, "height": 760}, "previewSource": "https://raw.githubusercontent.com/maverickgao8848/kouyu/main/docs/screenshots/practice.png", "previewEvidence": "author-repository-example", "previewNote": "作者仓库中的本地复习台截图；非本次运行成果。", "addedAt": "2026-10-26", "verifiedAt": "2026-10-26", "en": {"title": "Kouyu (English speaking practice)", "description": "An English speaking practice Skill for Codex / ChatGPT: pick a topic and role-play a real scenario after previewing words and sentence patterns, with step-by-step Chinese hints and light correction, then a local review workbench that saves what you actually said, corrections and next steps.", "tags": "English speaking / Scenario dialogue / Graded hints / Correction / Local review workbench", "notes": "Scenarios such as supermarket, gym, café, restaurant, hotel, airport, haircut and job interview, or your own; 5 / 10 / 20 / 40-minute sessions, beginner to advanced, and immersive / guided / learning hint modes. Say \"I'm ready.\" to start and \"Let's wrap up.\" for the report. The workbench runs on the Python 3.10+ standard library and keeps data on your machine.", "license": "No license file in the repository", "previewNote": "The author's screenshot of the local review workbench — not output from this site."}}, {"id": "skill-appshot", "kind": "skill", "resourceType": "App 宣传视频 Skill", "title": "Appshot", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "App 宣传视频 / App Store 预览 / Remotion / Codex / 推荐：首选", "description": "扫描你的项目代码，自动生成 App Store / Google Play 预览视频、商店截图和网站演示视频：AI Skill 像创意总监一样读取应用名、品牌色、图标和功能，为每个项目写专属的 Remotion 场景。", "prompt": "Appshot\n类型：App 宣传视频 Skill\n\n用途：扫描你的项目代码，自动生成 App Store / Google Play 预览视频、商店截图和网站演示视频：AI Skill 像创意总监一样读取应用名、品牌色、图标和功能，为每个项目写专属的 Remotion 场景。\n\n说明：基于 Remotion + React 的原语库加 AI Skill，支持 Claude Code、Cursor、Windsurf、Codex 等支持 Agent Skills 规范的工具；移动端支持 React Native / Expo、Flutter、Swift、Kotlin，网页端支持 Next.js、SvelteKit、Nuxt、Astro、Remix、Vite，网页项目输出 1920×1080 带浏览器外框的演示视频。预览为作者用 Appshot 为 BookStreak 生成的商店预览视频。\n\n推荐程度（收录者）：首选\n\n许可：MIT\n\nGitHub：https://github.com/trunghaiy/appshot\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/trunghaiy/appshot", "repository": "https://github.com/trunghaiy/appshot", "addedAt": "2026-10-25", "verifiedAt": "2026-10-25", "en": {"title": "Appshot", "description": "Scans your codebase to generate App Store / Google Play preview videos, store screenshots and website demo videos: an AI skill acts as creative director, reading your app name, brand colours, icon and features to write custom Remotion scenes per project.", "tags": "App promo videos / App Store previews / Remotion / Codex / Pick: first choice", "notes": "A Remotion + React primitives library plus an AI skill for Claude Code, Cursor, Windsurf, Codex and other Agent Skills tools; mobile: React Native / Expo, Flutter, Swift, Kotlin; web: Next.js, SvelteKit, Nuxt, Astro, Remix, Vite (1920×1080 browser-framed demos). Curator rating: first choice.", "license": "MIT", "previewNote": "The App Store preview video the author generated with Appshot for BookStreak (GIF) — not output from this site."}, "preview": {"type": "image", "src": "assets/skill-appshot/author-app-preview.gif", "alt": "Appshot 为 BookStreak 生成的 App Store 预览视频（动图）", "width": 360, "height": 780}, "previewSource": "https://raw.githubusercontent.com/trunghaiy/appshot/main/examples/bookstreak/app-preview.gif", "previewEvidence": "author-repository-example", "previewNote": "作者仓库中用 Appshot 为 BookStreak 生成的 App Store 预览视频（动图）；非本次运行成果。"}, {"id": "skill-create-onboarding-video", "kind": "skill", "resourceType": "Claude Code Skill", "title": "create-onboarding-video", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "引导视频 / 手机 UI 组件动画 / Remotion / 功能短视频 / 推荐：很推荐", "description": "用 Remotion 做简短有力的 iOS App 引导视频：不放整屏，而是裁出按钮、开关、卡片、底部弹层等单个组件，用弹簧、滑动、缩放、遮罩揭示等 UI 式转场展示功能正在起作用。", "prompt": "create-onboarding-video\n类型：Claude Code Skill\n\n用途：用 Remotion 做简短有力的 iOS App 引导视频：不放整屏，而是裁出按钮、开关、卡片、底部弹层等单个组件，用弹簧、滑动、缩放、遮罩揭示等 UI 式转场展示功能正在起作用。\n\n说明：每个引导屏 3–8 秒、整片通常不超过约 30 秒，默认 1080×1920 竖屏；开工前先向你要每屏 2–4 张截图（静止、操作中、结果）和一句功能说明，再规划镜头并渲染 MP4。位于作者的 Claude Code skill 合集 skill-set 中。仓库未附许可证文件。\n\n推荐程度（收录者）：很推荐\n\n许可：仓库未附许可证文件\n\nGitHub：https://github.com/bidah/skill-set\n文档：https://github.com/bidah/skill-set/blob/main/skills/create-onboarding-video/SKILL.md\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/bidah/skill-set", "repository": "https://github.com/bidah/skill-set", "addedAt": "2026-10-25", "verifiedAt": "2026-10-25", "en": {"title": "create-onboarding-video", "description": "Makes short, punchy iOS app onboarding videos in Remotion: instead of whole screens it crops single components — a button, toggle, card or sheet — and animates them with UI-style springs, slides, scales and masked reveals to show the feature working.", "tags": "Onboarding videos / Mobile UI component motion / Remotion / Feature clips / Pick: highly recommended", "notes": "3–8 s per onboarding screen, usually under ~30 s overall, 1080×1920 portrait by default; it first asks for 2–4 stills per screen (resting, mid-interaction, result) plus a one-line feature intent, then plans shots and renders MP4. Part of the author's skill-set collection. Curator rating: highly recommended.", "license": "No license file in the repository", "previewNote": "The repository has no real output image, and no concept art was substituted; real preview pending."}, "documentation": "https://github.com/bidah/skill-set/blob/main/skills/create-onboarding-video/SKILL.md", "previewStatus": "pending", "previewEvidence": "none-in-official-repository", "previewSource": "https://github.com/bidah/skill-set", "previewNote": "仓库未提供真实效果图，未用概念图替代；真实预览待补。"}, {"id": "skill-remotion-3d", "kind": "skill", "resourceType": "Remotion 官方模板", "title": "Remotion 3D（template-three）", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "3D 手机模型 / React Three Fiber / Remotion / 屏幕视频替换 / 推荐：很推荐", "description": "Remotion 官方的 React Three Fiber 模板，自带一部 3D 手机模型：屏幕里的视频可直接替换，手机的尺寸、颜色、长宽比、圆角等都能调，适合做 App 宣传片里的立体手机镜头。", "prompt": "Remotion 3D（template-three）\n类型：Remotion 官方模板\n\n用途：Remotion 官方的 React Three Fiber 模板，自带一部 3D 手机模型：屏幕里的视频可直接替换，手机的尺寸、颜色、长宽比、圆角等都能调，适合做 App 宣传片里的立体手机镜头。\n\n说明：预装 @remotion/three 与 React Three Fiber；npm run dev 预览，npx remotion render 导出 MP4；也可以清空画布从零做自己的 3D 场景。模板内容为 MIT，Remotion 本身对部分公司需要商业许可。\n\n推荐程度（收录者）：很推荐\n\n许可：模板 MIT；Remotion 对部分公司需商业许可\n\nGitHub：https://github.com/remotion-dev/template-three\n官网：https://www.remotion.dev/templates/three\n\n收录状态：仅收藏，未安装或执行。", "source": "https://github.com/remotion-dev/template-three", "repository": "https://github.com/remotion-dev/template-three", "addedAt": "2026-10-25", "verifiedAt": "2026-10-25", "en": {"title": "Remotion 3D (template-three)", "description": "Remotion's official React Three Fiber template with a ready-made 3D phone: swap the video on its screen and tune size, colour, aspect ratio and corner radius — ideal for 3D phone shots in app promo videos.", "tags": "3D phone model / React Three Fiber / Remotion / Screen video swap / Pick: highly recommended", "notes": "Ships with @remotion/three and React Three Fiber; npm run dev to preview, npx remotion render to export MP4; or clear the canvas to build your own 3D scene. Template content is MIT; Remotion itself needs a company licence for some organisations. Curator rating: highly recommended.", "license": "Template MIT; Remotion company licence for some organisations", "previewNote": "The demo GIF from Remotion's official template repository (a 3D phone in the Remotion Player) — not output from this site."}, "officialUrl": "https://www.remotion.dev/templates/three", "preview": {"type": "image", "src": "assets/skill-remotion-3d/author-demo.gif", "alt": "Remotion template-three 官方演示：Remotion Player 中的 3D 手机模型（动图）", "width": 800, "height": 620}, "previewSource": "https://raw.githubusercontent.com/remotion-dev/template-three/main/demo.gif", "previewEvidence": "author-repository-example", "previewNote": "Remotion 官方模板仓库中的演示动图（3D 手机模型在 Remotion Player 中播放）；非本次运行成果。"}, {"id": "skill-remotion-skills", "kind": "skill", "resourceType": "Remotion 官方 Agent Skills", "title": "Remotion Skills", "category": "动画动效", "skillTopics": ["动画视频"], "tags": "Remotion / 视频制作规范 / Agent Skills / Codex / 推荐：必装", "description": "Remotion 官方维护的 Agent Skills：教 AI 按最佳实践写 Remotion 视频——新建项目与合成、动画与排版标记、字幕、地图动画、Studio 可编辑交互，以及调用渲染导出视频或静帧。", "prompt": "Remotion S ": "prompt", "title": "单选下拉", "category": "动画动效", "topics": ["下拉菜单"], "tags": "下拉菜单 / 状态 / 角色 / 排序 / Fade + Slide，180ms", "description": "菜单从上方 8px 滑入淡入、箭头翻转，选中打勾并自动收起；支持键盘与视口边缘自动避让。", "prompt": "实现单选 Dropdown。点击时菜单从上方 8px 滑入并淡入，箭头旋转 180°。Hover 背景平滑高亮，选中显示 Check 图标并自动收起。支持 Escape、键盘上下导航、外部点击关闭和视口边缘自动避让。", "preview": {"type": "animation", "src": "assets/dropdown-select/preview.html", "alt": "单选下拉：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/dropdown-select/card-preview.png", "alt": "单选下拉：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Dropdown Select", "description": "The menu slides in 8px from above with a fade and the arrow flips; picking shows a check and closes, with keyboard support and viewport-edge flipping.", "tags": "Dropdowns / Status / role / sort / Fade + Slide, 180ms", "prompt": "Implement a single-select Dropdown. On click the menu slides in from 8px above and fades in, and the arrow rotates 180°. Hovered rows highlight smoothly; the selected option shows a check icon and the menu closes automatically. Support Escape, up/down keyboard navigation, closing on outside click, and automatic flipping away from viewport edges.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "dropdown-option-groups", "kind": "prompt", "title": "分组下拉", "category": "动画动效", "topics": ["下拉菜单"], "tags": "下拉菜单 / 学科 / 部门 / 课程分类 / Fade + Slide，200ms", "description": "选项按类别分组、组标题吸顶且不可选，长列表内部滚动，键盘导航会跳过标题。", "prompt": "实现分组下拉菜单。选项按类别分组，组标题不可选，组间使用分隔线。展开时使用 200ms Fade + Slide 动画。Hover 时选项柔和高亮，选中后显示勾选状态并关闭。长列表内部滚动，组标题支持 Sticky，键盘导航跳过标题。", "preview": {"type": "animation", "src": "assets/dropdown-option-groups/preview.html", "alt": "分组下拉：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/dropdown-option-groups/card-preview.png", "alt": "分组下拉：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Option Groups", "description": "Options are grouped by category with sticky, non-selectable headers and dividers; long lists scroll inside and keyboard navigation skips the headers.", "tags": "Dropdowns / Subjects / departments / course categories / Fade + Slide, 200ms", "prompt": "Implement a grouped dropdown. Options are grouped by category, group titles are not selectable, and groups are separated by dividers. Opening uses a 200ms Fade + Slide animation. Options highlight softly on hover and show a checked state when picked, then the menu closes. Long lists scroll internally, group titles are sticky, and keyboard navigation skips the titles.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "dropdown-typeahead", "kind": "prompt", "title": "可搜索下拉", "category": "动画动效", "topics": ["下拉菜单"], "tags": "下拉菜单 / 学生 / 教师 / 课程搜索 / Fade + Slide，160ms", "description": "输入即时过滤并高亮关键词，远程搜索 250ms 防抖，带加载、无结果和出错状态，输入时不重播入场动画。", "prompt": "实现可搜索 Typeahead Combobox。输入时即时过滤选项，关键词高亮，搜索结果平滑更新。展开使用 160ms Fade + Slide，远程搜索使用 250ms Debounce。支持键盘上下选择、Enter 确认、Escape 关闭，以及 Loading、Empty、Error 状态。避免输入时整个菜单反复播放进入动画。", "preview": {"type": "animation", "src": "assets/dropdown-typeahead/preview.html", "alt": "可搜索下拉：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/dropdown-typeahead/card-preview.png", "alt": "可搜索下拉：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Typeahead Combobox", "description": "Filters as you type with highlighted matches, debounces remote search by 250ms, and has loading, empty and error states — without replaying the entrance on every keystroke.", "tags": "Dropdowns / Student / teacher and course search / Fade + Slide, 160ms", "prompt": "Implement a searchable Typeahead Combobox. Options filter instantly as you type, keywords are highlighted, and results update smoothly. Opening uses a 160ms Fade + Slide, and remote search uses a 250ms debounce. Support up/down keyboard selection, Enter to confirm, Escape to close, and Loading, Empty and Error states. Avoid replaying the whole menu's entrance animation while typing.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "split-action-button", "kind": "prompt", "title": "拆分按钮", "category": "动画动效", "topics": ["下拉菜单", "按钮交互"], "tags": "下拉菜单 / 保存 / 导出 / 创建 / Scale + Fade，170ms", "description": "左侧主按钮直接执行，右侧箭头以 0.97→1 缩放淡入展开相关操作；带加载与防重复提交。", "prompt": "实现 Split Action Button。左侧主按钮直接执行操作，右侧箭头展开其他相关操作。菜单以 Scale(0.97→1) + Fade 在 170ms 内出现。按钮 Hover 独立高亮，点击微缩放。支持 Loading、防止重复提交、Escape 和外部点击关闭。", "preview": {"type": "animation", "src": "assets/split-action-button/preview.html", "alt": "拆分按钮：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/split-action-button/card-preview.png", "alt": "拆分按钮：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Split Action Button", "description": "The main half runs the action directly while the arrow opens related actions with a 0.97→1 scale and fade; includes loading and duplicate-submit protection.", "tags": "Dropdowns / Save / export / create / Scale + Fade, 170ms", "prompt": "Implement a Split Action Button. The left main button performs the action directly, and the right arrow opens other related actions. The menu appears with Scale(0.97→1) + Fade within 170ms. Each half highlights independently on hover and scales down slightly on click. Support Loading, preventing duplicate submits, Escape, and closing on outside click.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "date-range-picker", "kind": "prompt", "title": "日期范围选择", "category": "动画动效", "topics": ["下拉菜单"], "tags": "下拉菜单 / 考勤 / 报表 / 课程周期 / Fade + Scale，220ms", "description": "双月日历 220ms 淡入缩放展开，两次点击选定区间、悬停预览、连续高亮，带快捷范围和应用 / 取消 / 清除。", "prompt": "实现 Date Range Picker。点击展开双月份日历，使用 220ms Fade + Scale 动画。首次点击选择开始日期，第二次选择结束日期。Hover 时预览范围，日期区间以连续背景高亮。支持 Today、Last 7 Days、Last 30 Days、Apply、Cancel、Clear，切换月份使用轻微横向滑动动画。", "preview": {"type": "animation", "src": "assets/date-range-picker/preview.html", "alt": "日期范围选择：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/date-range-picker/card-preview.png", "alt": "日期范围选择：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Date Range Picker", "description": "A two-month calendar opens with a 220ms fade and scale; two clicks set the range with hover preview and continuous highlighting, plus presets and Apply / Cancel / Clear.", "tags": "Dropdowns / Attendance / reports / course periods / Fade + Scale, 220ms", "prompt": "Implement a Date Range Picker. Clicking opens a two-month calendar with a 220ms Fade + Scale animation. The first click picks the start date and the second picks the end date. Hovering previews the range, and the date span is highlighted with a continuous background. Support Today, Last 7 Days, Last 30 Days, Apply, Cancel and Clear; switching months uses a slight horizontal slide.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "cascade-select", "kind": "prompt", "title": "级联选择", "category": "动画动效", "topics": ["下拉菜单"], "tags": "下拉菜单 / 年级 / 课程层级 / 地区 / Slide Right + Fade，200ms", "description": "选父级后子级面板从左 10px 滑入淡入，父级保持高亮，切换父级清掉无效子级，手机上逐级展示。", "prompt": "实现 Cascade Cascader。选择父级后，右侧子级面板以 translateX(-10px)→0 + Fade 展开，时长 200ms。父级保持高亮并显示箭头，最终选择后显示完整路径。切换父级时清除无效子级。支持多级数据、键盘导航、内部滚动和移动端逐级展示。", "preview": {"type": "animation", "src": "assets/cascade-select/preview.html", "alt": "级联选择：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/cascade-select/card-preview.png", "alt": "级联选择：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Cascader", "description": "Picking a parent slides the child panel in from 10px left with a fade; the parent stays highlighted, invalid children clear on switch, and mobile shows one level at a time.", "tags": "Dropdowns / Grade / course hierarchy / region / Slide Right + Fade, 200ms", "prompt": "Implement a Cascade Cascader. After a parent is picked, the child panel on the right opens with translateX(-10px)→0 + Fade over 200ms. The parent stays highlighted with an arrow, and the full path is shown after the final pick. Switching the parent clears invalid children. Support multi-level data, keyboard navigation, internal scrolling and level-by-level display on mobile.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "tag-picker", "kind": "prompt", "title": "多选标签", "category": "动画动效", "topics": ["下拉菜单"], "tags": "下拉菜单 / 多学科筛选 / 标签 / 权限 / Chip Fade + Scale，160ms", "description": "选中项以圆角标签显示，新增 0.9→1 淡入、删除缩小淡出，其余标签平滑补位；支持上限、去重和 +N 折叠。", "prompt": "实现 Multi-select Tag Picker。支持搜索、多选、删除标签。选中项以圆角 Chip 显示在输入框中，新增标签采用 160ms Fade + Scale(0.9→1)，删除采用 120ms 缩小淡出。其他标签平滑重新排列。支持 Backspace 删除、Clear All、重复项去重、最大数量限制和 +N 折叠。", "preview": {"type": "animation", "src": "assets/tag-picker/preview.html", "alt": "多选标签：可交互网页演示"}, "previewNote": "根据提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "用户在对话中直接提供的提示词表格（交互类型 / 适用场景 / 动效设计 / Codex 开发提示词），原始出处未注明。", "addedAt": "2026-10-25", "cardPreview": {"type": "image", "src": "assets/tag-picker/card-preview.png", "alt": "多选标签：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Tag Picker", "description": "Selections become rounded chips that pop in from 0.9 and shrink out on removal while the rest reflow smoothly; with a limit, de-duplication and +N collapsing.", "tags": "Dropdowns / Multi-subject filters / tags / permissions / Chip Fade + Scale, 160ms", "prompt": "Implement a Multi-select Tag Picker. Support search, multiple selection and removing tags. Selected items appear as rounded Chips in the input; new tags use a 160ms Fade + Scale(0.9→1), and removal uses a 120ms shrink and fade. Other tags reflow smoothly. Support Backspace to delete, Clear All, de-duplication, a maximum count and +N collapsing.", "previewNote": "Interactive web demo hand-built from the prompt — not the original author's video or model output."}}, {"id": "mega-menu", "kind": "prompt", "title": "大型下拉导航", "category": "动画动效", "topics": ["下拉菜单", "导航设计"], "tags": "下拉菜单 / 网站顶部导航 / 课程中心 / Fade + Slide + Stagger，250–350ms", "description": "桌面端悬停或点击展开多列面板，内容 30ms 交错出现、图标悬停右移 3px；手机上变成手风琴。", "prompt": "实现响应式 Mega Menu。桌面端 Hover 或点击展开多列导航，面板使用 250ms Fade + translateY(-12px) 动画，内部内容以 30ms Stagger 依次出现。导航项 Hover 时图标轻微移动 3px。支持 Hover Delay、Escape、外部点击关闭。移动端转换为 Accordion，展开动画 200ms。", "preview": {"type": "animation", "src": "assets/mega-menu/pr  秒的片子，讲……」，或输入 /lemo-opuscar:lemo-opuscar 从入口选择。也可 clone 仓库后在仓库里运行 claude。\n\n说明：作者注明风格按 Claude Opus 5.5 调校，其他模型适配度不高；开工前只问一次主题细节、是否有自己的配音或素材、要不要先看分镜。代码和文档为 MIT，样片视频及静帧为 CC BY 4.0（须署名 LemoLab），少数配音不在该授权内。预览为作者仓库中的 OPUSCAR 98 风格总览图。\n\n风格图鉴：https://lemomo-ai.github.io/lemo-opuscar/\nGitHub：https://github.com/lemomo-ai/lemo-opuscar\n\n收录状态：仅收藏，未安装或执行。", "preview": {"type": "image", "src": "assets/skill-lemo-opuscar/author-opuscar98-styles.jpg", "alt": "Lemo-Opuscar 作者仓库中的 OPUSCAR 98「98 种风格全部公开」总览图", "width": 1920, "height": 1080}, "previewSource": "https://raw.githubusercontent.com/lemomo-ai/lemo-opuscar/main/docs/opuscar98-styles.jpg", "previewEvidence": "author-repository-example", "previewNote": "作者仓库中的 OPUSCAR 98 风格总览图（98 种风格、风格提示词与镜头设计示例），按 CC BY 4.0 署名 LemoLab；非本次运行成果。", "addedAt": "2026-10-25", "verifiedAt": "2026-10-25", "en": {"title": "Lemo-Opuscar", "description": "A \"films made in code\" style toolbox for Claude Code: 59 ready-made styles (each a style prompt plus a demo film made purely in code), and you can remix your own; the agent reads director and technique guides, renders frames, writes the score, voices and mixes — no video model.", "tags": "Films in code / Style prompts / Claude Code / Frame-by-frame rendering / Score and voice-over", "notes": "Install with claude plugin marketplace add lemomo-ai/lemo-opuscar, then claude plugin install lemo-opuscar@lemolab. The author tuned the styles for Claude Opus 5.5 and warns other models fit poorly.", "license": "Code and docs MIT; sample films and stills CC BY 4.0 (credit LemoLab)", "previewNote": "The OPUSCAR 98 style overview from the author's repository, credited to LemoLab under CC BY 4.0 — not output from this site."}}, {"id": "drop-gather-intro", "kind": "prompt", "title": "开场落下收拢", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 开场动画 / 重力下落 / Spring 收拢 / 扇形", "description": "照片带重力一张张落下错开堆叠，停顿后四张用弹簧收拢成扇形，其余落出屏幕，标题和面板升起。", "prompt": "开场落下收拢（Drop and Gather Intro）：照片带重力依次落下并随机〔错〕开堆叠，停顿后四张用 ht": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Welcome Parallax Pager", "description": "Three welcome pages follow your finger with layered parallax — slow art, fast titles — while the dot stretches into a capsule and the last page springs up its button.", "tags": "App interaction / Onboarding / Parallax pager / Follow-finger drag / Capsule indicator", "prompt": "Build a 3-page welcome tour for an app, like leafing through a layered pop-up book: swipe left and right to switch, the page follows wherever the finger drags; on release, past one third or a fast flick turns to the next page, otherwise it springs back; on each page the illustration and text move at different speeds (illustration slow, title fast, for a sense of depth), and the illustration also scales and fades in slightly; small dots at the bottom act as the indicator, the current page's dot stretches into a capsule and stretches and shrinks with the finger while swiping [as a] transition; on the last page a \"Get started\" button springs up from below, and the first two pages show \"Skip\" in the top-right corner; use a 390×844 phone size.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "empty-state-guide", "kind": "prompt", "title": "空状态引导", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 空状态 / 虚线箭头 / 按钮提醒 / 飞入列表", "description": "空列表时插画浮动、虚线箭头指向「+」并定时轻弹；添加后待办从「+」飞进列表，空状态缩小淡出。", "prompt": "做一个待办 App 的空状态引导，像空桌子上有人指着说\"从这开始\"：列表没东西时，中间一张插画轻轻上下浮动 + 标题\"还没有待办\" + 一句说明，下面一条弯曲的虚线箭头指向右下角的\"+\"按钮，\"+\"按钮每隔几秒轻轻弹一下提醒点击；点\"+\"后底部弹出一行输入框，点\"添加\"后，这条待办从\"+\"按钮的位置飞出来落进列表（带一〔点〕回弹），空状态插画和箭头缩小淡出，列表顶部出现\"第一条已添加\"的小提示；按 390×844 手机尺寸。", "preview": {"type": "animation", "src": "assets/empty-state-guide/preview.html", "alt": "空状态引导：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AIGC「4个新手引导，让用户一眼知道点哪」系列（4 条）中「AI描述词 · 复制给 AI 就能用」字幕，用户提供截图。截图右侧的点赞、评论图标遮住了少量文字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/empty-state-guide/card-preview.png", "alt": "空状态引导：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Empty State Guide", "description": "An empty to-do list floats its illustration and points a dashed arrow at a gently nudging +; a new to-do flies out of + into the list as the empty state fades away.", "tags": "App interaction / Empty state / Dashed arrow / Button nudge / Fly into list", "prompt": "Build an empty-state guide for a to-do app, like someone at an empty desk pointing and saying \"start here\": when the list is empty, an illustration in the middle gently floats up and down + the title \"No to-dos yet\" + one line of explanation, with a curved dashed arrow below pointing to the \"+\" button in the bottom-right corner, and the \"+\" button gives a light bounce every few seconds as a reminder to tap; tapping \"+\" slides up an input row at the bottom, and after tapping \"Add\" the to-do flies out from the \"+\" button's position and lands in the list (with a [little] bounce), the empty-state illustration and arrow shrink and fade out, and a small \"First one added\" tip appears at the top of the list; use a 390×844 phone size.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "permission-primer", "kind": "prompt", "title": "权限请求前说明", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 权限引导 / 说明卡 / 通知预览 / 系统弹框", "description": "首次打卡后先弹出带晃动铃铛和通知预览的说明卡，同意后才出系统权限框，拒绝只收起卡片。", "prompt": "做一个打卡 App 开启通知前的说明卡，像先敲门打个招呼再进屋：用户第一次打卡成功后，从底部弹起一张圆角说明卡（带回弹），上面一个轻轻晃动的铃铛图标 + 标题\"每天 8 点提醒你打卡\" + 一句好处说明 + 一条锁屏通知的小预览（像真的通知一样滑进来）；两个按钮\"好的，提醒我\"和\"以后再说\"；点\"好的\"后说明卡收下去，再〔弹〕出系统的通知权限请求（演示时用一个仿 iOS 的系统弹框代替，淡入并轻微放大）；点\"以后再说\"只收起卡片，不弹系统框；按 390×844 手机尺寸。", "preview": {"type": "animation", "src": "assets/permission-primer/preview.html", "alt": "权限请求前说明：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AIGC「4个新手引导，让用户一眼知道点哪」系列（4 条）中「AI描述词 · 复制给 AI 就能用」字幕，用户提供截图。截图右侧的点赞、评论图标遮住了少量文字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/permission-primer/card-preview.png", "alt": "权限请求前说明：本次实际网页演示的浏览器截图，点开可交互", "width": 1380, "height": 900}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Permission Primer", "description": "After the first check-in, a card with a swinging bell and a notification preview asks first; only \"Yes\" brings up the system permission prompt.", "tags": "App interaction / Permission priming / Explainer card / Notification preview / System dialog", "prompt": "Build an explainer card shown before turning on notifications in a check-in app, like knocking and saying hello before walking in: after the user's first successful check-in, a rounded explainer card springs up from the bottom (with a bounce), showing a gently swinging bell icon + the title \"Remind you to check in at 8 every day\" + one line on the benefit + a small preview of a lock-screen notification (sliding in like a real notification); two buttons, \"OK, remind me\" and \"Maybe later\"; tapping \"OK\" tucks the card away and then [brings up] the system notification permission request (in the demo, use an iOS-style system dialog instead, fading in with a slight scale); tapping \"Maybe later\" only tucks the card away without the system dialog; use a 390×844 phone size.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "website-howtolivebetter", "kind": "website", "resourceType": "GitHub 项目", "title": "高性价比人生指南 · HowToLiveBetter", "category": "其他", "topics": ["实用软件"], "tags": "生活指南 / 循证建议 / 健康急救 / 理财法律 / 社保 / AI Skill", "description": "767 条循证生活建议，涵盖健康急救、省钱理财、 t-lang.org 并连接开发者工具；非本次运行成果。", "previewEvidence": "author-repository-example"}, {"id": "website-compositor", "kind": "website", "resourceType": "GitHub 项目", "title": "Compositor", "category": "其他", "topics": ["创作工具"], "tags": "图像编辑 / Mac / Photoshop 替代 / 图层 / AI Agent", "description": "免费开源的 Mac 图像编辑器，按 Photoshop 的合成与后期流程设计，支持图层、文件夹和完整的混合模式；项目文件就是一组 PNG 图层加清单，AI Agent 和脚本可以直接创建、编辑图层，打开的项目会实时更新。", "source": "https://robbietilton.com/compositor", "officialUrl": "https://robbietilton.com/compositor", "repository": "https://github.com/robbietilton/Compositor", "en": {"title": "Compositor", "description": "A free, open-source Mac image editor built around the Photoshop compositing workflow — layers, folders and the full set of blend modes. Projects are folders of PNG layers plus a manifest, so AI agents and scripts can build and edit layers directly while the open project updates live.", "tags": "Image editing / Mac / Photoshop alternative / Layers / AI agents", "notes": "Install from the official site, GitHub Releases or Homebrew, or download the Xcode project and modify it yourself.", "license": "MIT", "previewNote": "Screenshot of the official site taken on 2026-10-24; saved for reference only — no sign-in, install or purchase."}, "prompt": "Compositor\n类型：GitHub 项目\n\n用途：免费开源的 Mac 图像编辑器，按 Photoshop 的合成与后期流程设计，支持图层、文件夹和完整的混合模式；项目文件就是一组 PNG 图层加清单，AI Agent 和脚本可以直接创建、编辑图层，打开的项目会实时更新。\n\n说明：可从官网、GitHub Releases 或 Homebrew 安装；也可下载 Xcode 工程自行修改。\n\n许可：MIT\n\n官网：https://robbietilton.com/compositor\nGitHub：https://github.com/robbietilton/Compositor\n\n收录来源：「GitHub AI · 开源周榜」第 41 周（2026.10.05–10.11）第 6 名；GitHub 仓库已核实。\n\n收录状态：仅收藏，未安装、登录或执行。", "collection": "GitHub AI 开源周榜", "userProvidedRank": 6, "addedAt": "2026-10-24", "verifiedAt": "2026-10-24", "preview": {"type": "image", "src": "assets/website-compositor/official-site.png", "alt": "Compositor 官方网页实际截图", "width": 1280, "height": 720}, "previewSource": "https://robbietilton.com/compositor", "previewNote": "2026-10-24 实际打开官网后的网页截图；仅收藏，未登录、安装或购买。", "previewEvidence": "live-website-screenshot"}, {"id": "skill-orca", "kind": "skill", "resourceType": "Coding Agent 编排工具", "title": "Orca", "category": "其他", "skillTopics": ["开发工具"], "tags": "多 Agent / 并行开发 / Git Worktree / 终端分屏 / 移动端", "description": "并行管理多个 Coding Agent 的桌面工具：Codex、Claude Code、OpenCode 等各自在独立 git worktree 中运行并集中追踪，可把同一提示交给多个 Agent 比较后合并；另有终端分屏、设计模式、GitHub 与 Linear 集成和手机端。", "source": "https://github.com/stablyai/orca", "officialUrl": "https://orca.dev", "repository": "https://github.com/stablyai/orca", "documentation": "https://github.com/stablyai/orca#readme", "en": {"title": "Orca", "description": "A desktop app for running a fleet of coding agents — Codex, Claude Code, OpenCode and more — each in its own git worktree and tracked in one place, so you can fan out one prompt, compare and merge; with terminal splits, a design mode, GitHub \u0026 Linear and a mobile companion.", "tags": "Multi-agent / Parallel development / Git worktrees / Terminal splits / Mobile", "license": "MIT", "previewNote": "Real app screenshot from the author's repository: several agent sessions and the mobile app; not produced here."}, "prompt": "Orca\n类型：Coding Agent 编排工具\n\n用途：并行管理多个 Coding Agent 的桌面工具：Codex、Claude Code、OpenCode 等各自在独立 git worktree 中运行并集中追踪，可把同一提示交给多个 Agent 比较后合并；另有终端分屏、设计模式、GitHub 与 Linear 集成和手机端。\n\n许可：MIT\n\n官网：https://orca.dev\nGitHub：https://github.com/stablyai/orca\n\n收录来源：「GitHub AI · 开源周榜」第 41 周（2026.10.05–10.11）第 8 名；GitHub 仓库已核实。\n\n收录状态：仅收藏，未安装、登录或执行。", "collection": "GitHub AI 开源周榜", "userProvidedRank": 8, "addedAt": "2026-10-24", "verifiedAt": "2026-10-24", "preview": {"type": "image", "src": "assets/skill-orca/author-app.jpg", "alt": "Orca 作者真实示例", "width": 1800, "height": 1126}, "previewSource": "https://raw.githubusercontent.com/stablyai/orca/HEAD/docs/assets/readme-hero.jpg", "previewNote": "作者仓库中的真实应用截图：多个 Agent 会话与手机端界面；非本次运行成果。", "previewEvidence": "author-repository-example"}, {"id": "skill-deepseek-harness", 46 种语言，并提供本地 API 与 MCP 供 Agent 调用。", "source": "https://voicestudio.sh", "officialUrl": "https://voicestudio.sh", "repository": "https://github.com/debpalash/VoiceStudio", "en": {"title": "VoiceStudio (formerly OmniVoice-Studio)", "description": "An open-source, fully local AI voice studio for voice cloning, voice design, video dubbing, dictation, transcription and audiobooks in 646 languages, with a local API and MCP for agents.", "tags": "AI voice / Voice cloning / Video dubbing / Audiobooks / Local / MCP", "notes": "Listed as OmniVoice-Studio on the leaderboard; the repository has been renamed VoiceStudio (the old address redirects). The default engine is based on k2-fsa/OmniVoice.", "license": "AGPL-3.0", "previewNote": "Screenshot of the official site taken on 2026-10-24; saved for reference only — no sign-in, install or purchase."}, "prompt": "VoiceStudio（原 OmniVoice-Studio）\n类型：GitHub 项目\n\n用途：开源、完全本地运行的 AI 语音创作工具，支持声音克隆、声音设计、视频配音、听写、转写和有声书制作，覆盖 646 种语言，并提供本地 API 与 MCP 供 Agent 调用。\n\n说明：榜单名称为 OmniVoice-Studio，仓库已更名为 VoiceStudio（原地址自动跳转）。默认引擎基于 k2-fsa/OmniVoice。\n\n许可：AGPL-3.0\n\n官网：https://voicestudio.sh\nGitHub：https://github.com/debpalash/VoiceStudio\n\n收录来源：「GitHub AI · 开源周榜」第 41 周（2026.10.05–10.11）第 10 名；GitHub 仓库已核实。\n\n收录状态：仅收藏，未安装、登录或执行。", "collection": "GitHub AI 开源周榜", "userProvidedRank": 10, "addedAt": "2026-10-24", "verifiedAt": "2026-10-24", "preview": {"type": "image", "src": "assets/website-voicestudio/official-site.png", "alt": "VoiceStudio（原 OmniVoice-Studio） 官方网页实际截图", "width": 1280, "height": 720}, "previewSource": "https://voicestudio.sh", "previewNote": "2026-10-24 实际打开官网后的网页截图；仅收藏，未登录、安装或购买。", "previewEvidence": "live-website-screenshot"}, {"id": "cloisonne-enamel", "kind": "prompt", "title": "珐琅彩质感", "category": "动画动效", "topics": ["网页特效"], "tags": "网页特效 / 掐丝珐琅 / WebGL2 / 游戏道具 / 立体材质", "description": "金色掐丝线勾边、填色珐琅釉与宝石镶嵌的游戏勋章、头像框和武器，随鼠标倾斜、光源流动，立体感十足。", "prompt": "做一组珐琅彩（掐丝珐琅）质感的游戏道具：游戏勋章、头像框、武器各一个，用 WebGL2 渲染，每件都要有立体感。\n1. 结构：金色掐丝线勾出每块色区并凸起，色区里填红、蓝、绿等珐琅釉；宝石用金色包边镶嵌；武器刀身为银色金属，带中脊。\n2. 立体：用高度图生成法线，金线和包边最高，釉面在格子里略微鼓起，边缘模糊过渡成圆润倒角。\n3. 材质：金和银反射柔和的影棚灯光并带锐利高光；珐琅釉保留自身颜色，格子深处色调更深，表面有一层清漆般的细小反光；宝石更饱和、闪光更强。\n4. 交互：鼠标在物件上移动时弹簧倾斜（±14°），光源跟随指针，移出回正；不操作时光源缓慢环绕，让高光持续流动。\n5. 细节：逐帧检查 DPR，变化才重设画布；不支持 WebGL2 时显示平面贴图；减少动态效果时停止光源动画；卸载时释放 GPU 资源。", "preview": {"type": "animation", "src": "assets/cloisonne-enamel/preview.html", "alt": "珐琅彩质感：可交互网页演示"}, "previewNote": "按自拟提示词手工制作的 WebGL2 可交互演示，非外部作者作品或模型实测输出。", "sourceNote": "本工具箱按用户要求自拟的提示词与演示（2026-10-24），参考掐丝珐琅工艺，非来自外部作者。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/cloisonne-enamel/card-preview.png", "alt": "珐琅彩质感：本次实际网页演示的浏览器截图，点开可交互", "width": 740, "height": 310}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Cloisonné Enamel", "description": "A game medal, avatar frame and sword in raised gold wire, coloured enamel and set gems, tilting with the cursor under a moving light for real depth.", "tags": "Web effects / Cloisonné / WebGL2 / Game items / 3D material", "prompt": "Build a set of cloisonné-enamel game items — a game medal, an avatar frame and a weapon — rendered in WebGL2, each with a strong sense of depth.\n1. Structure: raised gold wire outlines every colour field, filled with red, blue, green and other enamel glazes; gems sit in gold bezels; the weapon blade is silver metal with a central ridge.\n2. Depth: derive normals from a height map — gold wires and bezels highest, glaze slightly domed inside each cell, edges blurred into rounded bevels.\n3. Materials: gold and silver reflect soft studio light with sharp highlights; enamel keeps its own colour, deeper in the cells, with a fine clear-coat glint; gems are more saturated and sparkle more.\n4. Interaction: when the pointer moves over an item it tilts on a spring (±14°) and the light follows the pointer, returning when it leaves; when idle the light slowly orbits so highlights keep moving.\n5. Details: check DPR every frame and resize the canvas only when it changes; without WebGL2 show the flat texture; stop the light animation under reduced motion; release GPU resources on unload.", "previewNote": "Interactive WebGL2 demo hand-built from a prompt written for this toolbox — not an external author's work or model output."}}, {"id": "checkin-confetti", "kind": "prompt", "title": "撒花庆祝", "category": "动画动效", "topics": ["按钮交互", "App 交互"], "tags": "App 交互 / 撒花 / Canvas 粒子 / 重力与空气阻力 / 打卡反馈", "description": "打卡后约 100 片彩纸从按钮喷出，冲高、翻面、受空气阻力飘落，再各自淡出。", "prompt": "做一个打卡成功的撒花庆祝：点\"打卡\"按钮后，从按钮位置向上喷出约 100 片彩纸，有长条、圆片、小方块 3 种形状、5 种主题色；每片先快速冲上去，再被重力拉回来（发射角度在正上方左右 35° 内，速度随机）；下落时左右飘、绕自身翻面（翻〔…〕到背面颜色变暗），越落越慢像有空气阻力；约 2.5 秒后各自逐渐淡出，不要同〔时消〕失；按钮先压一下再弹起，变成\"已打卡✓\"；用 canvas 画，保持 60 帧。", "preview": {"type": "animation", "src": "assets/checkin-confetti/preview.html", "alt": "撒花庆祝：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AI「删掉的消息，会碎成沙子飘走」粒子效果系列（3 条）中「提示词 · 复制给 AI 就能用」字幕，用户提供截图。截图右侧图标遮住了少量文字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/checkin-confetti/card-preview.png", "alt": "撒花庆祝：本次实际网页演示的浏览器截图，点开可交互", "width": 530, "height": 380}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Check-in Confetti", "description": "About 100 pieces of confetti burst from the check-in button, rise, flip and drift down against air drag, then fade out one by one.", "tags": "App interaction / Confetti / Canvas particles / Gravity \u0026 drag / Check-in feedback", "prompt": "Build a check-in success confetti celebration: after tapping the \"Check in\" button, about 100 pieces of confetti burst upward from the button, in 3 shapes (strips, discs and small squares) and 5 theme colours. Each piece shoots up fast, then gravity pulls it back (launch angle within 35° either side of straight up, random speed). As they fall they drift side to side and flip over (turning [to] the back, which looks darker), slowing as if there were air resistance. After about 2.5 seconds each one fades out on its own — they must not all [disappear at the same time]. The button presses in, springs back and becomes \"Checked in ✓\". Draw it with canvas and keep 60 fps.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "sand-disintegrate-delete", "kind": "prompt", "title": "碎沙删除", "category": "动画动效", "topics": ["App 交互"], "tags": "App 交互 / 消息删除 / 像素采样 / 粒子消散 / 补位动画", "description": "删除的气泡按像素碎成约 1500 粒沙，像被风从左到右吹散，下面的消息上移补位。", "prompt": "做一个聊天消息删除时碎成沙子消失：长按消息选\"删除\"后，把这条气泡按像素〔采样成〕约 1500 粒小沙，每粒用气泡原来那个位置的颜色；从左往右依次散开（像一阵风扫过，约 0.8 秒扫完），每粒往右上方飘走，带一点随机抖动，边飘边变小、变淡，〔约 1〕秒消失；散开的同时，原气泡从左往右被一点点擦掉，不要整条一起消失；删完后〔下〕面的消息平滑上移补位（约 300ms）。", "preview": {"type": "animation", "src": "assets/sand-disintegrate-delete/preview.html", "alt": "碎沙删除：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AI「删掉的消息，会碎成沙子飘走」粒子效果系列（3 条）中「提示词 · 复制给 AI 就能用」字幕，用户提供截图。截图右侧图标遮住了少量文字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/sand-disintegrate-delete/card-preview.png", "alt": "碎沙删除：本次实际网页演示的浏览器截图，点开可交互", "width": 560, "height": 572}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Sand Disintegrate Delete", "description": "A deleted chat bubble breaks into about 1,500 grains of sand in its own colours, blown away left to right while the messages below slide up.", "tags": "App interaction / Message delete / Pixel sampling / Particle dissolve / Reflow", "prompt": "Build a chat-message delete that crumbles into sand: after long-pressing a message and choosing \"Delete\", [sample] the bubble pixel by pixel into about 1,500 grains of sand, each using the colour of its original spot. They scatter from left to right (like a gust sweeping across, finishing in about 0.8 s); each grain drifts up and to the right with a little random jitter, shrinking and fading as it goes, and disappears in [about 1] second. While it scatters, the original bubble is erased bit by bit from left to right — not all at once. Afterwards the messages [below] slide up smoothly to fill the gap (about 300ms).", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "particle-logo", "kind": "prompt", "title": "粒子 Logo", "category": "动画动效", "topics": ["网页特效"], "tags": "官网首页 / 粒子 Logo / Canvas / 鼠标交互 / 弹簧回弹", "description": "约 2000 颗粒子从四周飞来聚成 Logo，轻轻呼吸；鼠标推开附近粒子，离开后弹簧拉回。", "prompt": "做一个官网首页的粒子 Logo：用 canvas 把 Logo 文字采样成约 2000 个小圆点；〔页〕面打开时粒子从屏幕四周飞进来聚成 Logo（约 1.5 秒，先快后慢，每粒出发时间错开一点）；聚好后每粒轻轻呼吸浮动；鼠标划过时，附近的粒子被推开（半径〔约〕 80px，越近推得越远），鼠标离开后像被弹簧拉回原位，带一点点回弹；粒子用〔品牌〕渐变色。", "preview": {"type": "animation", "src": "assets/particle-logo/preview.html", "alt": "粒子 Logo：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。", "sourceNote": "抖音 @林逸AI「删掉的消息，会碎成沙子飘走」粒子效果系列（3 条）中「提示词 · 复制给 AI 就能用」字幕，用户提供截图。截图右侧图标遮住了少量文字，以〔〕标出；括号内为据上下文的推测，非可见原文。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/particle-logo/card-preview.png", "alt": "粒子 Logo：本次实际网页演示的浏览器截图，点开可交互", "width": 530, "height": 380}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Particle Logo", "description": "About 2,000 particles fly in from the edges to form the logo and breathe gently; the cursor pushes nearby ones away and a spring pulls them back.", "tags": "Landing page / Particle logo / Canvas / Mouse interaction / Spring return", "prompt": "Build a particle logo for a landing page: use canvas to sample the logo text into about 2,000 small dots. When the [page] opens, the particles fly in from all edges of the screen and assemble into the logo (about 1.5 s, fast then slow, each particle starting slightly staggered). Once assembled, each one breathes gently. When the mouse passes over, nearby particles are pushed away (radius [about] 80px, the closer the further), and when the mouse leaves they are pulled back by a spring with a slight bounce. Colour the particles with the [brand] gradient.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "webgl-metal-card", "kind": "prompt", "title": "反射金属卡片", "category": "动画动效", "topics": ["卡片交互", "网页特效"], "tags": "卡片交互 / WebGL2 / 金属反射 / 弹簧倾斜 / 着色器", "description": "用 WebGL2 做磨砂金属卡片：动态环境经两次模糊后反射在表面，弹簧倾斜同步 CSS 与法线。", "prompt": "做可运行的 React + WebGL2 金属卡片。\n320×500px，圆角 24px。\n卡号：0001 2345 6789\n\n1. 环境：Canvas 画蓝色板、暖色球、白色灯条，逐帧上传纹理；横纵两次模糊，取样后去色。\n2. 反射：倒角＋微噪声法线 N；I 为相机→表面，R=reflect(I,N)，q=R.xy/max(R.z,0.2)，UV=vUv+0.12*q。用平面贴图，不用全景或渐变冒充。\n3. 交互：弹簧 120/16，倾斜目标 ±12°；同一角度同步 CSS 与法线，移出回正。\n4. 图层：画布＋HTML 标题「反射通行证」和卡号＋高光边框；不要人物、摄像头或外部图片。\n5. 交付：组件、完整 GLSL/CSS、运行命令；逐帧检查 DPR/尺寸，变化才重设；无 WebGL 降级，卸载清理资源。", "preview": {"type": "animation", "src": "assets/webgl-metal-card/preview.html", "alt": "反射金属卡片：可交互网页演示"}, "previewNote": "根据截图提示词手工制作的可交互网页演示，非原作者视频或模型实测输出。提示词要求 React，演示用原生 JS + WebGL2 实现同一渲染流程。", "sourceNote": "抖音 @费纸张「截图保存，交给你的 Agent」，原理参考 React Bits / Reflective Card；用户提供截图。", "addedAt": "2026-10-24", "cardPreview": {"type": "image", "src": "assets/webgl-metal-card/card-preview.png", "alt": "反射金属卡片：本次实际网页演示的浏览器截图，点开可交互", "width": 530, "height": 420}, "cardPreviewNote": "从本次实际运行的网页演示截图；卡片不嵌入可滚动 iframe，详情保留完整交互。", "en": {"title": "Reflective Metal Card", "description": "A brushed-metal card in WebGL2: a live environment, blurred in two passes, reflects off the surface while a spring tilt keeps CSS and normals in sync.", "tags": "Card interaction / WebGL2 / Metal reflection / Spring tilt / Shaders", "prompt": "Build a working React + WebGL2 metal card.\n320×500px, 24px corner radius.\nCard number: 0001 2345 6789\n\n1. Environment: draw a blue panel, a warm sphere and a white light bar on a Canvas and upload it as a texture every frame; blur horizontally then vertically, and desaturate after sampling.\n2. Reflection: bevel + micro-noise normal N; I is camera→surface, R=reflect(I,N), q=R.xy/max(R.z,0.2), UV=vUv+0.12*q. Use a flat texture — don't fake it with a panorama or gradient.\n3. Interaction: spring 120/16, tilt target ±12°; drive CSS and the normals with the same angle, and return to rest when the pointer leaves.\n4. Layers: canvas + HTML title \"Reflective Pass\", the card number and a highlight border; no people, camera or external images.\n5. Deliverables: component, full GLSL/CSS, run commands; check DPR/size every frame and reset only on change; fall back gracefully without WebGL; clean up resources on unmount.", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output. The prompt asks for React; the demo implements the same rendering pipeline in plain JS + WebGL2."}}, {"id": "skill-superpowers", "kind": "skill", "title": "superpowers", "resourceType": "开发流程 Skills", "category": "其他", "skillTopics": ["开发工具"], "tags": "开发流程 / 需求澄清 / 实施计划 / 测试驱动 / 代码审查", "description": "一套给编程 Agent 的完整开发方法：先追问真正的需求，分段确认设计，再写清实施计划，按红绿测试驱动推进并审查结果。适合想让 Agent 按工程纪律做事的项目。", "source": "https://github.com/obra/superpowers", "repository": "https://github.com/obra/superpowers", "officialUrl": "https://github.com/obra/superpowers", "documentation": "https://github.com/obra/superpowers#readme", "prompt": "superpowers\n\n类型：开发流程 Skills\n\n用途：一套给编程 Agent 的完整开发方法：先追问真正的需求，分段确认设计，再写清实施计划，按红绿测试驱动推进并审查结果。适合想让 Agent 按工程纪律做事的项目。\n\n说明：支持 Claude Code、Codex、Cursor、Gemini CLI 等多种编程 Agent。\n\n许可：MIT\n\nGitHub：https://github.com/obra/superpowers\n使用说明：https://github.com/obra/superpowers#readme\n\n收录来源：「全球高星 Skill TOP 20」榜单第 1 名（2026-10-05 数据快照）；GitHub 仓库已核实。\n\n收录状态：仅收藏资源，未安装或执行。", "collection": "全球高星 Skill TOP 20", "userProvidedRank": 1, "addedAt": "2026-10-24", "verifiedAt": "2026-10-24", "previewStatus": "pending", "previewEvidence": "none-in-official-repository", "previewNote": "官方仓库 README 未提供该 Skill 的真实效果图（只有标 s / Caterpillar underline / Follow-finger swipe / Snap bounce", "prompt": "Build segmented tabs (Following / Discover / Nearby) with content pages that swipe left and right: the underline follows the finger in real time, and while switching it first stretches then pulls its tail in like a caterpillar; label colour and weight [change] along with it. On release it snaps to the nearest page by distance and velocity with a slight bounce; tapping a tab slides the underline and content [together].", "previewNote": "Interactive web demo hand-built from the prompt in the screenshot — not the original author's video or model output."}}, {"id": "website-morphicons", "kind": "website", "title": "morphicons", "category": "动画动效", "topics": ["组件动画库"], "tags": "SVG 图标 / 图标变形 / 弹簧动画 / React / Vue / Svelte", "description": "让任意 SVG 图标弹性变形成另一个图标，支持 Lucide、Tabler、Heroicons 等描边或填充图标，零依赖，可用于 React、Vue、Svelte 等框架，适合做菜单、播放、收藏等状态切换。", "source": "https://www.morphicons.com/", "officialUrl": "https://www.morphicons.com/", "repository": "https://github.com/guillermolg00/morphicons", "documentation": "https://github.com/guillermolg00/morphicons#readme", "prompt": "morphicons\n\n用途：让任意 SVG 图标弹性变形成另一个图标，支持 Lucide、Tabler、Heroicons 等描边或填充图标，零依赖，可用于 React、Vue、Svelte 等框架，适合做菜单、播放、收藏等状态切换。\n\n说明：传入新的图标数据即可自动变形，也能手动控制进度；提供 snappy / smooth / bouncy 三种弹簧预设，可跟随系统的减少动态效果设置。官网首页即在线试玩，可切换图标集、弹簧、速度和描边粗细。\n\n许可：MIT。\n\n官网：https://www.morphicons.com/\nGitHub：https://github.com/guillermolg00/morphicons\n\n收录状态：仅收藏网站，未安装或执行。", "preview": {"type": "image", "src": "assets/website-morphicons/official-site.png", "alt": "morphicons 官方网页实际截图", "width": 1280, "height": 720}, "previewNote": "2026-10-23 实际打开官网后的网页截图；仅收藏，未登录、安装或购买。", "previewSource": "https://www.morphicons.com/", "previewEvidence": "live-website-screenshot", "addedAt": "2026-10-23", "verifiedAt": "2026-10-23", "en": {"title": "morphicons", "description": "Morphs any SVG icon into any other with spring physics — Lucide, Tabler, Heroicons and more, stroked
