.app{background:#e8eae5}.map{position:absolute;inset:0}.road{position:absolute;background:#fff;box-shadow:0 0 0 1px #dcdfd8}.v{top:0;bottom:0;width:26px}.h{left:0;right:0;height:26px}

.car{position:absolute;width:30px;height:15px;margin:-7.5px 0 0 -15px;border-radius:5px;background:#2a2a2e;box-shadow:0 3px 6px #0004}.car:after{content:'';position:absolute;right:4px;top:3px;width:6px;height:9px;border-radius:2px;background:#9ab0c8}

</div></div></section><aside class="side"><div class="metric"><small>WAITED</small><strong id="sec">0 s</strong></div><div class="metric"><small>STATE</small><strong id="state">呼叫中</strong></div><p class="note">定位点每 1.6 秒向外扩一圈波纹、越扩越淡，3 圈错开；周围小车慢慢靠近，底部秒数在走。4 秒后接单：波纹收回成一点，一辆车沿路线开来，底部卡片向上翻出司机信息。</p><button id="replay" type="button">模拟 4 秒后接单</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script src="../app-flow-20261024.js"></script><script>
let s=0,timer=0;
function tickWait(){s++;$('waited').textContent=s;$('sec').textContent=s+' s'}
function start(){
 // Nearby cars creep toward you while the call is out.
 [['c0','0 0','0 40px'],['c1','0 0','0 34px'],['c3','0 0','-46px 0']].forEach(([id,a,b])=>A($(id),[{translate:a},{translate:b}],{duration:4000,easing:'linear'}));
 timer=setInterval(tickWait,1000);setTimeout(match,4000)}
function match(){clearInterval(timer);$('state').textContent='已接单';
 // Ripples fold back into the dot.
 document.querySelectorAll('.ring').forEach(r=>{r.style.animation='none';A(r,[{transform:'scale(1.2)',opacity:.5},{transform:'scale(.1)',opacity:0}],{duration:450,easing:'cubic-bezier(.4,0,.2,1)'})});
 A($('dot'),[{scale:1},{scale:1.45,offset:.4},{scale:1}],{duration:520,delay:300,easing:spring,fill:'none'});
 // The matched car drives the route: along the street, then turns up to you.
 const r=$('route');r.style.opacity=1;const len=99+93;r.setAttribute('stroke-dasharray',len);A(r,[{strokeDashoffset:len},{strokeDashoffset:0}],{duration:600,easing:easeOut});
 A($('c2'),[{left:'96px',top:'491px',transform:'rotate(0deg)'},{left:'195px',top:'491px',transform:'rotate(0deg)',offset:.5},{left:'195px',top:'491px',transform:'rotate(-90deg)',offset:.58},{left:'195px',top:'404px',transform:'rotate(-90deg)'}],{duration:2200,delay:400,easing:'cubic-bezier(.45,.05,.35,1)'});
 // The bottom card flips up to the driver's details.
 A($('front'),[{transform:'rotateX(0)',opacity:1},{opacity:1,offset:.95},{transform:'rotateX(-90deg)',opacity:0}],{duration:220,delay:500,easing:'ease-in'});
 A($('back'),[{transform:'rotateX(90deg)',opacity:0},{opacity:1,offset:.05},{transform:'rotateX(0)',opacity:1}],{duration:520,delay:720,easing:spring})}
$('replay').onclick=()=>location.reload();
if(reduced){s=3;$('waited').textContent=3;$('sec').textContent='3 s';start=()=>{};match()}else start();
</script><script src="../demo-i18n.js"></script></body></html>
