<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>底部导航切换 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>
#stage{height:590px;grid-template-columns:600px 220px}.screen{height:430px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3b3b3b,#151515)}
.phone{position:relative;width:228px;height:410px;border:6px solid #2b2b2b;border-radius:34px;background:#0f0f11;color:#f2f2f2;overflow:hidden;box-shadow:0 22px 50px #0009}
.page{position:absolute;inset:0 0 70px;padding:34px 18px 0}.page h3{margin:0 0 4px;font-size:18px}.page p{margin:0 0 14px;font-size:11px;color:#9a9a9a}.row{height:34px;margin-bottom:9px;border-radius:12px;background:#1d1d21;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#cfcfcf}.row i{width:16px;height:16px;border-radius:5px;background:#2e2e33;margin-right:10px}
.bar{position:absolute;left:10px;right:10px;bottom:16px;height:52px;border-radius:20px;background:#1b1b1f;display:grid;grid-template-columns:repeat(4,1fr)}
.capsule{position:absolute;top:6px;height:40px;border-radius:16px;background:#ffd43b;will-change:left,width,height,top}
.tab{position:relative;z-index:1;min-height:0;height:52px;padding:0;border:0;border-radius:16px;background:transparent;color:#8a8a8a;display:grid;place-content:center;justify-items:center;gap:2px;font-size:9px;transition:color .3s}
.tab:hover{background:transparent}.tab[aria-pressed=true]{color:#191919}.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>底部导航切换</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone"><div class="page" id="page"></div><nav class="bar" id="bar" aria-label="底部导航"><span class="capsule" id="capsule" aria-hidden="true"></span></nav></div></section><aside class="side"><div class="metric"><small>CAPSULE WIDTH</small><strong id="width">0 px</strong></div><div class="metric"><small>DURATION</small><strong>≈ 400 ms</strong></div><p class="note">点底部任意 Tab：胶囊前沿先到、后沿慢半拍跟上，途中拉长变扁，弹簧停稳；图标先缩后弹，内容沿点击方向推入。</p><button id="replay">自动演示一遍</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/590)})`}new ResizeObserver(fit).observe(document.body);fit();
const icons={首页:'<path d="M3 11 12 4l9 7v9H3z"/>',发现:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 5-4 1 2-5z"/>',收藏:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',我的:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'};
const pages={首页:['今日推荐','为你挑选的 3 条行程'],发现:['发现','附近正在流行的海岛'],收藏:['我的收藏','收藏的 12 个地方'],我的:['Mia 在海边','去过 23 个海岛']};
const names=Object.keys(icons);let current=0;
$('bar').insertAdjacentHTML('beforeend',names.map((n,i)=>`<button class="tab" type="button" aria-pressed="${i===0}" data-i="${i}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>${n}</button>`).join(''));
const tabs=[...$('bar').querySelectorAll('.tab')],cap=$('capsule'),PAD=6,H=40;
function slot(i){const t=tabs[i];return {l:t.offsetLeft+PAD,r:t.offsetLeft+t.offsetWidth-PAD}}
function paint(l,r){const w=r-l,base=slot(current).r-slot(current).l,stretch=Math.max(0,w/base-1),h=H*(1-Math.min(.22,stretch*.18));cap.style.left=l+'px';cap.style.width=w+'px';cap.style.height=h+'px';cap.style.top=(6+(H-h)/2)+'px';$('width').textContent=Math.round(w)+' px'}
function renderPage(i,dir){const [t,s]=pages[names[i]];$('page').innerHTML=`<h3>${t}</h3><p>${s}</p>`+['我的行程','消息通知','我的收藏','设置'].map(x=>`<div class="row"><i></i>${x}</div>`).join('');if(!reduced.matches&&dir)$('page').animate([{transform:`translateX(${dir*26}px)`,opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.9,.22,1)'})}
// Each edge is its own lightly underdamped spring; the trailing edge starts half a beat (70 ms) later.
let raf=0;function move(to){if(to===current)return;const from=slot(current),goal=slot(to),dir=to>current?1:-1;tabs[current].setAttribute('aria-pressed','false');tabs[to].setAttribute('aria-pressed','true');current=to;renderPage(to,dir);const icon=tabs[to].querySelector('svg');if(!reduced.matches)icon.animate([{scale:1},{scale:.78,offset:.35},{scale:1.12,offset:.7},{scale:1}],{duration:400,easing:'ease-out'});cancelAnimationFrame(raf);if(reduced.matches){paint(goal.l,goal.r);return}const lead=dir>0?'r':'l',tail=dir>0?'l':'r';const s={l:{x:from.l,v:0},r:{x:from.r,v:0}};let start,last;const step=now=>{start??=now;const dt=Math.min(.032,((now-(last??now))/1000)||.016);last=now;for(const k of ['l','r']){if(k===tail&&now-start<70)continue;const e=s[k];e.v+=((goal[k]-e.x)*520-e.v*30)*dt;e.x+=e.v*dt}paint(Math.min(s.l.x,s.r.x),Math.max(s.l.x,s.r.x));const done=['l','r'].every(k=>Math.abs(goal[k]-s[k].x)<.3&&Math.abs(s[k].v)<4);if(done){paint(goal.l,goal.r)}else raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
$('bar').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)move(Number(t.dataset.i))});
$('replay').onclick=()=>{[3,1,2,0].forEach((i,k)=>setTimeout(()=>move(i),k*700))};
renderPage(0,0);requestAnimationFrame(()=>{const s=slot(0);paint(s.l,s.r)});
</script><script src="../demo-i18n.js"></script></body></html>
