<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加号展开面板 · 动效演示</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191d23;color:#f7f6f3;font:15px "Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:760px;height:420px;flex-shrink:0;transform-origin:center;display:grid;grid-template-columns:500px 200px;gap:28px;padding:26px 16px}button{font:inherit;cursor:pointer;color:inherit;border:0}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.screen{position:relative;height:350px;background:#242429;border:1px solid #3d3d43;border-radius:24px;padding:23px;overflow:hidden}.kicker{font:11px monospace;letter-spacing:2px;color:#b8b7bd}h1{font-size:24px;line-height:1.2;margin:7px 0 20px;font-weight:600}.side{padding-top:13px}.side header{font:11px monospace;color:#bbbfc7;letter-spacing:2px;border-bottom:1px solid #41454b;padding-bottom:15px;margin-bottom:24px}.metric{color:var(--accent);margin-bottom:19px}.metric small{display:block;letter-spacing:2px;font:11px monospace}.metric strong{display:block;font-size:29px;line-height:1.4;font-weight:600}.note{font-size:12px;color:#b5b7bd;line-height:1.8}.replay{background:transparent;border:1px solid #70737d;padding:9px 16px;border-radius:20px;font-size:12px;margin-top:10px}.hint{position:absolute;bottom:8px;left:25px;font-size:11px;color:#c0c1c7;letter-spacing:1px}.pill{height:40px;background:#34343b;border-radius:11px;display:flex;align-items:center;padding:0 15px;margin:9px 0;color:#dedee4;font-size:13px}.pill:after{content:'';height:8px;width:29px;background:#55555f;border-radius:5px;margin-left:auto}.row{display:flex;align-items:center;gap:10px;background:#3d3d44;padding:10px 13px;border-radius:10px;margin-top:8px;font-size:14px}.dot{height:6px;width:6px;background:var(--accent);border-radius:50%}.bg{position:absolute;left:23px;right:23px;top:98px}.dim{opacity:.38}svg{overflow:visible}.speed{color:var(--accent)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
#sheet{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:32px;background:var(--accent);transition:width 480ms cubic-bezier(.2,.9,.22,1),height 480ms cubic-bezier(.2,.9,.22,1),border-radius 480ms cubic-bezier(.2,.9,.22,1),background 480ms;overflow:hidden}#sheet.open{width:470px;height:300px;border-radius:28px;background:#303036;box-shadow:0 -10px 40px #0003}#toggle{position:absolute;right:0;bottom:0;width:64px;height:64px;background:transparent;font-size:36px;color:#211e20;z-index:2;transition:transform 480ms,color 480ms}#sheet.open #toggle{transform:rotate(45deg);color:#eee}#options{padding:22px;opacity:0;visibility:hidden}#sheet.open #options{opacity:1;visibility:visible}#options>*{opacity:0;transform:translateY(8px);transition:opacity 240ms,transform 240ms;transition-delay:0ms}#sheet.open #options>*{opacity:1;transform:none;transition-delay:480ms}#sheet.open #options>*:nth-child(2){transition-delay:547ms}#sheet.open #options>*:nth-child(3){transition-delay:614ms}#sheet.open #options>*:nth-child(4){transition-delay:681ms}
</style></head><body style="--accent:#ff714f"><main id="stage"><section class="screen"><div class="kicker">CARRY</div><h1>Day bag</h1><div class="bg"><div class="pill">Water filter</div><div class="pill">Sleep pad</div></div><div id="sheet"><button id="toggle" aria-label="展开选项" aria-expanded="false">＋</button><div id="options"><b>Add to bag</b><div class="row"><i class="dot"></i>Rain shell</div><div class="row"><i class="dot"></i>Head lamp</div><div class="row"><i class="dot"></i>Dry sack</div></div></div></section><aside class="side"><header>● LIVE PREVIEW</header><div class="metric"><small>SIZE</small><strong id="m1">64 × 64</strong></div><div class="metric"><small>RADIUS</small><strong id="m2">32 px</strong></div><p class="note">点击加号展开，再点击关闭。<br>选项在面板落定后依次出现。</p><button class="replay" id="replay">展开 / 收起</button></aside><div class="hint">手工制作的交互演示 · 非模型实测输出</div></main><script>
const stage=document.getElementById('stage');const reduced=matchMedia('(prefers-reduced-motion:reduce)');function fit(){stage.style.transform=`scale(${Math.min(innerWidth/760,innerHeight/420)})`}new ResizeObserver(fit).observe(document.body);fit();const $=id=>document.getElementById(id);const ease='cubic-bezier(.2,.9,.22,1)';
let open=false;function toggle(){open=!open;$('sheet').classList.toggle('open',open);$('toggle').setAttribute('aria-expanded',open);$('toggle').setAttribute('aria-label',open?'关闭选项':'展开选项');$('options').inert=!open;$('m1').textContent=open?'470 × 300':'64 × 64';$('m2').textContent=open?'28 px':'32 px'}$('options').inert=true;$('toggle').onclick=toggle;$('replay').onclick=toggle;if(!reduced.matches)setTimeout(toggle,700);
</script></body></html>
