<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>底部弹窗 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>
#stage{height:590px;grid-template-columns:600px 220px}.screen{height:430px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3b3b3b,#151515)}
.phone{position:relative;width:228px;height:410px;border:6px solid #2b2b2b;border-radius:34px;background:#000;overflow:hidden;box-shadow:0 22px 50px #0009}
.back{position:absolute;inset:0;background:#141416;color:#f2f2f2;transform-origin:50% 0;will-change:transform,border-radius}
.hero{height:170px;background:linear-gradient(180deg,#f2a65a 0%,#c8644a 42%,#2f4858 43%,#1b2b38 100%);position:relative}.hero:after{content:'';position:absolute;left:30px;bottom:52px;width:46px;height:46px;border-radius:50%;background:#ffe2a8;box-shadow:0 0 30px #ffd43b}
.info{padding:14px 16px}.info h3{margin:0 0 4px;font-size:16px}.info p{margin:0 0 12px;font-size:10px;color:#9a9a9a}#open{width:100%;min-height:38px;padding:0;border:0;border-radius:12px;background:#ffd43b;color:#191919;font-size:12px;font-weight:700}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;bottom:0;height:270px;border-radius:22px 22px 0 0;background:#1d1d21;color:#f2f2f2;padding:0 14px 14px;transform:translateY(100%);will-change:transform}
.grab{display:block;width:100%;height:28px;min-height:0;padding:0;border:0;background:transparent;touch-action:none;cursor:grab}.grab:hover{background:transparent}.grab i{display:block;width:40px;height:5px;margin:auto;border-radius:4px;background:#555}
.sheet h4{margin:0 0 2px;font-size:14px}.sheet small{font-size:9px;color:#9a9a9a}.days{display:flex;gap:6px;margin:10px 0}.days span{flex:1;padding:5px 0;border-radius:9px;background:#29292e;text-align:center;font-size:9px}.days .on{background:#ffd43b;color:#191919}
.room{display:flex;gap:9px;align-items:center;margin-bottom:7px;padding:7px;border-radius:12px;background:#26262b;font-size:10px}.room i{width:38px;height:30px;border-radius:7px;background:linear-gradient(#7cc4d8,#2f7d8e)}.room b{display:block;color:#ffd43b;font-size:10px}.room.sel{outline:1px solid #ffd43b}
#book{width:100%;min-height:34px;margin-top:4px;padding:0;border:0;border-radius:12px;background:#ffd43b;color:#191919;font-size:11px;font-weight:700}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>底部弹窗</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone"><div class="back" id="back"><div class="hero"></div><div class="info"><h3>海景度假酒店</h3><p>10月18日 – 10月20日 · 2 晚 · 2 位成人</p><button id="open" type="button" aria-haspopup="dialog">选择房型</button></div></div><div class="dim" id="dim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-label="选择房型" hidden><button class="grab" id="grab" type="button" aria-label="拖动弹窗；按 Esc 或向下键关闭"><i></i></button><h4>选择房型</h4><small>10月18日 – 10月20日 · 2 晚</small><div class="days"><span>17</span><span class="on">18</span><span>19</span><span class="on">20</span><span>21</span></div><div class="room sel"><i></i><div>海景大床房<b>¥1,280 / 晚</b></div></div><div class="room"><i></i><div>泳池别墅<b>¥3,680 / 晚</b></div></div><button id="book" type="button">确认预订 · ¥2,560</button></div></div></section><aside class="side"><div class="metric"><small>PAGE SCALE</small><strong id="scale">1.00</strong></div><div class="metric"><small>SHEET</small><strong id="state">关闭</strong></div><p class="note">点「选择房型」：弹窗弹簧升起，背后页面缩到 0.92、变圆角、压暗。拖动把手：上拖有阻力；下拖超过 1/3 或快速一甩关闭，否则弹回。</p><button id="replay">重新打开</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/590)})`}new ResizeObserver(fit).observe(document.body);fit();
const sheet=$('sheet'),H=270;let y=H,target=H,v=0,raf=0,last=0;
// y is how far the sheet sits below its open position; the page behind follows the same progress.
function draw(){const p=1-Math.min(1,Math.max(0,y/H)),s=1-.08*p;sheet.style.transform=`translateY(${y}px)`;$('back').style.transform=`translateY(${p*14}px) scale(${s})`;$('back').style.borderRadius=p*20+'px';$('dim').style.opacity=p*.45;$('scale').textContent=s.toFixed(2)}
function frame(t){const dt=Math.min(.032,((t-(last||t))/1000)||.016);last=t;v+=((target-y)*360-v*30)*dt;y+=v*dt;draw();if(Math.abs(target-y)+Math.abs(v)>.2)raf=requestAnimationFrame(frame);else{y=target;draw();raf=0;last=0;if(target===H)sheet.hidden=true}}
function go(to,speed=0){target=to;v=speed;sheet.hidden=false;$('state').textContent=to===H?'关闭':'打开';if(reduced.matches){y=to;draw();if(to===H)sheet.hidden=true;return}if(!raf){last=0;raf=requestAnimationFrame(frame)}}
$('open').onclick=()=>{go(0);$('grab').focus({preventScroll:true})};$('replay').onclick=()=>{if(target===0){go(H);setTimeout(()=>go(0),450)}else go(0)};$('book').onclick=()=>go(H);
let drag=false,startY=0,origin=0,prevY=0,prevT=0,speed=0;
$('grab').onpointerdown=e=>{drag=true;cancelAnimationFrame(raf);raf=0;startY=prevY=e.clientY;prevT=e.timeStamp;origin=y;speed=0;$('grab').setPointerCapture(e.pointerId)};
$('grab').onpointermove=e=>{if(!drag)return;const k=$('stage').getBoundingClientRect().width/900,raw=origin+(e.clientY-startY)/k;y=raw<0?raw*.3:raw;const dt=e.timeStamp-prevT;if(dt>0)speed=(e.clientY-prevY)/k/dt*1000;prevY=e.clientY;prevT=e.timeStamp;draw()};
function release(e){if(!drag)return;drag=false;if(e.timeStamp-prevT>90)speed=0;(y>H/3||speed>700)?go(H,speed):go(0,speed)}
$('grab').onpointerup=release;$('grab').onpointercancel=()=>{drag=false;go(0)};
document.addEventListener('keydown',e=>{if(target===0&&(e.key==='Escape'||(e.key==='ArrowDown'&&document.activeElement===$('grab')))){e.preventDefault();go(H);$('open').focus({preventScroll:true})}});
draw();setTimeout(()=>go(0),500);
</script></body></html>
