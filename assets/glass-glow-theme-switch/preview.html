<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111214;color:#d9d9df;-webkit-tap-highlight-color:transparent}.day-scene{position:fixed;inset:0;background:#d8d7d4;opacity:0;transition:opacity .6s ease;pointer-events:none}body[data-day=true] .day-scene{opacity:1}main{position:relative;display:grid;place-items:center;width:100%;height:100%;min-height:240px}.stage{position:relative;--w:min(440px,76vw,126vh);--h:calc(var(--w)/2.1);width:var(--w);height:var(--h)}button{font:inherit;cursor:pointer}.switch{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;border-radius:calc(var(--h)*.34);touch-action:none;user-select:none;isolation:isolate;outline:none}.switch:focus-visible{outline:2px solid #959fff;outline-offset:14px}.rail{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(150deg,#010203,#050608 65%,#090a0e);box-shadow:inset 0 2px 6px #000,0 2px 2px #ffffff05,0 8px 17px #0008}.rail-day{position:absolute;inset:0;opacity:0;border-radius:inherit;background:linear-gradient(145deg,#d9d8d5,#e5e4df 52%,#cbc9c2);box-shadow:inset 0 2px 4px #fff8,inset 0 -1px 2px #8c877d55,0 7px 16px #62594533}.thumb{position:absolute;left:10px;top:10px;width:calc(var(--h) - 20px);height:calc(var(--h) - 20px);border-radius:calc(var(--h)*.29);will-change:transform;transform:translate3d(0,0,0)}.surface{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 13% 87%,#7289ff30,transparent 68%),linear-gradient(135deg,#d9e2ff31,#c4d3ff0d 48%,#b8baf017);box-shadow:inset 1px 1px 2px #f5f7ff85,inset -1px -1px 2px #adb4e52c,0 4px 14px #0008;overflow:hidden}.surface::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,#fff2,transparent 27%,transparent 67%,#aeb9fa15);box-shadow:inset 0 0 0 1px #ffffff18}.surface-day{opacity:0;background:radial-gradient(ellipse at 100% 67%,#ffc5536b,transparent 78%),linear-gradient(140deg,#ffffffb0,#ffffff32 57%,#ecdeba55);box-shadow:inset 1px 1px 3px #fffffff2,inset -1px -1px 2px #fff7,0 5px 13px #6b583940}.light{position:absolute;inset:0;border-radius:inherit;pointer-events:none;will-change:opacity}.light-night{color:#8b9bff}.light-day{color:#ffc044;opacity:0}.aura{position:absolute;inset:-22%;border-radius:40%;background:radial-gradient(ellipse at 25% 71%,currentColor,transparent 60%);filter:blur(23px);opacity:.4}.light-day .aura{background:radial-gradient(ellipse at 78% 62%,currentColor,transparent 60%);opacity:.48}.rim{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round}.rim use{stroke-dasharray:36 64;stroke-dashoffset:var(--edge,12)}.rim .outer{stroke:currentColor;stroke-width:9;filter:blur(4px);opacity:.7}.rim .bloom{stroke:currentColor;stroke-width:3.2;filter:blur(1px)}.rim .core{stroke:#efffff;stroke-width:.9}.light-day .rim .core{stroke:#fff9d6}.glyph{position:absolute;inset:22%;width:56%;height:56%;overflow:visible;will-change:transform,opacity;fill:#fffdf0;filter:drop-shadow(0 0 4px #fff4)}.sun{opacity:0;fill:#393532;filter:none}.hint{position:fixed;bottom:24px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.12em;color:#8b8c96;pointer-events:none}body[data-day=true] .hint{color:#68645e}.label{position:fixed;left:22px;top:18px;font-size:11px;letter-spacing:.14em;color:#898b95}body[data-day=true] .label{color:#6e6860}.download{position:fixed;right:20px;top:16px;padding:5px 9px;font-size:11px;text-decoration:none;border:1px solid #ffffff24;color:#a6a7b0;border-radius:6px}body[data-day=true] .download{border-color:#0002;color:#625c52}.download:focus-visible{outline:2px solid #8a97ff;outline-offset:3px}@media(max-height:330px){.hint{bottom:14px}.label{top:12px}.download{top:9px}.stage{--w:min(390px,76vw,126vh)}}@media(prefers-reduced-motion:reduce){.day-scene{transition:none}.thumb,.light,.glyph{will-change:auto}}@media(forced-colors:active){.switch{outline:2px solid ButtonText}.surface{background:ButtonFace;border:2px solid ButtonText}.light{display:none}.glyph{fill:ButtonText}}
</style></head><body data-day="false"><div class="day-scene"></div><span class="label" data-zh="玻璃 · 像素 · 位置光晕" data-en="GLASS · PIXELS · POSITIONAL LIGHT">玻璃 · 像素 · 位置光晕</span><a class="download" href="preview.html" download="glass-glow-switch.html" data-zh="下载 HTML" data-en="Download HTML">下载 HTML</a><main><div class="stage"><button class="switch" type="button" role="switch" aria-checked="true" aria-label="切换到日间模式"><span class="rail"></span><span class="rail-day"></span><span class="thumb"><span class="surface"></span><span class="surface surface-day"></span><span class="light light-night"><i class="aura"></i><svg class="rim" viewBox="0 0 96 96" aria-hidden="true"><defs><path id="left-rim" pathLength="100" d="M25 2H71C84 2 94 12 94 25V71C94 84 84 94 71 94H25C12 94 2 84 2 71V25C2 12 12 2 25 2Z"/></defs><use class="outer" href="#left-rim"/><use class="bloom" href="#left-rim"/><use class="core" href="#left-rim"/></svg></span><span class="light light-day"><i class="aura"></i><svg class="rim" viewBox="0 0 96 96" aria-hidden="true"><defs><path id="right-rim" pathLength="100" d="M25 2H71C84 2 94 12 94 25V71C94 84 84 94 71 94H25C12 94 2 84 2 71V25C2 12 12 2 25 2Z"/></defs><use class="outer" href="#right-rim"/><use class="bloom" href="#right-rim"/><use class="core" href="#right-rim"/></svg></span><svg class="glyph moon" viewBox="0 0 32 32" aria-hidden="true"><g id="moon-pixels"></g></svg><svg class="glyph sun" viewBox="0 0 32 32" aria-hidden="true"><g id="sun-pixels"></g></svg></span></button></div></main><div class="hint" data-zh="点击或拖动切换 · 高光跟随滑块与指针，静止时不旋转" data-en="CLICK OR DRAG · LIGHT FOLLOWS THE THUMB & POINTER, THEN RESTS">点击或拖动切换 · 高光跟随滑块与指针，静止时不旋转</div>
<script>
const english=new URLSearchParams(location.search).get('lang')==='en';if(english){document.documentElement.lang='en';document.title='Glass Glow Theme Switch';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset.en)}
const control=document.querySelector('.switch'),thumb=document.querySelector('.thumb'),railDay=document.querySelector('.rail-day'),dayGlass=document.querySelector('.surface-day'),nightLight=document.querySelector('.light-night'),dayLight=document.querySelector('.light-day'),moon=document.querySelector('.moon'),sun=document.querySelector('.sun'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
for(let y=3;y<29;y++)for(let x=3;x<29;x++){const r=Math.hypot(x-16,y-16),a=Math.atan2(y-16,x-16),crescent=(x-14.7)**2+(y-16.6)**2<9.2**2&&(x-19.2)**2+(y-12.4)**2>7.7**2;for(const [id,on] of [['moon-pixels',crescent],['sun-pixels',r<5.5||(r>8.2&&r<11.2&&Math.abs(Math.sin(4*a))<.24)]])if(on){const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',x);rect.setAttribute('y',y);rect.setAttribute('width','.84');rect.setAttribute('height','.84');document.getElementById(id).append(rect)}}
for(const [x,y,o] of [[23,5,.75],[21,7,.25],[25,10,.5],[27,8,.8],[22,13,.2],[24,16,.35],[28,13,.45],[25,20,.4]]){const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x,y,width:.84,height:.84,opacity:o}))rect.setAttribute(k,v);document.getElementById('moon-pixels').append(rect)}
let pointerEdge=null;let p=0,target=0,start=0,startX=0,dragging=false,moved=false,frame=0,from=0,began=0,travel=0;
const clamp=x=>Math.max(0,Math.min(1,x));
function paint(){control.style.setProperty('--edge',pointerEdge===null?12-40*p:pointerEdge);thumb.style.transform=`translate3d(${p*travel}px,0,0)`;railDay.style.opacity=p;dayGlass.style.opacity=p;nightLight.style.opacity=1-p;dayLight.style.opacity=p;moon.style.opacity=1-p;sun.style.opacity=p;moon.style.transform=`scale(${1-p*.14}) rotate(${p*-12}deg)`;sun.style.transform=`scale(${.86+p*.14}) rotate(${(1-p)*12}deg)`}
function measure(){travel=Math.max(0,control.clientWidth-thumb.offsetWidth-20);paint()}
function tick(now){const t=Math.min(1,(now-began)/620),e=1-Math.pow(1-t,4);p=from+(target-from)*e;paint();if(t<1)frame=requestAnimationFrame(tick);else{p=target;paint();frame=0}}
function settle(next){cancelAnimationFrame(frame);frame=0;target=next;document.body.dataset.day=String(next===1);control.setAttribute('aria-checked',String(next===0));control.setAttribute('aria-label',english?(next?'Switch to night mode':'Switch to day mode'):(next?'切换到夜间模式':'切换到日间模式'));if(reduced.matches){p=next;paint();return}from=p;began=performance.now();frame=requestAnimationFrame(tick)}
control.addEventListener('pointerdown',e=>{if(e.button!==0)return;cancelAnimationFrame(frame);frame=0;start=p;startX=e.clientX;dragging=true;moved=false;control.setPointerCapture(e.pointerId)});
control.addEventListener('pointermove',e=>{const box=thumb.getBoundingClientRect(),angle=Math.atan2(e.clientY-box.top-box.height/2,e.clientX-box.left-box.width/2);pointerEdge=-(angle/(Math.PI*2)*100+43);if(dragging){const dx=e.clientX-startX;if(Math.abs(dx)>3)moved=true;p=clamp(start+dx/travel)}if(!frame)frame=requestAnimationFrame(()=>{paint();frame=0})});
control.addEventListener('pointerleave',()=>{pointerEdge=null;if(!frame)frame=requestAnimationFrame(()=>{paint();frame=0})});
control.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;settle(moved?(p>.5?1:0):1-target)});
control.addEventListener('pointercancel',()=>{dragging=false;settle(target)});
control.addEventListener('keydown',e=>{if([' ','Enter','ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();settle(['ArrowLeft','Home'].includes(e.key)?0:['ArrowRight','End'].includes(e.key)?1:1-target)}});
control.addEventListener('click',e=>{if(e.detail===0&&!dragging)settle(1-target)});
new ResizeObserver(measure).observe(control);measure();settle(0);
</script></body></html>
