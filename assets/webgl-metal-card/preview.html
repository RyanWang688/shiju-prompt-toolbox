<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反射金属卡片 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>
#stage{height:640px;grid-template-columns:600px 220px}.screen{height:480px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2c3140,#11131a)}
.holder{width:320px;height:500px;scale:.86;perspective:900px}
.card{position:relative;width:320px;height:500px;border-radius:24px;transform-style:preserve-3d;will-change:transform;cursor:grab;touch-action:none;--hx:50%;--hy:30%}
.card canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:24px}
.card .fallback{position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,#d9dde3,#8c929b 45%,#f2f4f7 60%,#6d737c);display:none}.card.no-gl .fallback{display:block}
.card .edge{position:absolute;inset:0;border-radius:24px;pointer-events:none;border:1px solid #ffffff59;background:radial-gradient(260px circle at var(--hx) var(--hy),#ffffff38,transparent 60%);mix-blend-mode:screen}
.card .label{position:absolute;left:26px;top:28px;color:#11131a;font:800 22px/1.2 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:2px;text-shadow:0 1px 0 #ffffff80}.card .label small{display:block;margin-top:4px;font:600 10px monospace;letter-spacing:3px;opacity:.7}
.card .num{position:absolute;left:26px;bottom:34px;color:#11131a;font:700 19px/1 Consolas,"Courier New",monospace;letter-spacing:3px;text-shadow:0 1px 0 #ffffff80}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>反射金属卡片</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="holder"><div class="card" id="card" role="img" aria-label="可倾斜的金属质感卡片：反射通行证，卡号 0001 2345 6789"><div class="fallback"></div><canvas id="gl" aria-hidden="true"></canvas><div class="label">反射通行证<small>REFLECTIVE PASS</small></div><div class="num">0001 2345 6789</div><div class="edge"></div></div></div></section><aside class="side"><div class="metric"><small>TILT X / Y</small><strong id="tilt">0° / 0°</strong></div><div class="metric"><small>RENDERER</small><strong id="mode">WebGL2</strong></div><p class="note">把鼠标移到卡片上：弹簧（120/16）把卡片倾向 ±12°，CSS 变换与着色器法线使用同一角度；表面反射逐帧绘制的蓝色板、暖色球和白色灯条，经横纵两次模糊并去色。移出后回正。</p><button id="replay">自动晃动一遍</button></aside><div class="hint">根据用户提示词手工制作的网页演示（原生 JS + WebGL2 实现同一流程）· 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/640)})`}new ResizeObserver(fit).observe(document.body);fit();
const card=$('card'),cv=$('gl'),gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:false,antialias:true});
// Environment: a small 2D canvas with a blue panel, a warm sphere and a white light bar, redrawn and uploaded each frame.
const env=document.createElement('canvas');env.width=env.height=256;const ec=env.getContext('2d');
function paintEnv(t){ec.fillStyle='#0b1020';ec.fillRect(0,0,256,256);ec.fillStyle='#2f6bff';ec.fillRect(18+Math.sin(t*.4)*10,40,96,150);const sx=170+Math.cos(t*.6)*40,sy=110+Math.sin(t*.5)*30,g=ec.createRadialGradient(sx,sy,4,sx,sy,58);g.addColorStop(0,'#ffe0b0');g.addColorStop(.5,'#ff9a3c');g.addColorStop(1,'rgba(255,120,40,0)');ec.fillStyle=g;ec.beginPath();ec.arc(sx,sy,58,0,6.283);ec.fill();ec.save();ec.translate(128,210+Math.sin(t*.7)*14);ec.rotate(-.35);ec.fillStyle='#ffffff';ec.fillRect(-120,-7,240,14);ec.restore()}
const VS=`#version 300 es
in vec2 p;out vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
const BLUR=`#version 300 es
precision highp float;in vec2 vUv;uniform sampler2D t;uniform vec2 dir;out vec4 o;
void main(){float w[5]=float[](.227,.1945,.1216,.054,.0162);vec4 c=texture(t,vUv)*w[0];for(int i=1;i<5;i++){vec2 d=dir*float(i)*4.;c+=texture(t,vUv+d)*w[i]+texture(t,vUv-d)*w[i];}o=c;}`;
const CARD=`#version 300 es
precision highp float;in vec2 vUv;uniform sampler2D env;uniform vec2 size;uniform vec2 tilt;out vec4 o;
float sdR(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
void main(){vec2 px=(vUv-.5)*size,b=size*.5;float d=sdR(px,b,24.);if(d>.5)discard;
float e=.5;vec2 g=vec2(sdR(px+vec2(e,0),b,24.)-sdR(px-vec2(e,0),b,24.),sdR(px+vec2(0,e),b,24.)-sdR(px-vec2(0,e),b,24.))/(2.*e);
float bevel=smoothstep(-16.,0.,d);vec2 nn=vec2(n(px*.35)-.5,n(px*.35+17.)-.5)*.06;
vec3 N=normalize(vec3(g*bevel*.85+nn,1.));
float cx=cos(tilt.x),sx=sin(tilt.x),cy=cos(tilt.y),sy=sin(tilt.y);N=vec3(N.x,N.y*cx-N.z*sx,N.y*sx+N.z*cx);N=vec3(N.x*cy+N.z*sy,N.y,-N.x*sy+N.z*cy);
vec3 P=vec3(px/size.y,0.),I=normalize(P-vec3(0.,0.,1.6)),R=reflect(I,N);
vec2 q=R.xy/max(R.z,.2);vec3 c=texture(env,clamp(vUv+.12*q,0.,1.)).rgb;
float l=dot(c,vec3(.299,.587,.114));vec3 m=mix(vec3(.5,.53,.58),vec3(.98,.99,1.),smoothstep(.02,.75,l));
m*=.92+.08*n(vec2(px.x*.02,px.y*2.));m+=pow(1.-max(N.z,0.),2.)*.55+bevel*.08;o=vec4(min(m,1.),1.-smoothstep(-1.,.5,d));}`;
let state=null,raf=0;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(fs){const p=gl.createProgram(),v=shader(gl.VERTEX_SHADER,VS),f=shader(gl.FRAGMENT_SHADER,fs);gl.attachShader(p,v);gl.attachShader(p,f);gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));gl.deleteShader(v);gl.deleteShader(f);return p}
function tex(){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,256,256,0,gl.RGBA,gl.UNSIGNED_BYTE,null);for(const k of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR);for(const k of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);return t}
function fbo(t){const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return f}
function init(){if(!gl)throw Error('no webgl2');const vao=gl.createVertexArray(),buf=gl.createBuffer();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const envT=tex(),a=tex(),b=tex();return {vao,buf,envT,a,b,fa:fbo(a),fb:fbo(b),blur:program(BLUR),card:program(CARD),w:0,h:0,dpr:0}}
// Spring 120 / 16 toward a ±12° target; the same angle drives the CSS transform and the shader normal.
const ang={x:0,y:0,vx:0,vy:0,tx:0,ty:0},MAX=12;
function step(dt){for(const k of ['x','y']){const v='v'+k;ang[v]+=((ang['t'+k]-ang[k])*120-ang[v]*16)*dt;ang[k]+=ang[v]*dt}card.style.transform=`rotateX(${ang.x.toFixed(2)}deg) rotateY(${ang.y.toFixed(2)}deg)`;card.style.setProperty('--hx',50+ang.y*3+'%');card.style.setProperty('--hy',30-ang.x*3+'%');$('tilt').textContent=`${ang.x.toFixed(1)}° / ${ang.y.toFixed(1)}°`}
function render(t){const s=state,d=devicePixelRatio||1,w=Math.round(card.offsetWidth*d),h=Math.round(card.offsetHeight*d);
if(w!==s.w||h!==s.h||d!==s.dpr){s.w=w;s.h=h;s.dpr=d;cv.width=w;cv.height=h}
paintEnv(t);gl.bindVertexArray(s.vao);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.bindTexture(gl.TEXTURE_2D,s.envT);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,env);
gl.useProgram(s.blur);gl.viewport(0,0,256,256);gl.uniform1i(gl.getUniformLocation(s.blur,'t'),0);
gl.bindFramebuffer(gl.FRAMEBUFFER,s.fa);gl.bindTexture(gl.TEXTURE_2D,s.envT);gl.uniform2f(gl.getUniformLocation(s.blur,'dir'),1/256,0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
gl.bindFramebuffer(gl.FRAMEBUFFER,s.fb);gl.bindTexture(gl.TEXTURE_2D,s.a);gl.uniform2f(gl.getUniformLocation(s.blur,'dir'),0,1/256);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(s.card);gl.bindTexture(gl.TEXTURE_2D,s.b);gl.uniform1i(gl.getUniformLocation(s.card,'env'),0);gl.uniform2f(gl.getUniformLocation(s.card,'size'),320,500);gl.uniform2f(gl.getUniformLocation(s.card,'tilt'),ang.x*Math.PI/180,ang.y*Math.PI/180);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
let last=0;function frame(ms){const dt=Math.min(.033,((ms-(last||ms))/1000)||1/60);last=ms;if(reduced.matches){ang.x=ang.tx;ang.y=ang.ty;ang.vx=ang.vy=0}step(dt);if(state)render(ms/1000);raf=requestAnimationFrame(frame)}
try{state=init()}catch(e){card.classList.add('no-gl');cv.remove();$('mode').textContent='CSS 降级'}
card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),u=(e.clientX-r.left)/r.width-.5,v=(e.clientY-r.top)/r.height-.5;ang.ty=Math.max(-1,Math.min(1,u*2))*MAX;ang.tx=Math.max(-1,Math.min(1,-v*2))*MAX});
card.addEventListener('pointerleave',()=>{ang.tx=ang.ty=0});
let demo=[];$('replay').onclick=()=>{demo.forEach(clearTimeout);demo=[[12,-8],[-10,12],[6,10],[0,0]].map(([y,x],i)=>setTimeout(()=>{ang.ty=y;ang.tx=x},i*420))};
// Release GPU resources when the page goes away.
addEventListener('pagehide',()=>{cancelAnimationFrame(raf);if(!state)return;const s=state;[s.envT,s.a,s.b].forEach(t=>gl.deleteTexture(t));[s.fa,s.fb].forEach(f=>gl.deleteFramebuffer(f));gl.deleteProgram(s.blur);gl.deleteProgram(s.card);gl.deleteBuffer(s.buf);gl.deleteVertexArray(s.vao);state=null});
raf=requestAnimationFrame(frame);if(location.hash==='#cover'){ang.ty=-10;ang.tx=7}
</script></body></html>
