<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单选下拉 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><link rel="stylesheet" href="../ui-flow-20261025.css"><style>
.form{display:grid;gap:18px;width:300px}.edge{position:absolute;left:32px;right:32px;bottom:28px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.edge p{margin:0;font-size:12px;color:#8a8a8a;max-width:190px}.edge .wrap{width:200px}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / DROPDOWN 01</div><h1>单选下拉</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="canvas" id="canvas">
<h3>任务设置</h3><p class="sub">状态、负责人角色与排序</p>
<div class="form"><div><p class="cap" id="l1">状态</p><div class="wrap" data-dd='[["todo","待处理","#9a9a9a"],["doing","进行中","#3b82f6"],["review","待审核","#f59e0b"],["done","已完成","#22c55e"]]' data-value="doing" data-label="l1"></div></div>
<div><p class="cap" id="l2">角色</p><div class="wrap" data-dd='[["owner","负责人"],["editor","协作者"],["viewer","只读"]]' data-label="l2"></div></div></div>
<div class="edge"><p>靠近底部的下拉会自动向上展开，避开视口边缘。</p><div class="wrap" data-dd='[["new","最近更新"],["due","截止日期"],["prio","优先级"],["name","名称 A–Z"]]' data-value="new" data-label="l3"><p class="cap" id="l3" hidden>排序</p></div></div>
</div></section><aside class="side"><div class="metric"><small>STATE</small><strong id="st">收起</strong></div><div class="metric"><small>LAST PICK</small><strong id="pick">—</strong></div><p class="note">点开时菜单从上方 8px 滑入并淡入（180ms），箭头旋转 180°；悬停背景平滑高亮，选中显示对勾并自动收起。支持上下键、Enter、Esc、点外部关闭；靠近底部时自动向上展开。</p><button id="replay" type="button">打开「状态」</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script src="../ui-flow-20261025.js"></script><script>
let openDd=null;
function build(wrap,k){const opts=JSON.parse(wrap.dataset.dd);wrap.dd={opts,value:wrap.dataset.value||null,active:0};
 wrap.insertAdjacentHTML('afterbegin',`<button type="button" class="field" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${wrap.dataset.label} v${k}"><span class="val" id="v${k}"></span>${chev}</button>`);
 const menu=document.createElement('ul');menu.className='menu';menu.id='m'+k;menu.setAttribute('role','listbox');menu.tabIndex=-1;menu.hidden=true;$('canvas').append(menu);wrap.menu=menu;
 menu.innerHTML=opts.map(([v,t,c],i)=>`<li class="opt" role="option" id="m${k}-${i}" data-i="${i}">${c?`<span class="dot" style="background:${c}"></span>`:''}<span>${t}</span>${tick}</li>`).join('');
 const btn=wrap.querySelector('.field');btn.onclick=()=>openDd===wrap?close(wrap):open(wrap);btn.onkeydown=e=>{if(['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){e.preventDefault();open(wrap)}};
 menu.onpointermove=e=>{const li=e.target.closest('.opt');if(li)activate(wrap,+li.dataset.i)};menu.onclick=e=>{const li=e.target.closest('.opt');if(li)choose(wrap,+li.dataset.i)};
 menu.onkeydown=e=>{const n=opts.length,a=wrap.dd.active;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();activate(wrap,(a+(e.key==='ArrowDown'?1:n-1))%n)}else if(e.key==='Home'||e.key==='End'){e.preventDefault();activate(wrap,e.key==='Home'?0:n-1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(wrap,a)}else if(e.key==='Escape'){e.preventDefault();close(wrap,true)}else if(e.key==='Tab')close(wrap)};paint(wrap)}
function paint(wrap){const {opts,value}=wrap.dd,i=opts.findIndex(o=>o[0]===value),v=wrap.querySelector('.val');v.innerHTML=i<0?'<span class="ph">请选择</span>':(opts[i][2]?`<span class="dot" style="background:${opts[i][2]};display:inline-block;margin-right:8px"></span>`:'')+opts[i][1];wrap.menu.querySelectorAll('.opt').forEach((li,k)=>li.setAttribute('aria-selected',String(k===i)))}
function activate(wrap,i){wrap.dd.active=i;wrap.menu.querySelectorAll('.opt').forEach((li,k)=>li.classList.toggle('active',k===i));wrap.menu.setAttribute('aria-activedescendant',wrap.menu.id+'-'+i)}
function open(wrap){if(openDd&&openDd!==wrap)close(openDd);if(openDd===wrap)return;openDd=wrap;const btn=wrap.querySelector('.field'),menu=wrap.menu;btn.setAttribute('aria-expanded','true');menu.hidden=false;menu.style.width=btn.offsetWidth+'px';
 const below=placeMenu(menu,btn,{gap:8});activate(wrap,Math.max(0,wrap.dd.opts.findIndex(o=>o[0]===wrap.dd.value)));menu.focus({preventScroll:true});
 // Slides in from 8px on the side it opens from.
 A(menu,[{opacity:0,transform:`translateY(${below?-8:8}px)`},{opacity:1,transform:'none'}],{duration:180,easing:easeOut});$('st').textContent=below?'向下展开':'向上展开'}
function close(wrap,focus){if(openDd!==wrap)return;openDd=null;const btn=wrap.querySelector('.field'),menu=wrap.menu;btn.setAttribute('aria-expanded','false');
 A(menu,[{opacity:1},{opacity:0}],{duration:120,fill:'forwards'});setTimeout(()=>{if(openDd!==wrap){menu.hidden=true;menu.getAnimations().forEach(a=>a.cancel())}},reduced?0:120);if(focus)btn.focus({preventScroll:true});$('st').textContent='收起'}
function choose(wrap,i){wrap.dd.value=wrap.dd.opts[i][0];paint(wrap);$('pick').textContent=wrap.dd.opts[i][1];setTimeout(()=>close(wrap,true),reduced?0:90)}
document.querySelectorAll('[data-dd]').forEach(build);
document.addEventListener('pointerdown',e=>{if(openDd&&!openDd.contains(e.target)&&!openDd.menu.contains(e.target))close(openDd)});
$('replay').onclick=()=>open(document.querySelector('[data-dd]'));
setTimeout(()=>open(document.querySelector('[data-dd]')),reduced?0:700);
</script><script src="../demo-i18n.js"></script></body></html>
