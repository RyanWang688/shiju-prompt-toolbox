<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>撒花庆祝 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>
#stage{height:590px;grid-template-columns:600px 220px}.screen{height:430px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3b3b3b,#151515)}
.phone{position:relative;width:228px;height:410px;border:6px solid #2b2b2b;border-radius:34px;background:#121214;color:#f2f2f2;overflow:hidden;box-shadow:0 22px 50px #0009}
.top{padding:26px 14px 0;text-align:center;font-size:11px;font-weight:700}.streak{margin:12px 12px 10px;padding:12px;border-radius:14px;background:#1d1d21}.streak small{font-size:8px;color:#9a9a9a}.streak strong{display:block;font-size:30px;line-height:1.1}.streak strong span{font-size:11px}.bar{height:4px;margin-top:8px;border-radius:4px;background:#2c2c31}.bar i{display:block;width:96%;height:100%;border-radius:inherit;background:#ffd43b}
.week{display:flex;justify-content:space-between;margin:0 12px 10px}.week i{width:20px;height:20px;border-radius:50%;background:#ffd43b;display:grid;place-items:center;color:#191919;font-size:10px;font-style:normal}.week i.today{background:transparent;border:2px solid #ffd43b}.week i.off{background:#2c2c31}
.task{display:flex;align-items:center;gap:8px;margin:0 12px 6px;padding:8px 10px;border-radius:11px;background:#1d1d21;font-size:9px}.task b{margin-left:auto;width:12px;height:12px;border-radius:50%;background:#4dd4ac}.task b.no{background:transparent;border:1px solid #555}
#checkin{position:absolute;left:24px;right:24px;bottom:30px;min-height:0;height:36px;padding:0;border:0;border-radius:18px;background:#ffd43b;color:#191919;font-size:12px;font-weight:800}#checkin:hover{background:#ffd43b}#checkin.done{background:#2c2c31;color:#ffd43b}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>撒花庆祝</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone" id="phone"><div class="top">每日打卡</div><div class="streak"><small>已连续打卡</small><strong id="days">29<span> 天</span></strong><div class="bar"><i></i></div></div><div class="week"><i>✓</i><i>✓</i><i>✓</i><i>✓</i><i class="today" id="today"></i><i class="off"></i><i class="off"></i></div><div class="task">晨跑 3 公里<b></b></div><div class="task">阅读 20 页<b></b></div><div class="task">喝水 8 杯<b class="no"></b></div><button id="checkin" type="button">打卡</button><canvas id="fx" aria-hidden="true"></canvas></div></section><aside class="side"><div class="metric"><small>PIECES</small><strong id="count">0</strong></div><div class="metric"><small>FPS</small><strong id="fps">–</strong></div><p class="note">点「打卡」：约 100 片彩纸从按钮向上喷出（正上方 ±35°），长条、圆片、小方块 5 种颜色；先冲高再被重力拉回，下落时左右飘、绕自身翻面，越落越慢，约 2.5 秒后各自淡出。</p><button id="replay">再撒一次</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/590)})`}new ResizeObserver(fit).observe(document.body);fit();
const cv=$('fx'),ctx=cv.getContext('2d'),COLORS=['#ffd43b','#ff6b6b','#4dd4ac','#5aa9ff','#f5f5f5'];let dpr=0,W=0,H=0,pieces=[],raf=0,last=0,frames=0,fpsT=0;
// Resize the backing store only when the CSS size or DPR actually changes.
function size(){const r={width:cv.offsetWidth,height:cv.offsetHeight},d=devicePixelRatio||1;if(d===dpr&&r.width===W&&r.height===H)return;dpr=d;W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}
const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);return `rgb(${(n>>16&255)*k|0},${(n>>8&255)*k|0},${(n&255)*k|0})`};
function burst(){size();const b=$('checkin'),pr=$('phone').getBoundingClientRect(),br=b.getBoundingClientRect(),k=pr.width/($('phone').offsetWidth||1),x0=(br.left+br.width/2-pr.left)/k,y0=(br.top-pr.top)/k+6;
for(let i=0;i<100;i++){const a=(-90+(Math.random()*70-35))*Math.PI/180,s=380+Math.random()*300;pieces.push({x:x0+(Math.random()-.5)*40,y:y0,vx:Math.cos(a)*s,vy:Math.sin(a)*s,shape:i%3,color:COLORS[i%5],w:i%3===0?3:5,h:i%3===0?11:5,rot:Math.random()*6.28,spin:(Math.random()-.5)*10,flip:Math.random()*6.28,flipV:6+Math.random()*8,sway:Math.random()*6.28,age:0,life:2.2+Math.random()*.8})}
if(!raf){last=0;raf=requestAnimationFrame(tick)}}
function tick(t){const dt=Math.min(.033,((t-(last||t))/1000)||1/60);last=t;frames++;if(t-fpsT>500){$('fps').textContent=Math.round(frames*1000/(t-fpsT||1));frames=0;fpsT=t}size();ctx.clearRect(0,0,W,H);
for(const p of pieces){p.age+=dt;p.vy+=900*dt;
// Air drag grows while falling, so each piece slows towards a gentle terminal speed.
const drag=p.vy>0?3.2:.6;p.vx*=Math.exp(-drag*.6*dt);p.vy*=Math.exp(-drag*dt);p.sway+=dt*3;p.x+=(p.vx+(p.vy>0?Math.sin(p.sway)*36:0))*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;p.flip+=p.flipV*dt;
const fade=Math.min(1,Math.max(0,(p.life-p.age)/.5)),c=Math.cos(p.flip);if(fade<=0)continue;ctx.save();ctx.globalAlpha=fade;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,Math.max(.08,Math.abs(c)));ctx.fillStyle=c<0?shade(p.color,.62):p.color;
if(p.shape===1){ctx.beginPath();ctx.arc(0,0,p.w/2+.5,0,6.283);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
pieces=pieces.filter(p=>p.age<p.life);$('count').textContent=pieces.length;if(pieces.length)raf=requestAnimationFrame(tick);else{raf=0;ctx.clearRect(0,0,W,H)}}
function press(){const b=$('checkin');if(!reduced.matches)b.animate([{scale:1},{scale:.92,offset:.3},{scale:1.06,offset:.65},{scale:1}],{duration:420,easing:'cubic-bezier(.2,.9,.22,1)'});b.textContent='已打卡 ✓';b.classList.add('done');$('days').firstChild.textContent='30';$('today').textContent='✓';$('today').classList.remove('today')}
$('checkin').onclick=()=>{if($('checkin').classList.contains('done'))return;press();if(!reduced.matches)burst()};
$('replay').onclick=()=>{press();if(!reduced.matches)burst()};
new ResizeObserver(size).observe(cv);size();if(location.hash==='#cover')setTimeout(()=>$('checkin').click(),300);
</script></body></html>
