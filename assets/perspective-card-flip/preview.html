<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立体翻面 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.art{background:#ffd43b;color:#191919;position:relative;padding:22px;height:160px;transition:height .6s}.art span{font:11px monospace;letter-spacing:3px}.art b{display:block;font-size:30px;line-height:1.2;margin-top:18px}.art i{position:absolute;right:22px;bottom:18px;font-size:48px;font-style:normal}.caption{padding:18px;background:white;color:#191919}.caption h2{font-size:20px}.caption p{margin:8px 0;font-size:13px;line-height:1.7}.scene-button{padding:0;border-radius:20px;overflow:hidden;text-align:left;box-shadow:0 18px 40px #19191918}.scene-button:hover{background:white}.screen{background:#eee}.small{font:12px monospace;color:#595959}.screen>h2{padding:22px;font-size:20px}.screen button:focus-visible{outline-offset:-4px}#flip{position:absolute;left:100px;top:45px;width:375px;height:235px;padding:0;border:0;background:transparent;perspective:1000px;text-align:left;overflow:visible}#flip:hover{background:transparent}.rotor{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}#flip.flipped .rotor{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:1px solid #191919;border-radius:22px;overflow:hidden;backface-visibility:hidden;padding:25px;background:#ffd43b}.face:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x,30%) var(--y,20%),#ffffffa0,transparent 65%)}.face h2{font-size:34px;margin:28px 0 14px}.back{transform:rotateY(180deg);background:#191919;color:#fff}.face small{font:12px monospace;letter-spacing:3px}.back p{line-height:1.8;color:#fff}.face>*{position:relative;z-index:1}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / CARD INTERACTIONS</div><h1>立体翻面</h1></div><span class="badge">交互演示</span></header><section class="screen"><button id="flip" aria-label="翻转卡片" aria-pressed="false"><div class="rotor"><div class="face front"><small>SHIJU / MEMBERSHIP</small><h2>Creative<br>Pass.</h2><span>01 — 点击翻到背面 ↗</span></div><div class="face back"><small>REVERSE / 02</small><h2>另一面，也精彩。</h2><p>收集灵感 · 记录想法<br>再次点击返回正面</p></div></div></button></section><aside class="side"><div class="metric"><small>INTERACTION STATE</small><strong id="state">READY</strong></div><p class="note">点击卡片切换正反面，移动指针观察柔和高光。键盘聚焦后按 Enter 也可翻转。</p><button id="replay">展开 / 收起</button></aside><div class="hint">按用户提示词手工制作的网页演示 · 非原作者作品或模型实测输出</div></main><script>
const stage=document.getElementById('stage'),state=document.getElementById('state'),replay=document.getElementById('replay'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const feature=document.getElementById('feature'),closeButton=document.getElementById('close'),stack=document.getElementById('stack'),player=document.getElementById('player'),handle=document.getElementById('handle'),track=document.getElementById('track'),flip=document.getElementById('flip');
function scaleFactor(){return Math.min(innerWidth/900,innerHeight/500)}function fit(){stage.style.transform=`translate(-50%,-50%) scale(${scaleFactor()})`}new ResizeObserver(fit).observe(document.body);fit();
function toggle(){let back=flip.classList.toggle('flipped');flip.setAttribute('aria-pressed',back);state.textContent=back?'BACK':'FRONT'}flip.onclick=toggle;replay.onclick=toggle;flip.onpointermove=e=>{let r=flip.getBoundingClientRect();flip.style.setProperty('--x',(e.clientX-r.left)/r.width*100+'%');flip.style.setProperty('--y',(e.clientY-r.top)/r.height*100+'%')};flip.onpointerleave=()=>{flip.style.removeProperty('--x');flip.style.removeProperty('--y')};</script><script src="../demo-i18n.js"></script></body></html>
