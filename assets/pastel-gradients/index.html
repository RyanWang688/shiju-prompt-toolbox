<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神仙渐变色 · 3D 色卡</title>
<style>
* { box-sizing: border-box }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: clamp(14px, 5vw, 60px); background: #17181d; color: #f5f2ed; font: 15px/1.45 system-ui, sans-serif }
main { width: min(100%, 730px) }
header, footer, .readout { display: flex; justify-content: space-between; align-items: center; gap: 10px }
header, footer { color: #d2ced6; font-size: .82rem }
header { padding-bottom: 12px }
header strong { color: #fff; letter-spacing: .12em }
.stage { perspective: 900px; padding-bottom: 15px }
.card { --a: #ddffc2; --b: #eee1ff; display: grid; position: relative; isolation: isolate; align-content: space-between; gap: 18px; min-height: clamp(180px, 39vh, 330px); padding: clamp(18px, 5vw, 43px); border-radius: 26px; background: linear-gradient(124deg,var(--a),var(--b)); color: #252431; border: 1px solid #fff9; box-shadow: 0 7px 0 #aaa5b5, 0 11px 0 #514c5c, 0 24px 44px #0008; transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition: transform .22s ease-out }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; background: radial-gradient(ellipse at var(--x,25%) var(--y,10%), #fff9, transparent 55%); pointer-events: none }
.card p, h1 { margin: 0 }
.series { font: 600 .75rem/1.3 ui-monospace, monospace; letter-spacing: .12em }
h1 { font-size: clamp(24px, 6vw, 58px); letter-spacing: -.045em; line-height: 1.12 }
.readout { font: 600 clamp(12px, 2vw, 15px)/1.3 ui-monospace, monospace; border-top: 1px solid #25243135; padding-top: 12px }
.controls { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 13px }
button { display: grid; place-items: center; align-content: center; gap: 3px; min-width: 0; min-height: 46px; border: 1px solid #fff3; border-radius: 11px; color: #eee; background: #26272e; font: 600 .75rem ui-monospace, monospace; cursor: pointer }
button span { width: 68%; height: 9px; border-radius: 9px; background: linear-gradient(90deg,var(--a),var(--b)) }
button[aria-pressed="true"] { border-color: #fff; background: #3e3e49 }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px }
footer { margin-top: 12px; flex-wrap: wrap }
@media(max-width: 430px) { .controls { grid-template-columns: repeat(4, 1fr) } }
@media(prefers-reduced-motion: reduce) { .card { transition: none; transform: none } }
</style>
<main>
  <header><strong id="label">神仙渐变色</strong><span id="count">08 组双色渐变</span></header>
  <div class="stage">
    <section class="card" aria-live="polite" aria-atomic="true">
      <p class="series" id="series">01 / GRADIENT STUDY</p>
      <h1 id="paletteName">这就是我想要的</h1>
      <div class="readout"><code id="first">#DDFFC2</code><span aria-hidden="true">→</span><code id="second">#EEE1FF</code></div>
    </section>
  </div>
  <div class="controls" role="group" aria-label="选择渐变配色"></div>
  <footer><span id="hint">点击色票切换 · 鼠标移动时卡面会倾斜</span><span id="credit">配色参考 · @汤圆十里</span></footer>
</main>
<script>
const palettes = [["01","这就是我想要的","Lime & Lilac","#DDFFC2","#EEE1FF"],["02","一眼心动系列","Blush & Sky","#FFEAE1","#B6FAFF"],["03","美好从审美开始","Spring & Mist","#CFFFBD","#B9DFFF"],["04","梦境的粉色泡泡","Dream Bubble","#DBDDFF","#FFD0D0"],["05","所有的美好给你","Aqua & Rose","#ACFFF1","#FFDCDC"],["06","这配色太上头","Cream & Ice","#FFFFD0","#D8EFFF"],["07","粉末天青一见倾心","Powder & Pink","#D89CA6","#FFC5CE"],["10","黄紫迷人眼","Cream & Lavender","#FFFFD0","#D2CDFF"]];
const en = new URLSearchParams(location.search).get('lang') === 'en';
const card = document.querySelector('.card');
const stage = document.querySelector('.stage');
const controls = document.querySelector('.controls');
const byId = id => document.getElementById(id);
if (en) {
  document.documentElement.lang = 'en';
  document.title = 'Pastel Gradients · 3D palette';
  byId('label').textContent = 'Pastel Gradients';
  byId('count').textContent = '08 colour pairs';
  byId('hint').textContent = 'Select a swatch · Move the pointer to tilt';
  byId('credit').textContent = 'Palette reference · @Tangyuan Shili';
  controls.setAttribute('aria-label', 'Choose a gradient');
}
function show(index) {
  const [number, zh, english, a, b] = palettes[index];
  card.style.setProperty('--a', a);
  card.style.setProperty('--b', b);
  byId('series').textContent = number + ' / GRADIENT STUDY';
  byId('paletteName').textContent = en ? english : zh;
  byId('first').textContent = a;
  byId('second').textContent = b;
  Array.from(controls.children).forEach((button, i) => {
    button.setAttribute('aria-pressed', String(i === index));
  });
}
palettes.forEach(([number, zh, english, a, b], index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.setAttribute('aria-label', number + ' ' + (en ? english : zh));
  button.style.setProperty('--a', a);
  button.style.setProperty('--b', b);
  button.append(document.createElement('span'), number);
  button.addEventListener('click', () => show(index));
  controls.append(button);
});
const tilt = matchMedia('(hover: hover) and (prefers-reduced-motion: no-preference)');
stage.addEventListener('pointermove', event => {
  if (!tilt.matches || event.pointerType !== 'mouse') return;
  const bounds = stage.getBoundingClientRect();
  const x = (event.clientX - bounds.left) / bounds.width;
  const y = (event.clientY - bounds.top) / bounds.height;
  card.style.setProperty('--rx', (0.5 - y) * 15 + 'deg');
  card.style.setProperty('--ry', (x - 0.5) * 18 + 'deg');
  card.style.setProperty('--x', x * 100 + '%');
  card.style.setProperty('--y', y * 100 + '%');
});
stage.addEventListener('pointerleave', () => {
  ['--rx', '--ry', '--x', '--y'].forEach(key => card.style.removeProperty(key));
});
show(0);
</script>
</html>
