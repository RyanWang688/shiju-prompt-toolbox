<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共享元素无缝展开 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.trail-bg{padding:24px}.trail-bg b{font-size:23px}.trail-bg p{font-size:12px;color:#595959}#trail{position:absolute;left:24px;top:100px;width:260px;height:155px;padding:0;border:0;border-radius:18px;overflow:hidden;text-align:left;transition:left .65s cubic-bezier(.2,.85,.25,1),top .65s cubic-bezier(.2,.85,.25,1),width .65s cubic-bezier(.2,.85,.25,1),height .65s cubic-bezier(.2,.85,.25,1),border-radius .65s;z-index:2;background:#191919;color:white}.art{position:absolute;inset:0;height:100%;transition:height .65s}.trail-label{position:absolute;left:14px;bottom:14px;background:#191919;color:#fff;padding:5px 10px;border-radius:8px;font-size:12px;transition:opacity .2s}.details{position:absolute;left:24px;bottom:20px;opacity:0;transition:opacity .25s .3s}.details p,.details small{margin:2px 0;color:#ddd}#trail.open{left:0;top:0;width:578px;height:328px;border-radius:0}#trail.open .art{height:63%}#trail.open .trail-label{opacity:0}#trail.open .details{opacity:1}.placeholder{position:absolute;left:310px;top:100px;border:1px dashed #ccc;border-radius:18px;padding:25px;width:238px;height:155px;color:#595959}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>共享元素无缝展开</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="trail-bg"><b>Trail journal</b><p>山间路线 · 共享元素</p></div><button id="trail" aria-label="展开山间路线详情" aria-expanded="false"><div class="art"><svg class="mountain" viewBox="0 0 540 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="540" height="260" fill="#ffd43b"/><circle cx="440" cy="55" r="30" fill="#fff"/><path d="M-20 270 170 22 350 270Z" fill="#191919"/><path d="m170 22-62 81 49-12 25 25 30-33Z" fill="#fff"/><path d="M230 270 390 80 550 270Z" fill="#595959"/><path d="m390 80-45 54 37-9 20 13 16-24Z" fill="#fff"/><path d="M0 235Q180 200 540 230V260H0" fill="#e8e8e8"/></svg></div><span class="trail-label">ALPINE ROUTE ↗</span><div class="details"><h2>更高处的风景</h2><p>同一张卡片 · 同一幅背景</p><small>再次点击返回列表</small></div></button><div class="placeholder">下一条路线 · 12 km</div></section><aside class="side"><div class="metric"><small>STAGE</small><strong id="state">LIST</strong></div><div class="metric"><small>WIDTH RATIO</small><strong id="scale">× 1.00</strong></div><p class="note">点击图卡展开，再次点击返回。背景与容器连续变化，不创建重复图层。</p><button id="replay">展开 / 返回</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
