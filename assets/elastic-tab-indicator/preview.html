<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标签指示条 · 动效演示</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191d23;color:#f7f6f3;font:15px "Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}#stage{position:absolute;left:50%;top:50%;width:760px;height:420px;flex-shrink:0;transform-origin:center;display:grid;grid-template-columns:500px 200px;gap:28px;padding:26px 16px}button{font:inherit;cursor:pointer;color:inherit;border:0}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.screen{position:relative;height:350px;background:#242429;border:1px solid #3d3d43;border-radius:24px;padding:23px;overflow:hidden}.kicker{font:11px monospace;letter-spacing:2px;color:#b8b7bd}h1{font-size:24px;line-height:1.2;margin:7px 0 20px;font-weight:600}.side{padding-top:13px}.side header{font:11px monospace;color:#bbbfc7;letter-spacing:2px;border-bottom:1px solid #41454b;padding-bottom:15px;margin-bottom:24px}.metric{color:var(--accent);margin-bottom:19px}.metric small{display:block;letter-spacing:2px;font:11px monospace}.metric strong{display:block;font-size:29px;line-height:1.4;font-weight:600}.note{font-size:12px;color:#b5b7bd;line-height:1.8}.replay{background:transparent;border:1px solid #70737d;padding:9px 16px;border-radius:20px;font-size:12px;margin-top:10px}.hint{position:absolute;bottom:8px;left:25px;font-size:11px;color:#c0c1c7;letter-spacing:1px}.pill{height:40px;background:#34343b;border-radius:11px;display:flex;align-items:center;padding:0 15px;margin:9px 0;color:#dedee4;font-size:13px}.pill:after{content:'';height:8px;width:29px;background:#55555f;border-radius:5px;margin-left:auto}.row{display:flex;align-items:center;gap:10px;background:#3d3d44;padding:10px 13px;border-radius:10px;margin-top:8px;font-size:14px}.dot{height:6px;width:6px;background:var(--accent);border-radius:50%}.bg{position:absolute;left:23px;right:23px;top:98px}.dim{opacity:.38}svg{overflow:visible}.speed{color:var(--accent)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
#tabs{position:relative;display:flex;border-bottom:1px solid #494950;margin-top:5px;margin-bottom:18px}#tabs button{flex:1;height:40px;background:transparent;color:#bbbcc5;font-size:14px}#tabs button[aria-selected=true]{color:#fff;font-weight:600}#indicator{position:absolute;height:4px;background:var(--accent);bottom:-1px;left:0;width:148px;border-radius:3px;pointer-events:none}.tabbody{background:#323238;border-radius:15px;padding:18px;margin-bottom:13px;font-size:16px}.skel{height:7px;border-radius:4px;background:#55555e;width:75%;margin-top:12px}.skel.short{width:48%}.skel.hot{width:36%;background:var(--accent)}
</style></head><body style="--accent:#ff594f"><main id="stage"><section class="screen"><div class="kicker">CARRY</div><h1>Trail map</h1><div id="tabs" role="tablist" aria-label="路线内容"><button role="tab" aria-selected="true" tabindex="0">Trip</button><button role="tab" aria-selected="false" tabindex="-1">List</button><button role="tab" aria-selected="false" tabindex="-1">Gear</button><div id="indicator"></div></div><div class="tabbody" role="tabpanel"><b id="tabTitle">Plan the route</b><div class="skel hot"></div><div class="skel"></div><div class="skel short"></div></div><div class="tabbody dim"><div class="skel short"></div><div class="skel"></div></div></section><aside class="side"><header>● LIVE PREVIEW</header><div class="metric"><small>LEAD / TAIL</small><strong id="m1">Trip</strong></div><div class="metric"><small>WIDTH</small><strong id="m2">148 px</strong></div><p class="note">点击 Trip、List 或 Gear。<br>前沿先走，后沿延后 6 帧追赶。</p><button class="replay" id="replay">切换下一个</button></aside><div class="hint">手工制作的交互演示 · 非模型实测输出</div></main><script>
const stage=document.getElementById('stage');const reduced=matchMedia('(prefers-reduced-motion:reduce)');function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/760,innerHeight/420)})`}new ResizeObserver(fit).observe(document.body);fit();const $=id=>document.getElementById(id);const ease='cubic-bezier(.2,.9,.22,1)';
const buttons=[...document.querySelectorAll('[role=tab]')];let active=0;let indicatorAnimation;function select(index){const width=$('tabs').clientWidth/3;const indicator=$('indicator');const left=parseFloat(getComputedStyle(indicator).left);const oldWidth=parseFloat(getComputedStyle(indicator).width);if(indicatorAnimation)indicatorAnimation.cancel();const right=left+oldWidth;const target=index*width;const movingRight=target>left;const leadingFrom=movingRight?right:left,leadingTo=movingRight?target+width:target;const trailingFrom=movingRight?left:right,trailingTo=movingRight?target:target+width;let frames=[];for(let frame=0;frame<=50;frame++){const t=frame/50;const e=x=>{x=Math.min(1,Math.max(0,x));let lo=0,hi=1;for(let n=0;n<15;n++){const t=(lo+hi)/2;const bx=3*(1-t)*(1-t)*t*.2+3*(1-t)*t*t*.22+t*t*t;if(bx<x)lo=t;else hi=t}const t=(lo+hi)/2;return 3*(1-t)*(1-t)*t*.9+3*(1-t)*t*t+t*t*t};const lead=leadingFrom+(leadingTo-leadingFrom)*e(t/.72);const tail=trailingFrom+(trailingTo-trailingFrom)*e((t-.12)/.88);const overshoot=Math.sin(Math.max(0,(t-.7)/.3)*Math.PI)*3;frames.push({left:(movingRight?tail:lead)-overshoot+'px',width:Math.abs(lead-tail)+overshoot+'px',offset:t})}indicator.style.left=target+'px';indicator.style.width=width+'px';indicatorAnimation=indicator.animate(frames,{duration:reduced.matches?1:800,easing:'linear'});active=index;buttons.forEach((b,i)=>{b.setAttribute('aria-selected',i===index);b.tabIndex=i===index?0:-1});$('tabTitle').textContent=['Plan the route','Pack your essentials','Ready for the trail'][index];$('m1').textContent=buttons[index].textContent;$('m2').textContent=Math.round(width)+' px'}buttons.forEach((b,i)=>{b.onclick=()=>select(i);b.onkeydown=e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?2:(active+(e.key==='ArrowRight'?1:2))%3;select(n);buttons[n].focus()}}});$('replay').onclick=()=>select((active+1)%3);select(0);if(!reduced.matches)setTimeout(()=>select(2),700);
</script></body></html>
