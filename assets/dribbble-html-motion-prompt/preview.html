<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dribbble 级丝滑 HTML UI 动效 · 交互演示</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #eeede8; color: #111111; font-family: "Inter", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 14px;
      background: radial-gradient(circle at 50% 42%, #f5f4f0 0%, #eeede8 72%);
    }

    /* Top bar: minimal telemetry */
    .hud-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      color: #6b6a65;
      z-index: 4;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #111111;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111111;
    }
    .telemetry {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .telemetry b { color: #111111; font-weight: 700; }

    /* Center Stage */
    .stage {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 0;
    }

    /* Morphing shell: strictly driven by seek(t) — ZERO CSS transitions/animations */
    .shell {
      position: relative;
      background: #ffffff;
      border: 1px solid rgba(17, 17, 17, 0.08);
      box-shadow: 0 22px 48px -18px rgba(17, 17, 17, 0.16), 0 4px 12px -4px rgba(17, 17, 17, 0.06);
      overflow: hidden;
      display: grid;
      place-items: center;
      will-change: width, height, border-radius, background-color, transform;
    }

    .layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .layer.is-interactive { pointer-events: auto; }

    /* 1. Generate Button + Loader */
    .btn-label {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
      white-space: nowrap;
    }
    .spinner {
      position: absolute;
      width: 18px;
      height: 18px;
    }

    /* 2. Dynamic Island Music Player */
    .island {
      width: 100%;
      height: 100%;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #ffffff;
    }
    .album {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3f3f46, #18181b);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 12px;
    }
    .track {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .track strong { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track small { font-size: 10px; color: #a1a1aa; white-space: nowrap; }
    .eq {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 18px;
      flex-shrink: 0;
    }
    .eq i {
      display: block;
      width: 2.5px;
      border-radius: 2px;
      background: #ffffff;
    }

    /* 3. Volume Slider */
    .vol-wrap {
      width: 100%;
      height: 100%;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: ew-resize;
    }
    .vol-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      fill: none;
      stroke: #111111;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .vol-track {
      position: relative;
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: #e7e6e1;
      overflow: hidden;
    }
    .vol-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: #111111;
      border-radius: 999px;
    }
    .vol-val {
      width: 32px;
      text-align: right;
      font: 600 11px/1 ui-monospace, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: #52525b;
    }

    /* 4. Dual-Spring Liquid Segmented Tabs */
    .seg-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
    }
    .seg-pill {
      position: absolute;
      top: 4px;
      bottom: 4px;
      border-radius: 999px;
      background: #111111;
      box-shadow: 0 4px 12px rgba(17, 17, 17, 0.18);
    }
    .seg-btn {
      position: relative;
      z-index: 1;
      height: 100%;
      border: 0;
      background: transparent;
      font: 600 12.5px/1 inherit;
      cursor: pointer;
      padding: 0;
      outline: none;
    }

    /* 5. 84,320 Data Line Chart */
    .chart-wrap {
      width: 100%;
      height: 100%;
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .chart-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .chart-head small { font-size: 11px; color: #71717a; font-weight: 500; }
    .chart-num {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.8px;
      font-variant-numeric: tabular-nums;
      color: #111111;
    }
    .chart-svg { width: 100%; height: 92px; overflow: visible; }

    /* 6. Command Palette */
    .cmd-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .cmd-search {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-bottom: 1px solid #ecebe6;
      font-size: 13px;
      color: #111111;
    }
    .cmd-search svg { width: 14px; height: 14px; stroke: #71717a; fill: none; stroke-width: 2; }
    .cmd-cursor { display: inline-block; width: 1.5px; height: 14px; background: #111111; vertical-align: middle; margin-left: 1px; }
    .cmd-list {
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .cmd-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      color: #3f3f46;
    }
    .cmd-row.is-active { background: #f3f2ed; color: #111111; font-weight: 600; }
    .cmd-row kbd {
      font: 600 10px/1 ui-monospace, Consolas, monospace;
      color: #71717a;
    }

    /* Bottom Scrub & Stage Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 4;
    }
    .stages {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
    }
    .stage-btn {
      border: 1px solid rgba(17, 17, 17, 0.1);
      background: rgba(255, 255, 255, 0.7);
      color: #52525b;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    .stage-btn.active {
      background: #111111;
      border-color: #111111;
      color: #ffffff;
    }

    .scrub-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(17, 17, 17, 0.08);
      border-radius: 12px;
      padding: 6px 12px;
    }
    .play-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 0;
      background: #111111;
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      outline: none;
    }
    .play-btn svg { width: 12px; height: 12px; fill: currentColor; }
    .scrubber {
      position: relative;
      flex: 1;
      height: 22px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .scrub-rail {
      position: relative;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: #deddd7;
      overflow: hidden;
    }
    .scrub-prog {
      position: absolute;
      inset: 0 auto 0 0;
      background: #111111;
    }
    .scrub-knob {
      position: absolute;
      top: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #111111;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transform: translate(-50%, -50%);
    }
    .scrub-hint {
      font-size: 10.5px;
      color: #71717a;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud-top">
      <div class="kicker">
        <span class="dot"></span>
        <span id="hudTitle">SEEK(T) · 双弹簧确定性引擎</span>
      </div>
      <div class="telemetry">
        <span>120 BPM · <b id="beatReadout">BAR 1.1</b></span>
        <span id="timeReadout">t = 0.00s</span>
      </div>
    </div>

    <div class="stage">
      <div class="shell" id="shell">
        <!-- Layer 1: Button + Loader -->
        <div class="layer" id="layerBtn">
          <span class="btn-label" id="btnLabel">Generate</span>
          <svg class="spinner" id="btnSpin" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.4"/>
            <path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Layer 2: Dynamic Island -->
        <div class="layer" id="layerIsland">
          <div class="island">
            <div class="album">♪</div>
            <div class="track">
              <strong>Every Frame Is Code</strong>
              <small>120 BPM · Deterministic Mix</small>
            </div>
            <div class="eq" id="eqBars">
              <i></i><i></i><i></i><i></i>
            </div>
          </div>
        </div>

        <!-- Layer 3: Volume Slider -->
        <div class="layer" id="layerVol">
          <div class="vol-wrap" id="volWrap">
            <svg class="vol-icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            <div class="vol-track"><div class="vol-fill" id="volFill"></div></div>
            <span class="vol-val" id="volVal">68%</span>
          </div>
        </div>

        <!-- Layer 4: Dual-Spring Liquid Segmented Tabs -->
        <div class="layer" id="layerTab">
          <div class="seg-wrap" id="segWrap">
            <div class="seg-pill" id="segPill"></div>
            <button type="button" class="seg-btn" data-tab="0">Day</button>
            <button type="button" class="seg-btn" data-tab="1">Week</button>
            <button type="button" class="seg-btn" data-tab="2">Month</button>
          </div>
        </div>

        <!-- Layer 5: 84,320 Data Line Chart -->
        <div class="layer" id="layerChart">
          <div class="chart-wrap">
            <div class="chart-head">
              <small id="chartLabel">Render Frames / Peak</small>
              <strong class="chart-num" id="chartNum">84,320</strong>
            </div>
            <svg class="chart-svg" viewBox="0 0 240 80" preserveAspectRatio="none">
              <defs>
                <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#111111" stop-opacity="0.14"/>
                  <stop offset="100%" stop-color="#111111" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path id="chartArea" d="M0,72 C32,68 48,46 78,52 C106,58 122,22 154,28 C184,34 202,8 240,12 L240,80 L0,80 Z" fill="url(#areaGrad)"/>
              <path id="chartPath" d="M0,72 C32,68 48,46 78,52 C106,58 122,22 154,28 C184,34 202,8 240,12" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
              <circle id="chartDot" cx="240" cy="12" r="4" fill="#111111" stroke="#ffffff" stroke-width="2"/>
            </svg>
          </div>
        </div>

        <!-- Layer 6: Command Palette -->
        <div class="layer" id="layerCmd">
          <div class="cmd-wrap">
            <div class="cmd-search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span id="cmdQuery"></span><span class="cmd-cursor" id="cmdCursor"></span>
            </div>
            <div class="cmd-list" id="cmdList">
              <div class="cmd-row"><span>New project</span><kbd>⌘N</kbd></div>
              <div class="cmd-row"><span>Export video</span><kbd>⌘E</kbd></div>
              <div class="cmd-row"><span>Frame rate · 60fps</span><kbd>4x</kbd></div>
              <div class="cmd-row"><span>Motion blur (tmix)</span><kbd>ON</kbd></div>
              <div class="cmd-row"><span>Every frame is code</span><kbd>↵</kbd></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="stages" id="stagePills"></div>
      <div class="scrub-bar">
        <button type="button" class="play-btn" id="playBtn" aria-label="Play / Pause"></button>
        <div class="scrubber" id="scrubber">
          <div class="scrub-rail"><div class="scrub-prog" id="scrubProg"></div></div>
          <div class="scrub-knob" id="scrubKnob"></div>
        </div>
        <span class="scrub-hint" id="scrubHint">拖动时间轴 · 点击 Tab 可直接交互</span>
      </div>
    </div>
  </div>

  <script>
    const isEn = new URLSearchParams(location.search).get('lang') === 'en';
    const DURATION = 14.0; // 7 bars at 120 BPM (2.0s per bar)
    const $ = id => document.getElementById(id);
    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);

    // Critically-damped-like smooth cubic / exponential curves (NO cheap bouncy overshoot)
    const easeOutQuart = x => 1 - Math.pow(1 - clamp(x, 0, 1), 4);
    const easeInOutCubic = x => {
      const t = clamp(x, 0, 1);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    };

    // Dual-spring approximation for leading vs trailing edge viscosity
    const springFast = x => {
      const t = clamp(x, 0, 1);
      return 1 - Math.exp(-9.5 * t) * Math.cos(t * 2.1);
    };
    const springSlow = x => {
      const t = clamp(x, 0, 1);
      return 1 - Math.exp(-5.4 * t) * (1 + 2.2 * t * (1 - t));
    };

    const STAGES = isEn
      ? [
          { t: 0.0, label: '01 Generate' },
          { t: 1.4, label: '02 Island' },
          { t: 2.8, label: '03 Volume' },
          { t: 4.5, label: '04 Liquid Tab' },
          { t: 8.3, label: '05 84,320 Chart' },
          { t: 10.4, label: '06 ⌘K Panel' },
          { t: 12.6, label: '07 Loop' },
        ]
      : [
          { t: 0.0, label: '01 按钮加载' },
          { t: 1.4, label: '02 灵动岛' },
          { t: 2.8, label: '03 音量滑块' },
          { t: 4.5, label: '04 双弹簧 Tab' },
          { t: 8.3, label: '05 84,320 曲线' },
          { t: 10.4, label: '06 ⌘K 面板' },
          { t: 12.6, label: '07 首尾闭环' },
        ];

    if (isEn) {
      $('hudTitle').textContent = 'SEEK(T) · DUAL-SPRING DETERMINISTIC ENGINE';
      $('chartLabel').textContent = 'Render Frames / Peak';
      $('scrubHint').textContent = 'Scrub timeline · Click Day/Week/Month directly';
    }

    const stagePills = $('stagePills');
    stagePills.innerHTML = STAGES.map((s, i) => `<button type="button" class="stage-btn" data-jump="${s.t}" data-idx="${i}">${s.label}</button>`).join('');

    const shell = $('shell');
    const layers = {
      btn: $('layerBtn'),
      island: $('layerIsland'),
      vol: $('layerVol'),
      tab: $('layerTab'),
      chart: $('layerChart'),
      cmd: $('layerCmd'),
    };
    const eqBars = [...$('eqBars').querySelectorAll('i')];
    const segBtns = [...$('segWrap').querySelectorAll('.seg-btn')];
    const cmdRows = [...$('cmdList').querySelectorAll('.cmd-row')];
    const chartPath = $('chartPath');
    const pathLen = chartPath.getTotalLength();
    chartPath.style.strokeDasharray = pathLen;

    let currentT = 0;
    let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    let manualTabLock = false;
    let manualTabTarget = 2;
    let manualVolOverride = null;

    function mixColor(c1, c2, t) {
      const k = clamp(t, 0, 1);
      const r = Math.round(lerp(c1[0], c2[0], k));
      const g = Math.round(lerp(c1[1], c2[1], k));
      const b = Math.round(lerp(c1[2], c2[2], k));
      return `rgb(${r},${g},${b})`;
    }

    function setLayer(el, op, interactive = false) {
      el.style.opacity = op.toFixed(3);
      el.style.display = op > 0.01 ? 'flex' : 'none';
      el.classList.toggle('is-interactive', interactive && op > 0.5);
    }

    // Pure deterministic seek(t) function: zero timers, zero CSS transitions
    window.seek = function seek(rawT) {
      const t = ((rawT % DURATION) + DURATION) % DURATION;
      currentT = t;

      // Keyframe geometry table (width, height, radius, darkMix[0=white,1=black])
      let w = 136, h = 44, r = 22, dark = 1, sx = 1, sy = 1;

      if (t < 0.7) {
        // Button idle -> slight press -> compress into loader
        const p = easeInOutCubic(invLerp(0.35, 0.7, t));
        w = lerp(136, 46, p);
        h = 44;
        r = 22;
        dark = 1;
      } else if (t < 1.2) {
        // Spinning loader
        w = 46; h = 44; r = 22; dark = 1;
      } else if (t < 2.5) {
        // Expand into Dynamic Island
        const p = easeOutQuart(invLerp(1.2, 1.65, t));
        w = lerp(46, 252, p);
        h = lerp(44, 52, p);
        r = lerp(22, 26, p);
        dark = 1;
      } else if (t < 4.0) {
        // Morph into light Volume Slider
        const p = easeInOutCubic(invLerp(2.5, 2.95, t));
        w = lerp(252, 268, p);
        h = lerp(52, 48, p);
        r = lerp(26, 24, p);
        dark = 1 - p;
        // Tactile end-stop stretch at volume peak
        const stretch = Math.sin(invLerp(3.3, 3.8, t) * Math.PI) * 0.04;
        sx = 1 + stretch;
        sy = 1 - stretch * 0.45;
      } else if (t < 8.0) {
        // Morph into Day / Week / Month Dual-Spring Liquid Tab
        const p = easeInOutCubic(invLerp(4.0, 4.45, t));
        w = lerp(268, 286, p);
        h = lerp(48, 48, p);
        r = 24;
        dark = 0;
      } else if (t < 10.0) {
        // Morph into 84,320 Data Line Chart
        const p = easeOutQuart(invLerp(8.0, 8.5, t));
        w = lerp(286, 296, p);
        h = lerp(48, 168, p);
        r = lerp(24, 20, p);
        dark = 0;
      } else if (t < 12.2) {
        // Morph into ⌘K Command Palette
        const p = easeInOutCubic(invLerp(10.0, 10.45, t));
        w = lerp(296, 290, p);
        h = lerp(168, 204, p);
        r = lerp(20, 16, p);
        dark = 0;
      } else {
        // Collapse cleanly back into Generate black pill button
        const p = easeInOutCubic(invLerp(12.2, 12.85, t));
        w = lerp(290, 136, p);
        h = lerp(204, 44, p);
        r = lerp(16, 22, p);
        dark = p;
      }

      shell.style.width = `${w.toFixed(1)}px`;
      shell.style.height = `${h.toFixed(1)}px`;
      shell.style.borderRadius = `${r.toFixed(1)}px`;
      shell.style.backgroundColor = mixColor([255, 255, 255], [17, 17, 17], dark);
      shell.style.transform = `scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;

      // Layer 1: Generate / Loader
      const btnVis = t < 1.25 ? 1 - invLerp(1.1, 1.25, t) : invLerp(12.6, 12.95, t);
      setLayer(layers.btn, btnVis);
      const labelOp = t < 0.45 ? 1 - invLerp(0.3, 0.45, t) : invLerp(12.7, 13.0, t);
      const spinOp = t >= 0.5 && t <= 1.2 ? Math.min(invLerp(0.5, 0.65, t), 1 - invLerp(1.05, 1.2, t)) : 0;
      $('btnLabel').style.opacity = labelOp.toFixed(3);
      $('btnSpin').style.opacity = spinOp.toFixed(3);
      $('btnSpin').style.transform = `rotate(${((t - 0.5) * 540).toFixed(1)}deg)`;

      // Layer 2: Dynamic Island
      const islandOp = (t >= 1.3 && t <= 2.75) ? Math.min(invLerp(1.3, 1.6, t), 1 - invLerp(2.45, 2.75, t)) : 0;
      setLayer(layers.island, islandOp);
      if (islandOp > 0.01) {
        eqBars.forEach((bar, idx) => {
          const amp = 4 + 12 * (0.5 + 0.5 * Math.sin(t * 11 + idx * 1.4));
          bar.style.height = `${amp.toFixed(1)}px`;
        });
      }

      // Layer 3: Volume Slider
      const volOp = (t >= 2.6 && t <= 4.2) ? Math.min(invLerp(2.6, 2.95, t), 1 - invLerp(3.95, 4.2, t)) : 0;
      setLayer(layers.vol, volOp, true);
      if (volOp > 0.01) {
        const autoVol = manualVolOverride !== null
          ? manualVolOverride
          : lerp(0.34, 0.88, easeInOutCubic(invLerp(2.9, 3.65, t)));
        $('volFill').style.width = `${(autoVol * 100).toFixed(1)}%`;
        $('volVal').textContent = `${Math.round(autoVol * 100)}%`;
      }

      // Layer 4: Dual-Spring Liquid Segmented Tabs (Day / Week / Month)
      const tabOp = (t >= 4.05 && t <= 8.2) ? Math.min(invLerp(4.05, 4.4, t), 1 - invLerp(7.95, 8.2, t)) : 0;
      setLayer(layers.tab, tabOp, true);
      if (tabOp > 0.01) {
        let fromIdx = 0, toIdx = 0, prog = 1;
        if (manualTabLock) {
          fromIdx = toIdx = manualTabTarget;
          prog = 1;
        } else if (t < 5.3) {
          fromIdx = 0; toIdx = 1; prog = invLerp(4.6, 5.2, t);
        } else if (t < 6.6) {
          fromIdx = 1; toIdx = 2; prog = invLerp(5.6, 6.25, t);
        } else {
          fromIdx = 2; toIdx = 0; prog = invLerp(6.95, 7.6, t);
        }

        const slotW = (286 - 8) / 3;
        const fromL = 4 + fromIdx * slotW;
        const toL = 4 + toIdx * slotW;
        const movingRight = toL >= fromL;

        // Leading edge uses fast spring; trailing edge uses slow viscous spring -> jelly stretch!
        const leadP = springFast(prog);
        const trailP = springSlow(prog);
        const leftEdge = lerp(fromL, toL, movingRight ? trailP : leadP);
        const rightEdge = lerp(fromL + slotW, toL + slotW, movingRight ? leadP : trailP);

        const pill = $('segPill');
        pill.style.left = `${leftEdge.toFixed(2)}px`;
        pill.style.width = `${Math.max(slotW * 0.7, rightEdge - leftEdge).toFixed(2)}px`;

        const pillCenter = (leftEdge + rightEdge) / 2;
        segBtns.forEach((btn, idx) => {
          const btnCenter = 4 + (idx + 0.5) * slotW;
          const dist = Math.abs(pillCenter - btnCenter) / slotW;
          const onPill = clamp(1 - dist * 1.4, 0, 1);
          btn.style.color = mixColor([82, 82, 91], [255, 255, 255], onPill);
        });
      }

      // Layer 5: 84,320 Chart
      const chartOp = (t >= 8.15 && t <= 10.2) ? Math.min(invLerp(8.15, 8.5, t), 1 - invLerp(9.95, 10.2, t)) : 0;
      setLayer(layers.chart, chartOp);
      if (chartOp > 0.01) {
        const drawP = easeOutQuart(invLerp(8.35, 9.55, t));
        chartPath.style.strokeDashoffset = (pathLen * (1 - drawP)).toFixed(2);
        const pt = chartPath.getPointAtLength(pathLen * drawP);
        $('chartDot').setAttribute('cx', pt.x.toFixed(1));
        $('chartDot').setAttribute('cy', pt.y.toFixed(1));
        $('chartNum').textContent = Math.round(lerp(12400, 84320, drawP)).toLocaleString('en-US');
      }

      // Layer 6: ⌘K Command Palette
      const cmdOp = (t >= 10.1 && t <= 12.45) ? Math.min(invLerp(10.1, 10.45, t), 1 - invLerp(12.15, 12.45, t)) : 0;
      setLayer(layers.cmd, cmdOp);
      if (cmdOp > 0.01) {
        const typed = t >= 10.65 ? (t >= 11.0 ? 'fr' : 'f') : '';
        $('cmdQuery').textContent = typed;
        $('cmdCursor').style.opacity = Math.floor(t * 2) % 2 === 0 ? '1' : '0.2';
        const activeRow = t < 11.0 ? 0 : t < 11.55 ? 2 : 3;
        cmdRows.forEach((row, idx) => row.classList.toggle('is-active', idx === activeRow));
      }

      // Update HUD + Scrubber + Stage Pills
      const beatTotal = t / 0.5; // 120 BPM = 0.5s/beat
      const bar = Math.floor(beatTotal / 4) + 1;
      const beat = Math.floor(beatTotal % 4) + 1;
      $('beatReadout').textContent = `BAR ${bar}.${beat}`;
      $('timeReadout').textContent = `t = ${t.toFixed(2)}s`;

      const pct = (t / DURATION) * 100;
      $('scrubProg').style.width = `${pct.toFixed(2)}%`;
      $('scrubKnob').style.left = `${pct.toFixed(2)}%`;

      let activeStage = 0;
      STAGES.forEach((s, idx) => { if (t >= s.t) activeStage = idx; });
      stagePills.querySelectorAll('.stage-btn').forEach((b, idx) => b.classList.toggle('active', idx === activeStage));
    };

    function updatePlayBtn() {
      $('playBtn').innerHTML = playing
        ? '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>'
        : '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"/></svg>';
    }

    let lastTs = 0;
    function tick(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      if (playing) {
        window.seek(currentT + dt);
      }
      requestAnimationFrame(tick);
    }

    $('playBtn').onclick = () => {
      playing = !playing;
      manualTabLock = false;
      manualVolOverride = null;
      updatePlayBtn();
    };

    stagePills.addEventListener('click', e => {
      const btn = e.target.closest('[data-jump]');
      if (!btn) return;
      manualTabLock = false;
      manualVolOverride = null;
      window.seek(Number(btn.dataset.jump) + 0.35);
    });

    // Direct interactive tab click inside Liquid Tab stage
    $('segWrap').addEventListener('click', e => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      manualTabLock = true;
      manualTabTarget = Number(btn.dataset.tab);
      playing = false;
      updatePlayBtn();
      window.seek(5.5);
    });

    // Direct interactive volume drag
    let volDrag = false;
    $('volWrap').addEventListener('pointerdown', e => {
      volDrag = true;
      playing = false;
      updatePlayBtn();
      const rect = $('volWrap').getBoundingClientRect();
      manualVolOverride = clamp((e.clientX - rect.left - 34) / (rect.width - 80), 0.05, 1);
      window.seek(3.3);
      $('volWrap').setPointerCapture(e.pointerId);
    });
    $('volWrap').addEventListener('pointermove', e => {
      if (!volDrag) return;
      const rect = $('volWrap').getBoundingClientRect();
      manualVolOverride = clamp((e.clientX - rect.left - 34) / (rect.width - 80), 0.05, 1);
      window.seek(3.3);
    });
    $('volWrap').addEventListener('pointerup', () => { volDrag = false; });

    // Scrubber drag
    let scrubbing = false;
    function scrubTo(clientX) {
      const rect = $('scrubber').getBoundingClientRect();
      const p = clamp((clientX - rect.left) / rect.width, 0, 1);
      manualTabLock = false;
      manualVolOverride = null;
      window.seek(p * DURATION);
    }
    $('scrubber').addEventListener('pointerdown', e => {
      scrubbing = true;
      playing = false;
      updatePlayBtn();
      scrubTo(e.clientX);
      $('scrubber').setPointerCapture(e.pointerId);
    });
    $('scrubber').addEventListener('pointermove', e => { if (scrubbing) scrubTo(e.clientX); });
    $('scrubber').addEventListener('pointerup', () => { scrubbing = false; });

    updatePlayBtn();
    window.seek(playing ? 0 : 5.9);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
