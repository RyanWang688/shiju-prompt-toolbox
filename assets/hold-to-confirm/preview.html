<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长按确认 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.hold-wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px}.hold-control{position:relative;width:140px;height:140px}.hold-control svg{position:absolute;inset:0;width:140px;height:140px;transform:rotate(-90deg);fill:none;stroke-width:6}.ring-bg{stroke:#eee}#progress{stroke:#d9a600;stroke-dasharray:389.56;stroke-dashoffset:389.56;stroke-linecap:round}#hold{position:absolute;inset:18px;border-radius:50%;background:#191919;color:#fff;border:0;font-size:45px;touch-action:none;user-select:none;-webkit-user-select:none}#hold.complete{background:#d9a600;color:#191919}#holdStatus{font-weight:600;margin:0}.hold-wrap small{color:#595959;font-size:12px}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>长按确认</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="hold-wrap"><div class="kicker">HOLD TO CONFIRM</div><div class="hold-control"><svg viewBox="0 0 140 140" aria-hidden="true"><circle class="ring-bg" cx="70" cy="70" r="62"/><circle id="progress" cx="70" cy="70" r="62"/></svg><button id="hold" aria-label="长按 1.5 秒确认删除演示"><span id="holdIcon">×</span></button></div><p id="holdStatus" role="status">按住 1.5 秒确认</p><small>交互演示，不会删除任何数据</small></div></section><aside class="side"><div class="metric"><small>PROGRESS</small><strong id="percent">0%</strong></div><div class="metric"><small>STATE</small><strong id="state">READY</strong></div><p class="note">持续按住直到进度走满；提前松手则回退。支持按住空格或 Enter，完成后可重置。</p><button id="replay">重置演示</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let progress=0,holding=false,done=false,raf=0,last=0;function draw(){ $('progress').style.strokeDashoffset=389.56*(1-progress);$('percent').textContent=Math.round(progress*100)+'%'}function frame(t){const dt=Math.min((t-(last||t))/1000,.05);last=t;progress=Math.max(0,Math.min(1,progress+dt*(holding?1/1.5:-2)));draw();if(progress>=1&&holding){done=true;holding=false;$('hold').classList.add('complete');$('holdIcon').textContent='✓';$('holdStatus').textContent='已删除（演示）';$('state').textContent='CONFIRMED';anim($('hold'),[{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:180});raf=0;last=0;return}if(holding||progress>0)raf=requestAnimationFrame(frame);else{raf=0;last=0;$('state').textContent='READY'}}function start(){if(done||holding)return;holding=true;$('state').textContent='HOLDING';$('holdStatus').textContent='继续按住…';if(!raf)raf=requestAnimationFrame(frame)}function stop(){if(!holding)return;holding=false;$('holdStatus').textContent='已取消，进度回退';$('state').textContent='CANCELLED'}$('hold').onpointerdown=e=>{$('hold').setPointerCapture(e.pointerId);start()};$('hold').onpointerup=$('hold').onpointercancel=stop;$('hold').onlostpointercapture=stop;$('hold').oncontextmenu=e=>e.preventDefault();$('hold').onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();start()}};$('hold').onkeyup=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();stop()}};$('hold').onblur=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});$('replay').onclick=()=>{cancelAnimationFrame(raf);raf=0;last=0;progress=0;done=false;holding=false;$('hold').classList.remove('complete');$('holdIcon').textContent='×';$('holdStatus').textContent='按住 1.5 秒确认';$('state').textContent='READY';draw()};</script></body></html>
