<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 倾斜光影面板 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.screen{perspective:900px;display:grid;place-items:center}#tilt{position:relative;width:450px;height:245px;background:#ffd43b;border:1px solid #191919;border-radius:24px;padding:24px;transform-style:preserve-3d;touch-action:none;overflow:hidden;box-shadow:0 18px 30px #0002}#tilt h2{font-size:42px;line-height:1.1;margin:16px 0}#tilt span{font:11px monospace}.board{position:absolute;right:25px;top:45px;width:65px;height:170px;border-radius:45%;background:#191919;transform:rotate(30deg)}.board i{position:absolute;left:8px;width:49px;height:25px;border:4px solid white;top:35px;border-radius:7px}.board i+i{top:110px}.glare{position:absolute;inset:-40%;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#fff9,transparent 42%);mix-blend-mode:screen}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>3D 倾斜光影面板</h1></div><span class="badge">交互演示</span></header><section class="screen"><div id="tilt" tabindex="0" role="group" aria-label="倾斜光影卡片，方向键调整，Escape 回正"><div class="glare"></div><div class="kicker">MY BOARD / 156</div><h2>Ride the<br>light.</h2><div class="board"><i></i><i></i></div><span>CARVE CUSTOM ↗</span></div></section><aside class="side"><div class="metric"><small>TILT X</small><strong id="mx">0.0°</strong></div><div class="metric"><small>TILT Y</small><strong id="my">0.0°</strong></div><p class="note">移动指针或拖动卡片，观察倾斜和反光；松手回正。也支持方向键与 Escape。</p><button id="replay">体验倾斜 / 回正</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let x=0,y=0,vx=0,vy=0,tx=0,ty=0,raf=0,last=0;function draw(){ $('tilt').style.transform=`rotateX(${x}deg) rotateY(${y}deg)`;$('mx').textContent=x.toFixed(1)+'°';$('my').textContent=y.toFixed(1)+'°' }function frame(t){let dt=Math.min((t-(last||t))/1000,.032);last=t;vx+=((tx-x)*180-vx*21)*dt;vy+=((ty-y)*180-vy*21)*dt;x+=vx*dt;y+=vy*dt;draw();if(Math.abs(tx-x)+Math.abs(ty-y)+Math.abs(vx)+Math.abs(vy)>.015)raf=requestAnimationFrame(frame);else{raf=0;last=0}}function aim(a,b){tx=a;ty=b;if(reduced.matches){x=tx;y=ty;draw();return}if(!raf)raf=requestAnimationFrame(frame)}function move(e){let r=$('tilt').getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;aim((.5-py)*18,(px-.5)*22);$('tilt').style.setProperty('--gx',30+px*40+'%');$('tilt').style.setProperty('--gy',30+py*40+'%')}const el=$('tilt');el.onpointermove=move;el.onpointerleave=()=>aim(0,0);el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);move(e)};el.onpointerup=el.onpointercancel=()=>aim(0,0);el.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Escape'].includes(e.key)){e.preventDefault();aim(e.key==='Escape'?0:tx+(e.key==='ArrowUp'?-3:e.key==='ArrowDown'?3:0),e.key==='Escape'?0:ty+(e.key==='ArrowRight'?3:e.key==='ArrowLeft'?-3:0))}};$('replay').onclick=()=>{aim(-7,9);setTimeout(()=>aim(0,0),900)};</script></body></html>
