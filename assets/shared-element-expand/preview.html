</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / APP MOTION 04</div><h1>共享元素放大</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone"><div class="app" id="app">

const photos=[['scene-aurora','北极光','挪威 · 2026'],['scene-ice','冰洞','冰岛 · 2025'],['scene-dune','沙丘日落','纳米比亚 · 2025'],['scene-ridge','粉色山脊','新西兰 · 2024'],['scene-lake','冰川湖','川西 · 2026'],['scene-aurora','极光第二夜','挪威 · 2026'],['scene-snow','雪线','新西兰 · 2024'],['scene-dune','红沙','纳米比亚 · 2025'],['scene-dusk','湖边黄昏','川西 · 2026']];
$('grid').innerHTML=photos.map(([s,t],i)=>`<button class="th ${s}" type="button" data-i="${i}" aria-label="${t}"></button>`).join('');
let cur=null;const big=$('big');
// FLIP from the thumbnail: translate + uniform scale with the top-left corner as origin (both are 4:5).
function from(th){const t=appRect(th),k=t.width/350;return{transform:`translate(${t.left-20}px,${t.top-110}px) scale(${k})`,k}}
function openAt(th){if(cur)return;cur=th;const p=photos[th.dataset.i],f=from(th);big.className='big '+p[0];big.style.visibility='visible';th.style.visibility='hidden';
 $('capT').textContent=p[1];$('capM').textContent=p[2]+' · 4:5';$('dim').classList.add('on');$('back').classList.add('on');
 A(big,[{transform:f.transform},{transform:'none'}],{duration:460,easing:easeOut});A($('dim'),[{opacity:0},{opacity:1}],{duration:300});
 A($('cap'),[{opacity:0,translate:'0 16px'},{opacity:1,translate:'0 0'}],{duration:360,delay:120,easing:easeOut});
 A($('acts'),[{opacity:0,translate:'0 50px'},{opacity:1,translate:'0 0'}],{duration:520,delay:180,easing:spring});A($('back'),[{opacity:0},{opacity:1}],{duration:200,delay:200});
 $('scale').textContent='×1.00';$('btn').textContent='显示'}
function close(){if(!cur)return;const th=cur,f=from(th);cur=null;$('dim').classList.remove('on');$('back').classList.remove('on');
 A($('acts'),[{opacity:1,translate:'0 0'},{opacity:0,translate:'0 40px'}],{duration:180});A($('cap'),[{opacity:1},{opacity:0}],{duration:150});A($('back'),[{opacity:1},{opacity:0}],{duration:150});
 A(big,[{transform:'none'},{transform:f.transform}],{duration:380,delay:60,easing:'cubic-bezier(.4,0,.2,1)'});A($('dim'),[{opacity:1},{opacity:0}],{duration:320,delay:60});
 setTimeout(()=>{th.style.visibility='';big.style.visibility='hidden'},reduced?0:440);$('scale').textContent='×'+f.k.toFixed(2);$('btn').textContent='—'}
$('grid').onclick=e=>{const th=e.target.closest('.th');if(th)openAt(th)};big.onclick=close;$('back').onclick=close;
$('replay').onclick=()=>cur?close():openAt($('grid').children[0]);
$('scale').textContent='×'+from($('grid').children[0]).k.toFixed(2);setTimeout(()=>openAt($('grid').children[0]),reduced?0:1000);
</script><script src="../demo-i18n.js"></script></body></html>
