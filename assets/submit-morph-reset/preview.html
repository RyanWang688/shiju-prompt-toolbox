<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提交按钮三连变 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.submit-wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:34px}#submit{position:relative;width:300px;height:68px;border-radius:34px;background:#ffd43b;transition:width .3s ease-in-out,background-color .25s;border:0;font-size:21px;font-weight:650;overflow:hidden}.submit-label{white-space:nowrap;transition:opacity .16s}.loader,.check{position:absolute;width:40px;height:40px;left:14px;top:14px;opacity:0;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.loader circle{stroke-dasharray:68 26}.check path{stroke-dasharray:40;stroke-dashoffset:40}#submit.loading,#submit.success{width:68px;background:#191919}#submit.loading .submit-label,#submit.success .submit-label{opacity:0}#submit.loading .loader{opacity:1;animation:spin .8s linear infinite}#submit.success{background:#238451}#submit.success .check{opacity:1}#submit.success .check path{stroke-dashoffset:0;transition:stroke-dashoffset .3s}#submitStatus{font-size:13px;color:#595959;margin:0}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>提交按钮三连变</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="submit-wrap"><div class="kicker">ONE BUTTON / THREE STATES</div><button id="submit"><span class="submit-label">提交内容 →</span><svg class="loader" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15"/></svg><svg class="check" viewBox="0 0 40 40" aria-hidden="true"><path d="m10 20 7 7 14-15"/></svg></button><p id="submitStatus" role="status">准备提交</p></div></section><aside class="side"><div class="metric"><small>STAGE</small><strong id="state">READY</strong></div><div class="metric"><small>TIMING</small><strong id="timing">1.2 s + 1 s</strong></div><p class="note">点击后变圆加载，1.2 秒显示成功，再过 1 秒恢复。仅模拟提交，不发送数据。</p></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let busy=false;$('submit').onclick=()=>{if(busy)return;busy=true;$('submit').className='loading';$('state').textContent='LOADING';$('submitStatus').textContent='正在加载…';$('submit').setAttribute('aria-busy','true');setTimeout(()=>{$('submit').className='success';$('state').textContent='SUCCESS';$('submitStatus').textContent='提交成功';$('submit').setAttribute('aria-busy','false')},1200);setTimeout(()=>{$('submit').className='';$('state').textContent='READY';$('submitStatus').textContent='准备提交';busy=false},2200)};</script></body></html>
