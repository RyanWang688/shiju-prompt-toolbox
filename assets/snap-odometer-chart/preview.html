<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>磁吸游标与滚动码表 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.chart-head{display:flex;align-items:baseline;padding:26px 30px;gap:10px}.chart-head>span:first-child{position:absolute;top:18px;font:11px monospace;color:#595959}#odometer{display:flex;font-size:54px;font-weight:700;line-height:1;margin-top:10px;height:1em;overflow:hidden}.digit{width:.63em;height:1em;display:block}.reel{display:block;transition:transform .4s cubic-bezier(.2,.8,.25,1)}.reel span{display:block;height:1em;line-height:1}.decimal{width:.3em}.unit{font-size:15px}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}#chart{width:calc(100% - 40px);height:190px;margin:0 20px;touch-action:none}#cursor{transition:transform .15s ease}#cursor circle{transition:cy .15s ease}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>磁吸游标与滚动码表</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="chart-head"><span>TOP SPEED</span><div id="odometer" aria-hidden="true"></div><span class="unit">km/h</span><output id="value" class="sr">50.1 km/h</output></div><svg id="chart" viewBox="0 0 520 170" role="img" aria-label="速度折线图，使用右侧滑块选择数据点"><path d="M20 140H500M20 90H500M20 40H500" stroke="#ddd"/><polyline id="line" fill="none" stroke="#191919" stroke-width="3"/><g id="cursor"><path d="M0 15V160" stroke="#191919"/><circle r="8" fill="#d9a600" stroke="#191919"/></g></svg></section><aside class="side"><div class="metric"><small>SNAP POINT</small><strong id="point">P12</strong></div><p class="note">拖动折线图，游标吸附至最近数据点。右侧滑块支持方向键，顶部数字逐位滚动。</p><label for="index">选择数据点</label><input id="index" type="range" min="0" max="11" value="11"></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
const values=[34.2,41.6,38.1,52.7,49.2,61.3,68.1,57.9,43.6,62.4,70.8,50.1];const pts=values.map((v,i)=>[20+i*480/11,150-(v-30)*2.6]);$('line').setAttribute('points',pts.map(p=>p.join(',')).join(' '));$('odometer').innerHTML=[0,1,2,3].map((_,i)=>i===2?'<span class=decimal>.</span>':'<span class=digit><span class=reel>'+Array.from({length:10},(_,n)=>'<span>'+n+'</span>').join('')+'</span></span>').join('');function select(i){i=Math.max(0,Math.min(11,Math.round(i)));const v=values[i],str=v.toFixed(1).replace('.','');$('odometer').querySelectorAll('.reel').forEach((r,n)=>r.style.transform=`translateY(-${Number(str[n])}em)`);$('cursor').style.transform=`translateX(${pts[i][0]}px)`;$('cursor').querySelector('circle').setAttribute('cy',pts[i][1]);$('point').textContent='P'+String(i+1).padStart(2,'0');$('value').textContent=v.toFixed(1)+' km/h';$('index').value=i;$('index').setAttribute('aria-valuetext','数据点 '+(i+1)+'，'+v+' 公里每小时')}function point(e){const r=$('chart').getBoundingClientRect();select(((e.clientX-r.left)/r.width*520-20)/480*11)}$('chart').onpointerdown=e=>{$('chart').setPointerCapture(e.pointerId);point(e)};$('chart').onpointermove=e=>{if(e.buttons)point(e)};$('index').oninput=e=>select(e.target.value);select(11);</script><script src="../demo-i18n.js"></script></body></html>
