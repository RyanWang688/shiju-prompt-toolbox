<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>果冻开关 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.jelly-wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px}.jelly-wrap h2{margin:0;font-size:27px}#jelly{position:relative;width:200px;height:100px;border-radius:60px;border:0;background:#b7b7b7;padding:0;transition:background-color .35s}#jelly.on{background:#238451}#knob{position:absolute;left:10px;top:10px;width:80px;height:80px;border-radius:50%;background:#fff;box-shadow:0 4px 10px #0002;transform:translateX(0)}#jellyStatus{font-size:13px;color:#595959;margin:0}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>果冻开关</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="jelly-wrap"><div class="kicker">MAKE ROOM FOR PLAY</div><h2>Daily reminders</h2><button id="jelly" role="switch" aria-checked="false" aria-label="每日提醒"><span id="knob"></span></button><p id="jellyStatus">提醒已关闭</p></div></section><aside class="side"><div class="metric"><small>SWITCH</small><strong id="state">OFF</strong></div><div class="metric"><small>DURATION</small><strong id="duration">350 ms</strong></div><p class="note">点击开关，圆点移动中拉长，落点轻微回弹。只演示状态变化，不修改设备提醒设置。</p></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let on=false;$('jelly').onclick=()=>{const el=$('knob');const from=getComputedStyle(el).transform;el.getAnimations().forEach(a=>a.cancel());on=!on;const x=on?100:0,dir=on?1:-1;el.style.transform=`translateX(${x}px)`;$('jelly').classList.toggle('on',on);$('jelly').setAttribute('aria-checked',on);anim(el,[{transform:from},{transform:`translateX(${x-dir*35}px) scaleX(1.32) scaleY(.85)`,offset:.45},{transform:`translateX(${x+dir*6}px) scaleX(.92) scaleY(1.07)`,offset:.78},{transform:`translateX(${x}px) scale(1)`}],{duration:350,easing:'ease-in-out'});$('state').textContent=on?'ON':'OFF';$('jellyStatus').textContent=on?'提醒已开启':'提醒已关闭'};</script><script src="../demo-i18n.js"></script></body></html>
