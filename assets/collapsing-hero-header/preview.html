<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吸顶标题 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>
#stage{height:590px;grid-template-columns:600px 220px}.screen{height:430px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3b3b3b,#151515)}
.phone{position:relative;width:228px;height:410px;border:6px solid #2b2b2b;border-radius:34px;background:#121214;color:#f2f2f2;overflow:hidden;box-shadow:0 22px 50px #0009;touch-action:none;cursor:grab}.phone:active{cursor:grabbing}.phone:focus-visible{outline:3px solid #ffd43b;outline-offset:4px}
.hero{position:absolute;left:0;right:0;top:0;height:180px;transform-origin:50% 0;background:linear-gradient(180deg,#8fd3e8 0%,#4fa7c4 40%,#2c7a6d 41%,#1d5a4f 70%,#173d36 100%);will-change:transform}.hero:before{content:'';position:absolute;left:24px;right:70px;bottom:38px;height:46px;border-radius:50% 50% 0 0;background:#2f6b45}.hero:after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dark,0)}
.nav{position:absolute;left:0;right:0;top:0;height:46px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:8px 12px 0;font-size:14px}.nav:before{content:'';position:absolute;inset:0;z-index:-1;background:#16161ab0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14;opacity:var(--glass,0)}
.title{position:absolute;z-index:4;left:16px;top:136px;margin:0;font-size:24px;font-weight:800;transform-origin:0 50%;white-space:nowrap;pointer-events:none;will-change:transform}
.body{position:absolute;left:0;right:0;top:180px;padding:14px 14px 30px;will-change:transform}.body p{margin:0 0 12px;font-size:10px;line-height:1.7;color:#b5b5b5}.tags{display:flex;gap:5px;margin-bottom:10px}.tags span{padding:2px 7px;border-radius:7px;background:#ffd43b;color:#191919;font-size:9px;font-weight:700}
.body h4{margin:14px 0 8px;font-size:12px}.cards{display:flex;gap:8px}.cards i{flex:1;height:72px;border-radius:12px;background:linear-gradient(135deg,#3c8f7e,#1f4f63)}.say{margin-bottom:7px;padding:9px;border-radius:12px;background:#1f1f24;font-size:10px;color:#cfcfcf}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.grid i{height:52px;border-radius:8px;background:linear-gradient(160deg,#6fb7cf,#2a5d74)}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>吸顶标题</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone" id="phone" tabindex="0" aria-label="详情页演示：拖动或滚轮滚动，方向键也可滚动"><div class="hero" id="hero"></div><div class="nav" id="nav"><span aria-hidden="true">‹</span><span aria-hidden="true">⇪</span></div><h3 class="title" id="title">爱妮岛</h3><div class="body" id="body"><div class="tags"><span>跳岛游</span><span>浮潜</span><span>潟湖</span><span>日落</span></div><p>★ 4.9 · 3,862 条评价 · 巴拉望省。石灰岩峭壁直插进翡翠色的海里，坐螃蟹船一天能跳 4 个岛。</p><h4>必玩亮点</h4><div class="cards"><i></i><i></i></div><h4>旅行者说</h4><div class="say">小鱼：船夫带我们去了一个没人的小海湾。</div><div class="say">阿哲：日落时在码头喝椰子，天空是粉紫色的。</div><h4>照片墙</h4><div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></section><aside class="side"><div class="metric"><small>COLLAPSE</small><strong id="progress">0%</strong></div><div class="metric"><small>OFFSET</small><strong id="offset">0 px</strong></div><p class="note">在手机里向上拖或滚动：头图以 0.5 倍速视差并压暗，大标题缩小飞进导航栏，导航栏渐变成毛玻璃。顶部下拉头图放大；停在一半时按速度收起或展开。</p><button id="replay">自动演示一遍</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/590)})`}new ResizeObserver(fit).observe(document.body);fit();
const C=134,HERO=180;let o=0,target=0,v=0,raf=0,last=0,max=0;
function draw(){const p=Math.min(1,Math.max(0,o/C)),pull=Math.max(0,-o);$('hero').style.transform=pull?`scale(${1+pull/HERO})`:`translateY(${-o*.5}px)`;$('hero').style.setProperty('--dark',(p*.55).toFixed(3));$('nav').style.setProperty('--glass',Math.max(0,(p-.45)/.55).toFixed(3));
// Title: from below the photo to the centre of the nav bar, shrinking on the way.
const s=1-p*.42,w=$('title').offsetWidth*s,x=16+(($('phone').clientWidth-w)/2-16)*p,top=136-(136-14)*p;$('title').style.transform=`translate(${x-16}px,${top-136+pull}px) scale(${s})`;$('body').style.transform=`translateY(${-o}px)`;$('progress').textContent=Math.round(p*100)+'%';$('offset').textContent=Math.round(o)+' px'}
function measure(){max=Math.max(C,$('body').offsetHeight+HERO-$('phone').clientHeight)}
function frame(t){const dt=Math.min(.032,((t-(last||t))/1000)||.016);last=t;v+=((target-o)*300-v*28)*dt;o+=v*dt;draw();if(Math.abs(target-o)+Math.abs(v)>.2)raf=requestAnimationFrame(frame);else{o=target;draw();raf=0;last=0}}
function settle(to,speed=0){target=Math.max(0,Math.min(max,to));v=speed;if(reduced.matches){o=target;draw();return}if(!raf){last=0;raf=requestAnimationFrame(frame)}}
// Never rest half-way through the collapse: project with velocity, then pick fully open or fully collapsed.
function decide(speed){if(o<0)return settle(0);if(o<C){const projected=o+speed*.22;return settle(projected>C/2?C:0,speed)}settle(o)}
let drag=false,sy=0,so=0,py=0,pt=0,sp=0;const ph=$('phone');
ph.onpointerdown=e=>{drag=true;cancelAnimationFrame(raf);raf=0;sy=py=e.clientY;pt=e.timeStamp;so=o;sp=0;ph.setPointerCapture(e.pointerId)};
ph.onpointermove=e=>{if(!drag)return;const k=$('stage').getBoundingClientRect().width/900,raw=so-(e.clientY-sy)/k;o=raw<0?raw*.4:Math.min(raw,max+(raw-max)*.3);const dt=e.timeStamp-pt;if(dt>0)sp=-(e.clientY-py)/k/dt*1000;py=e.clientY;pt=e.timeStamp;draw()};
ph.onpointerup=e=>{if(!drag)return;drag=false;if(e.timeStamp-pt>90)sp=0;decide(sp)};ph.onpointercancel=()=>{drag=false;decide(0)};
let wheelTimer,lastDir=0;ph.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(raf);raf=0;lastDir=Math.sign(e.deltaY);o=Math.max(-60,Math.min(max,o+e.deltaY*.6));draw();clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>decide(lastDir*500),140)},{passive:false});
ph.addEventListener('keydown',e=>{const step={ArrowDown:60,ArrowUp:-60,PageDown:200,PageUp:-200,Home:-1e4,End:1e4}[e.key];if(step===undefined)return;e.preventDefault();cancelAnimationFrame(raf);raf=0;const to=Math.max(0,Math.min(max,o+step));(to>0&&to<C)?settle(step>0?C:0):settle(to)});
$('replay').onclick=()=>{settle(0);setTimeout(()=>settle(C,0),500);setTimeout(()=>settle(max),1200);setTimeout(()=>settle(0),2100)};
measure();new ResizeObserver(measure).observe($('body'));draw();
</script><script src="../demo-i18n.js"></script></body></html>
