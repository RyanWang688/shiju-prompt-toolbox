<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粒子 Logo · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>
#stage{height:590px;grid-template-columns:600px 220px}.screen{height:430px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3b3b3b,#151515)}
.site{position:relative;width:560px;height:350px;border:6px solid #2b2b2b;border-radius:14px;background:radial-gradient(circle at 50% 40%,#1b1830,#0d0c14 70%);color:#f2f2f2;overflow:hidden;box-shadow:0 22px 50px #0009}
.nav{display:flex;align-items:center;gap:18px;padding:12px 18px;font-size:10px;color:#bbb}.nav b{display:flex;align-items:center;gap:6px;margin-right:auto;color:#fff;font-size:12px;letter-spacing:2px}.nav b i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,#4dd4ac,#a78bfa)}.nav span:last-child{padding:4px 10px;border:1px solid #444;border-radius:999px}
canvas{display:block;width:560px;height:190px;cursor:crosshair;touch-action:none}
.copy{text-align:center}.copy h3{margin:2px 0 4px;font-size:15px}.copy p{margin:0 0 12px;font-size:9px;color:#9a9a9a}.copy span{display:inline-block;margin:0 4px;padding:6px 16px;border-radius:999px;font-size:10px;font-weight:700}.copy span:first-of-type{background:linear-gradient(90deg,#4dd4ac,#5aa9ff);color:#0d0c14}.copy span:last-of-type{border:1px solid #555}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>粒子 Logo</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="site"><div class="nav"><b><i></i>NOVA</b><span>产品</span><span>方案</span><span>价格</span><span>免费试用</span></div><canvas id="logo" aria-label="由粒子组成的 NOVA 标志，鼠标划过会推开粒子"></canvas><div class="copy"><h3>把灵感，变成会思考的笔记</h3><p>NOVA 智能笔记 · 自动整理 · 联想 · 总结</p><span>开始使用</span><span>观看演示</span></div></div></section><aside class="side"><div class="metric"><small>PARTICLES</small><strong id="count">0</strong></div><div class="metric"><small>PHASE</small><strong id="phase">–</strong></div><p class="note">打开时约 2000 颗粒子从四周飞进来聚成 Logo（约 1.5 秒，先快后慢、出发错开）；聚好后轻轻呼吸。鼠标划过推开 80px 内的粒子，越近越远；离开后被弹簧拉回并轻微回弹。</p><button id="replay">重新聚合</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/590)})`}new ResizeObserver(fit).observe(document.body);fit();
const cv=$('logo'),ctx=cv.getContext('2d'),W=560,H=190,N=2000,R=80;let dpr=0,ps=[],t0=0,raf=0,last=0,mouse=null;
function size(){const d=devicePixelRatio||1;if(d===dpr)return;dpr=d;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
// Brand gradient: teal → blue → violet across the word.
const brand=x=>{const s=[[77,212,172],[90,169,255],[167,139,250]],f=Math.min(.999,Math.max(0,x/W))*2,i=Math.floor(f),k=f-i,a=s[i],b=s[i+1];return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(',')})`};
function homes(){const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.font='900 128px "Segoe UI","Arial Black",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('NOVA',W/2,H/2+6);const d=g.getImageData(0,0,W,H).data,pts=[];for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(d[(y*W+x)*4+3]>128)pts.push([x,y]);for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}return pts.slice(0,N)}
// Start points sit on a ring just outside the whole site frame, so particles fly in from every edge.
function edge(){const s=Math.random()*4|0,u=Math.random();return s===0?[u*W,-120]:s===1?[W+60,u*H]:s===2?[u*W,H+160]:[-60,u*H]}
function start(){size();ps=homes().map(([x,y])=>{const [sx,sy]=edge();return {hx:x,hy:y,sx,sy,x:sx,y:sy,vx:0,vy:0,delay:Math.random()*.35,ph:Math.random()*6.28,c:brand(x)}});$('count').textContent=ps.length;t0=performance.now()/1000;if(reduced.matches){ps.forEach(p=>{p.x=p.hx;p.y=p.hy});draw(0);$('phase').textContent='静止';return}if(!raf){last=0;raf=requestAnimationFrame(tick)}}
const easeOut=t=>1-Math.pow(1-t,3);
function tick(ms){size();const now=ms/1000,dt=Math.min(.033,((ms-(last||ms))/1000)||1/60);last=ms;const el=now-t0;let flying=false;
for(const p of ps){const lt=(el-p.delay)/1.15;if(lt<1){flying=true;const e=easeOut(Math.max(0,lt));p.x=p.sx+(p.hx-p.sx)*e;p.y=p.sy+(p.hy-p.sy)*e;continue}
// After assembly: spring to a gently breathing home; the cursor pushes particles away within R.
const tx=p.hx+Math.sin(now*1.4+p.ph)*.9,ty=p.hy+Math.cos(now*1.2+p.ph)*.9;let fx=(tx-p.x)*90-p.vx*9,fy=(ty-p.y)*90-p.vy*9;if(mouse){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);if(d<R&&d>.01){const push=(1-d/R)*9000;fx+=dx/d*push;fy+=dy/d*push}}p.vx+=fx*dt;p.vy+=fy*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
$('phase').textContent=flying?'聚合中':mouse?'推开':'呼吸';draw(now);raf=requestAnimationFrame(tick)}
function draw(){ctx.clearRect(0,0,W,H);for(const p of ps){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,1.15,0,6.283);ctx.fill()}}
function local(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointermove',e=>{mouse=local(e)});cv.addEventListener('pointerleave',()=>{mouse=null});cv.addEventListener('pointerdown',e=>{mouse=local(e)});cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')mouse=null});
$('replay').onclick=start;start();
</script><script src="../demo-i18n.js"></script></body></html>
