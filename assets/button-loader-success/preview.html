<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提交状态反馈 · 动效演示</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191d23;color:#f7f6f3;font:15px "Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}#stage{position:absolute;left:50%;top:50%;width:760px;height:420px;flex-shrink:0;transform-origin:center;display:grid;grid-template-columns:500px 200px;gap:28px;padding:26px 16px}button{font:inherit;cursor:pointer;color:inherit;border:0}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.screen{position:relative;height:350px;background:#242429;border:1px solid #3d3d43;border-radius:24px;padding:23px;overflow:hidden}.kicker{font:11px monospace;letter-spacing:2px;color:#b8b7bd}h1{font-size:24px;line-height:1.2;margin:7px 0 20px;font-weight:600}.side{padding-top:13px}.side header{font:11px monospace;color:#bbbfc7;letter-spacing:2px;border-bottom:1px solid #41454b;padding-bottom:15px;margin-bottom:24px}.metric{color:var(--accent);margin-bottom:19px}.metric small{display:block;letter-spacing:2px;font:11px monospace}.metric strong{display:block;font-size:29px;line-height:1.4;font-weight:600}.note{font-size:12px;color:#b5b7bd;line-height:1.8}.replay{background:transparent;border:1px solid #70737d;padding:9px 16px;border-radius:20px;font-size:12px;margin-top:10px}.hint{position:absolute;bottom:8px;left:25px;font-size:11px;color:#c0c1c7;letter-spacing:1px}.pill{height:40px;background:#34343b;border-radius:11px;display:flex;align-items:center;padding:0 15px;margin:9px 0;color:#dedee4;font-size:13px}.pill:after{content:'';height:8px;width:29px;background:#55555f;border-radius:5px;margin-left:auto}.row{display:flex;align-items:center;gap:10px;background:#3d3d44;padding:10px 13px;border-radius:10px;margin-top:8px;font-size:14px}.dot{height:6px;width:6px;background:var(--accent);border-radius:50%}.bg{position:absolute;left:23px;right:23px;top:98px}.dim{opacity:.38}svg{overflow:visible}.speed{color:var(--accent)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.booking{background:#34343a;border-radius:16px;padding:15px 18px;margin-bottom:18px}.booking small{display:block;font:10px monospace;letter-spacing:2px;color:#bcbcc3}.booking strong{font-size:39px}.bar{height:6px;width:86px;background:var(--accent);border-radius:3px}#submit{position:absolute;width:470px;height:76px;bottom:17px;left:50%;transform:translateX(-50%);border-radius:15px;background:#37373c;display:grid;place-items:center;transition:width 480ms cubic-bezier(.2,.9,.22,1),border-radius 480ms cubic-bezier(.2,.9,.22,1);color:var(--accent)}#label{color:#f7f7f8;transition:opacity 120ms;font-size:15px}#submit.loading{width:76px;border-radius:38px}#submit.loading #label{opacity:0}#ring{position:absolute;opacity:0}#submit.loading #ring{opacity:1}#ring circle{stroke-dasharray:195;stroke-dashoffset:195}#check{stroke-dasharray:48;stroke-dashoffset:48}#submit.result{width:470px;border-radius:15px}#submit.result #ring{opacity:0}
</style><link rel="stylesheet" href="../card-demo.css"></head><body style="--accent:#f4ca32"><main id="stage"><section class="screen"><div class="kicker">ONSEN</div><h1>Stay dates</h1><div class="booking"><small>NIGHTS</small><strong>02</strong><div class="bar"></div></div><div class="pill dim">Private mountain retreat</div><button id="submit" aria-label="预订两晚"><span id="label">Reserve · Two nights</span><svg id="ring" width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="31" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(-90 38 38)"/><path id="check" d="M24 39 L34 49 L53 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></section><aside class="side"><header>● LIVE PREVIEW</header><div class="metric"><small>STAGE</small><strong id="m1">READY</strong></div><div class="metric"><small>PROGRESS</small><strong id="m2">0 %</strong></div><p class="note">同一容器连续形变。<br>点击提交体验完整状态链。</p><button class="replay" id="replay">重播状态链</button></aside><div class="hint">手工制作的交互演示 · 非模型实测输出</div></main><script>
const stage=document.getElementById('stage');const reduced=matchMedia('(prefers-reduced-motion:reduce)');function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/760,innerHeight/420)})`}new ResizeObserver(fit).observe(document.body);fit();const $=id=>document.getElementById(id);const ease='cubic-bezier(.2,.9,.22,1)';
let running=false;async function animate(){if(running)return;running=true;const b=$('submit');b.disabled=true;b.setAttribute('aria-label','正在提交');b.className='';$('label').textContent='Reserve · Two nights';$('m1').textContent='LOADING';$('m2').textContent='0 %';const circle=document.querySelector('circle');const check=$('check');circle.getAnimations().forEach(a=>a.cancel());check.getAnimations().forEach(a=>a.cancel());b.className='loading';const wait=ms=>new Promise(r=>setTimeout(r,reduced.matches?0:ms));await wait(480);const duration=reduced.matches?1:1600;const progress=circle.animate([{strokeDashoffset:195},{strokeDashoffset:0}],{duration,fill:'forwards',easing:'linear'});let raf;const tick=()=>{const n=Math.min(100,Math.round(Number(progress.currentTime||0)/duration*100));$('m2').textContent=n+' %';if(n<100)raf=requestAnimationFrame(tick)};tick();await progress.finished;cancelAnimationFrame(raf);$('m2').textContent='100 %';$('m1').textContent='SUCCESS';await check.animate([{strokeDashoffset:48},{strokeDashoffset:0}],{duration:reduced.matches?1:360,fill:'forwards',easing:'ease-out'}).finished;await wait(180);$('label').textContent='✓ Reserved · Two nights';b.className='result';$('m1').textContent='RESULT';await wait(480);b.disabled=false;b.setAttribute('aria-label','已预订两晚，点击重播');running=false} $('submit').onclick=animate;$('replay').onclick=animate;if(!reduced.matches)setTimeout(animate,700);
</script><script src="../demo-i18n.js"></script></body></html>
