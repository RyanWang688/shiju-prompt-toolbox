<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花纸风车</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto minmax(200px, 1fr) auto; background: #fcfbf7; color: #283a64; font: 14px/1.5 system-ui, sans-serif }
  header, footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 18px; padding: 13px clamp(14px, 4vw, 48px) }
  header { border-bottom: 1px solid #3755971a }
  footer { border-top: 1px solid #3755971a }
  h1, p { margin: 0 }
  h1 { font: 600 clamp(17px, 3vw, 24px)/1.2 Georgia, "Songti SC", SimSun, serif }
  .index, .hint { color: #586585; font-size: 12px }
  .index { letter-spacing: .14em }
  .stage { position: relative; min-width: 0; min-height: 200px; overflow: hidden; display: grid; place-items: center }
  svg { width: 100%; height: 100%; position: absolute; inset: 0; overflow: hidden }
  .rotor-target { position: absolute; inset: 0; padding: 0; background: transparent; border: 0; cursor: pointer; border-radius: 0 }
  .rotor-target:focus-visible { outline-offset: -5px }
  .controls { display: flex; gap: 8px }
  button { font: inherit; color: inherit }
  .controls button { cursor: pointer; background: #fff; border: 1px solid #c5cde0; border-radius: 99px; min-height: 44px; padding: 0 15px; white-space: nowrap }
  .controls button:hover { background: #eaf0ff; border-color: #758ac4 }
  button:focus-visible { outline: 2px solid #36579e; outline-offset: 3px }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
  @media (max-width: 430px) { footer { justify-content: center } .hint { text-align: center } }
</style>
</head>
<body>
<header><h1 id="title">花纸风车</h1><span class="index" id="indexLabel">纸上动效 · 01</span></header>
<main class="stage" id="stage" data-state="ready">
  <svg viewBox="0 0 720 510" aria-hidden="true">
    <defs>
      <path id="blade" d="M0 0 C18 -48 24 -132 147 -121 L105 -26 Q53 -28 0 0Z"/>
      <clipPath id="blade-clip"><use href="#blade"/></clipPath>
      <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
        <stop stop-color="#fff"/><stop offset=".63" stop-color="#f7f8fd"/><stop offset="1" stop-color="#dce5f7"/>
      </linearGradient>
      <linearGradient id="fold" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
        <stop stop-color="#edf1fb"/><stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <path id="petal" d="M0 0 Q-8 -6 -4 -12 Q2 -15 5 -9 Q6 -4 0 0Z"/>
    </defs>
    <path d="M360 219 Q352 338 326 510" fill="none" stroke="#5272b1" stroke-width="1.5"/>
    <g id="stem-flowers"></g>
    <g transform="translate(360 219)"><g id="rotor"></g></g>
    <g id="air"></g>
    <circle cx="360" cy="219" r="5.5" fill="#4e77bb" stroke="#fcfbf7" stroke-width="1.5"/>
  </svg>
  <button type="button" class="rotor-target" id="target" aria-label="吹动纸风车"></button>
</main>
<footer>
  <p class="hint" id="hint">点一下风车，让纸上的花随风散开。</p>
  <div class="controls">
    <button type="button" id="gust">吹一阵风</button>
    <button type="button" id="reset">重置</button>
  </div>
</footer>
<p id="status" class="sr-only" aria-live="polite"></p>
<script>
  const byId = id => document.getElementById(id);
  const svgNS = 'http://www.w3.org/2000/svg';
  const stage = byId('stage');
  const rotor = byId('rotor');
  const air = byId('air');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const english = new URLSearchParams(location.search).get('lang') === 'en';
  const colors = ['#f5c32f', '#f18d38', '#df597e', '#278cc9', '#29aa94', '#935cba'];
  const hub = { x: 360, y: 219 };
  const paperPrint = [];
  const launchPoints = [];
  const stateText = english
    ? { ready: 'Pinwheel ready.', burst: 'A gust scattered the petals.', clear: 'Petals dispersed.' }
    : { ready: '风车已就绪。', burst: '风车转动，花瓣散开。', clear: '花瓣已飘散。' };
  if (english) {
    document.documentElement.lang = 'en';
    document.title = 'Flower Paper Pinwheel';
    byId('title').textContent = document.title;
    byId('indexLabel').textContent = 'PAPER MOTION · 01';
    byId('hint').textContent = 'Tap the pinwheel and let the paper flowers take flight.';
    byId('gust').textContent = 'Send a gust';
    byId('reset').textContent = 'Reset';
    byId('target').setAttribute('aria-label', 'Blow the pinwheel');
  }
  function element(name, attrs, parent) {
    const node = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.append(node);
    return node;
  }
  function flower(parent, x, y, size, angle, color) {
    const stamp = element('g', { transform: 'translate(' + x + ' ' + y + ') rotate(' + angle + ') scale(' + size + ')', fill: color }, parent);
    for (let petal = 0; petal < 5; petal++) {
      element('use', { href: '#petal', transform: 'rotate(' + petal * 72 + ')' }, stamp);
    }
    element('circle', { r: 1.8, fill: '#fff8e8' }, stamp);
  }
  const motifs = [
    [41, -47, .91, 8], [57, -62, .58, 35], [57, -88, .75, 24],
    [76, -73, 1.06, 65], [84, -108, .72, 12], [94, -87, .46, 33],
    [111, -69, .7, 41], [110, -113, 1.02, 20], [130, -108, .55, 40],
    [71, -98, .36, 0], [101, -101, .38, 13], [37, -66, .52, 6]
  ];
  for (let blade = 0; blade < 4; blade++) {
    const shape = element('g', { transform: 'rotate(' + blade * 90 + ')' }, rotor);
    element('use', { href: '#blade', fill: 'url(#paper)' }, shape);
    const ink = element('g', { 'clip-path': 'url(#blade-clip)' }, shape);
    paperPrint.push(ink);
    motifs.forEach(([x, y, scale, tilt], index) => {
      const color = colors[(index + blade * 2) % colors.length];
      flower(ink, x, y, scale, tilt + blade * 11, color);
      launchPoints.push({ x, y, turn: blade * 90, color });
    });
    element('path', { d: 'M0 0 Q58 -25 105 -26 L147 -121 Q111 -54 0 0Z', fill: 'url(#fold)', 'fill-opacity': '.86' }, shape);
    element('use', { href: '#blade', fill: 'none', stroke: '#7590c5', 'stroke-width': '1.1', 'stroke-linejoin': 'round' }, shape);
    element('path', { d: 'M0 0 Q66 -44 105 -26', fill: 'none', stroke: '#839ad0', 'stroke-opacity': '.65', 'stroke-width': '.85' }, shape);
  }
  flower(byId('stem-flowers'), 352, 314, .72, 14, colors[5]);
  flower(byId('stem-flowers'), 344, 370, 1.05, 36, colors[2]);
  flower(byId('stem-flowers'), 335, 438, .55, 23, colors[1]);

  const rest = 12;
  let angle = rest;
  let frame = 0;
  function state(name) {
    if (stage.dataset.state === name) return;
    stage.dataset.state = name;
    byId('status').textContent = stateText[name];
  }
  function paint(rotation, ink) {
    angle = rotation;
    rotor.setAttribute('transform', 'rotate(' + rotation + ')');
    paperPrint.forEach(group => group.setAttribute('opacity', ink));
  }
  function reset() {
    cancelAnimationFrame(frame);
    air.replaceChildren();
    paint(rest, 1);
    state('ready');
  }
  function gust() {
    cancelAnimationFrame(frame);
    air.replaceChildren();
    state('burst');
    if (motion.matches) {
      paint(rest + 20, .18);
      return;
    }
    const startAngle = angle;
    const particles = Array.from({ length: 144 }, (_, index) => {
      const point = launchPoints[index % launchPoints.length];
      const delay = 90 + Math.random() * 450;
      const flight = 850 + Math.random() * 1050;
      const direction = Math.random() * Math.PI * 2;
      const speed = 48 + Math.random() * 162;
      return {
        node: element('use', { href: '#petal', fill: point.color, opacity: 0 }, air),
        point, delay, flight, speed, direction,
        size: .26 + Math.random() * .95,
        spin: (Math.random() - .5) * 680,
        tilt: Math.random() * 360
      };
    });
    const start = performance.now();
    const spinAngle = elapsed => {
      const progress = Math.min(1, elapsed / 2800);
      return startAngle + 550 * (1 - (1 - progress) ** 3);
    };
    function tick(now) {
      const elapsed = now - start;
      const ink = Math.max(0.03, 1 - Math.max(0, elapsed - 110) / 670);
      paint(spinAngle(elapsed), ink);
      for (const particle of particles) {
        const age = elapsed - particle.delay;
        if (age < 0 || age > particle.flight) {
          particle.node.setAttribute('opacity', 0);
          continue;
        }
        const { point, direction, speed } = particle;
        const radians = (spinAngle(particle.delay) + point.turn) * Math.PI / 180;
        const t = age / 1000;
        const x = hub.x + point.x * Math.cos(radians) - point.y * Math.sin(radians) + (70 + speed * Math.cos(direction)) * t;
        const y = hub.y + point.x * Math.sin(radians) + point.y * Math.cos(radians) + (speed * Math.sin(direction) - 92) * t + 72 * t * t;
        const progress = age / particle.flight;
        const flutter = .25 + .75 * Math.abs(Math.sin(particle.tilt + t * 9));
        particle.node.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + (particle.tilt + t * particle.spin) + ') scale(' + particle.size + ' ' + particle.size * flutter + ')');
        particle.node.setAttribute('opacity', Math.min(1, age / 55, (1 - progress) * 4));
      }
      if (elapsed < 2800) {
        frame = requestAnimationFrame(tick);
      } else {
        air.replaceChildren();
        paint(spinAngle(2800), .03);
        state('clear');
      }
    }
    frame = requestAnimationFrame(tick);
  }
  byId('target').addEventListener('click', gust);
  byId('gust').addEventListener('click', gust);
  byId('reset').addEventListener('click', reset);
  motion.addEventListener('change', reset);
  reset();
</script>
</body>
</html>
