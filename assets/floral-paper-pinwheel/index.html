<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花纸风车</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: auto minmax(200px, 1fr) auto; background: #fffefa; color: #283a64; font: 14px/1.5 system-ui, sans-serif }
  header, footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 18px; padding: 13px clamp(14px, 4vw, 48px) }
  header { border-bottom: 1px solid #3755971a }
  footer { border-top: 1px solid #3755971a }
  h1, p { margin: 0 }
  h1 { font: 600 clamp(17px, 3vw, 24px)/1.2 Georgia, "Songti SC", SimSun, serif }
  .index, .hint { color: #586585; font-size: 12px }
  .index { letter-spacing: .14em }
  .stage { position: relative; min-width: 0; min-height: 200px; overflow: hidden; display: grid; place-items: center }
  canvas { width: 100%; height: 100%; position: absolute; inset: 0; overflow: hidden }
  .rotor-target { position: absolute; inset: 0; padding: 0; background: transparent; border: 0; cursor: pointer; border-radius: 0 }
  .rotor-target:focus-visible { outline-offset: -5px }
  .controls { display: flex; gap: 8px }
  button { font: inherit; color: inherit }
  .controls button { cursor: pointer; background: #fff; border: 1px solid #c5cde0; border-radius: 99px; min-height: 44px; padding: 0 15px; white-space: nowrap }
  .controls button:hover { background: #eaf0ff; border-color: #758ac4 }
  button:focus-visible { outline: 2px solid #36579e; outline-offset: 3px }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
  @media (max-width: 430px) { footer { justify-content: center } .hint { text-align: center } }
</style>
</head>
<body>
<header><h1 id="title">花纸风车</h1><span class="index" id="indexLabel">纸上动效 · 01</span></header>
<main class="stage" id="stage" data-state="ready">
  <canvas id="scene" aria-hidden="true"></canvas>
  <button type="button" class="rotor-target" id="target" aria-label="吹动纸风车"></button>
</main>
<footer>
  <p class="hint" id="hint">点一下风车，让纸上的花随风散开。</p>
  <div class="controls">
    <button type="button" id="gust">吹一阵风</button>
    <button type="button" id="reset">重置</button>
  </div>
</footer>
<p id="status" class="sr-only" aria-live="polite"></p>
<script>
  const byId = id => document.getElementById(id);
  const stage = byId('stage');
  const canvas = byId('scene');
  const context = canvas.getContext('2d', { alpha: false });
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const english = new URLSearchParams(location.search).get('lang') === 'en';
  const colors = ['#ffca39', '#fa912f', '#ec507c', '#288cce', '#2cb59f', '#9c5bc0'];
  const tau = Math.PI * 2;
  const restAngle = -.10;
  const duration = 3.4;
  const timeScale = 3;
  const front = new Path2D('M0 0 C-22 -52 -52 -109 12 -153 C43 -175 83 -180 123 -199 L64 -81 C39 -71 16 -34 0 0 Z');
  const fold = new Path2D('M0 0 C21 -22 29 -71 64 -81 C47 -47 58 -28 82 -22 C45 -29 24 -20 0 0 Z');
  const petal = new Path2D('M0 0 C-7 -3 -13 -12 -8 -17 C-3 -22 6 -18 9 -13 C10 -8 4 -2 0 0Z');
  const flyingPetalShapes = [
    new Path2D('M0 1 C-4 -3 -13 -10 -11 -16 C-10 -22 -3 -23 1 -20 C5 -24 13 -20 12 -14 C12 -8 5 -2 0 1Z'),
    new Path2D('M0 1 C-4 -4 -10 -10 -9 -17 C-8 -23 -3 -27 1 -25 C6 -28 11 -23 10 -17 C9 -9 5 -3 0 1Z'),
    new Path2D('M0 1 C-5 -2 -14 -7 -15 -12 C-17 -19 -8 -22 -4 -18 C0 -22 8 -19 10 -14 C12 -8 5 -2 0 1Z')
  ];
  const stamps = [];

  // Pre-render the petal faces and vein detail once, so flight only transforms sprites.
  const petalFaces = colors.map(color => flyingPetalShapes.map(shape => [false, true].map(back => {
    const sprite = document.createElement('canvas');
    sprite.width = 112;
    sprite.height = 128;
    const ctx = sprite.getContext('2d');
    ctx.setTransform(3, 0, 0, 3, 54, 91);
    const tint = ctx.createLinearGradient(4, -25, -1, 0);
    tint.addColorStop(0, back ? '#fff9ee' : '#fff2e2');
    tint.addColorStop(back ? .82 : .48, color);
    tint.addColorStop(1, '#fff0da');
    ctx.fillStyle = tint;
    ctx.fill(shape);
    ctx.save();
    ctx.clip(shape);
    const light = ctx.createRadialGradient(-5, -16, 1, -5, -16, 14);
    light.addColorStop(0, back ? '#fffaf182' : '#ffffff58');
    light.addColorStop(1, '#ffffff00');
    ctx.fillStyle = light;
    ctx.fillRect(-18, -29, 36, 31);
    ctx.lineCap = 'round';
    ctx.lineWidth = .36;
    ctx.strokeStyle = back ? '#fffaf09c' : '#fff9ee70';
    ctx.beginPath();
    for (const tip of [-7, -2, 4, 8]) {
      ctx.moveTo(0, -.7);
      ctx.quadraticCurveTo(tip * .36, -9, tip, -19 - Math.abs(tip) * .16);
    }
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = color + (back ? '46' : '66');
    ctx.lineWidth = .32;
    ctx.stroke(shape);
    return sprite;
  })));
  let seed = 231;
  let width, height, ratio, scale, centerX, centerY;
  let angle = restAngle;
  let ink = 1;
  let burst = null;
  let frame = 0;

  if (english) {
    document.documentElement.lang = 'en';
    document.title = 'Flower Paper Pinwheel';
    byId('title').textContent = document.title;
    byId('indexLabel').textContent = 'PAPER MOTION · 01';
    byId('hint').textContent = 'Tap the pinwheel to scatter its paper petals.';
    byId('gust').textContent = 'Send a gust';
    byId('reset').textContent = 'Reset';
    byId('target').setAttribute('aria-label', 'Blow the pinwheel');
  }

  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  function flower(ctx, x, y, size, tilt, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(size, size);
    ctx.fillStyle = color;
    for (let index = 0; index < 5; index++) {
      ctx.rotate(tau / 5 + (index - 2) * .035);
      ctx.fill(petal);
    }
    ctx.fillStyle = '#fffae8';
    ctx.beginPath();
    ctx.arc(0, 0, 2.4, 0, tau);
    ctx.fill();
    ctx.restore();
  }

  // Cache the two complete paper wheels. Each animation frame blends these
  // bitmaps, so flowers and paper curves never have to be redrawn per frame.
  const edgeStamps = [
    [-13,-66],[-22,-99],[-13,-125],[1,-143],[22,-156],[42,-170],
    [65,-178],[85,-183],[108,-191],[88,-146],[80,-124],[65,-98],
    [49,-69],[34,-55],[18,-38],[35,-113]
  ];
  const layers = [false, true].map(printed => {
    const sheet = document.createElement('canvas');
    sheet.width = sheet.height = 1060;
    const ctx = sheet.getContext('2d');
    ctx.setTransform(2, 0, 0, 2, 530, 530);
    for (let blade = 0; blade < 4; blade++) {
      const turn = blade * Math.PI / 2;
      ctx.save();
      ctx.rotate(turn);
      const paper = ctx.createLinearGradient(-20, -190, 55, -25);
      paper.addColorStop(0, '#fffffe');
      paper.addColorStop(.68, '#fcfcfd');
      paper.addColorStop(1, '#edf0f9');
      ctx.fillStyle = paper;
      ctx.fill(front);
      if (printed) {
        edgeStamps.forEach(([baseX, baseY], index) => {
          const x = baseX + (random() - .5) * 15;
          const y = baseY + (random() - .5) * 12;
          const color = colors[(index + 2 * blade + Math.floor(random() * 4)) % colors.length];
          const size = .21 + random() ** 1.6 * .85;
          flower(ctx, x, y, size, random() * tau, color);
          stamps.push({ x, y, turn, color });
        });
      }
      ctx.lineJoin = 'round';
      ctx.lineWidth = 1.25;
      ctx.strokeStyle = '#7d96cc';
      ctx.stroke(front);
      const crease = ctx.createLinearGradient(11, -15, 57, -78);
      crease.addColorStop(0, '#dbe3f5');
      crease.addColorStop(.6, '#fafbff');
      crease.addColorStop(1, '#eef1fa');
      ctx.fillStyle = crease;
      ctx.fill(fold);
      ctx.lineWidth = .85;
      ctx.strokeStyle = '#9cadd5';
      ctx.stroke(fold);
      ctx.restore();
    }
    return sheet;
  });

  function draw(particles = [], time = 0) {
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.fillStyle = '#fffefa';
    context.fillRect(0, 0, width, height);
    context.translate(centerX, centerY);
    context.scale(scale, scale);

    context.beginPath();
    context.moveTo(0, 0);
    const stemLength = (height - centerY) / scale;
    context.lineTo(-stemLength * .142, stemLength);
    context.lineWidth = 1.55;
    context.strokeStyle = '#5879ba';
    context.stroke();
    flower(context, -14.5, 102, .63, .24, colors[5]);
    flower(context, -22, 155, .85, .64, colors[2]);
    flower(context, -39, 275, .48, .27, colors[1]);

    context.save();
    context.rotate(angle);
    context.drawImage(layers[0], -265, -265, 530, 530);
    if (ink > 0) {
      context.globalAlpha = ink;
      context.drawImage(layers[1], -265, -265, 530, 530);
    }
    context.restore();

    context.fillStyle = '#4e83cb';
    context.beginPath();
    context.arc(0, 0, 4.7, 0, tau);
    context.fill();

    for (const particle of particles) {
      const age = time - particle.delay;
      if (age < 0 || age > particle.life) continue;
      const travel = (1 - Math.exp(-age * .57)) / .57;
      const breeze = 27 * age * age;
      const sway = (Math.sin(age * particle.flutter + particle.phase) - Math.sin(particle.phase)) * 8 * age;
      const x = particle.x + particle.vx * travel + breeze + sway;
      const y = particle.y + particle.vy * travel + 55 * age * age + sway * .35;
      const tilt = Math.cos(age * particle.flutter + particle.phase);
      const thickness = .12 + .88 * Math.abs(tilt);
      const fade = Math.min(1, age * 22, (particle.life - age) * 2.6);
      context.save();
      context.translate(x, y);
      context.rotate(particle.phase + particle.spin * age + Math.sin(age * 4 + particle.phase) * .24);
      context.scale(particle.size * thickness, particle.size);
      context.globalAlpha = fade * (.64 + .36 * thickness);
      context.drawImage(particle.faces[tilt < 0 ? 1 : 0], -18, -91 / 3, 112 / 3, 128 / 3);
      context.restore();
    }
  }

  function resize() {
    ({ width, height } = stage.getBoundingClientRect());
    ratio = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(width * ratio));
    canvas.height = Math.max(1, Math.round(height * ratio));
    scale = Math.min(width / 820, height / 670);
    centerX = width * .5;
    centerY = height * .435;
    if (!burst) draw();
  }

  function setState(state) {
    if (stage.dataset.state === state) return;
    stage.dataset.state = state;
    byId('status').textContent = {
      ready: english ? 'Pinwheel ready.' : '风车已就绪。',
      burst: english ? 'Petals in the wind.' : '花瓣随风散开。',
      clear: english ? 'Paper blades revealed.' : '白纸叶片已露出。'
    }[state];
  }

  function spin(time, initialSpeed) {
    const slow = Math.exp(-time / .72);
    const fast = Math.exp(-time / .12);
    const coast = Math.exp(-time / .53);
    return {
      delta: initialSpeed * .53 * (1 - coast) + 22 * (.72 * (1 - slow) - .12 * (1 - fast)),
      speed: initialSpeed * coast + 22 * (slow - fast)
    };
  }

  function gust() {
    const now = performance.now();
    const speed = burst ? spin((now - burst.started) / (1000 * timeScale), burst.speed).speed : 0;
    cancelAnimationFrame(frame);
    if (reducedMotion.matches) {
      burst = null;
      angle = restAngle + .24;
      ink = 0;
      draw();
      setState('clear');
      return;
    }
    setState('burst');
    const initialAngle = angle;
    const initialInk = ink > .05 ? ink : 1;
    const particles = Array.from({ length: 210 }, (_, index) => {
      const stamp = stamps[index % stamps.length];
      const delay = .07 + random() ** 1.5 * .57;
      const turn = initialAngle + stamp.turn + spin(delay, speed).delta;
      const cos = Math.cos(turn);
      const sin = Math.sin(turn);
      const x = stamp.x * cos - stamp.y * sin;
      const y = stamp.x * sin + stamp.y * cos;
      const direction = Math.atan2(y, x) + (random() - .5) * 1.3;
      const reach = 44 + random() * 220;
      const faces = petalFaces[colors.indexOf(stamp.color)][Math.floor(random() * flyingPetalShapes.length)];
      return {
        x, y, delay, faces,
        life: 1.2 + random() * (duration - delay - 1.2),
        vx: 28 + Math.cos(direction) * reach - y * .19,
        vy: -44 + Math.sin(direction) * reach + x * .19,
        size: index < 10 ? .77 + random() * .61 : .16 + random() ** 2 * .66,
        phase: random() * tau, spin: (random() - .5) * 5.5, flutter: 5 + random() * 8
      };
    });
    burst = { started: now, speed };
    function animate(timestamp) {
      const time = Math.min(duration, Math.max(0, (timestamp - now) / (1000 * timeScale)));
      const progress = Math.max(0, Math.min(1, (time - .13) / .76));
      angle = initialAngle + spin(time, speed).delta;
      ink = initialInk * (1 - progress * progress * (3 - 2 * progress));
      draw(particles, time);
      if (time < duration) {
        frame = requestAnimationFrame(animate);
      } else {
        burst = null;
        setState('clear');
      }
    }
    frame = requestAnimationFrame(animate);
  }

  function reset() {
    cancelAnimationFrame(frame);
    burst = null;
    angle = restAngle;
    ink = 1;
    draw();
    setState('ready');
  }

  byId('target').addEventListener('click', gust);
  byId('gust').addEventListener('click', gust);
  byId('reset').addEventListener('click', reset);
  reducedMotion.addEventListener('change', reset);
  new ResizeObserver(resize).observe(stage);
  resize();
</script>
</body>
</html>
