<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>堆叠展开 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.art{background:#ffd43b;color:#191919;position:relative;padding:22px;height:160px;transition:height .6s}.art span{font:11px monospace;letter-spacing:3px}.art b{display:block;font-size:30px;line-height:1.2;margin-top:18px}.art i{position:absolute;right:22px;bottom:18px;font-size:48px;font-style:normal}.caption{padding:18px;background:white;color:#191919}.caption h2{font-size:20px}.caption p{margin:8px 0;font-size:13px;line-height:1.7}.scene-button{padding:0;border-radius:20px;overflow:hidden;text-align:left;box-shadow:0 18px 40px #19191918}.scene-button:hover{background:white}.screen{background:#eee}.small{font:12px monospace;color:#595959}.screen>h2{padding:22px;font-size:20px}.screen button:focus-visible{outline-offset:-4px}#stack{position:absolute;inset:28px 28px}.stack-card{position:absolute;left:85px;top:6px;width:290px;height:235px;transform:translateY(calc(var(--i)*20px)) scale(calc(1 - var(--i)*.065));transform-origin:center bottom;z-index:calc(3 - var(--i));transition:transform .65s cubic-bezier(.34,1.4,.5,1),left .65s cubic-bezier(.34,1.4,.5,1),top .65s;transition-delay:calc(var(--i)*70ms)}.stack-card .art{height:145px}.stack-card:nth-child(2) .art{background:#191919;color:#fff}.stack-card:nth-child(3) .art{background:#fff;border-bottom:1px solid #ddd}#stack.open .stack-card{width:170px;left:calc(var(--i)*175px);top:calc(var(--i)*13px);transform:scale(1)}.stack-card .caption{padding:12px}.stack-card .art b{font-size:24px}.stack-card .art i{font-size:24px;right:12px;bottom:12px}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / CARD INTERACTIONS</div><h1>堆叠展开</h1></div><span class="badge">交互演示</span></header><section class="screen"><div id="stack"><button class="stack-card scene-button" style="--i:0" aria-label="展开卡片组 1"><div class="art"><span>FIELD NOTES</span><b>把灵感<br>留在此刻。</b><i>↗</i></div><div class="caption"><h2>01 / 灵感片段</h2><span class="small">点击展开 / 收起</span></div></button><button class="stack-card scene-button" style="--i:1" aria-label="展开卡片组 2"><div class="art"><span>FIELD NOTES</span><b>把灵感<br>留在此刻。</b><i>↗</i></div><div class="caption"><h2>02 / 灵感片段</h2><span class="small">点击展开 / 收起</span></div></button><button class="stack-card scene-button" style="--i:2" aria-label="展开卡片组 3"><div class="art"><span>FIELD NOTES</span><b>把灵感<br>留在此刻。</b><i>↗</i></div><div class="caption"><h2>03 / 灵感片段</h2><span class="small">点击展开 / 收起</span></div></button></div></section><aside class="side"><div class="metric"><small>INTERACTION STATE</small><strong id="state">READY</strong></div><p class="note">点击卡片或右侧按钮，三张卡片依次排开，再次点击弹性归位。</p><button id="replay">展开 / 收起</button></aside><div class="hint">按用户提示词手工制作的网页演示 · 非原作者作品或模型实测输出</div></main><script>
const stage=document.getElementById('stage'),state=document.getElementById('state'),replay=document.getElementById('replay'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const feature=document.getElementById('feature'),closeButton=document.getElementById('close'),stack=document.getElementById('stack'),player=document.getElementById('player'),handle=document.getElementById('handle'),track=document.getElementById('track'),flip=document.getElementById('flip');
function scaleFactor(){return Math.min(innerWidth/900,innerHeight/500)}function fit(){stage.style.transform=`translate(-50%,-50%) scale(${scaleFactor()})`}new ResizeObserver(fit).observe(document.body);fit();
function toggle(){let open=stack.classList.toggle('open');replay.setAttribute('aria-expanded',open);state.textContent=open?'EXPANDED':'STACKED'}document.querySelectorAll('.stack-card').forEach(c=>c.onclick=toggle);replay.onclick=toggle;</script></body></html>
