<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>列表切换网格 · 动效演示</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191d23;color:#f7f6f3;font:15px "Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:760px;height:420px;flex-shrink:0;transform-origin:center;display:grid;grid-template-columns:500px 200px;gap:28px;padding:26px 16px}button{font:inherit;cursor:pointer;color:inherit;border:0}button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.screen{position:relative;height:350px;background:#242429;border:1px solid #3d3d43;border-radius:24px;padding:23px;overflow:hidden}.kicker{font:11px monospace;letter-spacing:2px;color:#b8b7bd}h1{font-size:24px;line-height:1.2;margin:7px 0 20px;font-weight:600}.side{padding-top:13px}.side header{font:11px monospace;color:#bbbfc7;letter-spacing:2px;border-bottom:1px solid #41454b;padding-bottom:15px;margin-bottom:24px}.metric{color:var(--accent);margin-bottom:19px}.metric small{display:block;letter-spacing:2px;font:11px monospace}.metric strong{display:block;font-size:29px;line-height:1.4;font-weight:600}.note{font-size:12px;color:#b5b7bd;line-height:1.8}.replay{background:transparent;border:1px solid #70737d;padding:9px 16px;border-radius:20px;font-size:12px;margin-top:10px}.hint{position:absolute;bottom:8px;left:25px;font-size:11px;color:#c0c1c7;letter-spacing:1px}.pill{height:40px;background:#34343b;border-radius:11px;display:flex;align-items:center;padding:0 15px;margin:9px 0;color:#dedee4;font-size:13px}.pill:after{content:'';height:8px;width:29px;background:#55555f;border-radius:5px;margin-left:auto}.row{display:flex;align-items:center;gap:10px;background:#3d3d44;padding:10px 13px;border-radius:10px;margin-top:8px;font-size:14px}.dot{height:6px;width:6px;background:var(--accent);border-radius:50%}.bg{position:absolute;left:23px;right:23px;top:98px}.dim{opacity:.38}svg{overflow:visible}.speed{color:var(--accent)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.view-toggle{position:absolute;top:25px;right:20px;display:flex;background:#38383e;border-radius:20px;padding:4px}.view-toggle button{background:transparent;font-size:12px;padding:7px 11px;border-radius:16px}.view-toggle button[aria-pressed=true]{background:var(--accent);color:#26222a}#gallery{display:grid;grid-template-columns:1fr;gap:8px;position:relative}.tile{position:relative;height:32px;border-radius:9px;overflow:hidden;display:flex;align-items:center;background:#36363e;transform-origin:0 0}.tile .landscape{width:75px;height:100%;flex-shrink:0;object-fit:cover}.tile span{padding-left:14px;font-size:12px}.landscape{background:linear-gradient(160deg,#94d2dd,#3487a6);position:relative;overflow:hidden}.landscape:after{content:"";position:absolute;inset:5% -5% -5%;background:linear-gradient(135deg,#e8f2ed 0 45%,#618490 46% 70%,#334c57);clip-path:polygon(0 100%,32% 14%,55% 60%,76% 32%,100% 100%)}.scene1{filter:hue-rotate(35deg) saturate(.4)}.scene2{filter:hue-rotate(130deg)}.scene3{filter:hue-rotate(210deg) saturate(.6)}.scene4{filter:hue-rotate(320deg)}.scene5{filter:hue-rotate(40deg) saturate(.6)}#gallery.grid{grid-template-columns:1fr 1fr;gap:10px}#gallery.grid .tile{height:72px;display:block}#gallery.grid .landscape{width:100%;height:100%}#gallery.grid .tile span{position:absolute;bottom:0;left:0;right:0;padding:10px 8px 5px;background:linear-gradient(transparent,#0009);font-size:11px}
</style></head><body style="--accent:#ffb039"><main id="stage"><section class="screen"><div class="kicker">GALLERY</div><h1>Van gallery</h1><div class="view-toggle" aria-label="显示方式"><button id="list" aria-pressed="true">List</button><button id="grid" aria-pressed="false">Grid</button></div><div id="gallery"><div class="tile" data-item="0"><div class="landscape scene0" role="img" aria-label="抽象山景示意 1"></div><span>Coast route</span></div><div class="tile" data-item="1"><div class="landscape scene1" role="img" aria-label="抽象山景示意 2"></div><span>Pine loop</span></div><div class="tile" data-item="2"><div class="landscape scene2" role="img" aria-label="抽象山景示意 3"></div><span>Ridge camp</span></div><div class="tile" data-item="3"><div class="landscape scene3" role="img" aria-label="抽象山景示意 4"></div><span>Trail map</span></div><div class="tile" data-item="4"><div class="landscape scene4" role="img" aria-label="抽象山景示意 5"></div><span>Saved</span></div><div class="tile" data-item="5"><div class="landscape scene5" role="img" aria-label="抽象山景示意 6"></div><span>Routes</span></div></div></section><aside class="side"><header>● LIVE PREVIEW</header><div class="metric"><small>LAYOUT</small><strong id="m1">LIST</strong></div><div class="metric"><small>ITEMS</small><strong id="m2">6 / 6</strong></div><p class="note">点击 List / Grid 切换。<br>同一批节点，沿弧线错峰归位。</p><button class="replay" id="replay">切换布局</button></aside><div class="hint">手工制作的交互演示 · 非模型实测输出</div></main><script>
const stage=document.getElementById('stage');const reduced=matchMedia('(prefers-reduced-motion:reduce)');function fit(){stage.style.transform=`scale(${Math.min(innerWidth/760,innerHeight/420)})`}new ResizeObserver(fit).observe(document.body);fit();const $=id=>document.getElementById(id);const ease='cubic-bezier(.2,.9,.22,1)';
const tiles=[...document.querySelectorAll('.tile')];let grid=false;let busy=false;async function setGrid(next){if(busy||next===grid)return;busy=true;const first=tiles.map(e=>e.getBoundingClientRect());grid=next;$('gallery').classList.toggle('grid',grid);const last=tiles.map(e=>e.getBoundingClientRect());const scale=stage.getBoundingClientRect().width/760;const duration=reduced.matches?1:650;const animations=tiles.map((e,i)=>{const dx=(first[i].left-last[i].left)/scale,dy=(first[i].top-last[i].top)/scale;const sx=first[i].width/last[i].width,sy=first[i].height/last[i].height;const photo=e.querySelector('.landscape');photo.style.transformOrigin='0 0';photo.animate([{transform:`scale(${1/sx},${1/sy})`,offset:0},{transform:`scale(${1/(1+(sx-1)*.48)},${1/(1+(sy-1)*.48)})`,offset:.48},{transform:'scale(1,1)',offset:1}],{duration,delay:reduced.matches?0:i*50,easing:ease});return e.animate([{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,offset:0},{transform:`translate(${dx*.48}px,${dy*.48-24}px) scale(${1+(sx-1)*.48},${1+(sy-1)*.48})`,offset:.48},{transform:'translate(0,0) scale(1,1)',offset:1}],{duration,delay:reduced.matches?0:i*50,easing:ease})});$('grid').setAttribute('aria-pressed',grid);$('list').setAttribute('aria-pressed',!grid);$('m1').textContent=grid?'GRID':'LIST';await Promise.all(animations.map(a=>a.finished));busy=false}$('grid').onclick=()=>setGrid(true);$('list').onclick=()=>setGrid(false);$('replay').onclick=()=>setGrid(!grid);if(!reduced.matches)setTimeout(()=>setGrid(true),700);
</script></body></html>
