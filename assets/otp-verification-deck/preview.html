<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-state="idle">
  <!-- Subtle bead-blasted matte grain -->
  <svg class="grain-overlay" aria-hidden="true">
    <filter id="matteGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <rect width="100%" height="100%" filter="url(#matteGrain)" />
  </svg>

  <main class="viewport">
    <section class="auth-card" aria-label="One-time password verification">
      <header class="auth-card__header">
        <h1 class="kinetic-line kinetic-line--title" id="titleContainer">
          <span class="kinetic-text" id="titleText">Enter your code</span>
        </h1>

        <p class="kinetic-line kinetic-line--subtitle" id="subtitleContainer">
          <span class="kinetic-text" id="subtitleText">
            Sent to <span class="phone-mask">+1 415 •••• 0142</span>
          </span>
        </p>
      </header>

      <div class="deck-stage" id="deckStage">
        <div class="deck-stage__slots" id="slotsRow" role="group" aria-label="4-digit verification code">
          <!-- Desk surface reflection under the center stack -->
          <div class="deck-desk-light" id="deckDeskLight" aria-hidden="true"></div>

          <!-- Slot 0 -->
          <label class="slot" data-index="0">
            <span class="slot__card">
              <span class="slot__card-frame" aria-hidden="true"></span>
              <span class="slot__pip slot__pip--tl" aria-hidden="true">01</span>
              <span class="slot__pip slot__pip--br" aria-hidden="true">01</span>
              <span class="slot__card-sheen" aria-hidden="true"></span>
              <span class="slot__card-rim" aria-hidden="true"></span>
              <span class="slot__digit" aria-hidden="true"></span>
              <span class="slot__caret" aria-hidden="true"></span>
            </span>
            <input
              class="slot__input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="one-time-code"
              aria-label="Digit 1 of 4"
            />
          </label>

          <!-- Slot 1 -->
          <label class="slot" data-index="1">
            <span class="slot__card">
              <span class="slot__card-frame" aria-hidden="true"></span>
              <span class="slot__pip slot__pip--tl" aria-hidden="true">02</span>
              <span class="slot__pip slot__pip--br" aria-hidden="true">02</span>
              <span class="slot__card-sheen" aria-hidden="true"></span>
              <span class="slot__card-rim" aria-hidden="true"></span>
              <span class="slot__digit" aria-hidden="true"></span>
              <span class="slot__caret" aria-hidden="true"></span>
            </span>
            <input
              class="slot__input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="off"
              aria-label="Digit 2 of 4"
            />
          </label>

          <!-- Slot 2 -->
          <label class="slot" data-index="2">
            <span class="slot__card">
              <span class="slot__card-frame" aria-hidden="true"></span>
              <span class="slot__pip slot__pip--tl" aria-hidden="true">03</span>
              <span class="slot__pip slot__pip--br" aria-hidden="true">03</span>
              <span class="slot__card-sheen" aria-hidden="true"></span>
              <span class="slot__card-rim" aria-hidden="true"></span>
              <span class="slot__digit" aria-hidden="true"></span>
              <span class="slot__caret" aria-hidden="true"></span>
            </span>
            <input
              class="slot__input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="off"
              aria-label="Digit 3 of 4"
            />
          </label>

          <!-- Slot 3 -->
          <label class="slot" data-index="3">
            <span class="slot__card">
              <span class="slot__card-frame" aria-hidden="true"></span>
              <span class="slot__pip slot__pip--tl" aria-hidden="true">04</span>
              <span class="slot__pip slot__pip--br" aria-hidden="true">04</span>
              <span class="slot__card-sheen" aria-hidden="true"></span>
              <span class="slot__card-rim" aria-hidden="true"></span>
              <span class="slot__digit" aria-hidden="true"></span>
              <span class="slot__caret" aria-hidden="true"></span>
            </span>
            <input
              class="slot__input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="off"
              aria-label="Digit 4 of 4"
            />
          </label>

          <!-- Centered optical & confirmation overlay locked 1:1 to top stacked card -->
          <div class="deck-overlay" id="deckOverlay" aria-hidden="true">
            <div class="deck-overlay__inner" id="deckOverlayInner">
              <div class="ripple-ring" id="rippleRing"></div>
              <div class="deck-core-glow"></div>

              <svg class="beam-svg" viewBox="0 0 74 100" fill="none">
                <defs>
                  <filter id="beamBlur" x="-45%" y="-45%" width="190%" height="190%">
                    <feGaussianBlur stdDeviation="3.2" />
                  </filter>
                </defs>
                <rect
                  class="beam-stroke beam-stroke--bloom"
                  x="1.5"
                  y="1.5"
                  width="71"
                  height="97"
                  rx="11.5"
                  pathLength="1"
                  filter="url(#beamBlur)"
                />
                <rect
                  class="beam-stroke beam-stroke--core"
                  x="1.5"
                  y="1.5"
                  width="71"
                  height="97"
                  rx="11.5"
                  pathLength="1"
                />
                <rect
                  class="beam-stroke beam-stroke--glint"
                  x="1.5"
                  y="1.5"
                  width="71"
                  height="97"
                  rx="11.5"
                  pathLength="1"
                />
              </svg>

              <svg class="check-svg" viewBox="0 0 36 36" fill="none">
                <path
                  class="check-svg__path"
                  d="M9.5 18.5L15.5 24.5L27 12"
                  stroke-width="2.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  pathLength="1"
                />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <footer class="auth-card__footer" id="footerArea">
        <div class="resend-row" id="resendRow">
          <span>Didn’t get a code?</span>
          <button type="button" class="link-btn" id="resendBtn">Resend</button>
        </div>

        <button type="button" class="action-btn" id="retrySuccessBtn" hidden>
          Verify another code
        </button>
      </footer>

      <div class="sr-only" id="liveRegion" aria-live="polite"></div>
    </section>

    <nav class="studio-strip" aria-label="Interaction controls">
      <button type="button" class="strip-btn strip-btn--primary" id="demoValidBtn" title="Run valid code 1234">
        1234
      </button>
      <span class="strip-sep" aria-hidden="true"></span>
      <button type="button" class="strip-btn" id="demoInvalidBtn" title="Run invalid code 5829">
        5829
      </button>
      <span class="strip-sep" aria-hidden="true"></span>
      <button type="button" class="strip-btn strip-btn--toggle" id="slowMoBtn" aria-pressed="false">
        0.4×
      </button>
      <span class="strip-sep" aria-hidden="true"></span>
      <button type="button" class="strip-btn strip-btn--toggle" id="soundBtn" aria-pressed="true">
        Sound
      </button>
      <span class="strip-sep" aria-hidden="true"></span>
      <button type="button" class="strip-btn" id="resetBtn">
        Reset
      </button>
    </nav>
  </main>

  <script src="../demo-i18n.js" defer></script>
  <script src="sound.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
