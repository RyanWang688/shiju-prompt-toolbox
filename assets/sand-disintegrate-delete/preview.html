<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碎沙删除 · 交互演示</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px);padding:clamp(10px,2.5vh,20px);background:radial-gradient(circle at 50% 30%,#2e2e33,#121214);color:#f2f2f2;font:clamp(14px,4.4vh,19px)/1.35 "Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
/* No fixed-size stage that gets scaled down: the chat window fills the frame, so text renders at real size. */
.window{position:relative;flex:0 1 640px;height:100%;max-height:720px;display:flex;flex-direction:column;border-radius:20px;background:#121214;box-shadow:0 0 0 1px #ffffff14,0 20px 50px #0008;overflow:hidden;user-select:none;-webkit-user-select:none}
.head{flex:none;padding:.55em 1em;border-bottom:1px solid #26262b;font-weight:700}.head small{margin-left:.6em;font-size:.72em;font-weight:400;color:#4dd4ac}
.chat{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:.6em;padding:.8em 1em;overflow:hidden}.msg{max-width:78%}.msg.me{align-self:flex-end}
.bubble{display:block;width:max-content;max-width:100%;padding:.5em .85em;border:0;border-radius:1em;background:#2a2a30;color:#f2f2f2;font:600 1em/1.3 "Segoe UI","Microsoft YaHei",sans-serif;text-align:left;cursor:pointer;touch-action:none}.me .bubble{background:#ffd43b;color:#191919}
.bubble:focus-visible{outline:3px solid #ffd43b;outline-offset:3px}
.bubble.photo{width:8.5em;height:5.4em;padding:0;border-radius:.8em;background:linear-gradient(180deg,#f6b26b 0%,#f4cfa0 38%,#7cc0d6 40%,#3b8ea8 70%,#e9d9b5 71%,#d8c49a 100%)}
.menu{position:absolute;z-index:3;display:none;padding:.25em;border-radius:.7em;background:#f2f2f2;box-shadow:0 6px 20px #0008}.menu button{padding:.35em 1em;border:0;border-radius:.5em;background:transparent;color:#e5484d;font:700 .9em "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}.menu button:hover,.menu button:focus-visible{background:#e2e2e2;outline:none}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.controls{flex:none;display:flex;flex-direction:column;gap:.6em}.controls button{padding:.6em 1.1em;border:1px solid #ffffff40;border-radius:999px;background:#ffffff0f;color:#f2f2f2;font:600 .85em "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}.controls button:first-child{border-color:#ffd43b;background:#ffd43b;color:#191919}.controls button:hover{filter:brightness(1.1)}.controls button:focus-visible{outline:3px solid #ffd43b;outline-offset:3px}
@media(max-width:560px){body{flex-direction:column}.window{flex:1 1 auto;width:100%}.controls{flex-direction:row}}
</style></head><body><div class="window" id="phone"><div class="head">阿杰<small>在线</small></div><div class="chat" id="chat"></div><div class="menu" id="menu" role="menu"><button type="button" role="menuitem" id="del">删除</button></div><canvas id="fx" aria-hidden="true"></canvas></div><div class="controls"><button id="demo" type="button">删除一条</button><button id="replay" type="button">恢复消息</button></div><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const PHOTO=[[0,'#f6b26b'],[.38,'#f4cfa0'],[.4,'#7cc0d6'],[.7,'#3b8ea8'],[.71,'#e9d9b5'],[1,'#d8c49a']];
const DATA=[['', '海边那几张照片发我呗'],['me','等我挑一下'],['me','发错了，是这张'],['me',null],['', '这张绝了！']];
function load(){$('chat').innerHTML=DATA.map(([who,t])=>`<div class="msg ${who}"><button type="button" class="bubble${t?'':' photo'}" aria-label="${t||'图片消息'}，点击、长按或按 Delete 删除">${t||''}</button></div>`).join('')}
const cv=$('fx'),ctx=cv.getContext('2d');let W=0,H=0,dpr=0,grains=[],raf=0,last=0,target=null;
function size(){const w=cv.offsetWidth,h=cv.offsetHeight,d=devicePixelRatio||1;if(w===W&&h===H&&d===dpr)return;W=w;H=h;dpr=d;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0)}
// Layout-space rectangle of an element inside the chat window.
function rectIn(el){let x=0,y=0,n=el;while(n&&n!==$('phone')){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent}return {x,y,w:el.offsetWidth,h:el.offsetHeight}}
// Paint the bubble exactly as styled into an offscreen canvas, so every grain takes the colour from its own spot.
function sample(el,r){const c=document.createElement('canvas'),s=2;c.width=r.w*s;c.height=r.h*s;const g=c.getContext('2d');g.scale(s,s);const cs=getComputedStyle(el);g.beginPath();g.roundRect(0,0,r.w,r.h,parseFloat(cs.borderTopLeftRadius));
if(el.classList.contains('photo')){const lg=g.createLinearGradient(0,0,0,r.h);PHOTO.forEach(([o,col])=>lg.addColorStop(o,col));g.fillStyle=lg}else g.fillStyle=cs.backgroundColor;g.fill();
if(!el.classList.contains('photo')){g.fillStyle=cs.color;g.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;g.textBaseline='middle';g.fillText(el.textContent,parseFloat(cs.paddingLeft),r.h/2+.5)}
const img=g.getImageData(0,0,c.width,c.height).data,step=Math.max(1.2,Math.sqrt(r.w*r.h/1500)),out=[];
for(let y=step/2;y<r.h;y+=step)for(let x=step/2;x<r.w;x+=step){const i=((y*s|0)*c.width+(x*s|0))*4;if(img[i+3]<40)continue;out.push({x:r.x+x,y:r.y+y,color:`rgb(${img[i]},${img[i+1]},${img[i+2]})`,size:step*1.05,t0:(x/r.w)*.8+Math.random()*.05,vx:40+Math.random()*80,vy:-(26+Math.random()*60),life:.9+Math.random()*.25,age:-1})}return out}
function disintegrate(el){const msg=el.closest('.msg');if(!msg||msg.dataset.gone)return;msg.dataset.gone='1';hideMenu();size();
if(reduced.matches){collapse(msg);return}const r=rectIn(el),gs=sample(el,r);grains.push(...gs);const start=performance.now();
// Erase the real bubble from left to right in step with the sweep instead of removing it at once.
const wipe=t=>{const p=Math.min(1,(t-start)/800);el.style.clipPath=`inset(-2px -2px -2px ${p*100}%)`;if(p<1)requestAnimationFrame(wipe);else setTimeout(()=>collapse(msg),650)};requestAnimationFrame(wipe);
for(const g of gs)g.start=start/1000+g.t0;if(!raf){last=0;raf=requestAnimationFrame(tick)}}
function collapse(msg){const h=msg.offsetHeight,gap=parseFloat(getComputedStyle($('chat')).rowGap)||8,dur=reduced.matches?0:300;msg.style.overflow='hidden';const a=msg.animate([{height:h+'px',marginBottom:'0px'},{height:'0px',marginBottom:-gap+'px'}],{duration:dur,easing:'cubic-bezier(.2,.9,.22,1)',fill:'forwards'});a.onfinish=()=>msg.remove();if(!dur)msg.remove()}
function tick(t){const now=t/1000,dt=Math.min(.033,((t-(last||t))/1000)||1/60);last=t;size();ctx.clearRect(0,0,W,H);
for(const g of grains){if(now<g.start){ctx.fillStyle=g.color;ctx.fillRect(g.x-g.size/2,g.y-g.size/2,g.size,g.size);continue}g.age=now-g.start;g.vx+=(Math.random()-.5)*160*dt;g.vy+=(Math.random()-.5)*160*dt-18*dt;g.x+=g.vx*dt;g.y+=g.vy*dt;const k=Math.max(0,1-g.age/g.life);if(!k)continue;ctx.globalAlpha=k;ctx.fillStyle=g.color;const s=g.size*(.35+.65*k);ctx.fillRect(g.x-s/2,g.y-s/2,s,s);ctx.globalAlpha=1}
grains=grains.filter(g=>now<g.start||g.age<g.life);if(grains.length)raf=requestAnimationFrame(tick);else{raf=0;ctx.clearRect(0,0,W,H)}}
// Click, long-press or right-click opens the menu; Delete / Backspace on a focused bubble deletes directly.
let pressTimer;$('chat').addEventListener('pointerdown',e=>{const b=e.target.closest('.bubble');if(!b)return;clearTimeout(pressTimer);pressTimer=setTimeout(()=>showMenu(b),450)});['pointerup','pointerleave','pointercancel'].forEach(n=>$('chat').addEventListener(n,()=>clearTimeout(pressTimer)));
$('chat').addEventListener('contextmenu',e=>{const b=e.target.closest('.bubble');if(b){e.preventDefault();showMenu(b)}});
$('chat').addEventListener('click',e=>{const b=e.target.closest('.bubble');if(b&&!b.closest('.msg').dataset.gone)showMenu(b)});
$('chat').addEventListener('keydown',e=>{const b=e.target.closest('.bubble');if(b&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();disintegrate(b)}});
function showMenu(b){target=b;const r=rectIn(b),m=$('menu');m.style.display='block';m.style.left=Math.max(8,Math.min(r.x,$('phone').clientWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,r.y-m.offsetHeight-6)+'px';$('del').focus({preventScroll:true})}function hideMenu(){$('menu').style.display='none'}
$('del').onclick=()=>{if(target)disintegrate(target)};document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu')&&!e.target.closest('.bubble'))hideMenu()});
$('replay').onclick=()=>{grains=[];hideMenu();load()};
const nextBubble=()=>[...$('chat').querySelectorAll('.msg:not([data-gone]) .bubble')].find(b=>b.classList.contains('photo'))||$('chat').querySelector('.msg:not([data-gone]) .bubble');
$('demo').onclick=()=>{const b=nextBubble();if(b)disintegrate(b);else $('replay').click()};
load();size();new ResizeObserver(size).observe(cv);
// Play once on open so the effect is visible right away.
if(!reduced.matches)setTimeout(()=>{const b=nextBubble();if(b)disintegrate(b)},location.hash==='#cover'?200:900);
</script></body></html>
