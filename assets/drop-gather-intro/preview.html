<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开场落下收拢 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><link rel="stylesheet" href="../app-flow-20261024.css"><style>
.app{background:#0c0c0e;color:#f4f2ee}.sb{color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 20px}.top i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font-style:normal;font-size:15px;color:#ddd}.top i:not(.me){background:#1d1d21}.top .me{width:46px;height:46px;border:2px solid #fff}
.kick{margin-top:8px;text-align:center;font-size:12px;color:#bdbab3}
.title{position:absolute;left:0;right:0;top:132px;text-align:center;font:600 46px/1.08 Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif;letter-spacing:-.5px}
.card{position:absolute;left:0;top:0;width:116px;height:146px;border:4px solid #f4f2ee;border-radius:12px;box-shadow:0 10px 24px #0008}
.panel{position:absolute;left:12px;right:12px;bottom:96px;padding:16px 16px 6px;border-radius:22px;background:#1a1a1e}
.panel header{display:flex;justify-content:space-between;align-items:baseline;height:auto;grid-column:auto}.panel h3{margin:0;font:600 22px Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif}.panel small{color:#9a978f;font-size:11px}
.chips{display:flex;gap:6px;margin:12px 0}.chips span{padding:5px 10px;border-radius:12px;background:#2a2a30;font-size:11px;color:#cfccc5}.chips .on{background:#f4f2ee;color:#111}
.al{display:flex;gap:10px;align-items:center;margin-bottom:8px;padding:8px;border-radius:14px;background:#232328}.al i{width:40px;height:40px;border-radius:9px}.al b{display:block;font:600 14px Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC","Microsoft YaHei",serif}.al small{font-size:10px}
.nav{position:absolute;left:14px;right:14px;bottom:24px;display:flex;justify-content:space-around;align-items:center;height:56px;border-radius:28px;background:#f4f2ee;color:#222;font-size:13px;font-weight:600}.nav i{width:40px;height:40px;border-radius:50%}
</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / APP MOTION 01</div><h1>开场落下收拢</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone"><div class="app" id="app">
<div class="island"></div><div class="sb"><span>9:41</span><i></i></div>
<div class="top"><i>☼</i><i class="me scene-aurora"></i><i>⌕</i></div><div class="kick">相册 1 / 6 · 2026 五个地方</div>
<div class="title" id="title">五段旅程里<br>最好的那些</div>
<div id="pile"></div>
<div class="panel" id="panel"><header><h3>六个相册</h3><small>20 张照片</small></header><div class="chips"><span class="on">全部 6</span><span>2026 · 2</span><span>2025 · 2</span><span>2024 · 2</span></div>
<div class="al"><i class="scene-aurora"></i><div><b>五段旅程精选</b><small>4 张 · 五个地方 · 2026</small></div></div><div class="al"><i class="scene-ice"></i><div><b>北极光</b><small>4 张 · 挪威 · 2026</small></div></div></div>
<nav class="nav" id="nav"><span>相册</span><span>整理</span><span>年份</span><i class="scene-lake"></i></nav>
</div></div></section><aside class="side"><div class="metric"><small>PHASE</small><strong id="phase">下落</strong></div><div class="metric"><small>FAN</small><strong id="fan">0 张</strong></div><p class="note">照片带重力一张接一张落下，随机错开堆成一叠；停顿片刻后最上面四张用弹簧收拢成扇形，其余继续下落出屏，标题和相册面板随后从下方升起。</p><button id="replay" type="button">重播开场</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script src="../app-flow-20261024.js"></script><script>
const scenes=['scene-ridge','scene-dune','scene-lake','scene-snow','scene-dusk','scene-ice','scene-ridge','scene-aurora','scene-ice','scene-dune'];
// Deterministic jitter so every replay stacks the same way.
const jit=k=>((Math.sin(k*12.9898)*43758.5453)%1+1)%1-.5;
async function play(){document.getAnimations().forEach(a=>a.cancel());$('pile').innerHTML=scenes.map(s=>`<div class="card ${s}"></div>`).join('');
 const cards=[...$('pile').children],n=cards.length;$('phase').textContent='下落';$('fan').textContent='0 张';
 [$('title'),$('panel'),$('nav')].forEach(el=>A(el,[{opacity:0,translate:'0 70px'},{opacity:0,translate:'0 70px'}],{duration:1}));
 const pile=cards.map((c,i)=>({x:137+jit(i)*90,y:300+jit(i+7)*50,r:jit(i+3)*30}));
 // 1. Gravity drop, one after another, with a small settle.
 cards.forEach((c,i)=>{const p=pile[i];A(c,[{translate:`${p.x}px -260px`,rotate:`${p.r*.4}deg`},{translate:`${p.x}px ${p.y}px`,rotate:`${p.r}deg`,offset:.78,easing:'ease-out'},{translate:`${p.x}px ${p.y-12}px`,offset:.89,easing:'ease-in'},{translate:`${p.x}px ${p.y}px`,rotate:`${p.r}deg`}],{duration:620,delay:i*90,easing:'cubic-bezier(.55,0,1,.45)'})});
 await wait(n*90+620+450);$('phase').textContent='收拢';
 // 2. The top four spring into a fan; the rest keep falling off screen.
 const fan=cards.slice(-4),rest=cards.slice(0,-4),fx=[-118,-40,40,118],fr=[-13,-4.5,4.5,13];
 fan.forEach((c,k)=>{const p=pile[n-4+k];A(c,[{translate:`${p.x}px ${p.y}px`,rotate:`${p.r}deg`},{translate:`${195+fx[k]-58}px ${282+Math.abs(k-1.5)*14}px`,rotate:`${fr[k]}deg`}],{duration:640,delay:k*40,easing:spring})});
 rest.forEach((c,k)=>{const p=pile[k];A(c,[{translate:`${p.x}px ${p.y}px`,rotate:`${p.r}deg`},{translate:`${p.x+jit(k+2)*80}px 980px`,rotate:`${p.r*2}deg`}],{duration:560,delay:k*35,easing:'cubic-bezier(.55,0,1,.45)'})});
 $('fan').textContent='4 张';await wait(520);$('phase').textContent='升起';
 // 3. Title and panel rise from below.
 [$('title'),$('panel'),$('nav')].forEach((el,k)=>A(el,[{opacity:0,translate:'0 70px'},{opacity:1,translate:'0 0'}],{duration:620,delay:k*90,easing:spring}));
 await wait(800);$('phase').textContent='完成'}
$('replay').onclick=play;play();
</script><script src="../demo-i18n.js"></script></body></html>
