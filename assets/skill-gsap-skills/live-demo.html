<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSAP 实际运行预览</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#132219;color:#e8f5e5;font:16px "Segoe UI","Microsoft YaHei",sans-serif}#stage{position:absolute;left:50%;top:50%;width:800px;height:450px;transform-origin:center;padding:30px 34px;background:#132219}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:27px;margin:0;color:#d5fa8a}small{font:11px monospace;letter-spacing:2px;color:#b6c8b2}.row{border:1px solid #40573c;background:#1a2c1e;border-radius:14px;margin:13px 0;padding:16px 20px;height:105px;display:flex;align-items:center;gap:25px}.label{width:145px;flex-shrink:0;font-size:15px;color:#d4dfce}.label small{display:block;margin-top:5px;font-size:10px;color:#8ea689}.lane{position:relative;width:460px;height:58px;border-bottom:1px solid #53654a}.box{height:42px;width:42px;position:absolute;bottom:0;border-radius:8px;background:#d0f781}.ghost{position:absolute;bottom:0;left:210px;width:42px;height:42px;border-radius:8px;border:1px dashed #9eb38c}.items{display:flex;gap:12px}.item{width:83px;height:56px;background:#9cce85;border-radius:8px;padding:16px;color:#182b1a;font-weight:700;text-align:center}.item:nth-child(2){background:#bade99}.item:nth-child(3){background:#d5edb3}.item:nth-child(4){background:#edfad5}.track{height:5px;background:#354a32;border-radius:4px;margin:17px 0 15px;overflow:hidden}.progress{height:100%;width:100%;background:#d5fa8a;transform:scaleX(0);transform-origin:left}.controls{display:flex;gap:12px;align-items:center}button{font:14px "Microsoft YaHei",sans-serif;cursor:pointer;border-radius:7px;border:1px solid #6c885d;padding:10px 19px;background:transparent;color:#e8f5e5;min-height:42px}button:first-child{background:#d5fa8a;color:#182b1a}button:focus-visible{outline:3px solid white;outline-offset:3px}#status{margin-left:auto;font:14px monospace;color:#d5fa8a}.caption{font-size:11px;color:#afc0a8;margin-top:16px}
</style></head><body><main id="stage"><header><h1>GSAP · 实际动画预览</h1><small>LIVE / 3.15.0</small></header><div class="row"><div class="label">移动与旋转<small>TWEEN / POWER2</small></div><div class="lane"><div class="ghost"></div><div class="box" id="single"></div></div></div><div class="row"><div class="label">时间轴与错峰<small>TIMELINE / STAGGER</small></div><div class="items"><div class="item">01</div><div class="item">02</div><div class="item">03</div><div class="item">04</div></div></div><div class="track"><div class="progress"></div></div><div class="controls"><button id="play">播放 / 重播</button><button id="pause">暂停</button><span id="status" role="status">READY</span></div><div class="caption">依据官方 core / timeline 示例模式制作 · 真实 GSAP 运行画面</div></main><script src="gsap.min.js"></script><script>
const stage=document.getElementById('stage');function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/800,innerHeight/450)})`}new ResizeObserver(fit).observe(document.body);fit();const status=document.getElementById('status');const reduced=matchMedia('(prefers-reduced-motion:reduce)');
// Source: greensock/gsap-skills examples/vanilla/main.js and skills/gsap-core/SKILL.md.
const tl=gsap.timeline({paused:true,defaults:{duration:.6,ease:'power2.out'},onUpdate(){status.textContent=Math.round(this.progress()*100)+' %'},onComplete(){status.textContent='COMPLETE · 100 %'}});
tl.fromTo('#single',{x:0,rotation:0,autoAlpha:.35},{x:210,rotation:90,autoAlpha:1,duration:1.1}).fromTo('.item',{y:18,autoAlpha:.12},{y:0,autoAlpha:1,stagger:.16},.5).fromTo('.progress',{scaleX:0},{scaleX:1,ease:'none',duration:1.58},0);
document.getElementById('play').onclick=()=>{if(reduced.matches){tl.progress(1);status.textContent='COMPLETE · 减少动态效果'}else tl.restart()};document.getElementById('pause').onclick=()=>{tl.pause();status.textContent='PAUSED · '+Math.round(tl.progress()*100)+' %'};
if(reduced.matches)tl.progress(1);else tl.play();
</script><script src="../demo-i18n.js"></script></body></html>
