<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================================================================
   0. 基础工具
   ================================================================ */
const V3 = THREE.Vector3, TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let rng = mulberry32(20261111);
const MOBILE = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 520;
const DENSITY = MOBILE ? 0.6 : 1;          // 花簇密度（移动端降低实例数）

/* ================================================================
   1. 渲染器 / 场景 / 相机 / 后期
   ================================================================ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;   // 仅玻璃 / 金属使用

const camera = new THREE.PerspectiveCamera(28, 1, 1, 400);
const TARGET = new V3(-0.6, 4.2, -0.6);
const AZ = THREE.MathUtils.degToRad(34), EL = THREE.MathUtils.degToRad(10.5);
const VIEW_DIR = new V3(Math.sin(AZ) * Math.cos(EL), Math.sin(EL), Math.cos(AZ) * Math.cos(EL));

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false; controls.rotateSpeed = 0.7; controls.zoomSpeed = 0.8;
controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.52;
controls.autoRotateSpeed = 0.7;

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
// 泛光前清洗：剔除 NaN / Inf 像素，否则模糊会把它扩散成整片黑块
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;
      if (!(c.r >= 0.0 && c.g >= 0.0 && c.b >= 0.0)) c = vec3(0.0);
      gl_FragColor = vec4(min(c, vec3(24.0)), 1.0); }`,
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.4, 0.75, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* 留白背景：柔和渐变 + 一轮淡圆，随时段变色 */
const bgU = {
  uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() }, uDisc: { value: new THREE.Color() },
  uDiscA: { value: 0.5 }, uCenter: { value: new THREE.Vector2(0.5, 0.5) }, uAspect: { value: 1 }, uRadius: { value: 0.4 },
};
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: bgU, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform vec3 uTop, uBot, uDisc; uniform float uDiscA, uAspect, uRadius; uniform vec2 uCenter; varying vec2 vUv;
    void main(){
      vec3 col = mix(uBot, uTop, smoothstep(0.0, 1.0, vUv.y));
      vec2 p = (vUv - uCenter) * vec2(uAspect, 1.0);
      float d = length(p);
      float disc = 1.0 - smoothstep(uRadius - 0.002, uRadius + 0.002, d);
      float halo = exp(-max(d - uRadius, 0.0) * 7.0) * 0.22 * (1.0 - disc);
      float shade = 0.72 + 0.28 * clamp(p.y / uRadius * 0.5 + 0.5, 0.0, 1.0);
      col = mix(col, uDisc, uDiscA * (disc * shade + halo));
      gl_FragColor = vec4(col, 1.0);
    }`,
}));
bg.frustumCulled = false; bg.renderOrder = -1000;
scene.add(bg);

/* ================================================================
   2. 材质：三渲二（少量色阶）+ 玻璃 / 金属 PBR
   ================================================================ */
// 色阶：背光 / 半明 / 过渡 / 受光 —— 不描边，靠明暗分界表现体积
const grad = new THREE.DataTexture(new Uint8Array([8, 8, 8, 20, 112, 190, 255, 255]), 8, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...o });

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const paveTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(120,96,150,.2)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
  g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.strokeStyle = 'rgba(120,96,150,.1)'; g.stroke();
});
paveTex.wrapS = paveTex.wrapT = THREE.RepeatWrapping; paveTex.repeat.set(9, 9);

// 高光钳制：避免极亮的镜面高光在半浮点缓冲里溢出，被泛光扩散成黑块
const clampSpec = (mat) => { mat.onBeforeCompile = (sh) => { sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>',
  `#include <dithering_fragment>
   if (!(gl_FragColor.r >= 0.0 && gl_FragColor.g >= 0.0 && gl_FragColor.b >= 0.0)) gl_FragColor.rgb = vec3(0.03);
   gl_FragColor.rgb = min(gl_FragColor.rgb, vec3(24.0));`); }; return mat; };
const glass = () => clampSpec(new THREE.MeshStandardMaterial({ color: '#93a6c8', metalness: 0.65, roughness: 0.12,
  emissive: '#ffc470', emissiveIntensity: 0 }));
const MAT = {
  wall: toon('#f5ebdb'), trim: toon('#fffaf0'), plinth: toon('#e6d8c5'), slab: toon('#f0e4d2'),
  roof: toon('#9d96b8'), awnA: toon('#bdb6d6', { side: THREE.DoubleSide }), awnB: toon('#a9a1c6', { side: THREE.DoubleSide }),
  door: toon('#8d5a4c'), bench: toon('#9b70d8'), pave: toon('#f3eadc', { map: paveTex }), curb: toon('#e2d7c7'),
  base: toon('#ebe0d0'), road: toon('#3d3954'), line: toon('#f4efe7'), soil: toon('#5d4c58'),
  pot: toon('#dba98e'), green: toon('#8fb47b'), bike: toon('#e9b651'), trunk: toon('#4a3440'),
  iron: clampSpec(new THREE.MeshStandardMaterial({ color: '#2f2c3c', metalness: 0.88, roughness: 0.3 })),
  glassA: glass(), glassB: glass(), glassC: glass(), glassW: glass(),
  glow: toon('#fff4da', { emissive: '#ffc063', emissiveIntensity: 0 }),
};
const GLASS_GAIN = { glassA: 1.0, glassB: 0.55, glassC: 0.07, glassW: 1.35 };

/* 风：同一个世界空间位移函数作用于枝干、花簇和它们的阴影 */
const windU = { uTime: { value: 0 }, uWind: { value: 1 } };
const WIND_GLSL = `
  uniform float uTime; uniform float uWind;
  vec3 windOffset(vec3 p){
    float h = smoothstep(1.4, 7.0, p.y);
    float a = sin(uTime * 0.85 + p.x * 0.42 + p.z * 0.31);
    float b = sin(uTime * 1.55 + p.x * 0.9 - p.z * 0.7 + 1.7);
    float c = sin(uTime * 2.4 + p.z * 1.6 + p.y * 1.1);
    return vec3(a * 0.075 + b * 0.03, c * 0.016, a * 0.04 + c * 0.028) * h * uWind;
  }`;
function withWind(mat, puff = false) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = windU.uTime; sh.uniforms.uWind = windU.uWind;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\n' + WIND_GLSL + (puff ? '\nattribute vec3 aPuff;\n' : ''))
      .replace('#include <project_vertex>', `
        vec4 wpos = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          wpos = instanceMatrix * wpos;
        #endif
        wpos = modelMatrix * wpos;
        wpos.xyz += windOffset(wpos.xyz);
        vec4 mvPosition = viewMatrix * wpos;
        gl_Position = projectionMatrix * mvPosition;`);
    if (puff) sh.vertexShader = sh.vertexShader.replace('#include <defaultnormal_vertex>', `#include <defaultnormal_vertex>
        transformedNormal = normalize(mix(normalize(transformedNormal), normalize(normalMatrix * aPuff), 0.74));`);
  };
  mat.customProgramCacheKey = () => 'wind' + (puff ? 'P' : '');
  return mat;
}
const windDepth = () => withWind(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }));

/* ================================================================
   3. 几何批处理：同材质合并为一个网格，减少 draw call
   ================================================================ */
const parts = {};
function put(key, geo, m) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  if (m) g.applyMatrix4(m);
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  for (const n of Object.keys(g.attributes)) if (n !== 'position' && n !== 'normal' && n !== 'uv') g.deleteAttribute(n);
  (parts[key] ||= []).push(g);
}
const frame = (x, y, z, ry = 0) => new THREE.Matrix4().makeRotationY(ry).setPosition(x, y, z);
function bx(key, w, h, d, x, y, z, m) { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); put(key, g, m); }
function rod(key, a, b, r0, r1 = r0, seg = 8, m) {
  const A = new V3(...a), B = new V3(...b), d = B.clone().sub(A), len = d.length();
  const g = new THREE.CylinderGeometry(r1, r0, len, seg, 1);
  g.applyMatrix4(new THREE.Matrix4().compose(A.add(B).multiplyScalar(0.5),
    new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), d.normalize()), new V3(1, 1, 1)));
  put(key, g, m);
}
// 在 XZ 平面上的轮廓向下挤出：顶面位于 yTop
function extrudeXZ(key, shape, yTop, h) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
  g.rotateX(HALF_PI); g.translate(0, yTop, 0); put(key, g);
}

/* ================================================================
   4. 底座：方形薄台、人行道、两侧街道
   ================================================================ */
const HALF = 7.5, WALK = 5.4;                 // 底座半宽 / 人行道外沿
bx('base', 15, 0.42, 15, 0, -0.31, 0);
bx('pave', WALK + HALF, 0.1, WALK + HALF, (WALK - HALF) / 2, -0.05, (WALK - HALF) / 2);
bx('curb', WALK + HALF, 0.112, 0.16, (WALK - HALF) / 2, -0.045, WALK - 0.08);
bx('curb', 0.16, 0.112, WALK + HALF, WALK - 0.08, -0.045, (WALK - HALF) / 2);
bx('road', 15, 0.08, HALF - WALK, 0, -0.06, (HALF + WALK) / 2);
bx('road', HALF - WALK, 0.08, WALK + HALF, (HALF + WALK) / 2, -0.06, (WALK - HALF) / 2);
for (let x = -6.7; x < 4.8; x += 1.5) bx('line', 0.8, 0.012, 0.09, x, -0.016, (HALF + WALK) / 2);
for (let z = -6.7; z < 4.8; z += 1.5) bx('line', 0.09, 0.012, 0.8, (HALF + WALK) / 2, -0.016, z);

/* ================================================================
   5. 建筑：奶油白三层转角楼（两立面 + 圆弧转角）
   ================================================================ */
const X0 = -4.0, X1 = 2.4, R = 1.5, CX = X1 - R;      // 平面范围 / 转角半径 / 圆心
const F2 = 2.4, F3 = 4.5, TOP = 6.5, PARA = 7.05;      // 楼层标高

// 沿街立面路径（A 面朝 +Z → 圆弧 → B 面朝 +X），off 为向外偏移
function facadePath(off, a0 = X0, b0 = X0, nS = 8, nArc = 16) {
  const pts = [];
  for (let i = 0; i < nS; i++) pts.push({ x: a0 + (CX - a0) * i / nS, z: X1 + off, th: 0 });
  for (let i = 0; i <= nArc; i++) { const th = i / nArc * HALF_PI; pts.push({ x: CX + (R + off) * Math.sin(th), z: CX + (R + off) * Math.cos(th), th }); }
  for (let i = 1; i <= nS; i++) pts.push({ x: X1 + off, z: CX + (b0 - CX) * i / nS, th: HALF_PI });
  return pts;
}
function strip(key, offIn, offOut, a0, b0, yTop, h) {
  const p = [...facadePath(offIn, a0, b0), ...facadePath(offOut, a0, b0).reverse()];
  extrudeXZ(key, new THREE.Shape(p.map(q => new THREE.Vector2(q.x, q.z))), yTop, h);
}
function footprint(off) {
  const p = [new THREE.Vector2(X0 - off, X0 - off), new THREE.Vector2(X1 + off, X0 - off)];
  for (let i = 0; i <= 18; i++) { const th = HALF_PI * (1 - i / 18); p.push(new THREE.Vector2(CX + (R + off) * Math.sin(th), CX + (R + off) * Math.cos(th))); }
  p.push(new THREE.Vector2(X0 - off, X1 + off));
  return p;
}
const fpShape = (off, hole) => { const s = new THREE.Shape(footprint(off)); if (hole !== undefined) s.holes.push(new THREE.Path(footprint(hole))); return s; };
const cornerFrame = (y, d = 0, th = Math.PI / 4) => frame(CX + (R + d) * Math.sin(th), y, CX + (R + d) * Math.cos(th), th);
const frameA = (x, y) => frame(x, y, X1, 0), frameB = (z, y) => frame(X1, y, z, HALF_PI);

extrudeXZ('wall', fpShape(0), TOP, TOP);
extrudeXZ('plinth', fpShape(0.05), 0.5, 0.5);
extrudeXZ('trim', fpShape(0.08), F2 + 0.05, 0.1);
extrudeXZ('trim', fpShape(0.08), F3 + 0.05, 0.1);
extrudeXZ('trim', fpShape(0.09), TOP - 0.02, 0.1);
extrudeXZ('trim', fpShape(0.17), TOP + 0.1, 0.12);
extrudeXZ('wall', fpShape(0, -0.22), PARA, PARA - TOP);
extrudeXZ('trim', fpShape(0.05, -0.27), PARA + 0.06, 0.06);
extrudeXZ('roof', fpShape(-0.22), TOP + 0.06, 0.06);
// 烟囱与屋顶小间
for (const [x, z] of [[-2.9, -2.7], [1.0, -3.0]]) {
  bx('wall', 0.62, 1.15, 0.46, x, TOP + 0.6, z); bx('trim', 0.74, 0.08, 0.58, x, TOP + 1.2, z);

  const N = MOBILE ? 2600 : 5200, g = new THREE.CircleGeometry(1, 5); g.rotateX(-HALF_PI);
  const carpet = new THREE.InstancedMesh(g, toon('#ffffff', { polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }), N);
  let k = 0;
  for (let tries = 0; k < N && tries < N * 4; tries++) {
    const [cx, , cz] = randCenter(), a = rng() * TAU, r = Math.sqrt(rng()) * 1.9;
    const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r, y = groundY(x, z);
    if (y === null) continue;
    const s = 0.035 + rng() * 0.04;
    _o.position.set(x, y + 0.004 + rng() * 0.006, z); _o.rotation.set(0, rng() * TAU, 0); _o.scale.set(s, 1, s * 0.62); _o.updateMatrix();
    carpet.setMatrixAt(k, _o.matrix); carpet.setColorAt(k, PETAL_COLS[Math.floor(rng() * PETAL_COLS.length)]); k++;
  }
  carpet.count = k; carpet.receiveShadow = true; carpet.frustumCulled = false; scene.add(carpet);
}
const FALL_N = MOBILE ? 150 : 260;
const fallGeo = new THREE.PlaneGeometry(1, 0.62);
const falling = new THREE.InstancedMesh(fallGeo, toon('#ffffff', { side: THREE.DoubleSide }), FALL_N);
falling.frustumCulled = false; falling.castShadow = false; scene.add(falling);
const fall = [];
function respawn(f, first) {
  const [x, y, z] = randCenter();
  f.x = x + (rng() - 0.5) * 0.6; f.z = z + (rng() - 0.5) * 0.6; f.y = y - 0.2;
  f.g = groundY(f.x, f.z) ?? -0.6; if (f.g > f.y) f.g = -0.6;
  if (first) f.y = lerp(f.g, f.y, rng());
  f.v = 0.38 + rng() * 0.42; f.ph = rng() * TAU; f.fr = 0.7 + rng() * 1.3; f.sw = 0.18 + rng() * 0.3;
  f.rx = rng() * TAU; f.rz = rng() * TAU; f.sp = 1.2 + rng() * 2.6; f.s = 0.05 + rng() * 0.035; f.rest = 0;
}
for (let i = 0; i < FALL_N; i++) { const f = {}; respawn(f, true); fall.push(f); falling.setColorAt(i, PETAL_COLS[i % PETAL_COLS.length]); }
function updatePetals(dt, t) {
  for (let i = 0; i < FALL_N; i++) {
    const f = fall[i];
    if (f.y > f.g + 0.02) {
      f.y -= f.v * dt; f.x += (Math.sin(t * f.fr + f.ph) * f.sw + 0.12) * dt; f.z += Math.cos(t * f.fr * 0.8 + f.ph) * f.sw * dt;
      f.rx += f.sp * dt; f.rz += f.sp * 0.6 * dt;
      _o.rotation.set(f.rx, f.ph, f.rz);
    } else { f.rest += dt; _o.rotation.set(-HALF_PI, 0, f.ph); if (f.rest > 2.5) respawn(f, false); }
    _o.position.set(f.x, Math.max(f.y, f.g + 0.012), f.z); _o.scale.setScalar(f.s * (f.rest > 1.8 ? clamp((2.5 - f.rest) / 0.7, 0, 1) : 1));
    _o.updateMatrix(); falling.setMatrixAt(i, _o.matrix);
  }
  falling.instanceMatrix.needsUpdate = true;
}

/* ================================================================
   9. 合并静态网格
   ================================================================ */
for (const [key, list] of Object.entries(parts)) {
  const mesh = new THREE.Mesh(mergeGeometries(list, false), MAT[key]);
  mesh.castShadow = key !== 'line' && key !== 'glow'; mesh.receiveShadow = key !== 'glow';
  scene.add(mesh);
}
{ // 底座下方的柔和落影，让微缩台“放”在留白上
  const t = canvasTex(256, 256, (g, w, h) => { const r = g.createRadialGradient(w / 2, h / 2, w * 0.2, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
  var floorShadow = new THREE.Mesh(new THREE.PlaneGeometry(27, 27), new THREE.MeshBasicMaterial({ map: t, color: '#3a2f6a', transparent: true, opacity: 0.25, depthWrite: false }));
  floorShadow.rotation.x = -HALF_PI; floorShadow.position.y = -0.53; scene.add(floorShadow);
}

/* ================================================================
   10. 灯光
   ================================================================ */
const hemi = new THREE.HemisphereLight(); scene.add(hemi);
const sun = new THREE.DirectionalLight();
sun.castShadow = true; sun.shadow.mapSize.set(MOBILE ? 2048 : 4096, MOBILE ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
sun.target.position.set(-0.6, 2.5, -0.6); scene.add(sun, sun.target);
// 背侧轮廓光：只勾亮花冠边缘，增强冷暖层次
const rim = new THREE.DirectionalLight(); rim.position.set(-9, 7, -12); scene.add(rim);

const lampLights = LAMPS.map(([x, z]) => { const l = new THREE.PointLight('#ffbf70', 0, 12, 1.7); l.position.set(x, LAMP_Y + 0.05, z); scene.add(l); return l; });
// 前景路灯追加一盏带阴影的聚光：在地面投出长椅与树干的影子
const pool = new THREE.SpotLight('#ffc27a', 0, 10, 1.12, 0.85, 1.6);
pool.position.set(LAMPS[0][0], LAMP_Y - 0.1, LAMPS[0][1]); pool.target.position.set(LAMPS[0][0] + 0.25, 0, LAMPS[0][1] - 0.4);
pool.castShadow = true; pool.shadow.mapSize.set(1024, 1024); pool.shadow.bias = -0.002; pool.shadow.normalBias = 0.03;
pool.shadow.camera.near = 0.3; pool.shadow.camera.far = 10; scene.add(pool, pool.target);
const doorPos = new V3(0, 1.75, 1.0).applyMatrix4(cornerFrame(0));
const doorLight = new THREE.PointLight('#ffb25c', 0, 7, 1.8); doorLight.position.copy(doorPos); scene.add(doorLight);
const balcLight = new THREE.PointLight('#ffc57a', 0, 5.5, 1.8); balcLight.position.copy(new V3(0, 3.85, 0.5).applyMatrix4(cornerFrame(0))); scene.add(balcLight);

/* ================================================================
   11. 时段预设与过渡
   ================================================================ */
const PRESETS = {
  day: { bgTop: '#f1eff9', bgBot: '#deDAf0', disc: '#f8f6fd', discA: 0.6,
    sunCol: '#fff0da', sunInt: 2.05, sunPos: [9.5, 12.5, 4.6], hemiSky: '#e4e6ff', hemiGnd: '#c1aed6', hemiInt: 1.5,
    rimCol: '#ffffff', rimInt: 0.0, lamp: 0, win: 0, env: 1.0, exposure: 1.0, bloom: 0.04, floor: 0.2 },
  dusk: { bgTop: '#cdbfe8', bgBot: '#f6d3c0', disc: '#ffe6cb', discA: 0.6,
    sunCol: '#ffb074', sunInt: 2.0, sunPos: [12, 4.4, 4.2], hemiSky: '#aaa4f2', hemiGnd: '#86689a', hemiInt: 1.2,
    rimCol: '#ff9d7a', rimInt: 0.4, lamp: 0.45, win: 0.7, env: 0.6, exposure: 1.0, bloom: 0.2, floor: 0.26 },
  night: { bgTop: '#1b1944', bgBot: '#2b2862', disc: '#39377a', discA: 0.62,
    sunCol: '#a9b6ff', sunInt: 1.5, sunPos: [-7, 12, 6.5], hemiSky: '#5a60cc', hemiGnd: '#2a2056', hemiInt: 1.25,
    rimCol: '#7f8dff', rimInt: 0.7, lamp: 1, win: 1, env: 0.22, exposure: 1.0, bloom: 0.3, floor: 0.42 },
};
for (const p of Object.values(PRESETS)) for (const k in p) {
  if (typeof p[k] === 'string') p[k] = new THREE.Color(p[k]); else if (Array.isArray(p[k])) p[k] = new V3(...p[k]);
}
const snap = (s) => { const o = {}; for (const k in s) o[k] = s[k].clone ? s[k].clone() : s[k]; return o; };
const cur = snap(PRESETS.day); let from = null, to = null, mix = 1;
function applyState() {
  bgU.uTop.value.copy(cur.bgTop); bgU.uBot.value.copy(cur.bgBot); bgU.uDisc.value.copy(cur.disc); bgU.uDiscA.value = cur.discA;
  sun.color.copy(cur.sunCol); sun.intensity = cur.sunInt;
  sun.position.copy(cur.sunPos).normalize().multiplyScalar(40).add(sun.target.position);
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGnd); hemi.intensity = cur.hemiInt;
  rim.color.copy(cur.rimCol); rim.intensity = cur.rimInt;
  lampLights.forEach((l, i) => l.intensity = cur.lamp * (i === 0 ? 11 : 14));
  pool.intensity = cur.lamp * 9; doorLight.intensity = cur.win * 3.2; balcLight.intensity = cur.win * 1.8;
  for (const k in GLASS_GAIN) MAT[k].emissiveIntensity = cur.win * GLASS_GAIN[k] * 1.5;
  MAT.glow.emissiveIntensity = cur.lamp * 3.2;
  scene.environmentIntensity = cur.env; renderer.toneMappingExposure = cur.exposure;
  bloom.strength = cur.bloom; floorShadow.material.opacity = cur.floor;
}
function setTime(name) {
  from = snap(cur); to = PRESETS[name]; mix = 0; document.body.dataset.time = name;
  document.querySelectorAll('#times button').forEach(b => b.classList.toggle('on', b.dataset.time === name));
}
function stepTime(dt) {
  if (mix >= 1) return;
  mix = Math.min(1, mix + dt / 1.9); const k = mix * mix * (3 - 2 * mix);
  for (const key in to) {
    const a = from[key], b = to[key];
    if (a.isColor) cur[key].copy(a).lerp(b, k); else if (a.isVector3) cur[key].lerpVectors(a, b, k); else cur[key] = lerp(a, b, k);
  }

}
applyState();

/* ================================================================
   12. 视角、尺寸与交互
   ================================================================ */
let wide = true;
function fitDistance() { const a = innerWidth / innerHeight, eff = wide ? a * 0.8 : a; return 29.5 * Math.max(1, 1.5 / eff); }
function resize() {
  const w = innerWidth, h = innerHeight, pr = Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 1.75);
  wide = w > 900 && w / h > 1.25;
  renderer.setPixelRatio(pr); renderer.setSize(w, h, false); composer.setPixelRatio(pr); composer.setSize(w, h);
  camera.aspect = w / h;
  const shift = wide ? Math.round(w * 0.115) : 0, lift = wide ? 0 : Math.round(h * 0.03);
  if (shift || lift) camera.setViewOffset(w, h, -shift, -lift, w, h); else camera.clearViewOffset();

  const d = fitDistance(); controls.minDistance = 7; controls.maxDistance = d * 1.7;
}
const VIEWS = {
  overview: () => ({ p: TARGET.clone().addScaledVector(VIEW_DIR, fitDistance()), t: TARGET.clone() }),
  bench: () => ({ p: new V3(1.6, 2.5, 13.2), t: new V3(-2.6, 2.0, 3.2) }),
};
let tween = null;

function setView(name) {

  if (name === 'orbit') { controls.autoRotate = !controls.autoRotate; if (controls.autoRotate) flyTo(VIEWS.overview()); }
  else { controls.autoRotate = false; flyTo(VIEWS[name]()); }
  btns.forEach(b => b.classList.toggle('on', controls.autoRotate ? b.dataset.view === 'orbit' : b.dataset.view === name || (name === 'orbit' && b.dataset.view === 'overview')));

controls.addEventListener('start', () => { tween = null; });

document.getElementById('times').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTime(b.dataset.time); });
addEventListener('resize', resize);
resize();
{ const v = VIEWS.overview(); camera.position.copy(v.p); controls.target.copy(v.t); controls.update(); }

/* ================================================================
   13. 主循环
   ================================================================ */
const clock = new THREE.Clock(); let time = 0, first = true;
function tick() {

}
