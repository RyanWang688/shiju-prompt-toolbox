<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拖拽展开 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.art{background:#ffd43b;color:#191919;position:relative;padding:22px;height:160px;transition:height .6s}.art span{font:11px monospace;letter-spacing:3px}.art b{display:block;font-size:30px;line-height:1.2;margin-top:18px}.art i{position:absolute;right:22px;bottom:18px;font-size:48px;font-style:normal}.caption{padding:18px;background:white;color:#191919}.caption h2{font-size:20px}.caption p{margin:8px 0;font-size:13px;line-height:1.7}.scene-button{padding:0;border-radius:20px;overflow:hidden;text-align:left;box-shadow:0 18px 40px #19191918}.scene-button:hover{background:white}.screen{background:#eee}.small{font:12px monospace;color:#595959}.screen>h2{padding:22px;font-size:20px}.screen button:focus-visible{outline-offset:-4px}#player{--p:0;position:absolute;left:145px;bottom:16px;width:290px;height:calc(198px + var(--p)*105px);background:#fff;border:1px solid #191919;border-radius:22px;overflow:hidden;transition:height .45s cubic-bezier(.2,.9,.3,1)}#player .art{height:calc(140px - var(--p)*62px);padding:14px;transition:height .45s}#player .art b{font-size:22px;margin-top:9px}#player .art span{display:none}#player.dragging,#player.dragging .art{transition:none}#handle{width:100%;height:48px;touch-action:none;border:0;border-radius:0;position:relative;z-index:2;cursor:ns-resize}#handle:before{content:'';display:inline-block;background:#191919;width:42px;height:4px;border-radius:8px;margin:0 14px 3px 0}.playlist{padding:4px 18px}.playlist p{font-size:14px;border-bottom:1px solid #ddd;margin:0;padding:13px 0}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / CARD INTERACTIONS</div><h1>拖拽展开</h1></div><span class="badge">交互演示</span></header><section class="screen"><div id="player"><div class="art"><span>FIELD NOTES</span><b>把灵感<br>留在此刻。</b><i>↗</i></div><button id="handle" aria-label="拖拽或点击展开播放列表" aria-expanded="false">向上拖拽</button><div class="playlist"><p>01　Morning light　3:28</p><p>02　City walk　　　 4:16</p><p>03　After hours　　2:54</p></div></div></section><aside class="side"><div class="metric"><small>INTERACTION STATE</small><strong id="state">READY</strong></div><p class="note">抓住把手上下拖动，超过一半后吸附。也可点击把手，或使用上下方向键。</p><button id="replay">展开 / 收起</button></aside><div class="hint">按用户提示词手工制作的网页演示 · 非原作者作品或模型实测输出</div></main><script>
const stage=document.getElementById('stage'),state=document.getElementById('state'),replay=document.getElementById('replay'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const feature=document.getElementById('feature'),closeButton=document.getElementById('close'),stack=document.getElementById('stack'),player=document.getElementById('player'),handle=document.getElementById('handle'),track=document.getElementById('track'),flip=document.getElementById('flip');
function scaleFactor(){return Math.min(innerWidth/900,innerHeight/500)}function fit(){stage.style.transform=`translate(-50%,-50%) scale(${scaleFactor()})`}new ResizeObserver(fit).observe(document.body);fit();
let progress=0,startY=0,startProgress=0,moved=false;function set(p){progress=Math.max(0,Math.min(1,p));player.style.setProperty('--p',progress);state.textContent=Math.round(progress*100)+'%'}function snap(p){set(p);handle.setAttribute('aria-expanded',p===1);handle.textContent=p?'向下拖拽':'向上拖拽'}handle.onpointerdown=e=>{startY=e.clientY;startProgress=progress;moved=false;handle.setPointerCapture(e.pointerId);player.classList.add('dragging')};handle.onpointermove=e=>{if(!handle.hasPointerCapture(e.pointerId))return;let dy=(startY-e.clientY)/scaleFactor();if(Math.abs(dy)>4)moved=true;set(startProgress+dy/105)};function release(e){if(!handle.hasPointerCapture(e.pointerId))return;handle.releasePointerCapture(e.pointerId);player.classList.remove('dragging');snap(progress>=.5?1:0)}handle.onpointerup=release;handle.onpointercancel=e=>{player.classList.remove('dragging');snap(startProgress);if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId)};handle.onclick=()=>{if(!moved)snap(progress>=.5?0:1);moved=false};handle.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();snap(e.key==='ArrowUp'?1:0)}};replay.onclick=()=>snap(progress>=.5?0:1);</script></body></html>
