</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / ONBOARDING STUDY 02</div><h1>欢迎页滑动引导</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="phone"><div class="app" id="app">

</div></div></section><aside class="side"><div class="metric"><small>PAGE</small><strong id="page">1 / 3</strong></div><div class="metric"><small>PROGRESS</small><strong id="prog">0.00</strong></div><p class="note">在手机里左右拖动：页面跟手，松手超过 1/3 或甩得快就翻页，否则弹回。插画慢、标题快、说明更快，形成前后层次；当前圆点拉长成胶囊并随手指伸缩，最后一页「开始使用」从下方弹上来。</p><div class="row"><button id="prev" type="button">上一页</button><button id="nextp" type="button">下一页</button></div></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script src="../app-flow-20261024.js"></script><script>
const G='#22b35e',L='#d9f2e2';
const art=[`<svg viewBox="0 0 280 240"><rect x="58" y="34" width="164" height="184" rx="18" fill="#f4fbf6" stroke="${G}" stroke-width="3"/><rect x="104" y="22" width="72" height="24" rx="10" fill="${G}"/>${[78,124,170].map((y,k)=>`<circle cx="92" cy="${y}" r="13" fill="${k<2?G:'#fff'}" stroke="${G}" stroke-width="3"/>${k<2?`<path d="M85 ${y}l5 5 9-10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`:''}<rect x="116" y="${y-6}" width="${[78,60,70][k]}" height="12" rx="6" fill="${k<2?L:'#e9ecea'}"/>`).join('')}<path d="M214 150l34-34 12 12-34 34-16 4z" fill="#ffd43b" stroke="#191919" stroke-width="3" stroke-linejoin="round"/></svg>`,
`<svg viewBox="0 0 280 240"><circle cx="140" cy="120" r="96" fill="#f4fbf6"/><path d="M140 52c-30 0-48 22-48 52v34l-14 20h124l-14-20v-34c0-30-18-52-48-52z" fill="${G}"/><circle cx="140" cy="172" r="13" fill="#ffd43b" stroke="#191919" stroke-width="3"/><rect x="132" y="38" width="16" height="16" rx="6" fill="${G}"/>${[0,1].map(k=>`<path d="M${70-k*16} ${80-k*10}q-${16+k*8} 34 0 ${68+k*20}M${210+k*16} ${80-k*10}q${16+k*8} 34 0 ${68+k*20}" fill="none" stroke="${G}" stroke-width="4" stroke-linecap="round" opacity="${.6-k*.3}"/>`).join('')}</svg>`,
`<svg viewBox="0 0 280 240"><path d="M24 214h232" stroke="#191919" stroke-width="3" stroke-linecap="round"/>${[[44,170],[94,140],[144,104],[194,64]].map(([x,y],k)=>`<rect x="${x}" y="${y}" width="42" height="${214-y}" rx="8" fill="${k===3?G:L}"/>`).join('')}<path d="M215 64V22" stroke="#191919" stroke-width="3"/><path d="M215 22l30 10-30 10z" fill="#e5484d"/><circle cx="66" cy="148" r="11" fill="#ffd43b" stroke="#191919" stroke-width="3"/><path d="M168 64l6-12 6 12 12 6-12 6-6 12-6-12-12-6z" fill="#ffd43b"/></svg>`];
const copy=[['记录','随手记下每个小目标','一句话就能建好一个习惯'],['提醒','到点轻轻提醒你','不打扰，只在需要的时候出现'],['成长','一点点，看见自己的成长','每周一份小报告，进步看得见']];
$('pages').innerHTML=copy.map(([k,t,s],i)=>`<div class="ill" data-p="${i}" data-f=".55">${art[i]}</div><div class="txt k" data-p="${i}" data-f="1">${k}</div><div class="txt t" data-p="${i}" data-f="1.1">${t}</div><div class="txt s" data-p="${i}" data-f="1.3">${s}</div>`).join('');
const layers=[...document.querySelectorAll('[data-p]')],dots=[...$('dots').children],W=390;
let x=0,v=0,target=0,raf=0,last=0,auto=true;
// Each layer moves at its own speed relative to the page offset: illustration slow, title fast, subtitle faster.
function draw(){for(const el of layers){const d=+el.dataset.p-x,ad=Math.min(1,Math.abs(d)),ill=el.classList.contains('ill');el.style.transform=`translateX(${d*W*+el.dataset.f}px)`+(ill?` scale(${1-.16*ad})`:'');el.style.opacity=1-ad}
 dots.forEach((d,i)=>{const near=Math.max(0,1-Math.abs(i-x));d.style.width=7+19*near+'px';d.classList.toggle('cur',near>.5)});
 const last2=Math.max(0,Math.min(1,x-1));$('startb').style.transform=`translateY(${(1-last2)*150}px)`;$('startb').style.opacity=last2;
 $('skip').style.opacity=1-last2;$('skip').style.pointerEvents=last2>.5?'none':'';$('prog').textContent=x.toFixed(2);$('page').textContent=`${Math.round(Math.max(0,Math.min(2,x)))+1} / 3`}
function frame(t){const dt=Math.min(.032,(t-(last||t))/1000||.016);last=t;v+=((target-x)*170-v*21)*dt;x+=v*dt;draw();if(Math.abs(target-x)+Math.abs(v)>.0005)raf=requestAnimationFrame(frame);else{x=target;v=0;draw();raf=0;last=0}}
function go(to,speed=0){target=Math.max(0,Math.min(2,to));v=speed;if(reduced){x=target;draw();return}if(!raf){last=0;raf=requestAnimationFrame(frame)}}
let drag=null;
$('app').onpointerdown=e=>{if(e.target.closest('button'))return;auto=false;cancelAnimationFrame(raf);raf=0;drag={sx:e.clientX,x0:x,px:e.clientX,pt:e.timeStamp,vel:0};$('app').classList.add('drag');$('app').setPointerCapture(e.pointerId)};
$('app').onpointermove=e=>{if(!drag)return;const k=appScale(),dx=(e.clientX-drag.sx)/k;let nx=drag.x0-dx/W;if(nx<0)nx*=.3;if(nx>2)nx=2+(nx-2)*.3;x=nx;
 const dt=e.timeStamp-drag.pt;if(dt>0)drag.vel=-(e.clientX-drag.px)/k/W/dt*1000;drag.px=e.clientX;drag.pt=e.timeStamp;draw()};
function release(e){if(!drag)return;const moved=x-drag.x0,base=Math.round(drag.x0);let vel=e.timeStamp-drag.pt>90?0:drag.vel;drag=null;$('app').classList.remove('drag');
 // Past a third of the width, or flicked faster than ~1.5 pages/s, turns the page; otherwise springs back.
 const to=Math.abs(moved)>1/3||Math.abs(vel)>1.5?base+Math.sign(Math.abs(moved)>1/3?moved:vel):base;go(to,vel)}
$('app').onpointerup=release;$('app').onpointercancel=release;
$('prev').onclick=()=>{auto=false;go(Math.round(target)-1)};$('nextp').onclick=()=>{auto=false;go(Math.round(target)+1)};$('skip').onclick=()=>{auto=false;go(2)};$('startb').onclick=()=>{auto=false;go(0)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){auto=false;go(Math.round(target)+1)}if(e.key==='ArrowLeft'){auto=false;go(Math.round(target)-1)}});
draw();setTimeout(()=>auto&&go(1),reduced?0:1000);setTimeout(()=>auto&&go(2),reduced?0:2800);
</script><script src="../demo-i18n.js"></script></body></html>
