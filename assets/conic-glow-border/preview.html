<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态弥散光晕边框 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.screen{background:#191919;display:grid;place-items:center}.glow-scene{position:relative;width:460px;height:260px}.halo{position:absolute;left:10%;right:10%;bottom:-12px;height:80px;background:#ffd43b;filter:blur(34px);opacity:.25;animation:breathe 3s ease-in-out infinite alternate}.border{position:absolute;inset:0;overflow:hidden;border-radius:26px;background:#444}.border:before{content:"";position:absolute;inset:-170%;background:conic-gradient(from 0deg,transparent 0 35%,#ffd43b 46%,#fff 49%,#d9a600 53%,transparent 63%);animation:spin 5s linear infinite}.glow-card{position:absolute;inset:2px;border-radius:24px;background:#191919;padding:24px;color:#fff}.glow-card .kicker{color:#ffd43b}.glow-card h2{font-size:32px;margin-top:18px}.glow-card svg{position:absolute;right:20px;top:85px;width:200px}.glow-card span{position:absolute;bottom:24px;font:10px monospace;letter-spacing:1px}.glow-card b{font-size:25px;display:block;letter-spacing:0;margin-top:6px}.paused:before,.paused .border:before,.paused .halo{animation-play-state:paused}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{to{opacity:.55;transform:scaleX(1.15)}}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>动态弥散光晕边框</h1></div><span class="badge">交互演示</span></header><section class="screen"><div id="glow" class="glow-scene"><div class="halo"></div><div class="border"><div class="glow-card"><div class="kicker">● AI LINE COACH</div><h2>Find your<br>best line.</h2><svg viewBox="0 0 220 70"><path d="M5 65Q50 0 105 28T215 5" stroke="#ffd43b" stroke-width="3" fill="none"/></svg><span>BEST LINE <b>1.4 min</b></span></div></div></div></section><aside class="side"><div class="metric"><small>CONIC BORDER</small><strong id="state">RUNNING</strong></div><div class="metric"><small>DURATION</small><strong id="duration">5 s</strong></div><p class="note">渐变描边匀速旋转，底部背光缓慢呼吸。可暂停；减少动态效果偏好下保持静态。</p><button id="replay">暂停动效</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
$('replay').onclick=()=>{const paused=$('glow').classList.toggle('paused');$('replay').textContent=paused?'继续播放':'暂停动效';$('state').textContent=reduced.matches?'REDUCED':paused?'PAUSED':'RUNNING'};if(reduced.matches){$('state').textContent='REDUCED';$('replay').disabled=true;$('replay').textContent='已启用减少动态效果'}</script></body></html>
