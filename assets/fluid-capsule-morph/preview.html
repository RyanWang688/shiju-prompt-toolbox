<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流体胶囊形变 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.morph-wrap{display:grid;place-items:center;height:100%}#morph{position:relative;width:190px;height:60px;border-radius:30px;background:#ffd43b;overflow:hidden;transition:width .7s cubic-bezier(.2,.9,.24,1),height .7s cubic-bezier(.2,.9,.24,1),border-radius .7s cubic-bezier(.2,.9,.24,1);border:1px solid #191919}#morphToggle{border:0;background:transparent;width:190px;height:60px;white-space:nowrap;text-align:left;padding-left:22px;position:absolute;top:0;right:0;z-index:2;transition:width .7s}#morph.open{width:480px;height:280px;border-radius:40px}#morph.open #morphToggle{width:62px;font-size:0}#morph.open #morphToggle:after{content:"×";font-size:28px}.morph-content{width:420px;position:absolute;left:28px;top:30px;opacity:0;transition:opacity .2s;pointer-events:none}#morph.open .morph-content{opacity:1;transition-delay:.3s}.morph-content h2{font-size:60px;margin:13px 0}.morph-content small{font-size:18px}.morph-content p{font-size:12px}.bars{height:80px;display:flex;align-items:end;gap:10px}.bars i{display:block;width:40px;background:#191919;border-radius:8px}.bars i:nth-child(4){background:white}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>流体胶囊形变</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="morph-wrap"><div id="morph"><button id="morphToggle" aria-expanded="false">＋ Fresh snow</button><div class="morph-content"><div class="kicker">THIS WEEK</div><h2>46 <small>cm fresh</small></h2><div class="bars"><i style="height:24px"></i><i style="height:44px"></i><i style="height:36px"></i><i style="height:74px"></i><i style="height:55px"></i><i style="height:64px"></i><i style="height:40px"></i></div><p>Nordkette · 新雪速报</p></div></div></div></section><aside class="side"><div class="metric"><small>WIDTH × HEIGHT</small><strong id="size">190 × 60</strong></div><div class="metric"><small>RADIUS</small><strong id="radius">30 px</strong></div><p class="note">点击胶囊或右上角关闭按钮。尺寸、圆角始终由同一个容器连续变化。</p><button id="replay">形变 / 收起</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let open=false;function toggle(){open=!open;$('morph').classList.toggle('open',open);$('morphToggle').setAttribute('aria-expanded',open);$('size').textContent=open?'480 × 280':'190 × 60';$('radius').textContent=open?'40 px':'30 px'}$('morphToggle').onclick=toggle;$('replay').onclick=toggle;</script><script src="../demo-i18n.js"></script></body></html>
