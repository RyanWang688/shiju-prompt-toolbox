<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弹性微缩触觉反馈 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.press-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.press-wrap h2{margin:0}#press{width:420px;height:100px;background:#ffd43b;border:1px solid #191919;border-radius:60px;font-size:34px;font-weight:700;box-shadow:0 12px 0 #191919;transform:scale(1);touch-action:none;transition:box-shadow .15s,transform .15s}#press span{margin-left:35px}#press.down{transform:scale(.96);box-shadow:inset 0 7px 13px #0005,0 3px 0 #191919}.press-wrap p{font-size:12px;color:#595959;margin:5px}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>弹性微缩触觉反馈</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="press-wrap"><div class="kicker">READY TO RIDE</div><h2>Nordkette · 46 cm</h2><button id="press">Start Run <span>→</span></button><p id="pressStatus">按住按钮，松开感受回弹</p></div></section><aside class="side"><div class="metric"><small>SCALE</small><strong id="scale">1.000</strong></div><div class="metric"><small>STATE</small><strong id="state">READY</strong></div><p class="note">按住按钮可见微缩与内阴影，释放后超调回弹。支持空格和 Enter；此网页演示不触发设备震动。</p><button id="replay">重播按压反馈</button></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let pressed=false;function down(){pressed=true;$('press').getAnimations().forEach(a=>a.cancel());$('press').classList.add('down');$('scale').textContent='0.960';$('state').textContent='PRESSED';$('pressStatus').textContent='压缩 4% · 加深内阴影'}function up(){if(!pressed)return;pressed=false;$('press').classList.remove('down');anim($('press'),[{transform:'scale(.96)'},{transform:'scale(1.035)',offset:.5},{transform:'scale(.994)',offset:.78},{transform:'scale(1)'}],{duration:490,easing:'ease-out'});$('scale').textContent='1.000';$('state').textContent='RELEASED';$('pressStatus').textContent='轻微超调回弹 · 已恢复'}$('press').onpointerdown=e=>{$('press').setPointerCapture(e.pointerId);down()};$('press').onpointerup=up;$('press').onpointercancel=up;$('press').onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();if(!e.repeat)down()}};$('press').onkeyup=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();up()}};$('press').onblur=up;$('replay').onclick=()=>{down();setTimeout(up,240)};</script></body></html>
