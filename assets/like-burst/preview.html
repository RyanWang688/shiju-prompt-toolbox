<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点赞爆粒子 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.like-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:35px}.like-wrap p{font-size:13px;color:#595959}#like{position:relative;display:flex;align-items:center;justify-content:center;gap:24px;width:270px;height:100px;border:1px solid #ddd;background:#fff;border-radius:60px;overflow:visible}#heart{display:block;font-size:56px;line-height:1;color:#888;transition:color .2s}#heart.liked{color:#df3158}#count{font-size:38px;line-height:1.2;height:1.2em;overflow:hidden}#countTrack{display:block}#countTrack span{display:block;height:1.2em}#particles{position:absolute;left:78px;top:50px;width:0;height:0;pointer-events:none}.particle{position:absolute;width:9px;height:9px;border-radius:50%}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>点赞爆粒子</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="like-wrap"><div class="kicker">A LITTLE APPRECIATION</div><button id="like" aria-label="点赞"><span id="heart">♥</span><span id="count"><span id="countTrack">128</span></span><span id="particles" aria-hidden="true"></span></button><p>点一下，让喜欢被看见。</p></div></section><aside class="side"><div class="metric"><small>LIKES</small><strong id="likes">128</strong></div><div class="metric"><small>BURST</small><strong id="state">READY</strong></div><p class="note">点击爱心，体验 600ms 弹跳、8 个粒子与数字滚动。只改变演示计数，不发送真实点赞。</p></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
let count=128,busy=false;$('like').onclick=()=>{if(busy)return;busy=true;const before=count++;$('heart').classList.add('liked');anim($('heart'),[{transform:'scale(1)'},{transform:'scale(.8)',offset:.18},{transform:'scale(1.2)',offset:.6},{transform:'scale(1)'}],{duration:600,easing:'cubic-bezier(.2,.8,.3,1)'});$('countTrack').innerHTML='<span>'+before+'</span><span>'+count+'</span>';anim($('countTrack'),[{transform:'translateY(0)'},{transform:'translateY(-1.2em)'}],{duration:600,fill:'forwards',easing:'cubic-bezier(.2,.9,.25,1)'});$('particles').replaceChildren();if(!reduced.matches)for(let i=0;i<8;i++){let p=document.createElement('i');p.className='particle';p.style.background=['#df3158','#ffd43b','#9771e8','#35a795','#f17f35','#5a95e8','#e470ac','#191919'][i];$('particles').append(p);const a=i*Math.PI/4;anim(p,[{opacity:1,transform:'translate(-4px,-4px) scale(.5)'},{opacity:0,transform:`translate(${Math.cos(a)*85}px,${Math.sin(a)*85}px) scale(1)`}],{duration:600,fill:'forwards',easing:'ease-out'})}$('likes').textContent=count;$('state').textContent='LIKED';setTimeout(()=>{busy=false;$('countTrack').getAnimations().forEach(a=>a.cancel());$('countTrack').textContent=count;$('particles').replaceChildren()},620)};</script></body></html>
