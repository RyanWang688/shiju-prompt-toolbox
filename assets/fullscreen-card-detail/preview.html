<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全屏详情 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.art{background:#ffd43b;color:#191919;position:relative;padding:22px;height:160px;transition:height .6s}.art span{font:11px monospace;letter-spacing:3px}.art b{display:block;font-size:30px;line-height:1.2;margin-top:18px}.art i{position:absolute;right:22px;bottom:18px;font-size:48px;font-style:normal}.caption{padding:18px;background:white;color:#191919}.caption h2{font-size:20px}.caption p{margin:8px 0;font-size:13px;line-height:1.7}.scene-button{padding:0;border-radius:20px;overflow:hidden;text-align:left;box-shadow:0 18px 40px #19191918}.scene-button:hover{background:white}.screen{background:#eee}.small{font:12px monospace;color:#595959}.screen>h2{padding:22px;font-size:20px}.screen button:focus-visible{outline-offset:-4px}#feature{position:absolute;left:40px;top:26px;width:270px;height:275px;transition:all .65s cubic-bezier(.2,.8,.2,1);z-index:5}#feature .extra{opacity:0;transform:translateY(18px);transition:opacity .3s,transform .4s}#stage.full #feature{left:-1px;top:-1px;width:850px;height:395px;border-radius:0;background:#fff}#stage.full #feature .art{height:185px}#stage.full .extra{opacity:1;transform:none;transition-delay:.22s}#feature .extra:nth-child(2){transition-delay:.32s}#stage.full .screen{overflow:visible;z-index:5}#stage.full header{opacity:.15}#close{position:absolute;right:16px;top:16px;z-index:8;display:none}#stage.full #close{display:block}.screen{overflow:visible}#stage.full .screen{position:static}#stage.full #feature{left:0;top:0;width:900px;height:500px;border:0}#stage.full #feature .art{height:260px}#stage.full #close{right:16px;top:16px}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / CARD INTERACTIONS</div><h1>全屏详情</h1></div><span class="badge">交互演示</span></header><section class="screen"><button id="feature" class="scene-button" aria-expanded="false"><div class="art"><span>FIELD NOTES</span><b>把灵感<br>留在此刻。</b><i>↗</i></div><div class="caption"><h2>周末城市漫游</h2><div class="extra">一段没有目的地的旅程 · 08:30 出发</div><p class="extra">沿着河岸，收集街角的光影与日常。<br>路线 / 4.8 km　时长 / 90 min</p></div></button><button id="close" aria-label="关闭全屏详情">关闭 ×</button></section><aside class="side"><div class="metric"><small>INTERACTION STATE</small><strong id="state">READY</strong></div><p class="note">点击卡片展开为演示视口中的全屏详情，点击关闭或 Esc 返回。</p><button id="replay">展开 / 收起</button></aside><div class="hint">按用户提示词手工制作的网页演示 · 非原作者作品或模型实测输出</div></main><script>
const stage=document.getElementById('stage'),state=document.getElementById('state'),replay=document.getElementById('replay'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const feature=document.getElementById('feature'),closeButton=document.getElementById('close'),stack=document.getElementById('stack'),player=document.getElementById('player'),handle=document.getElementById('handle'),track=document.getElementById('track'),flip=document.getElementById('flip');
function scaleFactor(){return Math.min(innerWidth/900,innerHeight/500)}function fit(){stage.style.transform=`translate(-50%,-50%) scale(${scaleFactor()})`}new ResizeObserver(fit).observe(document.body);fit();
