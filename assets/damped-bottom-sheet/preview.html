<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阻尼弹性抽屉 · 交互演示</title><link rel="stylesheet" href="../motion-set-20261023.css"><style>.sheet-bg{padding:28px;background:#191919;color:white;height:100%}.sheet-bg p{font-size:13px;color:#ccc}#sheet{position:absolute;left:44px;right:44px;top:0;height:310px;transform:translateY(130px);border-radius:26px 26px 0 0;background:#fff;padding:0 24px 20px;box-shadow:0 -8px 32px #0002;will-change:transform}#handle{height:44px;width:100%;border:0;background:transparent;padding:10px;touch-action:none;cursor:grab}#handle:active{cursor:grabbing}#handle i{display:block;width:48px;height:5px;border-radius:8px;background:#888;margin:auto}#sheet h2{font-size:21px}#sheet p{font:10px monospace;letter-spacing:2px;margin:15px 0 10px}.sizes{display:flex;gap:17px;align-items:center}.sizes>*{border:1px solid #bbb;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-size:12px}.sizes b{background:#ffd43b;color:#191919;border-color:#191919}.track{height:15px;background:#eee;border-radius:10px}.track i{display:block;width:65%;height:100%;background:#ffd43b;border-radius:inherit}#save{width:100%;background:#191919;color:white;margin-top:18px}</style></head><body><main id="stage"><header><div><div class="kicker">SHIJU / MOTION STUDY</div><h1>阻尼弹性抽屉</h1></div><span class="badge">交互演示</span></header><section class="screen"><div class="sheet-bg"><h2>My board</h2><p>拖动底部面板，感受阻尼</p></div><div id="sheet"><button id="handle" aria-label="拖动抽屉；方向键切换锚点"><i></i></button><h2>Choose your setup</h2><p>BOARD LENGTH</p><div class="sizes"><span>148</span><span>152</span><b>156</b><span>160</span></div><p>STANCE ANGLE</p><div class="track"><i></i></div><button id="save">保存设置</button></div></section><aside class="side"><div class="metric"><small>SHEET Y</small><strong id="position">130 px</strong></div><div class="metric"><small>VELOCITY</small><strong id="velocity">0 px/s</strong></div><p class="note">拖住把手上下滑动；越界阻尼，松手按速度吸附。把手也支持上下方向键。</p><label for="anchor">选择吸附锚点</label><select id="anchor"><option value="0">完整展开</option><option value="1" selected>中间位置</option><option value="2">收起</option></select></aside><div class="hint">根据用户提示词手工制作的网页演示 · 非原作者视频或模型实测输出</div></main><script>
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion:reduce)');
function fit(){ $('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/900,innerHeight/500)})` }new ResizeObserver(fit).observe(document.body);fit();
function anim(el,frames,options){if(reduced.matches){el.getAnimations().forEach(a=>a.cancel());return null}return el.animate(frames,options)}
const anchors=[35,130,230];let y=130,target=y,v=0,raf=0,last=0,drag=false,start=0,origin=0,prev=0,pt=0,speed=0;function draw(){ $('sheet').style.transform=`translateY(${y}px)`;$('position').textContent=Math.round(y)+' px';$('velocity').textContent=Math.round(speed)+' px/s'}function frame(t){const dt=Math.min((t-(last||t))/1000,.032);last=t;v+=((target-y)*210-v*24)*dt;y+=v*dt;draw();if(Math.abs(target-y)+Math.abs(v)>.1)raf=requestAnimationFrame(frame);else{y=target;draw();raf=0;last=0}}function snap(to){target=to;$('anchor').value=String(anchors.indexOf(to));if(reduced.matches){y=target;draw();return}if(!raf)raf=requestAnimationFrame(frame)}$('handle').onpointerdown=e=>{cancelAnimationFrame(raf);raf=0;last=0;drag=true;start=prev=e.clientY;origin=y;pt=e.timeStamp;speed=0;v=0;$('handle').setPointerCapture(e.pointerId)};$('handle').onpointermove=e=>{if(!drag)return;let scale=$('stage').getBoundingClientRect().width/900;let raw=origin+(e.clientY-start)/scale;y=raw<35?35+(raw-35)*.25:raw>230?230+(raw-230)*.25:raw;const dt=e.timeStamp-pt;if(dt>0)speed=(e.clientY-prev)/scale/dt*1000;prev=e.clientY;pt=e.timeStamp;draw()};function release(e){if(!drag)return;drag=false;if(e.timeStamp-pt>90)speed=0;const projected=y+speed*.16;v=speed;snap(anchors.reduce((a,b)=>Math.abs(b-projected)<Math.abs(a-projected)?b:a))}$('handle').onpointerup=release;$('handle').onpointercancel=()=>{drag=false;speed=0;v=0;snap(130)};$('handle').onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();let i=anchors.indexOf(target);snap(anchors[Math.max(0,Math.min(2,i+(e.key==='ArrowDown'?1:-1)))])}};$('anchor').onchange=e=>snap(anchors[Number(e.target.value)]);$('save').onclick=()=>snap(230);draw();</script></body></html>
