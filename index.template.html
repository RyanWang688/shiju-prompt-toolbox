function showDetail(item){selected=item;$('detailVisit').innerHTML=resourceLinksHtml(item,true)||sourceButton(item);$('detailTitle').textContent=tx(item,'title');$('detailMeta').textContent=(item.kind==='website'?tr('实用网站')+' / ':item.kind==='skill'?tr(item.resourceType||'Skill')+' / ':'')+tr(item.category)+' / '+(tx(item,'tags')||'');resetCopy();$('copy').textContent=copyLabel(item);$('promptText').textContent=item.prompt;$('detailPreview').innerHTML=item.preview||item.kind==='skill'?visual(item):'';$('previewNote').textContent=['skill','website'].includes(item.kind)?[tx(item,'description'),item.previewNote].filter(Boolean).join(' '):item.previewNote||'';$('skillSource').textContent=['skill','website'].includes(item.kind)&&item.source?tr('来源：')+item.source:'';$('sourceLink').innerHTML=typeof item.sourceImage==='string'&&item.sourceImage.startsWith('assets/')&&!item.sourceImage.includes('..')?`<a href="${esc(item.sourceImage)}" target="_blank" rel="noopener">${tr('查看原始提示词截图 ↗')}</a>`:'';if(item.preview?.type==='image'&&typeof item.preview.src==='string'&&item.preview.src.startsWith('assets/')&&!item.preview.src.includes('..'))$('sourceLink').innerHTML+=` <a href="${esc(item.preview.src)}" target="_blank" rel="noopener">${tr('查看原图 / 动图 ↗')}</a>`;if(typeof item.previewSource==='string'&&item.previewSource.startsWith('https://'))$('sourceLink').innerHTML+=` <a href="${esc(item.previewSource)}" target="_blank" rel="noopener">${tr('效果图原始出处 ↗')}</a>`;if(typeof item.demo==='string'&&item.demo.startsWith('assets/')&&!item.demo.includes('..'))$('sourceLink').innerHTML+=` <a href="${esc(item.demo)}" target="_blank" rel="noopener">${tr('打开实际演示 ↗')}</a>`;$('sourceLink').innerHTML+=' '+resourceLinksHtml(item);if(!$('detail').open)$('detail').showModal()}
const navGroups=[{label:'内容类型',items:[['全部内容','layout-dashboard'],['提示词','message-square-text'],['Skills','sparkles'],['实用网站','globe']]},{label:'个人收藏',items:[['我的收藏','heart']]},{label:'主题分类',items:[['动画动效','clapperboard'],['文字效果','type'],['界面设计','panels-top-left'],['写作表达','pen-line'],['其他','shapes']]}];
$('categories').innerHTML=navGroups.map((g,index)=>`${index?'<hr class="rail-separator" aria-hidden="true">':''}<div class="rail-group" role="group" aria-label="${g.label}" data-i18n-label="${g.label}">${g.items.map(([label,icon])=>`<button type="button" class="rail-button" data-category="${label}" aria-label="${label}" aria-pressed="false" data-tooltip="${label}"><img src="assets/icons/${icon}.svg" alt="" width="21" height="21"></button>`).join('')}</div>`).join('');
let tooltipButton=null,tooltipDismissed=false;
function hideRailTooltip(){if(tooltipButton)tooltipButton.removeAttribute('aria-describedby');tooltipButton=null;$('railTooltip').hidden=true}
function showRailTooltip(button){if(!button||tooltipDismissed)return;tooltipButton=button;const box=button.getBoundingClientRect();$('railTooltip').textContent=button.dataset.tooltip;button.setAttribute('aria-describedby','railTooltip');$('railTooltip').hidden=false;$('railTooltip').style.left=(box.right+12)+'px';$('railTooltip').style.top=Math.max(8,Math.min(innerHeight-44,box.top+box.height/2-18))+'px'}
$('categories').addEventListener('pointerover',e=>{const b=e.target.closest('[data-category]');if(b!==tooltipButton){hideRailTooltip();tooltipDismissed=false;showRailTooltip(b)}});
$('categories').addEventListener('pointerleave',()=>{tooltipDismissed=false;if(!document.activeElement.closest('[data-category]'))hideRailTooltip()});
$('categories').addEventListener('focusin',e=>{tooltipDismissed=false;hideRailTooltip();showRailTooltip(e.target.closest('[data-category]'))});
$('categories').addEventListener('focusout',hideRailTooltip);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){tooltipDismissed=true;hideRailTooltip()}});
$('categories').addEventListener('scroll',hideRailTooltip);window.addEventListener('resize',hideRailTooltip);
$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){if(category!==b.dataset.category)transitionCards(()=>{category=b.dataset.category;render()},true);hideRailTooltip()}};$('search').oninput=render;$('sort').onchange=()=>transitionCards(render);
$('grid').onclick=e=>{if(e.target.closest('a'))return;if(e.target.closest('#emptyAdd')){openEditor();return}const star=e.target.closest('[data-star]');if(star){save(items.map(i=>i.id===star.dataset.star?{...i,favorite:!i.favorite}:i));return}const b=e.target.closest('[data-open]');if(b){detailTrigger=b;detailScroll=scrollY;showDetail(items.find(i=>i.id===b.dataset.open))}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).close();if(b.dataset.close==='detail')$('detailPreview').innerHTML=''});
function updateForm(){const kind=$('kind').value,skill=kind==='skill',site=kind==='website';$('description').required=skill||site;$('descriptionLabel').textContent=tr(skill||site?'一句话用途（必填）':'一句话说明（选填）');$('prompt').required=kind==='prompt';$('contentLabel').textContent=tr(site?'网站说明（选填）':skill?'Skill 内容 / 使用说明（选填）':'提示词原文');$('source').required=site;$('source').type=site?'url':'text';$('sourceLabel').textContent=tr(site?'网站地址（必填，http 或 https）':'来源（链接或名称，选填）');$('formTitle').textContent=lang==='en'?(editing?'Edit ':'Add ')+(site?'site':skill?'Skill':'prompt'):(editing?'编辑':'收录')+(site?'网站':skill?' Skill':'提示词')}
function openEditor(item){editing=item?.id||null;$('form').reset();$('kind').value=item?(['skill','website'].includes(item.kind)?item.kind:'prompt'):category==='实用网站'?'website':category==='Skills'?'skill':'prompt';for(const k of ['title','category','tags','prompt','description','source'])if(item)$(k).value=item[k]||'';if(!item&&$('kind').value!=='prompt')$('category').value='其他';updateForm();$('editor').showModal()}
$('kind').onchange=updateForm;$('add').onclick=()=>openEditor();
$('form').onsubmit=e=>{e.preventDefault();const kind=$('kind').value;const title=$('title').value.trim(),description=$('description').value.trim(),prompt=$('prompt').value.trim(),source=$('source').value.trim();if(!title||(kind==='prompt'&&!prompt)||(kind!=='prompt'&&!description)){toast(tr('请填写标题与必填内容。'));return}if(kind==='website'&&!websiteUrl(source)){toast(tr('请填写有效的 http 或 https 网站地址。'));return}const item={...(items.find(i=>i.id===editing)||{}),id:editing||crypto.randomUUID(),kind,title,category:$('category').value,tags:$('tags').value.trim(),prompt:prompt||description,description,source:kind==='website'?websiteUrl(source):source};if(save(editing?items.map(i=>i.id===editing?item:i):[item,...items])){$('editor').close();toast(tr('已保存到工具箱'))}};

let copyRevision=0,copyTimer;
function resetCopy(){copyRevision++;clearTimeout(copyTimer);$('copy').disabled=false;$('copy').classList.remove('copy-success');$('copy').getAnimations().forEach(a=>a.cancel())}
$('copy').onclick=async()=>{if(!selected)return;const button=$('copy'),revision=++copyRevision,label=copyLabel(selected),text=selected.kind==='website'?selected.source:selected.prompt;clearTimeout(copyTimer);button.disabled=true;try{await navigator.clipboard.writeText(text);if(revision!==copyRevision)return;button.innerHTML='<svg class="copy-check" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>'+tr('复制成功')+'</span>';button.classList.add('copy-success');toast(tr('✓ 复制成功，已放入剪贴板'));if(!matchMedia('(prefers-reduced-motion:reduce)').matches)button.animate([{transform:'scale(1)'},{transform:'scale(.96)',offset:.2},{transform:'scale(1.04)',offset:.65},{transform:'scale(1)'}],{duration:460,easing:'cubic-bezier(.2,.9,.22,1)'});copyTimer=setTimeout(()=>{if(revision===copyRevision){button.textContent=label;button.classList.remove('copy-success')}},2200)}catch{if(revision===copyRevision)toast(tr('复制失败，请选中内容手动复制。'))}finally{if(revision===copyRevision)button.disabled=false}};
$('detail').addEventListener('close',resetCopy);
$('export').onclick=()=>{const data=items.map(({rating,...item})=>item);const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='拾句-工具箱备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(i=>i&&typeof i.title==='string'&&typeof i.prompt==='string'&&i.title.trim()&&i.prompt.trim()))throw Error();if(data.some(i=>i.kind==='website'&&!websiteUrl(i.source)))throw Error();const merged=[...items];for(const i of data){let existing=merged.find(x=>x.title===i.title&&x.prompt===i.prompt);if(!existing){existing={id:crypto.randomUUID(),kind:['skill','website'].includes(i.kind)?i.kind:'prompt',title:i.title.slice(0,100),prompt:i.prompt.slice(0,30000),category:['动画动效','文字效果','界面设计','写作表达','其他'].includes(i.category)?i.category:'其他',tags:String(i.tags||'').slice(0,150),description:String(i.description||'').slice(0,200),source:String(i.source||'').slice(0,1000),favorite:!!i.favorite};merged.unshift(existing)}}if(save(merged))toast(tr('导入完成，重复内容已合并。'))}catch{toast(tr('导入失败，请使用有效的 JSON 备份。'))}finally{$('file').value=''}};
function copyLabel(item){return tr(item.kind==='website'?'复制网站地址':item.kind==='skill'?'复制 Skill 内容':'复制提示词')}
function applyLanguage(){document.documentElement.lang=lang==='en'?'en':'zh-CN';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-i18n-label]').forEach(el=>el.setAttribute('aria-label',tr(el.dataset.i18nLabel)));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.i18nPlaceholder));document.querySelectorAll('.lang-option').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));hideRailTooltip();render();applyMasonry();positionTopicIndicator()}
// The language thumb reuses the elastic tab motion, clamped inside its pill.
let langFrame=0;
function moveLangThumb(animate){const thumb=document.querySelector('.lang-thumb'),active=document.querySelector('.lang-option[aria-pressed="true"]'),min=3,max=thumb.parentElement.clientWidth-3,to={left:active.offsetLeft,top:0,width:active.offsetWidth,height:0},paint=r=>{const left=Math.max(min,r.left),right=Math.min(max,r.left+r.width);thumb.style.left=left+'px';thumb.style.width=Math.max(0,right-left)+'px'};cancelAnimationFrame(langFrame);if(!animate||!thumb.style.width){paint(to);return}const from={left:parseFloat(thumb.style.left),top:0,width:parseFloat(thumb.style.width),height:0};let start,tailStart,frames=0;const tick=now=>{start??=now;frames++;if(frames===7)tailStart=now;const p=Math.min(1,(now-start)/560),tail=tailStart===undefined?0:Math.min(1,(now-tailStart)/Math.max(1,560-(tailStart-start)));paint(p<1?elasticTopicRect(from,to,p,tail):to);if(p<1)langFrame=requestAnimationFrame(tick)};langFrame=requestAnimationFrame(tick)}
// Without view transitions, changed text resolves from blur in a wave that starts at the toggle.
function revealText(origin){const o=origin.getBoundingClientRect(),reach=Math.hypot(innerWidth,innerHeight);document.querySelectorAll('.dashboard-shell :is([data-i18n],h1,h2,.description,.card-foot>span,.meta>span,.preview-credit,.visit-site,.topic-chip,#resultCount)').forEach(el=>{const r=el.getBoundingClientRect();if(!r.width||r.bottom<0||r.top>innerHeight)return;const distance=Math.hypot(r.left+r.width/2-o.left,r.top+r.height/2-o.top);el.animate([{opacity:0,filter:'blur(6px)',transform:'translateY(6px)'},{opacity:1,filter:'blur(0)',transform:'none'}],{duration:420,delay:distance/reach*320,easing:'cubic-bezier(.2,.9,.22,1)',fill:'backwards'})})}
function switchLanguage(next,origin){if(next===lang)return;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,update=()=>{lang=next;try{localStorage.setItem(langKey,lang)}catch{}applyLanguage();moveLangThumb(!reduce)};if(reduce||!document.startViewTransition){update();if(!reduce)revealText(origin);return}const box=origin.getBoundingClientRect(),x=box.left+box.width/2,y=box.top+box.height/2,radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));document.startViewTransition(update).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${radius}px at ${x}px ${y}px)`]},{duration:760,easing:'cubic-bezier(.2,.9,.22,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{})}
document.querySelector('.lang-switch').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)switchLanguage(b.dataset.lang,b)});
new ResizeObserver(()=>moveLangThumb(false)).observe(document.querySelector('.lang-switch'));
transitionCards(applyLanguage,true);moveLangThumb(false);
