<script>
const seed=__PROMPTS__;
const key='shiju-personal-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function websiteUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
function resourceLinks(item){if(!['skill','website'].includes(item.kind))return [];const candidates=[['官方项目',item.officialUrl||item.source],['GitHub 仓库',item.repository],['使用说明',item.documentation]];const seen=new Set();return candidates.map(([label,value])=>({label,url:websiteUrl(value)})).filter(link=>link.url&&!seen.has(link.url)&&seen.add(link.url))}
function resourceLinksHtml(item,compact=false){return resourceLinks(item).slice(0,compact?1:undefined).map(link=>`<a class="visit-site" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(item.title+'：'+link.label)}">${compact?'访问官网':esc(link.label)} ↗</a>`).join(' ')}
let items=seed,category='全部内容',skillTopic='全部',selected=null,editing=null,toastTimer;
try{const local=JSON.parse(localStorage.getItem(key)||'null');if(local&&Array.isArray(local.items)&&Array.isArray(local.deleted)){const valid=local.items.filter(i=>i&&typeof i.id==='string'&&typeof i.title==='string'&&typeof i.prompt==='string');const changed=new Map(valid.map(i=>[i.id,i]));items=[...seed.filter(i=>!local.deleted.includes(i.id)).map(i=>changed.get(i.id)||i),...valid.filter(i=>!seed.some(s=>s.id===i.id))]}}catch{}
function toast(message){const box=$('toast');const host=$('detail').open?$('detail'):document.body;if(box.parentElement!==host){if(box.matches(':popover-open'))box.hidePopover();host.append(box)}box.textContent=message;box.classList.remove('hidden');if(!box.matches(':popover-open'))box.showPopover();box.getAnimations().forEach(a=>a.cancel());if(!matchMedia('(prefers-reduced-motion:reduce)').matches)box.animate([{opacity:0,translate:'0 12px'},{opacity:1,translate:'0 0'}],{duration:240,easing:'cubic-bezier(.2,.9,.22,1)'});clearTimeout(toastTimer);toastTimer=setTimeout(()=>{box.hidePopover();box.classList.add('hidden')},2600)}
function save(next){try{const removed=seed.filter(i=>!next.some(n=>n.id===i.id)).map(i=>i.id);const changed=next.filter(i=>!seed.some(s=>s.id===i.id&&JSON.stringify(s)===JSON.stringify(i)));localStorage.setItem(key,JSON.stringify({items:changed,deleted:removed}));items=next;render();return true}catch{toast('保存失败：浏览器存储不可用，请先导出备份。');return false}}
function visual(item,card=false){if(card){const cover=item.cardPreview||seed.find(i=>i.id===item.id)?.cardPreview;if(cover)item={...item,preview:cover};else if(item.preview?.type==='animation')return `<div class="preview skill-cover"><span>交互演示</span><strong>${esc(item.title)}</strong><p>点开卡片查看完整动效</p></div>`;}if(item.kind==='skill'&&!item.preview)return `<div class="preview skill-cover"><span>SKILL / 能力卡</span><strong>${esc(item.title)}</strong><p>${esc(item.previewNote||item.description||'用途待补充')}</p></div>`;if(item.preview&&typeof item.preview.src==='string'&&/^assets\/[a-zA-Z0-9_./-]+$/.test(item.preview.src)&&!item.preview.src.includes('..')){const p=item.preview;if(p.type==='image')return `<div class="preview ${['skill','website'].includes(item.kind)?'skill-media':''}"><img src="${esc(p.src)}" alt="${esc(p.alt||item.title+'效果预览')}" loading="lazy" ${Number.isInteger(p.width)&&Number.isInteger(p.height)?`width="${p.width}" height="${p.height}"`:""} style="width:100%;height:100%;object-fit:cover"></div>`;if(p.type==='animation')return `<div class="preview"><iframe src="${esc(p.src)}" title="${esc(item.title+'动效预览')}" sandbox="allow-scripts" loading="lazy" style="border:0;width:100%;height:100%"></iframe></div>`;if(p.type==='video')return `<div class="preview"><video src="${esc(p.src)}" controls muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain"></video></div>`}const type=['orbit','type','glass','pulse','layout','write'].includes(item.effect)?item.effect:'custom';return `<div class="preview ${type}" aria-hidden="true">${({orbit:'<i class="ring"></i><i class="ring"></i><i class="ring"></i>',type:'<div><span>让灵感</span><span>慢慢浮现。</span></div>',glass:'<div><b>Clarity.</b><br><small>透过表面，看见层次</small></div>',pulse:'<span></span>',layout:'<b>The<br>Edit.</b><i></i>',write:'<del>致力于打造卓越的表达</del><span>把话说清楚。</span>',custom:'<div style="text-align:center"><span style="font:42px Georgia">Aa</span><br><small>已收录 · 暂无效果预览</small></div>'})[type]}</div>`}

function matches(item,c){return c==='全部内容'||c==='Skills'&&item.kind==='skill'||c==='提示词'&&!['skill','website'].includes(item.kind)||c==='实用网站'&&item.kind==='website'||c==='我的收藏'&&item.favorite||item.category===c}
const skillTopicNames=['图像创作','视觉设计','动画视频','写作创作','开发工具','求职效率','其他'];
function topicsFor(item){if(item.kind!=='skill')return [];const topics=item.skillTopics||seed.find(i=>i.id===item.id)?.skillTopics;return Array.isArray(topics)&&topics.some(t=>skillTopicNames.includes(t))?[...new Set(topics.filter(t=>skillTopicNames.includes(t)))]:[{动画动效:'动画视频',界面设计:'视觉设计',写作表达:'写作创作'}[item.category]||'其他']}
function matchesSkillTopic(item,topic){return item.kind==='skill'&&(topic==='全部'||topicsFor(item).includes(topic))}
function renderSkillTopics(){const box=$('skillTopics');box.hidden=category!=='Skills';if(box.hidden){cancelAnimationFrame(topicFrame);topicMoving=false;return}const skills=items.filter(i=>i.kind==='skill'),names=['全部',...skillTopicNames.filter(t=>t!=='其他'||skills.some(i=>topicsFor(i).includes(t)))];if(box.dataset.topics!==names.join('|')){box.dataset.topics=names.join('|');box.innerHTML='<div class="topic-list" role="group" aria-label="筛选 Skills 主题"><span class="topic-indicator" aria-hidden="true"></span>'+names.map(t=>`<button type="button" class="topic-chip" data-skill-topic="${t}"><span>${t}</span><small></small></button>`).join('')+'</div>'}box.querySelectorAll('button').forEach(b=>{const t=b.dataset.skillTopic,count=skills.filter(i=>matchesSkillTopic(i,t)).length;b.classList.toggle('active',skillTopic===t);b.setAttribute('aria-pressed',skillTopic===t);b.setAttribute('aria-label',`${t}，${count} 个 Skill`);b.querySelector('small').textContent=count});if(!topicMoving)positionTopicIndicator()}
let topicFrame=0,topicMoving=false;

function paintTopic(rect){const marker=$('skillTopics').querySelector('.topic-indicator');if(marker)Object.assign(marker.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'})}
function positionTopicIndicator(){cancelAnimationFrame(topicFrame);topicMoving=false;const button=$('skillTopics').querySelector('.active');if(button&&!$('skillTopics').hidden)paintTopic(topicRect(button))}
function elasticEase(x){let lo=0,hi=1,t=.5;for(let i=0;i<14;i++){t=(lo+hi)/2;const u=1-t,v=3*u*u*t*.2+3*u*t*t*.22+t*t*t;if(v<x)lo=t;else hi=t}return 3*(1-t)*(1-t)*t*.9+3*(1-t)*t*t+t*t*t}
function elasticTopicRect(from,to,p,tail){const right=to.left>=from.left,w=Math.max(from.width,to.width),startFront=right?from.left+from.width:from.left,startTail=right?from.left:from.left+from.width,endFront=right?to.left+to.width:to.left,endTail=right?to.left:to.left+to.width,peak=right?Math.max(endFront,from.left+w*2.3):Math.min(endFront,from.left+from.width-w*2.3);let front=p<.42?startFront+(peak-startFront)*elasticEase(p/.42):peak+(endFront-peak)*elasticEase((p-.42)/.58);front+=(right?1:-1)*4*Math.sin(Math.PI*Math.max(0,(p-.8)/.2));const back=startTail+(endTail-startTail)*tail**3;return {left:Math.min(front,back),top:from.top+(to.top-from.top)*elasticEase(p),width:Math.abs(front-back),height:to.height}}
function animateTopicIndicator(from,to){cancelAnimationFrame(topicFrame);if(matchMedia('(prefers-reduced-motion:reduce)').matches){paintTopic(to);topicMoving=false;return}topicMoving=true;let start,tailStart,frames=0;function tick(now){start??=now;frames++;if(frames===7)tailStart=now;const p=Math.min(1,(now-start)/660),tail=tailStart===undefined?0:Math.min(1,(now-tailStart)/Math.max(1,660-(tailStart-start)));paintTopic(elasticTopicRect(from,to,p,tail));if(p<1)topicFrame=requestAnimationFrame(tick);else{paintTopic(to);topicMoving=false}}topicFrame=requestAnimationFrame(tick)}
new ResizeObserver(()=>{const w=$('skillTopics').clientWidth;if(w!==lastTopicWidth){lastTopicWidth=w;positionTopicIndicator()}}).observe($('skillTopics'));

let filterRevision=0,filterAnimations=[];
function transitionCards(change){const previous=new Map([...$('grid').querySelectorAll('.card')].map(card=>[card.dataset.card,card.getBoundingClientRect()]));const revision=++filterRevision;filterAnimations.forEach(a=>a.cancel());filterAnimations=[];change();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(revision!==filterRevision)return;$('grid').querySelectorAll('.card').forEach((card,index)=>{const next=card.getBoundingClientRect();if(next.bottom<0||next.top>innerHeight+120)return;const old=previous.get(card.dataset.card);const moved=old&&Math.abs(old.top-next.top)<innerHeight;const frames=moved?[{transform:`translate(${old.left-next.left}px,${old.top-next.top}px)`,opacity:.7},{transform:'none',opacity:1}]:[{transform:'translateY(14px) scale(.985)',opacity:0},{transform:'none',opacity:1}];filterAnimations.push(card.animate(frames,{duration:moved?280:240,delay:moved?0:Math.min(index,5)*12,easing:'cubic-bezier(.22,1,.36,1)'}))})}))}
$('skillTopics').addEventListener('click',e=>{const b=e.target.closest('[data-skill-topic]');if(!b||b.dataset.skillTopic===skillTopic)return;const marker=$('skillTopics').querySelector('.topic-indicator'),from={left:parseFloat(marker.style.left)||0,top:parseFloat(marker.style.top)||0,width:parseFloat(marker.style.width)||b.offsetWidth,height:b.offsetHeight};topicMoving=true;const topic=b.dataset.skillTopic;transitionCards(()=>{skillTopic=topic;render()});const target=[...$('skillTopics').querySelectorAll('button')].find(b=>b.dataset.skillTopic===topic);animateTopicIndicator(from,topicRect(target));target.focus({preventScroll:true})});
function render(){document.querySelectorAll('[data-category]').forEach(b=>{const active=category===b.dataset.category;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));const label=b.dataset.category+' · '+items.filter(i=>matches(i,b.dataset.category)).length+' 条';b.setAttribute('aria-label',label);b.dataset.tooltip=label});$('viewTitle').textContent=category;const q=$('search').value.trim().toLowerCase();renderSkillTopics();let list=items.filter(i=>matches(i,category)&&(category!=='Skills'||matchesSkillTopic(i,skillTopic))&&[i.title,i.tags,i.prompt,i.description,i.source,topicsFor(i).join(' ')].join(' ').toLowerCase().includes(q));if($('sort').value==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));$('total').textContent=String(items.length).padStart(2,'0');document.querySelector('.collection-total').hidden=category!=='全部内容';$('resultCount').textContent=`${category}${category==='Skills'&&skillTopic!=='全部'?' / '+skillTopic:''} / ${list.length} 条`;$('grid').innerHTML=list.length?list.map(i=>`<article class="card" data-kind="${esc(i.kind||'prompt')}" data-card="${esc(i.id)}">${visual(i,true)}<div class="card-body">${['skill','website'].includes(i.kind)&&i.previewEvidence?`<div class="preview-credit">${i.previewStatus==='pending'?'真实预览待补':i.kind==='website'?'真实网页截图':i.previewEvidence.startsWith('author-')?'作者真实示例':'本次实际运行'}</div>`:''}<div class="meta"><span>${i.kind==='website'?'网站 · ':i.kind==='skill'?(i.resourceType||'Skill')+' · ':''}${esc(i.category)}</span><button class="star" data-star="${esc(i.id)}" aria-label="${i.favorite?'取消收藏':'收藏'} ${esc(i.title)}" aria-pressed="${!!i.favorite}">${i.favorite?'♥':'♡'}</button></div><h2>${esc(i.title)}</h2><p class="description">${esc(i.description||'一条新收录的灵感。')}</p><div class="card-foot"><span>${esc(i.tags||'未添加标签')}</span>${resourceLinksHtml(i,true)||sourceButton(i)}<button class="card-open" data-open="${esc(i.id)}" aria-label="展开${esc(i.title)}" aria-haspopup="dialog"><span c function sourceButton(item){const source=typeof item.sourceImage==='string'&&/^assets\/[a-zA-Z0-9_./-]+$/.test(item.sourceImage)&&!item.sourceImage.includes('..')?item.sourceImage:'';return source?`<a class="visit-site" href="${esc(source)}" target="_blank" rel="noopener" aria-label="${esc(item.title+'：访问原始来源')}">访问来源 ↗</a>`:'<span class="source-unavailable">原始来源待补</span>'}

function layoutCards(){cancelAnimationFrame(masonryFrame);masonryFrame=requestAnimationFrame(()=>{const grid=$('grid'),style=getComputedStyle(grid),gap=parseFloat(style.rowGap)||20,row=parseFloat(style.gridAutoRows)||8;grid.querySelectorAll('.card').forEach(card=>card.style.gridRowEnd='span '+Math.ceil((card.getBoundingClientRect().height+gap)/(row+gap)))})}

let backdropPress=false;

$('detail').addEventListener('close',()=>{$('detailPreview').innerHTML='';const trigger=detailTrigger?.isConnected?detailTrigger:[...$('grid').querySelectorAll('[data-open]')].find(b=>b.dataset.open===selected?.id);trigger?.focus({preventScroll:true});window.scrollTo({top:detailScroll,behavior:'instant'})});
function showDetail(item){selected=item;$('detailVisit').innerHTML=resourceLinksHtml(item,true)||sourceButton(item);$('detailTitle').textContent=item.title;$('detailMeta').textContent=(item.kind==='website'?'实用网站 / ':item.kind==='skill'?(item.resourceType||'Skill')+' / ':'')+item.category+' / '+(item.tags||'');resetCopy();$('copy').textContent=item.kind==='website'?'复制网站地址':item.kind==='skill'?'复制 Skill 内容':'复制提示词';$('promptText').textContent=item.prompt;$('detailPreview').innerHTML=item.preview||item.kind==='skill'?visual(item):'';$('previewNote').textContent=['skill','website'].includes(item.kind)?[item.description,item.previewNote].filter(Boolean).join(' '):item.previewNote||'';$('skillSource').textContent=['skill','website'].includes(item.kind)&&item.source?'来源：'+item.source:'';$('sourceLink').innerHTML=typeof item.sourceImage==='string'&&item.sourceImage.startsWith('assets/')&&!item.sourceImage.includes('..')?`<a href="${esc(item.sourceImage)}" target="_blank" rel="noopener">查看原始提示词截图 ↗</a>`:'';if(item.preview?.type==='image'&&typeof item.preview.src==='string'&&item.preview.src.startsWith('assets/')&&!item.preview.src.includes('..'))$('sourceLink').innerHTML+=` <a href="${esc(item.preview.src)}" target="_blank" rel="noopener">查看原图 / 动图 ↗</a>`;if(typeof item.previewSource==='string'&&item.previewSource.startsWith('https://'))$('sourceLink').innerHTML+=` <a href="${esc(item.previewSource)}" target="_blank" rel="noopener">效果图原始出处 ↗</a>`;if(typeof item.demo==='string'&&item.demo.startsWith('assets/')&&!item.demo.includes('..'))$('sourceLink').innerHTML+=` <a href="${esc(item.demo)}" target="_blank" rel="noopener">打开实际演示 ↗</a>`;$('sourceLink').innerHTML+=' '+resourceLinksHtml(item);if(!$('detail').open)$('detail').showModal()}

let tooltipButton=null,tooltipDismissed=false;
function hideRailTooltip(){if(tooltipButton)tooltipButton.removeAttribute('aria-describedby');tooltipButton=null;$('railTooltip').hidden=true}
function showRailTooltip(button){if(!button||tooltipDismissed)return;tooltipButton=button;const box=button.getBoundingClientRect();$('railTooltip').textContent=button.dataset.tooltip;button.setAttribute('aria-describedby','railTooltip');$('railTooltip').hidden=false;$('railTooltip').style.left=(box.right+12)+'px';$('railTooltip').style.top=Math.max(8,Math.min(innerHeight-44,box.top+box.height/2-18))+'px'}

$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){if(category!==b.dataset.category)transitionCards(()=>{category=b.dataset.category;render()});hideRailTooltip()}};$('search').oninput=render;$('sort').onchange=()=>transitionCards(render);
$('grid').onclick=e=>{if(e.target.closest('a'))return;if(e.target.closest('#emptyAdd')){openEditor();return}const star=e.target.closest('[data-star]');if(star){save(items.map(i=>i.id===star.dataset.star?{...i,favorite:!i.favorite}:i));return}const b=e.target.closest('[data-open]');if(b){detailTrigger=b;detailScroll=scrollY;showDetail(items.find(i=>i.id===b.dataset.open))}};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).close();if(b.dataset.close==='detail')$('detailPreview').innerHTML=''});
function updateForm(){const kind=$('kind').value,skill=kind==='skill',site=kind==='website';$('description').required=skill||site;$('descriptionLabel').textContent=skill||site?'一句话用途（必填）':'一句话说明（选填）';$('prompt').required=kind==='prompt';$('contentLabel').textContent=site?'网站说明（选填）':skill?'Skill 内容 / 使用说明（选填）':'提示词原文';$('source').required=site;$('source').type=site?'url':'text';$('sourceLabel').textContent=site?'网站地址（必填，http 或 https）':'来源（链接或名称，选填）';$('formTitle').textContent=(editing?'编辑':'收录')+(site?'网站':skill?' Skill':'提示词')}
function openEditor(item){editing=item?.id||null;$('form').reset();$('kind').value=item?(['skill','website'].includes(item.kind)?item.kind:'prompt'):category==='实用网站'?'website':category==='Skills'?'skill':'prompt';for(const k of ['title','category','tags','prompt','description','source'])if(item)$(k).value=item[k]||'';if(!item&&$('kind').value!=='prompt')$('category').value='其他';updateForm();$('editor').showModal()}
$('kind').onchange=updateForm;$('add').onclick=()=>openEditor();
$('form').onsubmit=e=>{e.preventDefault();const kind=$('kind').value;const title=$('title').value.trim(),description=$('description').value.trim(),prompt=$('prompt').value.trim(),source=$('source').value.trim();if(!title||(kind==='prompt'&&!prompt)||(kind!=='prompt'&&!description)){toast('请填写标题与必填内容。');return}if(kind==='website'&&!websiteUrl(source)){toast('请填写有效的 http 或 https 网站地址。');return}const item={...(items.find(i=>i.id===editing)||{}),id:editing||crypto.randomUUID(),kind,title,category:$('category').value,tags:$('tags').value.trim(),prompt:prompt||description,description,source:kind==='website'?websiteUrl(source):source};if(save(editing?items.map(i=>i.id===editing?item:i):[item,...items])){$('editor').close();toast('已保存到工具箱')}};

let copyRevision=0,copyTimer;
function resetCopy(){copyRevision++;clearTimeout(copyTimer);$('copy').disabled=false;$('copy').classList.remove('copy-success');$('copy').getAnimations().forEach(a=>a.cancel())}
$('copy').onclick=async()=>{if(!selected)return;const button=$('copy'),revision=++copyRevision,label=selected.kind==='website'?'复制网站地址':selected.kind==='skill'?'复制 Skill 内容':'复制提示词',text=selected.kind==='website'?selected.source:selected.prompt;clearTimeout(copyTimer);button.disabled=true;try{await navigator.clipboard.writeText(text);if(revision!==copyRevision)return;button.innerHTML='<svg class="copy-check" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><span>复制成功</span>';button.classList.add('copy-success');toast('✓ 复制成功，已放入剪贴板');if(!matchMedia('(prefers-reduced-motion:reduce)').matches)button.animate([{transform:'scale(1)'},{transform:'scale(.96)',offset:.2},{transform:'scale(1.04)',offset:.65},{transform:'scale(1)'}],{duration:460,easing:'cubic-bezier(.2,.9,.22,1)'});copyTimer=setTimeout(()=>{if(revision===copyRevision){button.textContent=label;button.classList.remove('copy-success')}},2200)}catch{if(revision===copyRevision)toast('复制失败，请选中内容手动复制。')}finally{if(revision===copyRevision)button.disabled=false}};
$('detail').addEventListener('close',resetCopy);
$('export').onclick=()=>{const data=items.map(({rating,...item})=>item);const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='拾句-工具箱备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(i=>i&&typeof i.title==='string'&&typeof i.prompt==='string'&&i.title.trim()&&i.prompt.trim()))throw Error();if(data.some(i=>i.kind==='website'&&!websiteUrl(i.source)))throw Error();const merged=[...items];for(const i of data){let existing=merged.find(x=>x.title===i.title&&x.prompt===i.prompt);if(!existing){existing={id:crypto.randomUUID(),kind:['skill','website'].includes(i.kind)?i.kind:'prompt',title:i.title.slice(0,100),prompt:i.prompt.slice(0,30000),category:['动画动效','文字效果','界面设计','写作表达','其他'].includes(i.category)?i.category:'其他',tags:String(i.tags||'').slice(0,150),description:String(i.description||'').slice(0,200),source:String(i.source||'').slice(0,1000),favorite:!!i.favorite};merged.unshift(existing)}}if(save(merged))toast('导入完成，重复内容已合并。')}catch{toast('导入失败，请使用有效的 JSON 备份。')}finally{$('file').value=''}};
