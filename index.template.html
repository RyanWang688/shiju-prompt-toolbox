:32px}.hero h1{font-size:clamp(30px,3.6vw,54px);line-height:1.2;font-weight:500;margin:14px 0;letter-spacing:-1px}.hero p{color:var(--muted);margin:0}.hero .num{font-family:Georgia,serif;font-size:74px;line-height:1;color:var(--accent)}.hero .num small{display:block;font:12px "Microsoft YaHei";color:var(--muted);text-align:right;margin-top:12px}.toolbar{display:flex;gap:12px;margin-bottom:25px}.search{flex:1;position:relative}.search input{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;width:100%;padding:13px 17px;outline-offset:3px}.toolbar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px}.results{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .2s}.card:hover{transform:translateY(-4px)}.preview{height:170px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#172329;color:#dff2ed}.card-body{padding:18px}.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.star{border:0;padding:0 4px;font-size:22px;line-height:1}.star[aria-pressed=true]{color:var(--accent)}h2{font-size:19px;margin:10px 0 5px;font-weight:600}.description{font-size:13px;color:var(--muted);margin:0 0 20px}.card-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}.card-foot button{padding:6px 11px;font-size:12px}.ring{width:116px;height:52px;border:1px solid #98cdb7;border-radius:50%;position:absolute;transform:rotate(-25deg)}.ring:nth-child(2){transform:rotate(45deg)}.ring:nth-child(3){transform:rotate(110deg)}.ring:after{content:'';width:9px;height:9px;border-radius:50%;background:#d5fc95;position:absolute;left:calc(50% - 4px);top:calc(50% - 4px);animation:orbit 4s linear infinite;box-shadow:0 0 15px #c4f477}.ring:nth-child(2):after{animation-delay:-1.5s}.ring:nth-child(3):after{animation-delay:-2.6s}@keyframes orbit{from{transform:rotate(0deg) translateX(57px)}to{transform:rotate(360deg) translateX(57px)}}.type{text-align:center;background:#d3dbc8;color:#263b30;font-family:Georgia,"Microsoft YaHei",serif}.type span{font-size:25px;line-height:1.7;display:block;animation:reveal 4s infinite}.type span+span{animation-delay:.18s}@keyframes reveal{0%,10%{opacity:0;transform:translateY(14px)}30%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}.glass{background:radial-gradient(circle at 25% 40%,#dd9c77,transparent 60%),radial-gradient(circle at 80% 70%,#a29cdd,#cbd3d4)}.glass div{background:#ffffff35;backdrop-filter:blur(12px);border:1px solid #ffffff90;border-radius:13px;padding:20px 30px;box-shadow:0 10px 25px #24203915;color:#343544}.glass b{font:italic 23px Georgia}.pulse{background:#26263b}.pulse:before,.pulse:after{content:'';position:absolute;width:75px;height:75px;border:1px solid #c7bdff;border-radius:50%;animation:pulse 2.8s ease-in-out infinite}.pulse:after{width:110px;height:110px;animation-delay:-1.4s}.pulse span{width:25px;height:25px;background:#d5ccff;border-radius:50%}@keyframes pulse{50%{transform:scale(1.16);opacity:.35}}.layout{background:#e9e3d6;color:#2b3935;padding:28px;gap:14px;align-items:flex-start}.layout b{font:40px Georgia;border-right:1px solid;padding-right:15px;line-height:1.1}.layout i{width:70px;height:65px;background:repeating-linear-gradient(to bottom,#738079 0 1px,transparent 1px 11px);margin-top:10px}.write{background:#ccc8bc;color:#34443a;font:21px Georgia,"Microsoft YaHei";flex-direction:column}.write del{opacity:.5;font-size:14px;margin-bottom:10px}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}dialog{width:min(640px,92vw);max-height:90vh;padding:30px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.dialog-head h2{margin:0}.dialog-head button{padding:4px 11px}label{display:block;font-size:13px;margin:12px 0 5px;color:var(--muted)}dialog input,dialog select,dialog textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}dialog textarea{min-height:160px;resize:vertical}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.prompt-text{white-space:pre-wrap;background:var(--bg);padding:20px;border-radius:8px;line-height:1.9}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:12px 24px;border-radius:8px;box-shadow:0 5px 30px #0003;z-index:20}.hidden{display:none}.foot{font-size:12px;color:var(--muted);margin-top:30px}.b #categories,.c #categories{display:flex;gap:6px;flex-wrap:wrap}.b .shell{grid-template-columns:1fr}.b .sidebar{min-height:0;border-right:0;padding:20px 4vw 0;display:flex;align-items:center;gap:8px}.b .sidebar .eyebrow,.b .side-note{display:none}.b .sidebar button{width:auto}.b .main{padding-top:20px}.b .hero{border-bottom:1px solid var(--line);padding-bottom:30px}.b .hero h1{font-family:Georgia,"Microsoft YaHei",serif}.b .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.b .card{display:grid;grid-template-columns:170px 1fr;border-radius:4px}.b .preview{height:100%;min-height:200px}.b .hero .num{color:var(--accent)}.c .shell{display:block}.c .sidebar{border:0;min-height:0;padding:20px 4vw 0;display:flex;gap:10px}.c .sidebar button{width:auto;border:1px solid var(--line);border-radius:30px}.c .sidebar .eyebrow,.c .side-note{display:none}.c .main{padding-top:15px}.c .hero h1{font-weight:800;font-size:clamp(36px,5vw,65px)}.c .hero .num{color:var(--ink)}.c .card{border:2px solid var(--line);border-radius:0;box-shadow:5px 5px 0 #242039}.c .card:nth-child(2){transform:rotate(1deg)}.c .card:nth-child(3){transform:rotate(-1deg)}.c .card:hover{transform:translateY(-5px) rotate(0)}.c .primary{box-shadow:3px 3px 0 #242039;border:1px solid #242039;border-radius:0}.c .preview{height:190px}.c .top{border-bottom:2px solid}.c .brand{font-weight:900} @media(min-width:1600px){.preview{height:210px}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.b .card{grid-template-columns:135px 1fr}.shell{grid-template-columns:165px 1fr}.sidebar{padding:35px 12px}.brand small{display:none}}@media(max-width:720px){.top{padding:12px 18px;height:auto;gap:15px;flex-wrap:wrap}.brand{font-size:20px}.switch a{padding:5px 8px}.shell{display:block}.sidebar,.b .sidebar,.c .sidebar{min-height:0;border:0;display:flex;overflow:auto;gap:6px;padding:18px 18px 0}#categories{display:flex;gap:6px}.sidebar .eyebrow,.side-note{display:none}.sidebar button{white-space:nowrap;width:auto;flex-shrink:0;font-size:13px}.main{padding:25px 18px}.hero{align-items:center}.hero .num{font-size:48px}.hero p{font-size:13px}.hero h1{font-size:32px}.grid,.b .grid{grid-template-columns:1fr}.b .card{grid-template-columns:125px 1fr}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar .primary{flex:1}.preview{height:190px}.b .preview{min-height:210px}.c .hero h1{font-size:36px}dialog{padding:22px}.actions{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.type span{opacity:1}}
.empty.start{background:#fffdf5;border:2px solid #242039;box-shadow:6px 6px 0 #242039;padding:55px 24px;color:var(--ink)}.start h2{font-size:30px;margin:14px 0}.start p{color:var(--muted);font-size:15px;line-height:1.9}.steps{display:flex;justify-content:center;gap:28px;margin:30px 0;font-size:12px;color:var(--muted)}@media(max-width:720px){.start h2{font-size:24px}.steps{gap:12px}.empty.start{padding:34px 14px}.c #categories{flex-wrap:nowrap}.c .sidebar{overflow-x:auto}.hero .num{display:none}} #detail{width:min(880px,94vw)}#detailPreview .preview{height:360px;border-radius:10px}#sourceLink a{font-size:13px;color:var(--muted)}@media(max-width:720px){#detailPreview .preview{height:230px}} .rating{display:flex;align-items:center;gap:3px;margin:12px 0 17px;flex-wrap:wrap}.rating button{padding:3px 5px;min-width:44px;min-height:44px;border:0;font-size:23px;color:#827c91;background:transparent}.rating button.filled{color:#866009}.rating small{color:var(--muted);font-size:12px;margin-left:6px}.skill-cover{background:#e4ddf8;color:#242039;padding:26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px}.skill-cover strong{font-size:25px}.skill-cover p{font-size:13px;margin:0;line-height:1.7}.skill-cover span{font:11px monospace;letter-spacing:3px}#skillSource{overflow-wrap:anywhere;font-size:13px}.detail-description{color:var(--muted);line-height:1.8} </style></head><body class="c">
<!-- C 方向已选定；提示词由 prompts.json 管理；预览为收录时单独制作；浏览器手动新增内容需导出后才能同步到仓库。 -->
<header class="top"><div class="brand">拾句 <small>PROMPT COLLECTION</small></div><span class="eyebrow">个人提示词与 Skills 工具箱</span></header>
<div class="shell"><aside class="sidebar"><div class="eyebrow">我的工具箱</div><div id="categories"></div><div class="side-note">捕捉一个想法，<br>留住一种可能。<br><br>初稿 · 浏览器本地保存</div></aside><main class="main"><section class="hero"><div><div class="eyebrow">YOUR IDEAS, WITHIN REACH.</div><h1>好点子，<br>都在这块板上。</h1><p>把好用的提示词、Skills 和视觉灵感，收进自己的工具箱。</p></div><div class="num"><span id="total">06</span><small>提示词与 Skills</small></div></section><div class="toolbar"><div class="search"><input id="search" type="search" placeholder="搜索提示词、Skills、标签…" aria-label="搜索提示词"></div><select id="sort" aria-label="排序"><option value="new">最近加入</option><option value="title">按名称排序</option><option value="rating">我的评分优先</option></select><button class="primary" id="add">＋ 收录内容</button></div><div class="results"><span id="resultCount"></span><span>效果预览 · 收录后制作</span></div><div class="grid" id="grid"></div><div class="foot">评分、收藏和手动新增保存在当前浏览器；可导出备份恢复。<button id="export">导出备份</button> <button id="import">导入备份</button><input id="file" type="file" accept="application/json" hidden></div></main></div>
<dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button data-close="detail" aria-label="关闭详情">×</button></div><p id="detailMeta" class="eyebrow"></p><div id="detailPreview"></div><p id="previewNote" class="description"></p><p id="sourceLink"></p><div id="detailRating"></div><p id="skillSource"></p><div id="promptText" class="prompt-text"></div><div class="actions"><button id="edit">编辑</button><button id="delete">删除</button><button id="copy" class="primary">复制提示词</button></div></dialog>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="formTitle">收录提示词</h2><button type="button" data-close="editor" aria-label="关闭编辑">×</button></div><label for="kind">内容类型</label><select id="kind"><option value="prompt">提示词</option><option value="skill">Skill</option></select><label for="title">标题 / Skill 名称</label><input id="title" required maxlength="100"><label for="category">分类</label><select id="category"><option>动画动效</option><option>文字效果</option><option>界面设计</option><option>写作表达</option><option>其他</option></select><label for="tags">标签（空格或逗号分隔）</label><input id="tags" maxlength="150"><label for="source">Skill 来源（链接或名称，选填）</label><input id="source" maxlength="1000"><label for="prompt" id="contentLabel">提示词原文</label><textarea id="prompt" maxlength="30000" placeholder="粘贴你想保存的提示词…"></textarea><label id="descriptionLabel" for="description">一句话说明（选填）</label><input id="description" maxlength="200"><div class="actions"><button type="button" data-close="editor">取消</button><button class="primary">保存到工具箱</button></div></form></dialog><div role="status" class="toast hidden" id="toast"></div>
<script>
const seed=__PROMPTS__;
const key='shiju-personal-v2',ratingKey='shiju-ratings-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizeRating=n=>Number.isInteger(n)&&n>=0&&n<=5?n:0;
let ratings={},items=seed,category='全部内容',selected=null,editing=null,toastTimer;
try{const r=JSON.parse(localStorage.getItem(ratingKey)||'{}');if(r&&typeof r==='object'&&!Array.isArray(r))ratings=r}catch{}
try{const local=JSON.parse(localStorage.getItem(key)||'null');if(local&&Array.isArray(local.items)&&Array.isArray(local.deleted)){const valid=local.items.filter(i=>i&&typeof i.id==='string'&&typeof i.title==='string'&&typeof i.prompt==='string');const changed=new Map(valid.map(i=>[i.id,i]));items=[...seed.filter(i=>!local.deleted.includes(i.id)).map(i=>changed.get(i.id)||i),...valid.filter(i=>!seed.some(s=>s.id===i.id))]}}catch{}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function save(next){try{const removed=seed.filter(i=>!next.some(n=>n.id===i.id)).map(i=>i.id);const changed=next.filter(i=>!seed.some(s=>s.id===i.id&&JSON.stringify(s)===JSON.stringify(i)));localStorage.setItem(key,JSON.stringify({items:changed,deleted:removed}));items=next;render();return true}catch{toast('保存失败：浏览器存储不可用，请先导出备份。');return false}}
function rating(item){return normalizeRating(Object.hasOwn(ratings,item.id)?ratings[item.id]:item.rating)}
function ratingControls(item){const n=rating(item);return `<div class="rating" role="group" aria-label="${esc(item.title)}的个人评分">${[1,2,3,4,5].map(v=>`<button data-rate="${esc(item.id)}" data-value="${v}" class="${v<=n?'filled':''}" aria-label="给${esc(item.title)}评${v}星" title="${v} 星；重复点击清除" aria-pressed="${n===v}">${v<=n?'★':'☆'}</button>`).join('')}<small>${n?n+' / 5':'未评分'}</small></div>`}
function visual(item){if(item.kind==='skill')return `<div class="preview skill-cover"><span>SKILL / 能力卡</span><strong>${esc(item.title)}</strong><p>${esc(item.description||'用途待补充')}</p></div>`;if(item.preview&&typeof item.preview.src==='string'&&/^assets\/[a-zA-Z0-9_./-]+$/.test(item.preview.src)&&!item.preview.src.includes('..')){const p=item.preview;if(p.type==='image')return `<div class="preview"><img src="${esc(p.src)}" alt="${esc(p.alt||item.title+'效果预览')}" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div>`;if(p.type==='animation')return `<div class="preview"><iframe src="${esc(p.src)}" title="${esc(item.title+'动效预览')}" sandbox="allow-scripts" loading="lazy" style="border:0;width:100%;height:100%"></iframe></div>`;if(p.type==='video')return `<div class="preview"><video src="${esc(p.src)}" controls muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain"></video></div>`}const type=['orbit','type','glass','pulse','layout','write'].includes(item.effect)?item.effect:'custom';return `<div class="preview ${type}" aria-hidden="true">${({orbit:'<i class="ring"></i><i class="ring"></i><i class="ring"></i>',type:'<div><span>让灵感</span><span>慢慢浮现。</span></div>',glass:'<div><b>Clarity.</b><br><small>透过表面，看见层次</small></div>',pulse:'<span></span>',layout:'<b>The<br>Edit.</b><i></i>',write:'<del>致力于打造卓越的表达</del><span>把话说清楚。</span>',custom:'<div style="text-align:center"><span style="font:42px Georgia">Aa</span><br><small>已收录 · 暂无效果预览</small></div>'})[type]}</div>`}

function matches(item,c){return c==='全部内容'||c==='Skills'&&item.kind==='skill'||c==='提示词'&&item.kind!=='skill'||c==='我的收藏'&&item.favorite||item.category===c}
function render(){const cats=['全部内容','提示词','Skills','我的收藏','动画动效','文字效果','界面设计','写作表达','其他'];$('categories').innerHTML=cats.map(c=>`<button data-category="${c}" class="${category===c?'active':''}">${c} <small>${items.filter(i=>matches(i,c)).length}</small></button>`).join('');const q=$('search').value.trim().toLowerCase();let list=items.filter(i=>matches(i,category)&&[i.title,i.tags,i.prompt,i.description,i.source].join(' ').toLowerCase().includes(q));if($('sort').value==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));if($('sort').value==='rating')list.sort((a,b)=>rating(b)-rating(a));$('total').textContent=String(items.length).padStart(2,'0');$('resultCount').textContent=`${category} / ${list.length} 条`;$('grid').innerHTML=list.length?list.map(i=>`<article class="card">${visual(i)}<div class="card-body"><div class="meta"><span>${i.kind==='skill'?'Skill · ':''}${esc(i.category)}</span><button class="star" data-star="${esc(i.id)}" aria-label="${i.favorite?'取消收藏':'收藏'} ${esc(i.title)}" aria-pressed="${!!i.favorite}">${i.favorite?'♥':'♡'}</button></div><h2>${esc(i.title)}</h2><p class="description">${esc(i.description||'一条新收录的灵感。')}</p>${ratingControls(i)}<div class="card-foot"><span>${esc(i.tags||'未添加标签')}</span><button data-open="${esc(i.id)}">${i.kind==='skill'?'查看 Skill':'查看提示词'} ↗</button></div></div></article>`).join(''):`<div class="empty start"><h2>${category==='Skills'?'Skills 收藏夹准备好了。':'没有找到匹配内容。'}</h2><p>${category==='Skills'?'告诉我要加入哪个 Skill，我会附上简短用途介绍。':'试试其他关键词或分类，也可以收录一条新内容。'}</p><button class="primary" id="emptyAdd">＋ ${category==='Skills'?'添加 Skill':'收录内容'}</button></div>`}
function showDetail(item){selected=item;$('detailTitle').textContent=item.title;$('detailMeta').textContent=(item.kind==='skill'?'Skill / ':'')+item.category+' / '+(item.tags||'');$('copy').textContent=item.kind==='skill'?'复制 Skill 内容':'复制提示词';$('promptText').textContent=item.prompt;$('detailPreview').innerHTML=item.preview||item.kind==='skill'?visual(item):'';$('previewNote').textContent=item.kind==='skill'?item.description:item.previewNote||'';$('detailRating').innerHTML=ratingControls(item);$('skillSource').textContent=item.kind==='skill'&&item.source?'来源：'+item.source:'';$('sourceLink').innerHTML=typeof item.sourceImage==='string'&&item.sourceImage.startsWith('assets/')&&!item.sourceImage.includes('..')?`<a href="${esc(item.sourceImage)}" target="_blank" rel="noopener">查看原始提示词截图 ↗</a>`:'';if(!$('detail').open)$('detail').showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rate]');if(!b)return;const item=items.find(i=>i.id===b.dataset.rate);if(!item)return;const next={...ratings,[item.id]:rating(item)===Number(b.dataset.value)?0:Number(b.dataset.value)};try{localStorage.setItem(ratingKey,JSON.stringify(next));ratings=next;render();if($('detail').open&&selected?.id===item.id)$('detailRating').innerHTML=ratingControls(item);toast(rating(item)?`已记住你的 ${rating(item)} 星评分`:'已清除评分')}catch{toast('评分未保存：浏览器存储不可用。')}});
$('categories').onclick=e=>{const b=e.target.closest('[data-category]');if(b){category=b.dataset.category;render()}};$('search').oninput=render;$('sort').onchange=render;
$('grid').onclick=e=>{if(e.target.closest('#emptyAdd')){openEditor();return}const star=e.target.closest('[data-star]');if(star){save(items.map(i=>i.id===star.dataset.star?{...i,favorite:!i.favorite}:i));return}const b=e.target.closest('[data-open]');if(b)showDetail(items.find(i=>i.id===b.dataset.open))};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$(b.dataset.close).close();if(b.dataset.close==='detail')$('detailPreview').innerHTML=''});
function updateForm(){const skill=$('kind').value==='skill';$('description').required=skill;$('descriptionLabel').textContent=skill?'一句话用途（必填）':'一句话说明（选填）';$('prompt').required=!skill;$('contentLabel').textContent=skill?'Skill 内容 / 使用说明（选填）':'提示词原文';$('formTitle').textContent=(editing?'编辑':'收录')+(skill?' Skill':'提示词')}
function openEditor(item){editing=item?.id||null;$('form').reset();$('kind').value=item?.kind==='skill'||!item&&category==='Skills'?'skill':'prompt';for(const k of ['title','category','tags','prompt','description','source'])if(item)$(k).value=item[k]||'';if(!item&&$('kind').value==='skill')$('category').value='其他';updateForm();$('editor').showModal()}
$('kind').onchange=updateForm;$('add').onclick=()=>openEditor();$('edit').onclick=()=>{$('detail').close();$('detailPreview').innerHTML='';openEditor(selected)};
$('form').onsubmit=e=>{e.preventDefault();const skill=$('kind').value==='skill';if(!$('title').value.trim()||(!skill&&!$('prompt').value.trim())||(skill&&!$('description').value.trim())){toast(skill?'请填写 Skill 名称和一句话用途。':'请填写标题和提示词。');return}const item={...(items.find(i=>i.id===editing)||{}),id:editing||crypto.randomUUID(),kind:skill?'skill':'prompt',title:$('title').value.trim(),category:$('category').value,tags:$('tags').value.trim(),prompt:$('prompt').value.trim()||$('description').value.trim(),description:$('description').value.trim(),source:$('source').value.trim()};if(save(editing?items.map(i=>i.id===editing?item:i):[item,...items])){$('editor').close();toast('已保存到工具箱')}};
$('delete').onclick=()=>{if(confirm('确定删除这条内容？')&&save(items.filter(i=>i.id!==selected.id))){$('detail').close();$('detailPreview').innerHTML='';toast('已删除')}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(selected.prompt);toast('内容已复制')}catch{toast('复制失败，请选中内容手动复制。')}};
$('export').onclick=()=>{const data=items.map(i=>({...i,rating:rating(i)}));const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='拾句-提示词与Skills备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(i=>i&&typeof i.title==='string'&&typeof i.prompt==='string'&&i.title.trim()&&i.prompt.trim()))throw Error();const merged=[...items];const nextRatings={...ratings};for(const i of data){let existing=merged.find(x=>x.title===i.title&&x.prompt===i.prompt);if(!existing){existing={id:crypto.randomUUID(),kind:i.kind==='skill'?'skill':'prompt',title:i.title.slice(0,100),prompt:i.prompt.slice(0,30000),category:['动画动效','文字效果','界面设计','写作表达','其他'].includes(i.category)?i.category:'其他',tags:String(i.tags||'').slice(0,150),description:String(i.description||'').slice(0,200),source:String(i.source||'').slice(0,1000),favorite:!!i.favorite};merged.unshift(existing)}if(Object.hasOwn(i,'rating'))nextRatings[existing.id]=normalizeRating(i.rating)}if(save(merged)){try{localStorage.setItem(ratingKey,JSON.stringify(nextRatings));ratings=nextRatings;render();toast('导入完成，评分已恢复，重复内容已合并。')}catch{toast('内容已导入，但评分保存失败。')}}}catch{toast('导入失败，请使用有效的 JSON 备份。')}finally{$('file').value=''}};
render();
</script></body></html>
